# Snow Island - a walk-around home screen for Android TV.
# This one file holds the whole app. Every time you save a change to it,
# GitHub builds a new SnowIsland.apk and posts it under Releases.
name: Build Snow Island

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Write the app's files
        run: |
          mkdir -p app
          cat > app/settings.gradle <<'SNOW_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "SnowIsland"
          SNOW_EOF
          cat > app/build.gradle <<'SNOW_EOF'
          plugins {
              id 'com.android.application' version '8.5.2'
          }

          android {
              namespace 'com.josh.snowisland'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.josh.snowisland'
                  minSdk 26
                  targetSdk 34
                  versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
                  versionName "1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
              }

              signingConfigs {
                  stable {
                      storeFile file('../signing/snowisland.keystore')
                      storePassword 'snowisland'
                      keyAlias 'snowisland'
                      keyPassword 'snowisland'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.stable
                  }
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          SNOW_EOF
          cat > app/gradle.properties <<'SNOW_EOF'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          SNOW_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'SNOW_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.REORDER_TASKS" />

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <package android:name="org.smarttube.stable" />
                  <package android:name="org.smarttube.beta" />
                  <package android:name="com.teamsmart.videomanager.tv" />
                  <package android:name="com.liskovsoft.smarttubetv.beta" />
                  <package android:name="com.liskovsoft.smarttubetv" />
              </queries>

              <application
                  android:label="Snow Island"
                  android:icon="@drawable/icon"
                  android:banner="@drawable/banner"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="landscape"
                      android:configChanges="keyboard|keyboardHidden|navigation|orientation|screenSize|screenLayout|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".MediaListener"
                      android:label="Snow Island"
                      android:exported="true"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          SNOW_EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/icon.xml <<'SNOW_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#2F78B8" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#F5FAFD" android:pathData="M4,80a50,22 0,1 0,100 0a50,22 0,1 0,-100 0z" />
              <path android:fillColor="#1B2230" android:pathData="M38,84a16,26 0,1 0,32 0a16,26 0,1 0,-32 0z" />
              <path android:fillColor="#1B2230" android:pathData="M42,52a12,12 0,1 0,24 0a12,12 0,1 0,-24 0z" />
              <path android:fillColor="#FAFCFF" android:pathData="M43,88a11,18 0,1 0,22 0a11,18 0,1 0,-22 0z" />
              <path android:fillColor="#FFFFFF" android:pathData="M45.5,50a3.5,3.5 0,1 0,7 0a3.5,3.5 0,1 0,-7 0zM55.5,50a3.5,3.5 0,1 0,7 0a3.5,3.5 0,1 0,-7 0z" />
              <path android:fillColor="#111111" android:pathData="M47.5,50.5a1.7,1.7 0,1 0,3.4 0a1.7,1.7 0,1 0,-3.4 0zM57.1,50.5a1.7,1.7 0,1 0,3.4 0a1.7,1.7 0,1 0,-3.4 0z" />
              <path android:fillColor="#FFA726" android:pathData="M50.5,55h7l-3.5,5z" />
              <path android:fillColor="#FF5252" android:pathData="M41,61h26v6h-26zM58,64h6v12h-6zM42,44a12,10 0,0 1,24 0z" />
              <path android:fillColor="#FFFFFF" android:pathData="M54,33a4,4 0,1 0,0.1 0z" />
          </vector>
          SNOW_EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/banner.xml <<'SNOW_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="320dp" android:height="180dp"
              android:viewportWidth="320" android:viewportHeight="180">
              <path android:fillColor="#2F78B8" android:pathData="M0,0h320v180h-320z" />
              <path android:fillColor="#F5FAFD" android:pathData="M20,150a140,34 0,1 0,280 0a140,34 0,1 0,-280 0z" />
              <path android:fillColor="#2E6B4A" android:pathData="M40,140l18,-40l18,40zM250,138l16,-36l16,36z" />
              <path android:fillColor="#FFFFFF" android:pathData="M50,118l8,-18l8,18zM259,118l7,-16l7,16z" />
              <path android:fillColor="#1B2230" android:pathData="M148,140a14,24 0,1 0,28 0a14,24 0,1 0,-28 0zM151,110a11,11 0,1 0,22 0a11,11 0,1 0,-22 0z" />
              <path android:fillColor="#FAFCFF" android:pathData="M152,144a10,16 0,1 0,20 0a10,16 0,1 0,-20 0z" />
              <path android:fillColor="#FFA726" android:pathData="M158,113h8l-4,5z" />
              <path android:fillColor="#FF5252" android:pathData="M150,119h24v5h-24zM151,103a11,9 0,0 1,22 0z" />
              <path android:fillColor="#FFFFFF" android:pathData="M155,108a2.5,2.5 0,1 0,5 0a2.5,2.5 0,1 0,-5 0zM164,108a2.5,2.5 0,1 0,5 0a2.5,2.5 0,1 0,-5 0z" />
