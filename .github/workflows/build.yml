                          c.drawText(it.value, l + w - 36, y + 36, tp);
                      }
                  }
                  if (listItems.size() > rows) {
                      float barH = h - 130;
                      float frac = rows / (float) listItems.size();
                      float pos = listScroll / (float) Math.max(1, listItems.size() - rows);
                      p.setColor(0x33ffffff);
                      rf.set(l + w - 10, rowTop, l + w - 6, rowTop + barH);
                      c.drawRoundRect(rf, 2, 2, p);
                      p.setColor(0xaaffffff);
                      float bh = barH * frac;
                      rf.set(l + w - 10, rowTop + (barH - bh) * pos, l + w - 6, rowTop + (barH - bh) * pos + bh);
                      c.drawRoundRect(rf, 2, 2, p);
                  }
              }
