              // ================================================================== lifecycle

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN
                          | WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  prefs = getSharedPreferences("island", MODE_PRIVATE);
                  musicOn = prefs.getBoolean("music", true);
                  soundOn = prefs.getBoolean("sound", true);
                  weatherFx = prefs.getBoolean("weatherfx", true);
                  seasonPref = prefs.getInt("season", 0);
                  bellyIcons = prefs.getBoolean("belly", false);
                  namesAlways = prefs.getBoolean("namesalways", true);
                  autoReturn = prefs.getBoolean("autoreturn", true);
                  tagColour = prefs.getBoolean("tagcolour", false);
                  clockSize = prefs.getInt("clocksize", 2);
                  ezFollow = prefs.getBoolean("ezfollow", false);
                  cdVolume = prefs.getFloat("cdvol", 1f);
                  shuffleOn = prefs.getBoolean("shuffle", false);
                  hidden.addAll(prefs.getStringSet("hidden", new HashSet<String>()));
                  loadDiscs();

                  view = new SurfaceView(this);
                  holder = view.getHolder();
                  holder.setFixedSize(VW, VH);
                  holder.addCallback(this);
                  view.setFocusable(true);
                  setContentView(view);
                  view.requestFocus();

                  tp.setTypeface(Typeface.create(Typeface.DEFAULT, Typeface.BOLD));
                  bakeWorld();
                  bakeRoom();
                  initParticles();
                  initAudio();
                  startWeather();
                  startRadioWatch();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  resumed = true;
                  hideSystemUi();
                  kUp = kDown = kLeft = kRight = false;
                  axX = axY = 0;
                  loadApps();
                  if (ytActive) { ytQuietSince = 0; ytGraceUntil = System.currentTimeMillis() + 6000; }
                  if (cdResumeOnReturn) {
                      cdResumeOnReturn = false;
                      try { if (cdPlayer != null) { cdPlayer.start(); cdPlaying = true; } } catch (Exception ignored) { }
                  }
                  updateMusic();
                  if (scene == SCENE_FIRE) startCrackle();
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  resumed = false;
                  // The CD player pauses while you're in another app and picks back up when you return
                  try {
                      if (cdPlayer != null && cdPlayer.isPlaying()) { cdPlayer.pause(); cdResumeOnReturn = true; }
                  } catch (Exception ignored) { }
                  stopCrackle();
                  if (music != null) {
                      try { if (music.isPlaying()) music.pause(); } catch (Exception ignored) { }
                  }
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  destroyed = true;
                  try { if (music != null) music.release(); } catch (Exception ignored) { }
                  try { if (cdPlayer != null) cdPlayer.release(); } catch (Exception ignored) { }
                  try { if (sounds != null) sounds.release(); } catch (Exception ignored) { }
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemUi();
              }

              @SuppressWarnings("deprecation")
              void hideSystemUi() {
                  view.setSystemUiVisibility(View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
              }

              @Override
              public void surfaceCreated(SurfaceHolder h) {
                  running = true;
                  lastNs = System.nanoTime();
                  renderThread = new Thread(this::renderLoop, "island-render");
                  renderThread.start();
              }

              @Override
              public void surfaceChanged(SurfaceHolder h, int format, int w, int hgt) { }

              @Override
              public void surfaceDestroyed(SurfaceHolder h) {
                  running = false;
                  if (renderThread != null) {
                      try { renderThread.join(500); } catch (InterruptedException ignored) { }
                      renderThread = null;
                  }
              }

              // ================================================================== input

              @Override
              public boolean dispatchKeyEvent(KeyEvent e) {
                  int code = e.getKeyCode();
                  boolean down = e.getAction() == KeyEvent.ACTION_DOWN;
                  switch (code) {
                      case KeyEvent.KEYCODE_DPAD_UP: case KeyEvent.KEYCODE_W: kUp = down; break;
                      case KeyEvent.KEYCODE_DPAD_DOWN: case KeyEvent.KEYCODE_S: kDown = down; break;
                      case KeyEvent.KEYCODE_DPAD_LEFT: case KeyEvent.KEYCODE_A: kLeft = down; break;
                      case KeyEvent.KEYCODE_DPAD_RIGHT: case KeyEvent.KEYCODE_D: kRight = down; break;
                      case KeyEvent.KEYCODE_DPAD_CENTER: case KeyEvent.KEYCODE_ENTER: case KeyEvent.KEYCODE_NUMPAD_ENTER:
                      case KeyEvent.KEYCODE_BUTTON_A: case KeyEvent.KEYCODE_BACK: case KeyEvent.KEYCODE_BUTTON_B:
                      case KeyEvent.KEYCODE_INFO: case KeyEvent.KEYCODE_MENU: case KeyEvent.KEYCODE_GUIDE:
                      case KeyEvent.KEYCODE_BUTTON_Y: case KeyEvent.KEYCODE_BUTTON_START: case KeyEvent.KEYCODE_BUTTON_X:
                      case KeyEvent.KEYCODE_BUTTON_L1: case KeyEvent.KEYCODE_BUTTON_R1:
                          break;
                      default:
                          return super.dispatchKeyEvent(e);
                  }
                  if (down) {
                      int rep = e.getRepeatCount();
                      if (rep == 0) keyQueue.add(code);
                      else if (code == KeyEvent.KEYCODE_DPAD_UP || code == KeyEvent.KEYCODE_DPAD_DOWN) keyQueue.add(code | REPEAT_FLAG);
                  }
                  return true;
              }

              @Override
              public boolean dispatchGenericMotionEvent(MotionEvent e) {
                  if ((e.getSource() & InputDevice.SOURCE_JOYSTICK) == InputDevice.SOURCE_JOYSTICK
                          && e.getAction() == MotionEvent.ACTION_MOVE) {
                      float x = e.getAxisValue(MotionEvent.AXIS_X);
                      float y = e.getAxisValue(MotionEvent.AXIS_Y);
                      float hx = e.getAxisValue(MotionEvent.AXIS_HAT_X);
                      float hy = e.getAxisValue(MotionEvent.AXIS_HAT_Y);
                      if (Math.abs(hx) > 0.5f) x = hx;
                      if (Math.abs(hy) > 0.5f) y = hy;
                      axX = Math.abs(x) > 0.25f ? x : 0;
                      axY = Math.abs(y) > 0.25f ? y : 0;
                      return true;
                  }
                  return super.dispatchGenericMotionEvent(e);
              }

              // ================================================================== audio

              void initAudio() {
                  try {
                      AudioAttributes aa = new AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_GAME)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build();
                      sounds = new SoundPool.Builder().setMaxStreams(6).setAudioAttributes(aa).build();
                  } catch (Exception ex) {
                      sounds = null;
                  }
                  new Thread(() -> {
                      File dir = getFilesDir();
                      String[] names = {"step", "chirp", "open", "whoosh", "splat", "tick", "toggle", "door", "crackle", "whistle"};
                      for (int i = 0; i < names.length; i++) {
                          try {
                              // Your own fire recording (fire.ogg in the repo) is used if it's there
                              if (i == 8 && sounds != null) {
                                  int rid = getResources().getIdentifier("fire", "raw", getPackageName());
                                  if (rid != 0) { soundIds[8] = sounds.load(this, rid, 1); continue; }
                              }
                              File f = new File(dir, (i == 1 ? "sfx4_" : i == 8 ? "sfx9_" : "sfx2_") + names[i] + ".wav");
                              if (!f.exists()) {
                                  float[] data;
                                  switch (i) {
                                      case 0: data = Synth.step(); break;
                                      case 1: data = Synth.chirp(); break;
                                      case 2: data = Synth.open(); break;
                                      case 3: data = Synth.whoosh(); break;
                                      case 4: data = Synth.splat(); break;
                                      case 5: data = Synth.tick(); break;
                                      case 6: data = Synth.toggle(); break;
                                      case 7: data = Synth.door(); break;
                                      case 9: data = Synth.whistle(); break;
                                      default: data = Synth.crackle(); break;
                                  }
                                  Synth.writeWav(f, data);
                              }
                              if (sounds != null) soundIds[i] = sounds.load(f.getAbsolutePath(), 1);
                          } catch (Exception ignored) { }
                      }
                      try {
                          File mf = new File(dir, "music3.wav");
                          if (!mf.exists()) {
                              new File(dir, "music2.wav").delete();
                              File tmp = new File(dir, "music3.tmp");
                              Synth.writeWav(tmp, Synth.music());
                              tmp.renameTo(mf);
                          }
                          runOnUiThread(() -> {
                              if (destroyed) return;
                              try {
                                  music = new MediaPlayer();
                                  music.setDataSource(mf.getAbsolutePath());
                                  music.setLooping(true);
                                  music.setVolume(0.32f, 0.32f);
                                  music.prepare();
                                  updateMusic();
                              } catch (Exception ex) {
                                  music = null;
                              }
                          });
                      } catch (Exception ignored) { }
                  }, "island-audio").start();
              }

              void play(int id, float vol, float rate) {
                  if (!soundOn || sounds == null || soundIds[id] == 0) return;
                  try { sounds.play(soundIds[id], vol, vol, 1, 0, rate); } catch (Exception ignored) { }
              }

              void startCrackle() {
                  stopCrackle();
                  if (soundOn && sounds != null && soundIds[S_CRACKLE] != 0) {
                      try { crackleStream = sounds.play(soundIds[S_CRACKLE], 0.85f, 0.85f, 1, -1, 1f); } catch (Exception ignored) { }
                  }
                  runOnUiThread(() -> { try { if (music != null) music.setVolume(0.1f, 0.1f); } catch (Exception ignored) { } });
              }

              void stopCrackle() {
                  if (crackleStream != 0 && sounds != null) {
                      try { sounds.stop(crackleStream); } catch (Exception ignored) { }
                  }
                  crackleStream = 0;
                  runOnUiThread(() -> { try { if (music != null) music.setVolume(0.32f, 0.32f); } catch (Exception ignored) { } });
              }

              /** True while a CD is playing, so the island's own music stays quiet. */
              boolean radioBusy() {
                  return cdPlaying || (ytActive && !radioPaused);
              }

              void updateMusic() {
                  runOnUiThread(() -> {
                      if (music == null) return;
                      try {
                          if (musicOn && resumed && !radioBusy()) { if (!music.isPlaying()) music.start(); }
                          else if (music.isPlaying()) music.pause();
                      } catch (Exception ignored) { }
                  });
              }

              // ================================================================== weather

              void startWeather() {
                  Thread t = new Thread(() -> {
                      while (!destroyed) {
                          Weather w = Weather.fetch();
                          if (w.ok) weather = w;
                          long wait = w.ok ? 20 * 60 * 1000L : 2 * 60 * 1000L;
                          long until = System.currentTimeMillis() + wait;
                          while (!destroyed && System.currentTimeMillis() < until) {
                              try { Thread.sleep(2000); } catch (InterruptedException ignored) { }
                          }
                      }
                  }, "island-weather");
                  t.setDaemon(true);
                  t.start();
              }

              // ================================================================== CD player: discs

              void loadDiscs() {
                  discs.clear();
                  try {
                      JSONArray arr = new JSONArray(prefs.getString("discs", "[]"));
                      for (int i = 0; i < arr.length(); i++) {
                          JSONObject o = arr.getJSONObject(i);
                          Disc d = new Disc();
                          d.name = o.optString("n", "Disc");
                          d.yt = o.optBoolean("y", false);
                          d.list = o.optString("l", "");
                          d.color = o.optInt("c", MIX_COLS[i % MIX_COLS.length]);
                          JSONArray s = o.optJSONArray("s");
                          if (s != null) for (int k = 0; k < s.length(); k++) d.songs.add(s.getString(k));
                          discs.add(d);
                      }
                  } catch (Exception ignored) { }
                  // Make sure every built-in playlist has a disc (new ones show up after an update)
                  int insertAt = 0;
                  for (String[] def : YT_DISCS) {
                      boolean have = false;
                      for (Disc d : discs) if (d.yt && def[1].equals(d.list)) { have = true; break; }
                      if (have) continue;
                      Disc d = new Disc();
                      d.name = def[0];
                      d.yt = true;
                      d.list = def[1];
                      try { d.color = Color.parseColor(def[2]); } catch (Exception ex) { d.color = 0xffc62828; }
                      discs.add(Math.min(insertAt++, discs.size()), d);
                  }
                  saveDiscs();
              }

              void saveDiscs() {
                  try {
                      JSONArray arr = new JSONArray();
                      for (Disc d : discs) {
                          JSONObject o = new JSONObject();
                          o.put("n", d.name);
                          o.put("y", d.yt);
                          o.put("l", d.list == null ? "" : d.list);
                          o.put("c", d.color);
                          JSONArray s = new JSONArray();
                          for (String song : d.songs) s.put(song);
                          o.put("s", s);
                          arr.put(o);
                      }
                      prefs.edit().putString("discs", arr.toString()).apply();
                  } catch (Exception ignored) { }
              }

              /** Copy songs here with ADB: /sdcard/Android/data/com.josh.snowisland/files/Music */
              File musicDir() {
                  File d = getExternalFilesDir("Music");
                  if (d != null && !d.exists()) d.mkdirs();
                  return d;
              }

              static boolean isSong(String n) {
                  String l = n.toLowerCase(Locale.US);
                  return l.endsWith(".mp3") || l.endsWith(".m4a") || l.endsWith(".aac") || l.endsWith(".ogg")
                          || l.endsWith(".wav") || l.endsWith(".flac") || l.endsWith(".opus");
              }

              static String prettySong(String file) {
                  int dot = file.lastIndexOf('.');
                  String s = dot > 0 ? file.substring(0, dot) : file;
                  return s.replace('_', ' ').trim();
              }

              /** Looks for songs that aren't on a disc yet. Runs on a background thread. */
              void scanSongs() {
                  File dir = musicDir();
                  if (dir == null) return;
                  String[] files = dir.list();
                  if (files == null) return;
                  Set<String> ignored = new HashSet<>(prefs.getStringSet("ignoredsongs", new HashSet<String>()));
                  ArrayList<String> found = new ArrayList<>();
                  for (String f : files) if (isSong(f)) found.add(f);
                  Collections.sort(found, String::compareToIgnoreCase);
                  gameTasks.add(() -> {
                      Set<String> onDisc = new HashSet<>();
                      for (Disc d : discs) onDisc.addAll(d.songs);
                      for (String f : found) {
                          if (onDisc.contains(f) || ignored.contains(f) || skippedSongs.contains(f) || newSongs.contains(f)) continue;
                          newSongs.add(f);
                      }
                  });
              }

              // ================================================================== CD player: playback

              void playDisc(Disc d, int start) {
                  if (d.yt) {
                      if (start >= 0 && d.tracks != null && start < d.tracks.size()) {
                          String[] t = d.tracks.get(start);
                          playYouTube(d, t[0], t[1]);
                      } else {
                          playYouTube(d, null, null);
                      }
                  } else {
                      playLocal(d, start);
                  }
              }

              void playLocal(Disc d, int start) {
                  File dir = musicDir();
                  ArrayList<String> q = new ArrayList<>();
                  for (String s : d.songs) if (dir != null && new File(dir, s).exists()) q.add(s);
                  if (q.isEmpty()) { toast(d.name + " has no songs on it yet"); return; }
                  String first = start >= 0 && start < d.songs.size() ? d.songs.get(start) : null;
                  if (shuffleOn) {
                      // Shuffled, with the chosen song (if any) first
                      Collections.shuffle(q, rnd);
                      if (first != null && q.remove(first)) q.add(0, first);
                  } else if (first != null) {
                      // In order, starting from the chosen song
                      int at = q.indexOf(first);
                      if (at > 0) q = new ArrayList<>(q.subList(at, q.size()));
                  }
                  stopRadio();
                  final ArrayList<String> queue = q;
                  nowDisc = d;
                  nowYT = false;
                  radioPaused = false;
                  runOnUiThread(() -> {
                      cdQueue.clear();
                      cdQueue.addAll(queue);
                      cdIndex = 0;
                      startCdTrack();
                  });
              }

              /** UI thread only. */
              void startCdTrack() {
                  try { if (cdPlayer != null) cdPlayer.release(); } catch (Exception ignored) { }
                  cdPlayer = null;
                  cdPlaying = false;
                  if (cdQueue.isEmpty() || destroyed) { updateMusic(); return; }
                  cdIndex = (cdIndex % cdQueue.size() + cdQueue.size()) % cdQueue.size();
                  String song = cdQueue.get(cdIndex);
                  try {
                      MediaPlayer mp = new MediaPlayer();
                      mp.setAudioAttributes(new AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build());
                      mp.setDataSource(new File(musicDir(), song).getAbsolutePath());
                      mp.setOnCompletionListener(m -> {
                          // The disc ends after its last song
                          if (cdIndex + 1 >= cdQueue.size()) { stopRadio(); toast("That's the end of the disc"); }
                          else { cdIndex++; startCdTrack(); }
                      });
                      mp.prepare();
                      mp.setVolume(cdVolume, cdVolume);
                      cdPlayer = mp;
                      nowTitle = prettySong(song);
                      if (resumed) { mp.start(); cdPlaying = true; }
                      else { cdPlaying = true; cdResumeOnReturn = true; }
                      radioPaused = false;
                  } catch (Exception ex) {
                      toast("Couldn't play " + prettySong(song));
                  }
                  updateMusic();
              }

              /** Shuffle on/off. MP3 discs reshuffle the songs still to come; YouTube discs ask SmartTube. */
              void setShuffle(boolean on) {
                  shuffleOn = on;
                  prefs.edit().putBoolean("shuffle", on).apply();
                  play(S_TOGGLE, 0.45f, on ? 1.15f : 0.85f);
                  Disc d = nowDisc;
                  if (d == null) return;
                  if (nowYT) {
                      sendShuffleToSmartTube(on);
                  } else {
                      runOnUiThread(() -> {
                          if (cdIndex + 1 >= cdQueue.size()) return;
                          ArrayList<String> rest = new ArrayList<>(cdQueue.subList(cdIndex + 1, cdQueue.size()));
                          if (on) Collections.shuffle(rest, rnd);
                          else Collections.sort(rest, (a, b) -> Integer.compare(d.songs.indexOf(a), d.songs.indexOf(b)));
                          while (cdQueue.size() > cdIndex + 1) cdQueue.remove(cdQueue.size() - 1);
                          cdQueue.addAll(rest);
                      });
                  }
              }

              void sendShuffleToSmartTube(boolean on) {
                  MediaController mc = smartTubeSession();
                  if (mc == null) return;
                  try {
                      // The standard "shuffle" request most Android media players understand
                      Bundle b = new Bundle();
                      b.putInt("android.support.v4.media.session.action.ARGUMENT_SHUFFLE_MODE", on ? 1 : 0);
                      mc.getTransportControls().sendCustomAction("android.support.v4.media.session.action.SET_SHUFFLE_MODE", b);
                  } catch (Exception ignored) { }
              }

              /**
               * A random song to shuffle to, within 12 songs either way (SmartTube can only move one song
               * at a time, so very far jumps would take too long).
               */
              int randomTrackNear(Disc d, int cur) {
                  int n = d.tracks.size();
                  int lo = Math.max(0, cur - 12), hi = Math.min(n - 1, cur + 12);
                  if (hi <= lo) return cur;
                  int t2 = cur;
                  while (t2 == cur) t2 = lo + rnd.nextInt(hi - lo + 1);
                  return t2;
              }

              /** Skip SmartTube from song `from` to song `to`, one quick step at a time. */
              void ytJumpTo(MediaController mc, int from, int to, long now) {
                  final int delta = to - from;
                  if (delta == 0) return;
                  ytJumpUntil = now + 3000 + Math.abs(delta) * 400L;
                  ytUserSkipAt = now;
                  new Thread(() -> {
                      for (int k = 0; k < Math.abs(delta); k++) {
                          try { Thread.sleep(320); } catch (InterruptedException ignored) { }
                          try { if (delta > 0) mc.getTransportControls().skipToNext(); else mc.getTransportControls().skipToPrevious(); } catch (Exception ignored) { }
                      }
                  }, "island-shuffle").start();
              }

              /** Where a song title sits in the disc's song list, or -1. */
              static int trackIndex(Disc d, String title) {
                  ArrayList<String[]> tr = d.tracks;
                  if (tr == null) return -1;
                  String n = normTitle(title);
                  for (int i = 0; i < tr.size(); i++) if (normTitle(tr.get(i)[1]).equals(n)) return i;
                  for (int i = 0; i < tr.size(); i++) {
                      String m = normTitle(tr.get(i)[1]);
                      if (n.length() > 6 && m.length() > 6 && (m.contains(n) || n.contains(m))) return i;
                  }
                  return -1;
              }

              static String normTitle(String t) {
                  return t == null ? "" : t.toLowerCase(Locale.US).replaceAll("[^a-z0-9]", "");
              }

              /** Is this title one of the disc's songs? */
              static boolean onDisc(Disc d, String title) {
                  ArrayList<String[]> tr = d.tracks;
                  if (tr == null) return true;
                  String n = normTitle(title);
                  if (n.isEmpty()) return true;
                  for (String[] t : tr) {
                      String m = normTitle(t[1]);
                      if (m.isEmpty()) continue;
                      if (m.equals(n) || (n.length() > 6 && m.length() > 6 && (m.contains(n) || n.contains(m)))) return true;
                  }
                  return false;
              }

              void radioToggle() {
                  Disc d = nowDisc;
                  if (d == null) return;
                  if (nowYT && mediaAccess && smartTubeSession() == null) {
                      // SmartTube's player was closed: start the disc again
                      playYouTube(d, null, null);
                      return;
                  }
                  if (nowYT) {
                      MediaController mc = smartTubeSession();
                      boolean wasPaused = radioPaused;
                      if (mc != null) {
                          try {
                              PlaybackState st = mc.getPlaybackState();
                              boolean playing = st != null && st.getState() == PlaybackState.STATE_PLAYING;
                              if (playing) mc.getTransportControls().pause(); else mc.getTransportControls().play();
                              radioPaused = playing;
                          } catch (Exception ex) { mediaKey(KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE); radioPaused = !wasPaused; }
                      } else {
                          mediaKey(KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE);
                          radioPaused = !wasPaused;
                      }
                      ytActive = true;
                      ytQuietSince = 0;
                      ytGraceUntil = System.currentTimeMillis() + 8000;
                      ytUserPaused = radioPaused;
                      updateMusic();
                  } else {
                      runOnUiThread(() -> {
                          try {
                              if (cdPlayer == null) { startCdTrack(); return; }
                              if (cdPlayer.isPlaying()) { cdPlayer.pause(); cdPlaying = false; radioPaused = true; }
                              else { cdPlayer.start(); cdPlaying = true; radioPaused = false; }
                          } catch (Exception ignored) { }
                          updateMusic();
                      });
                  }
                  play(S_TOGGLE, 0.4f, radioPaused ? 0.8f : 1.1f);
              }

              void radioSkip(int dir) {
                  if (nowDisc == null) return;
                  if (nowYT) {
                      // SmartTube is playing the playlist, so its own next/previous stay on the disc
                      ytUserSkipAt = System.currentTimeMillis();
                      MediaController mc = smartTubeSession();
                      boolean done = false;
                      Disc sd = nowDisc;
                      if (shuffleOn && mc != null && sd != null && sd.tracks != null) {
                          // Shuffle on: next picks a random song, back returns to the one before it
                          int curIdx = trackIndex(sd, nowTitle);
                          if (curIdx >= 0) {
                              long now = System.currentTimeMillis();
                              if (dir > 0) {
                                  ytHistory.add(curIdx);
                                  ytJumpTo(mc, curIdx, randomTrackNear(sd, curIdx), now);
                                  done = true;
                              } else if (!ytHistory.isEmpty()) {
                                  ytJumpTo(mc, curIdx, ytHistory.remove(ytHistory.size() - 1), now);
                                  done = true;
                              }
                          }
                      }
                      if (mc != null && !done) {
                          try {
                              if (dir > 0) mc.getTransportControls().skipToNext(); else mc.getTransportControls().skipToPrevious();
                              done = true;
                          } catch (Exception ignored) { }
                      }
                      if (!done && mc == null) mediaKey(dir > 0 ? KeyEvent.KEYCODE_MEDIA_NEXT : KeyEvent.KEYCODE_MEDIA_PREVIOUS);
                      radioPaused = false;
                      ytUserPaused = false;
                      ytGraceUntil = System.currentTimeMillis() + 8000;
                      updateMusic();
                      play(S_TICK, 0.45f, dir > 0 ? 1.2f : 0.9f);
                  } else {
                      runOnUiThread(() -> {
                          // "Previous" restarts the song if it's more than a few seconds in
                          try {
                              if (dir < 0 && cdPlayer != null && cdPlayer.getCurrentPosition() > 4000) {
                                  cdPlayer.seekTo(0);
                                  if (!cdPlayer.isPlaying()) { cdPlayer.start(); cdPlaying = true; radioPaused = false; updateMusic(); }
                                  return;
                              }
                          } catch (Exception ignored) { }
                          cdIndex += dir;
                          startCdTrack();
                      });
                  }
                  play(S_TICK, 0.45f, dir > 0 ? 1.2f : 0.9f);
              }

              void stopRadio() {
                  if (nowYT && ytActive && !radioPaused) {
                      MediaController mc = smartTubeSession();
                      try { if (mc != null) mc.getTransportControls().pause(); else mediaKey(KeyEvent.KEYCODE_MEDIA_PAUSE); }
                      catch (Exception ex) { mediaKey(KeyEvent.KEYCODE_MEDIA_PAUSE); }
                  }
                  nowDisc = null;
                  nowYT = false;
                  ytActive = false;
                  radioPaused = false;
                  nowTitle = "";
                  cdResumeOnReturn = false;
                  runOnUiThread(() -> {
                      try { if (cdPlayer != null) cdPlayer.release(); } catch (Exception ignored) { }
                      cdPlayer = null;
                      cdPlaying = false;
                      cdQueue.clear();
                      updateMusic();
                  });
              }

              /**
               * Plays a YouTube disc in SmartTube. SmartTube plays the playlist in order by itself (no
               * suggestions, no screen flashing between songs); Snow Island just watches and controls it.
               * Starting the whole disc shows SmartTube's song list, where you pick the first song once.
               */
              void playYouTube(Disc d, String videoId, String title) {
                  if (!smartTubeInstalled()) {
                      toast("Install SmartTube to play YouTube discs");
                      return;
                  }
                  // Already playing this disc? Try to jump straight to the chosen song inside SmartTube
                  if (videoId != null && title != null && nowYT && nowDisc == d) {
                      MediaController mc = smartTubeSession();
                      try {
                          List<MediaSession.QueueItem> q = mc != null ? mc.getQueue() : null;
                          if (q != null) {
                              for (MediaSession.QueueItem it : q) {
                                  CharSequence qt = it.getDescription() != null ? it.getDescription().getTitle() : null;
                                  if (qt != null && qt.toString().equalsIgnoreCase(title)) {
                                      mc.getTransportControls().skipToQueueItem(it.getQueueId());
                                      nowTitle = title;
                                      radioPaused = false;
                                      ytUserPaused = false;
                                      updateMusic();
                                      return;
                                  }
                              }
                          }
                      } catch (Exception ignored) { }
                  }
                  stopRadio();
                  nowDisc = d;
                  nowYT = true;
                  radioPaused = false;
                  ytUserPaused = false;
                  ytActive = true;
                  ytQuietSince = 0;
                  ytGraceUntil = System.currentTimeMillis() + 30000;
                  nowTitle = title != null ? title : d.name;
                  ytSawDiscSong = false;
                  ytShuffleSent = false;
                  ytLastTitle = null;
                  ytHistory.clear();
                  updateMusic();
                  if (d.tracks == null) new Thread(() -> fetchTracks(d), "island-tracks").start();
                  int index = 1;
                  ArrayList<String[]> tr = d.tracks;
                  if (videoId != null && tr != null) for (int i = 0; i < tr.size(); i++) if (tr.get(i)[0].equals(videoId)) { index = i + 1; break; }
                  String url = videoId != null
                          ? "https://www.youtube.com/watch?v=" + videoId + "&list=" + d.list + "&index=" + index
                          : "https://www.youtube.com/playlist?list=" + d.list;
                  // If SmartTube is still holding an old song, close that player first; otherwise it
                  // ignores the new song list
                  MediaController old = smartTubeSession();
                  if (old != null) {
                      try { old.getTransportControls().stop(); } catch (Exception ignored) { }
                      new Thread(() -> {
                          try { Thread.sleep(900); } catch (InterruptedException ignored) { }
                          openInSmartTube(url);
                          armReturn();
                      }, "island-reopen").start();
                      return;
                  }
                  openInSmartTube(url);
                  armReturn();
              }

              void armReturn() {
                  if (!autoReturn) return;
                  returnArmedAt = System.currentTimeMillis();
                  returnHits = 0;
                  returnDeadline = System.currentTimeMillis() + 300000;
                  returnPending = true;
              }

              /**
               * SmartTube's "now playing" controls, if Snow Island has been allowed to see them
               * (adb shell cmd notification allow_listener com.josh.snowisland/com.josh.snowisland.MediaListener).
               */
              MediaController smartTubeSession() {
                  try {
                      MediaSessionManager msm = (MediaSessionManager) getSystemService(MEDIA_SESSION_SERVICE);
                      List<MediaController> list = msm.getActiveSessions(new ComponentName(this, MediaListener.class));
                      mediaAccess = true;
                      String pk = smartTubePkg();
                      for (MediaController mc : list) {
                          String mp = mc.getPackageName();
                          if (mp == null) continue;
                          if (mp.equals(pk) || mp.toLowerCase(Locale.US).contains("smarttube")) return mc;
                      }
                  } catch (Exception ex) {
                      mediaAccess = false;
                  }
                  return null;
              }

              /** Finds SmartTube on the TV: by its known app names, or by looking for an app called "SmartTube". */
              String smartTubePkg() {
                  PackageManager pm = getPackageManager();
                  for (String pk : SMARTTUBE_PKGS) {
                      try { pm.getPackageInfo(pk, 0); return pk; } catch (Exception ignored) { }
                  }
                  List<AppPeng> all;
                  synchronized (lock) { all = allApps; }
                  for (AppPeng a : all) {
                      if (a.label != null && a.label.toLowerCase(Locale.US).replace(" ", "").contains("smarttube")) return a.pkg;
                  }
                  return null;
              }

              boolean smartTubeInstalled() {
                  return smartTubePkg() != null;
              }

              void openInSmartTube(String url) {
                  String pk = smartTubePkg();
                  runOnUiThread(() -> {
                      try {
                          Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                          if (pk != null) i.setPackage(pk);
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(i);
                      } catch (Exception ex) {
                          toast("Couldn't open SmartTube");
                          stopRadio();
                      }
                  });
              }

              /** Reads the song list of a YouTube playlist (first 100 songs). Background thread only. */
              ArrayList<String[]> fetchTracks(Disc d) {
                  if (d.tracks != null) return d.tracks;
                  ArrayList<String[]> out = new ArrayList<>();
                  try {
                      HttpURLConnection con = (HttpURLConnection) new URL("https://www.youtube.com/playlist?list=" + d.list).openConnection();
                      con.setConnectTimeout(10000);
                      con.setReadTimeout(15000);
                      con.setRequestProperty("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36");
                      con.setRequestProperty("Accept-Language", "en-CA,en;q=0.9");
                      con.setRequestProperty("Cookie", "CONSENT=YES+1; SOCS=CAI");
                      String html;
                      try (InputStream in = con.getInputStream()) {
                          ByteArrayOutputStream bo = new ByteArrayOutputStream();
                          byte[] buf = new byte[8192];
                          int n;
                          while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                          html = bo.toString("UTF-8");
                      } finally {
                          con.disconnect();
                      }
                      parseTracks(html, d.list, out);
                  } catch (Exception ignored) { }
                  if (!out.isEmpty()) {
                      fillTitles(d, out);
                      d.tracks = out;
                      try {
                          JSONArray a = new JSONArray();
                          for (String[] t : out) { JSONArray p = new JSONArray(); p.put(t[0]); p.put(t[1]); a.put(p); }
                          prefs.edit().putString("tracks_" + d.list, a.toString()).apply();
                      } catch (Exception ignored) { }
                      return out;
                  }
                  // Offline? Use the list saved last time.
                  try {
                      JSONArray a = new JSONArray(prefs.getString("tracks_" + d.list, "[]"));
                      for (int i = 0; i < a.length(); i++) out.add(new String[]{a.getJSONArray(i).getString(0), a.getJSONArray(i).getString(1)});
                  } catch (Exception ignored) { }
                  for (String[] t : out) { String c2 = prefs.getString("ytt_" + t[0], null); if (c2 != null) t[1] = c2; }
                  if (!out.isEmpty()) d.tracks = out;
                  return out;
              }

              /** Looks up each song's real name (YouTube's simple "oEmbed" lookup), remembering them. Runs in the background. */
              void fillTitles(Disc d, ArrayList<String[]> tracks) {
                  // a few lookups at a time so the song list loads quickly
                  java.util.concurrent.atomic.AtomicInteger next = new java.util.concurrent.atomic.AtomicInteger();
                  Thread[] workers = new Thread[4];
                  for (int w = 0; w < workers.length; w++) {
                      workers[w] = new Thread(() -> {
                          int k;
                          while ((k = next.getAndIncrement()) < tracks.size()) {
                              String[] t = tracks.get(k);
                              String cached = prefs.getString("ytt_" + t[0], null);
                              if (cached != null) { t[1] = cached; continue; }
                              try {
                                  HttpURLConnection con = (HttpURLConnection) new URL("https://www.youtube.com/oembed?format=json&url=https%3A%2F%2Fwww.youtube.com%2Fwatch%3Fv%3D" + t[0]).openConnection();
                                  con.setConnectTimeout(6000);
                                  con.setReadTimeout(6000);
                                  String body;
                                  try (InputStream in = con.getInputStream()) {
                                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                                      byte[] buf = new byte[4096];
                                      int n;
                                      while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                                      body = bo.toString("UTF-8");
                                  } finally {
                                      con.disconnect();
                                  }
                                  String title = new JSONObject(body).optString("title", "");
                                  if (!title.isEmpty()) {
                                      t[1] = title;
                                      prefs.edit().putString("ytt_" + t[0], title).apply();
                                  }
                              } catch (Exception ignored) { }
                          }
                      }, "island-titles");
                      workers[w].start();
                  }
                  for (Thread th : workers) { try { th.join(30000); } catch (InterruptedException ignored) { } }
              }

              static void parseTracks(String html, String list, ArrayList<String[]> out) {
                  Set<String> seen = new HashSet<>();
                  // Each song in the playlist has a "watch this video in this playlist at position N" link
                  Matcher m = Pattern.compile("\"watchEndpoint\":\\{\"videoId\":\"([A-Za-z0-9_-]{11})\",\"playlistId\":\"" + Pattern.quote(list) + "\",\"index\":(\\d+)").matcher(html);
                  ArrayList<Object[]> found = new ArrayList<>();
                  while (m.find()) {
                      String id = m.group(1);
                      if (!seen.add(id)) continue;
                      int idx = 0;
                      try { idx = Integer.parseInt(m.group(2)); } catch (Exception ignored) { }
                      found.add(new Object[]{idx, id, null});
                  }
                  Collections.sort(found, (a, b) -> Integer.compare((Integer) a[0], (Integer) b[0]));
                  for (Object[] f : found) out.add(new String[]{(String) f[1], f[2] != null ? (String) f[2] : "Song " + (out.size() + 1)});
                  if (!out.isEmpty()) return;
                  // Older page layout
                  m = Pattern.compile("\"playlistVideoRenderer\":\\{\"videoId\":\"([A-Za-z0-9_-]{11})\"").matcher(html);
                  while (m.find()) {
                      String id = m.group(1);
                      if (!seen.add(id)) continue;
                      String t = jsonStringAfter(html, m.end(), "\"title\":{\"runs\":[{\"text\":\"", 3000);
                      out.add(new String[]{id, t != null ? t : "Song " + (out.size() + 1)});
                  }
              }

              /** The last song title that appears shortly before position `at`. */
              static String titleBefore(String html, int at, int within) {
                  String[] keys = {"\"title\":{\"runs\":[{\"text\":\"", "\"title\":{\"simpleText\":\"", "\"title\":{\"content\":\""};
                  int best = -1;
                  String bestKey = null;
                  for (String k : keys) {
                      int pos = html.lastIndexOf(k, at);
                      if (pos > best && at - pos < within) { best = pos; bestKey = k; }
                  }
                  if (best < 0) return null;
                  return jsonStringAfter(html, best, bestKey, 10);
              }

              /** Finds key within the next `within` characters and returns the JSON string that follows it. */
              static String jsonStringAfter(String s, int from, String key, int within) {
                  int k = s.indexOf(key, from);
                  if (k < 0 || k - from > within) return null;
                  int start = k + key.length();
                  StringBuilder sb = new StringBuilder();
                  for (int i = start; i < s.length() && i < start + 400; i++) {
                      char ch = s.charAt(i);
                      if (ch == '\\' && i + 1 < s.length()) { sb.append(ch).append(s.charAt(++i)); continue; }
                      if (ch == '"') {
                          try { return new JSONArray("[\"" + sb + "\"]").getString(0); } catch (Exception ex) { return sb.toString(); }
                      }
                      sb.append(ch);
                  }
                  return null;
              }

              void mediaKey(int code) {
                  try {
                      AudioManager am = (AudioManager) getSystemService(AUDIO_SERVICE);
                      long t = SystemClock.uptimeMillis();
                      am.dispatchMediaKeyEvent(new KeyEvent(t, t, KeyEvent.ACTION_DOWN, code, 0));
                      am.dispatchMediaKeyEvent(new KeyEvent(t, t, KeyEvent.ACTION_UP, code, 0));
                  } catch (Exception ignored) { }
              }

              /**
               * Watches for SmartTube going quiet (song list finished, or you closed it) so the
               * island's own music can come back.
               */
              void startRadioWatch() {
                  Thread t = new Thread(() -> {
                      while (!destroyed) {
                          try { Thread.sleep(1500); } catch (InterruptedException ignored) { }
                          long now = System.currentTimeMillis();
                          MediaController mc = nowYT ? smartTubeSession() : null;
                          boolean stPlaying = false;
                          if (mc != null) {
                              // We can see exactly what SmartTube is doing
                              try {
                                  PlaybackState st = mc.getPlaybackState();
                                  int state = st != null ? st.getState() : PlaybackState.STATE_NONE;
                                  stPlaying = state == PlaybackState.STATE_PLAYING;
                                  MediaMetadata md = mc.getMetadata();
                                  String title = md != null ? md.getString(MediaMetadata.METADATA_KEY_TITLE) : null;
                                  long dur = md != null ? md.getLong(MediaMetadata.METADATA_KEY_DURATION) : 0;
                                  long pos = st != null ? st.getPosition() : 0;
                                  long livePos = pos;
                                  if (st != null && stPlaying && st.getLastPositionUpdateTime() > 0) {
                                      livePos = pos + (long) ((SystemClock.elapsedRealtime() - st.getLastPositionUpdateTime()) * st.getPlaybackSpeed());
                                  }
                                  progPos = livePos; progDur = dur; progAt = SystemClock.elapsedRealtime(); progPlaying = stPlaying;
                                  if (title != null && !title.isEmpty()) nowTitle = title;
                                  Disc cur = nowDisc;
                                  if (cur != null && stPlaying && title != null && !title.isEmpty() && cur.tracks != null) {
                                      if (onDisc(cur, title)) {
                                          ytSawDiscSong = true;
                                          // Shuffle: when SmartTube moves on to the next song by itself, jump to a random one instead
                                          // (only when the song before had actually played to its end, so our own skips don't trigger more skips)
                                          long onFor = now - ytTitleSince;
                                          boolean finished = ytPrevDur > 0 ? onFor >= ytPrevDur - 15000 : onFor >= 60000;
                                          if (shuffleOn && ytLastTitle != null && !title.equals(ytLastTitle) && finished
                                                  && now - ytUserSkipAt > 6000 && now > ytJumpUntil) {
                                              int cur2 = trackIndex(cur, title);
                                              if (cur2 >= 0) {
                                                  int prevIdx = trackIndex(cur, ytLastTitle);
                                                  if (prevIdx >= 0) ytHistory.add(prevIdx);
                                                  ytJumpTo(mc, cur2, randomTrackNear(cur, cur2), now);
                                              }
                                          }
                                          if (!title.equals(ytLastTitle)) { ytPrevPos = 0; ytPrevDur = 0; }
                                          if (now > ytJumpUntil && !title.equals(ytLastTitle)) { ytLastTitle = title; ytTitleSince = now; }
                                          if (title.equals(ytLastTitle)) { ytPrevPos = livePos; ytPrevDur = dur; }
                                      } else if (ytSawDiscSong) {
                                          // SmartTube ran past the last song into its own suggestions: the disc is over
                                          try { mc.getTransportControls().stop(); } catch (Exception ignored) { }
                                          stopRadio();
                                          toast("That's the end of the disc");
                                          continue;
                                      }
                                  }
                                  if (ytResumeAt > 0 && now >= ytResumeAt) {
                                      ytResumeAt = 0;
                                      if (!stPlaying && !ytUserPaused && state == PlaybackState.STATE_PAUSED) {
                                          mc.getTransportControls().play();
                                          stPlaying = true;
                                      }
                                  }
                                  if (stPlaying) { ytSawPlaying = true; ytQuietSince = 0; }
                                  boolean wasPaused = radioPaused;
                                  radioPaused = !stPlaying;
                                  if (wasPaused != radioPaused) updateMusic();
                              } catch (Exception ignored) { }
                          }
                          boolean musicOn = stPlaying;
                          if (mc == null) {
                              try { musicOn = ((AudioManager) getSystemService(AUDIO_SERVICE)).isMusicActive(); } catch (Exception ignored) { }
                          }
                          // Once SmartTube is playing, hop back to the island (needs "display over other apps")
                          if (returnPending) {
                              if ((resumed && now - returnArmedAt > 6000) || now > returnDeadline) returnPending = false;
                              else if (resumed) { }
                              else {
                                  returnHits = musicOn ? returnHits + 1 : 0;
                                  if (returnHits >= 2) {
                                      returnPending = false;
                                      // SmartTube pauses when the island covers it, so press play again for you
                                      ytResumeAt = now + 2500;
                                      runOnUiThread(() -> {
                                          try {
                                              Intent i = new Intent(this, MainActivity.class);
                                              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                                              startActivity(i);
                                          } catch (Exception ignored) { }
                                      });
                                  }
                              }
                          }
                          // Without SmartTube's controls, guess from whether any music is playing
                          if (mc != null || !ytActive || radioPaused || !resumed) continue;
                          if (now < ytGraceUntil) continue;
                          if (musicOn) { ytQuietSince = 0; continue; }
                          if (ytQuietSince == 0) ytQuietSince = now;
                          else if (now - ytQuietSince > 10000) {
                              radioPaused = true;
                              updateMusic();
                          }
                      }
                  }, "island-radio");
                  t.setDaemon(true);
                  t.start();
              }

              void toast(String msg) {
                  runOnUiThread(() -> Toast.makeText(this, msg, Toast.LENGTH_SHORT).show());
              }

              /** Pops up the TV keyboard to type a name. The callback runs on the game thread. */
              void askName(String title, String start, java.util.function.Consumer<String> done) {
                  dialogOpen = true;
                  runOnUiThread(() -> {
                      try {
                          EditText et = new EditText(this);
                          et.setSingleLine(true);
                          et.setText(start);
                          et.setSelection(start.length());
                          new AlertDialog.Builder(this)
                                  .setTitle(title)
                                  .setView(et)
                                  .setPositiveButton("Save", (dlg, w) -> {
                                      String v = et.getText().toString().trim();
                                      gameTasks.add(() -> done.accept(v.isEmpty() ? start : v));
                                  })
                                  .setNegativeButton("Cancel", (dlg, w) -> gameTasks.add(() -> done.accept(null)))
                                  .setOnCancelListener(dlg -> gameTasks.add(() -> done.accept(null)))
                                  .setOnDismissListener(dlg -> dialogOpen = false)
                                  .show();
                      } catch (Exception ex) {
                          dialogOpen = false;
                          gameTasks.add(() -> done.accept(start));
                      }
                  });
              }

              // ================================================================== apps

              void loadApps() {
                  new Thread(() -> {
                      PackageManager pm = getPackageManager();
                      LinkedHashMap<String, AppPeng> found = new LinkedHashMap<>();
                      // Penguins we already have keep everything (position, mood, icon), so coming back is instant
                      Map<String, AppPeng> known;
                      synchronized (lock) { known = new HashMap<>(byPkg); }
                      String[] cats = {Intent.CATEGORY_LEANBACK_LAUNCHER, Intent.CATEGORY_LAUNCHER};
                      for (String cat : cats) {
                          Intent q = new Intent(Intent.ACTION_MAIN);
                          q.addCategory(cat);
                          List<ResolveInfo> list;
                          try { list = pm.queryIntentActivities(q, 0); } catch (Exception ex) { continue; }
                          for (ResolveInfo ri : list) {
                              String pk = ri.activityInfo.packageName;
                              if (pk.equals(getPackageName()) || found.containsKey(pk)) continue;
                              AppPeng old = known.get(pk);
                              if (old != null) {
                                  old.label = String.valueOf(ri.loadLabel(pm));
                                  found.put(pk, old);
                                  continue;
                              }
                              AppPeng a = new AppPeng();
                              a.pkg = pk;
                              a.label = String.valueOf(ri.loadLabel(pm));
                              Intent li = cat.equals(Intent.CATEGORY_LEANBACK_LAUNCHER)
                                      ? pm.getLeanbackLaunchIntentForPackage(pk)
                                      : pm.getLaunchIntentForPackage(pk);
                              if (li == null) {
                                  li = new Intent(Intent.ACTION_MAIN);
                                  li.addCategory(cat);
                                  li.setClassName(pk, ri.activityInfo.name);
                              }
                              a.intent = li;
                              try { a.icon = toBitmap(ri.loadIcon(pm), 72); } catch (Exception ex) { a.icon = null; }
                              a.launches = prefs.getInt("n_" + pk, 0);
                              a.scarf = SCARVES[(pk.hashCode() & 0x7fffffff) % SCARVES.length];
                              a.bodyCol = a.icon != null ? iconColor(a.icon) : PENGUIN_BLACK;
                              found.put(pk, a);
                          }
                      }
                      List<AppPeng> all = new ArrayList<>(found.values());
                      Collections.sort(all, (a, b) -> a.label.compareToIgnoreCase(b.label));
                      List<Chair> ch = loadInputs();
                      synchronized (lock) {
                          allApps = all;
                          allChairs = ch;
                          relayout();
                      }
                      scanSongs();
                  }, "island-apps").start();
              }

              /** Builds the visible list: hidden apps removed, most-used apps closest to the igloo. Call with lock held. */
              void relayout() {
                  List<AppPeng> vis = new ArrayList<>();
                  for (AppPeng a : allApps) if (!hidden.contains(a.pkg)) vis.add(a);
                  Collections.sort(vis, (a, b) -> a.launches != b.launches
                          ? Integer.compare(b.launches, a.launches) : a.label.compareToIgnoreCase(b.label));
                  float[] ring = {0.36f, 0.55f, 0.71f, 0.84f};
                  int[] cap = {6, 10, 14, 1000};
                  int idx = 0, n = vis.size();
                  Random r = new Random(42);
                  for (int k = 0; k < ring.length && idx < n; k++) {
                      int count = Math.min(cap[k], n - idx);
                      double offset = Math.PI / count * 0.5 + k * 0.45;
                      for (int j = 0; j < count; j++, idx++) {
                          AppPeng a = vis.get(idx);
                          double ang = offset + 2 * Math.PI * j / count;
                          float nhx = CX + (float) Math.cos(ang) * RX * ring[k];
                          float nhy = CY + (float) Math.sin(ang) * RY * ring[k];
                          AppPeng old = byPkg.get(a.pkg);
                          if (old != null && old != a && old.placed) {
                              a.x = old.x; a.y = old.y; a.facing = old.facing; a.phase = old.phase;
                              a.placed = true;
                          } else if (!a.placed) {
                              a.x = nhx; a.y = nhy; a.phase = r.nextFloat() * 6f;
                              a.placed = true;
                          }
                          if (old == null || Math.abs(nhx - a.hx) > 1 || Math.abs(nhy - a.hy) > 1) {
                              a.tx = nhx; a.ty = nhy; a.wait = 0;
                          }
                          a.hx = nhx; a.hy = nhy;
                      }
                  }
                  byPkg.clear();
                  for (AppPeng a : allApps) {
                      byPkg.put(a.pkg, a);
                      if (a.chatWith != null && !vis.contains(a.chatWith)) {
                          a.chatWith = null; a.chatTalking = false; a.speaking = false; a.arrived = false; a.bubble = null;
                      }
                  }
                  apps = vis;

                  // HDMI chairs in a half circle around the front of the igloo
                  List<Chair> vc = new ArrayList<>();
                  for (Chair c : allChairs) if (!hidden.contains(c.key)) vc.add(c);
                  double[] angs = {28, 58, 122, 5, 152, 175};
                  List<Chair> placedChairs = new ArrayList<>();
                  for (int i = 0; i < vc.size() && i < angs.length; i++) {
                      Chair c = vc.get(i);
                      double a = Math.toRadians(angs[i]);
                      c.x = IGLOO_X + (float) Math.cos(a) * 228;
                      c.y = IGLOO_Y - 5 + (float) Math.sin(a) * 128;
                      placedChairs.add(c);
                  }
                  chairs = placedChairs;
              }

              List<Chair> loadInputs() {
                  List<Chair> out = new ArrayList<>();
                  try {
                      TvInputManager tim = (TvInputManager) getSystemService(TV_INPUT_SERVICE);
                      if (tim == null) return out;
                      List<TvInputInfo> all = tim.getTvInputList();
                      for (TvInputInfo info : all) {
                          if (info.getType() != TvInputInfo.TYPE_HDMI || info.getParentId() != null) continue;
                          try { if (info.isHidden(this)) continue; } catch (Exception ignored) { }
                          Chair c = new Chair();
                          c.key = "input:" + info.getId();
                          CharSequence cl = null;
                          try { cl = info.loadCustomLabel(this); } catch (Exception ignored) { }
                          CharSequence l = info.loadLabel(this);
                          c.label = String.valueOf(cl != null && cl.length() > 0 ? cl : l);
                          for (TvInputInfo child : all) {
                              if (info.getId().equals(child.getParentId())) {
                                  String cn = String.valueOf(child.loadLabel(this));
                                  if (!cn.isEmpty() && !cn.equals(c.label)) c.sub = cn;
                                  break;
                              }
                          }
                          c.intent = new Intent(Intent.ACTION_VIEW, TvContract.buildChannelUriForPassthroughInput(info.getId()));
                          out.add(c);
                      }
                  } catch (Exception ignored) { }
                  Collections.sort(out, (a, b) -> a.label.compareToIgnoreCase(b.label));
                  int[] cols = {0xffd84315, 0xff1565c0, 0xff2e7d32, 0xfff9a825, 0xff6a1b9a, 0xff00838f};
                  for (int i = 0; i < out.size(); i++) out.get(i).color = cols[i % cols.length];
                  return out;
              }

              /** Picks the main colour of an app icon, darkened a little so a white belly stands out. */
              int iconColor(Bitmap b) {
                  float[] hsv = new float[3];
                  long r = 0, g = 0, bl = 0, wsum = 0;
                  int w = b.getWidth(), h = b.getHeight();
                  for (int y = 0; y < h; y += 3) {
                      for (int x = 0; x < w; x += 3) {
                          int c = b.getPixel(x, y);
                          if (((c >>> 24) & 0xff) < 200) continue;
                          Color.colorToHSV(c, hsv);
                          if (hsv[1] < 0.35f || hsv[2] < 0.25f) continue;
                          int wt = (int) (hsv[1] * hsv[2] * 100);
                          r += ((c >> 16) & 0xff) * wt;
                          g += ((c >> 8) & 0xff) * wt;
                          bl += (c & 0xff) * wt;
                          wsum += wt;
                      }
                  }
                  if (wsum < 300) return 0xff37474f;
                  int rr = (int) (r / wsum) * 80 / 100, gg = (int) (g / wsum) * 80 / 100, bb = (int) (bl / wsum) * 80 / 100;
                  return 0xff000000 | (rr << 16) | (gg << 8) | bb;
              }

              Bitmap toBitmap(Drawable d, int size) {
                  Bitmap b = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888);
                  Canvas c = new Canvas(b);
                  d.setBounds(0, 0, size, size);
                  d.draw(c);
                  return b;
              }

              void launch(AppPeng a) {
                  a.launches++;
                  prefs.edit().putInt("n_" + a.pkg, a.launches).apply();
                  startIntent(a.intent, a.label);
              }

              void startIntent(Intent intent, String label) {
                  runOnUiThread(() -> {
                      try {
                          Intent i = new Intent(intent);
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(i);
                      } catch (Exception ex) {
                          Toast.makeText(this, "Couldn't open " + label, Toast.LENGTH_SHORT).show();
                      }
                  });
              }

              // ================================================================== seasons

              int activeSeason() {
                  if (seasonPref == 1) return SEASON_XMAS;
                  if (seasonPref == 2) return SEASON_HALLOWEEN;
                  if (seasonPref == 3) return SEASON_VALENTINE;
                  if (seasonPref == 4) return SEASON_NEWYEAR;
                  if (seasonPref == 5) return SEASON_NONE;
                  Calendar cal = Calendar.getInstance();
                  int m = cal.get(Calendar.MONTH), d = cal.get(Calendar.DAY_OF_MONTH), h = cal.get(Calendar.HOUR_OF_DAY);
                  if (m == Calendar.OCTOBER && d >= 15) return SEASON_HALLOWEEN;
                  if ((m == Calendar.DECEMBER && d == 31 && h >= 18) || (m == Calendar.JANUARY && d == 1)) return SEASON_NEWYEAR;
                  if (m == Calendar.DECEMBER || (m == Calendar.JANUARY && d <= 6)) return SEASON_XMAS;
                  if (m == Calendar.FEBRUARY && d >= 7 && d <= 14) return SEASON_VALENTINE;
                  return SEASON_NONE;
              }

              // ================================================================== baked art

              void bakeWorld() {
                  world = Bitmap.createBitmap((int) WW, (int) WH, Bitmap.Config.RGB_565);
                  Canvas c = new Canvas(world);
                  Paint w = new Paint(Paint.ANTI_ALIAS_FLAG);
                  Random r = new Random(7);

                  w.setShader(new LinearGradient(0, 0, 0, WH, 0xff2f78b8, 0xff123f6c, Shader.TileMode.CLAMP));
                  c.drawRect(0, 0, WW, WH, w);
                  w.setShader(null);
                  w.setColor(0xff4a97cf);
                  c.drawOval(CX - RX - 70, CY - RY - 55, CX + RX + 70, CY + RY + 55, w);
                  w.setColor(0xffcfe7f4);
                  c.drawOval(CX - RX - 20, CY - RY - 16, CX + RX + 20, CY + RY + 16, w);
                  w.setShader(new RadialGradient(CX, CY - 80, RX, 0xffffffff, 0xffe3eff7, Shader.TileMode.CLAMP));
                  c.drawOval(CX - RX, CY - RY, CX + RX, CY + RY, w);
                  w.setShader(null);

                  w.setColor(0xffe6f0f7);
                  for (int i = 0; i < 55; i++) {
                      float[] pt = randomOnIsland(r, 0.1f, 0.9f);
                      float dw = 50 + r.nextFloat() * 110, dh = 14 + r.nextFloat() * 26;
                      c.drawOval(pt[0] - dw, pt[1] - dh, pt[0] + dw, pt[1] + dh, w);
                  }
                  for (int i = 0; i < 26; i++) {
                      float[] pt = randomOnIsland(r, 0.97f, 1.015f);
                      float s = 0.6f + r.nextFloat() * 0.9f;
                      w.setColor(0xff7d8a95);
                      c.drawOval(pt[0] - 18 * s, pt[1] - 11 * s, pt[0] + 18 * s, pt[1] + 9 * s, w);
                      w.setColor(0xffffffff);
                      c.drawOval(pt[0] - 12 * s, pt[1] - 12 * s, pt[0] + 8 * s, pt[1] - 4 * s, w);
                  }
                  ArrayList<float[]> things = new ArrayList<>();
                  for (int i = 0; i < 70; i++) {
                      float[] pt = randomOnIsland(r, 0.88f, 0.97f);
                      things.add(new float[]{pt[0], pt[1], 0.8f + r.nextFloat() * 0.6f, 0});
                  }
                  for (int i = 0; i < 4; i++) {
                      float[] pt = randomOnIsland(r, 0.86f, 0.88f);
                      things.add(new float[]{pt[0], pt[1], 1f, 1});
                  }
                  Collections.sort(things, (a, b) -> Float.compare(a[1], b[1]));
                  for (float[] t : things) {
                      if (t[3] == 0) drawTree(c, w, t[0], t[1], t[2]);
                      else drawSnowman(c, w, t[0], t[1]);
                  }
                  // The igloo is its own picture so your penguin can walk behind it
                  iglooBmp = Bitmap.createBitmap(320, 176, Bitmap.Config.ARGB_8888);
                  Canvas ic = new Canvas(iglooBmp);
                  Paint ip = new Paint(Paint.ANTI_ALIAS_FLAG);
                  drawIgloo(ic, ip, 160, 150);
                  drawIglooChimney(ic, ip);
              }

