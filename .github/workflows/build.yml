                  // the spinning disc
                  float dcx = l + 112, dcy = t + 78;
                  if (d != null) {
                      c.save();
                      c.rotate(playing ? (time * 140) % 360 : 0, dcx, dcy);
                      drawDisc(c, dcx, dcy, 54, d, false);
                      c.restore();
                  }

                  // song info and progress
                  float tx = l + 186, tr = l + w - 20;
                  tp.setTextAlign(Paint.Align.LEFT);
                  tp.setTextSize(23);
