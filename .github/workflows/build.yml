                          c.drawCircle(-5, -8.5f, 1.8f, p); c.drawCircle(5, -8.5f, 1.8f, p);
                          p.setColor(0xffffa726);
                          path.reset(); path.moveTo(-4, -3); path.lineTo(4, -3); path.lineTo(0, 3); path.close();
                          c.drawPath(path, p);
                      } else {
                          p.setColor(0xffef8a3c);
                          c.drawOval(-12, -6, -2, 2, p); c.drawOval(2, -6, 12, 2, p);
                      }
                  }
                  c.restore();
              }

              void drawSign(Canvas c, AppPeng a, boolean highlight) {
                  float bob = (float) Math.sin(time * 2f + a.phase) * 3f;
                  if (bellyIcons) {
                      // Name floats over the head like a username in a game (above the Santa hat at Christmas)
                      float bottom = a.y - (activeSeason() == SEASON_XMAS ? 92 : 74);
                      int body = a.bodyCol & 0xffffff;
                      if (highlight) drawNameTag(c, a.x, bottom - 4 + bob, a.label, tagColour ? 0xf0000000 | body : 0xe0263238);
                      else if (namesAlways) drawUsername(c, a.x, bottom, a.label, tagColour ? 0xd8000000 | body : 0x99263238);
                      return;
                  }
                  float s = highlight ? 1.35f : 1f;
                  float cx = a.x, cy = a.y - 86 + bob - (highlight ? 8 : 0);
                  float half = 20 * s;

                  p.setColor(0xffffffff);
                  path.reset();
                  path.moveTo(cx - 5, cy + half - 1); path.lineTo(cx + 5, cy + half - 1); path.lineTo(cx, cy + half + 7);
                  path.close();
                  c.drawPath(path, p);

                  p.setColor(0x40000000);
                  rf.set(cx - half + 2, cy - half + 3, cx + half + 2, cy + half + 3);
                  c.drawRoundRect(rf, 9, 9, p);
                  p.setColor(0xffffffff);
                  rf.set(cx - half, cy - half, cx + half, cy + half);
                  c.drawRoundRect(rf, 9, 9, p);
                  if (highlight) {
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(3.5f);
                      p.setColor(a.scarf);
                      c.drawRoundRect(rf, 9, 9, p);
                      p.setStyle(Paint.Style.FILL);
                  }
                  if (a.icon != null) {
                      float ih = 15.5f * s;
                      rf.set(cx - ih, cy - ih, cx + ih, cy + ih);
                      c.drawBitmap(a.icon, null, rf, p);
                  } else {
                      tp.setColor(0xff37474f);
                      tp.setTextSize(20 * s);
                      tp.setTextAlign(Paint.Align.CENTER);
                      c.drawText(a.label.substring(0, 1).toUpperCase(Locale.getDefault()), cx, cy + 7 * s, tp);
                  }
                  if (highlight) drawNameTag(c, cx, cy - half - 6, a.label);
              }

