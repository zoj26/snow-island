                  float chatT, chatDur, speakT;
                  boolean chatTalking, speaking, arrived;
                  String bubble;
                  boolean hangout;            // staying put in one spot for a while
                  float spreeT, spreeNext;    // throwing snowballs about for a bit
                  float lookT;                // when to glance somewhere else while standing about
              }

              static class Chair {
                  String key, label, sub;
                  Intent intent;
                  float x, y;
                  int color;
              }

              static class Ball {
                  float x, y, vx, vy, t, dur;
