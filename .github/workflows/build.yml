              /** {position, length} of the current song in milliseconds, or null if unknown. */
              long[] songProgress() {
                  if (nowDisc == null) return null;
                  if (!nowYT) {
                      try {
                          MediaPlayer mp = cdPlayer;
                          if (mp != null) return new long[]{mp.getCurrentPosition(), mp.getDuration()};
                      } catch (Exception ignored) { }
                      return null;
                  }
                  if (progDur <= 0) return null;
                  long pos = progPos + (progPlaying ? SystemClock.elapsedRealtime() - progAt : 0);
                  return new long[]{Math.min(pos, progDur), progDur};
              }

              static String mmss(long ms) {
                  long s2 = Math.max(0, ms / 1000);
                  return (s2 / 60) + ":" + (s2 % 60 < 10 ? "0" : "") + (s2 % 60);
              }

              void drawWheel(Canvas c) {
                  // Stick picks a slice directly
                  if (Math.abs(axX) + Math.abs(axY) > 0.6f) {
                      double ang = Math.toDegrees(Math.atan2(axY, axX)) + 90;
                      if (ang < 0) ang += 360;
                      int sel = (int) Math.round(ang / (360.0 / WN)) % WN;
                      if (sel != wheelSel) { wheelSel = sel; play(S_TICK, 0.3f, 1f); }
                  }
                  c.drawColor(0x66000000);
                  float cx = VW / 2f, cy = VH / 2f, ro = 245, ri = 92;
                  p.setColor(0xd9142433);
                  c.drawCircle(cx, cy, ro, p);
                  rf.set(cx - ro, cy - ro, cx + ro, cy + ro);
                  p.setColor(0xff2e7dbd);
                  float slice = 360f / WN;
                  c.drawArc(rf, -90 + wheelSel * slice - slice / 2, slice, true, p);
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(2);
                  p.setColor(0x40ffffff);
                  for (int i = 0; i < WN; i++) {
                      double a = Math.toRadians(-90 + i * slice - slice / 2);
                      c.drawLine(cx + (float) Math.cos(a) * ri, cy + (float) Math.sin(a) * ri,
                              cx + (float) Math.cos(a) * ro, cy + (float) Math.sin(a) * ro, p);
                  }
                  p.setStyle(Paint.Style.FILL);
                  p.setColor(0xff0f1c2a);
                  c.drawCircle(cx, cy, ri, p);

                  tp.setTextAlign(Paint.Align.CENTER);
                  for (int i = 0; i < WN; i++) {
                      double a = Math.toRadians(-90 + i * slice);
                      float ix = cx + (float) Math.cos(a) * 168, iy = cy + (float) Math.sin(a) * 168;
                      tp.setColor(0xffffffff);
                      tp.setTextSize(i == wheelSel ? 46 : 38);
                      if (i == W_REMOTE) drawRemoteIcon(c, ix, iy - 6, i == wheelSel ? 1.15f : 1f);
                      else if (i == W_WHISTLE) drawWhistleIcon(c, ix, iy - 6, i == wheelSel ? 1.15f : 1f);
                      else c.drawText(WHEEL_ICONS[i], ix, iy + 8, tp);
                      tp.setTextSize(14);
                      tp.setColor(i == wheelSel ? 0xffffffff : 0xffb0bec5);
                      String nm = i == W_MUSIC ? (musicOn ? "Music: on" : "Music: off")
                              : i == W_EZIO ? (ezFollow ? "Ezio: following" : "Call Ezio") : WHEEL_NAMES[i];
                      c.drawText(nm, ix, iy + 34, tp);
                  }
                  tp.setColor(0xffffffff);
                  tp.setTextSize(20);
                  String nm = wheelSel == W_MUSIC ? (musicOn ? "Turn music off" : "Turn music on")
                          : wheelSel == W_EZIO ? (ezFollow ? "Let Ezio roam" : "Call Ezio over")
                          : wheelSel == W_REMOTE ? (nowDisc != null ? "CD remote" : "CD remote (no disc)") : WHEEL_NAMES[wheelSel];
                  c.drawText(nm, cx, cy + 6, tp);
                  tp.setTextSize(13);
                  tp.setColor(0xff90a4ae);
                  c.drawText("OK to choose", cx, cy + 30, tp);
              }

