          # (the side walk is frames 1-3 and 8 of "Walk (3)" plus frames 4-7 of "Walk (2)" - see JOBS)
          def is_side(d, i):
              return False     # no side-head changes either


          def round_top(col, r=70, frac=0.25, head_x=None, head_bottom=None, solid=None, strip=0.2):
              """Round off the top of the head: keep only what a circle of radius r can reach, in the top quarter,
              and only on the head itself (the run of pixels under the tip), so raised flippers are never trimmed."""
              from scipy.ndimage import distance_transform_edt
              a = np.asarray(col).copy()
              al = a[:, :, 3] > 0
              ys, xs = np.nonzero(al)
              if len(ys) == 0:
                  return col
              if head_x is not None:
                  # we know where the head is (above the beak): start from the top of the head there,
                  # so a flipper raised above the head is never mistaken for it
                  colx = np.nonzero(al[:, int(head_x)])[0]
                  if len(colx) == 0:
                      return col
                  y0 = colx.min()
                  lim = head_bottom if head_bottom is not None else y0 + int((ys.max() - ys.min()) * frac)
                  tip = float(head_x)
              else:
                  y0 = ys.min()
                  lim = y0 + int((ys.max() - y0) * frac)
                  tip = float(xs[ys <= y0 + 3].mean())
              head = np.zeros_like(al)
              cx = tip
              for y in range(y0, lim):
                  row = np.nonzero(al[y])[0]
                  if len(row) == 0:
                      continue
                  # split the row into runs, keep the one nearest the head's middle
                  cuts = np.nonzero(np.diff(row) > 1)[0]
                  starts = np.r_[row[0], row[cuts + 1]]
                  ends = np.r_[row[cuts], row[-1]]
                  k = int(np.argmin([0 if s0 <= cx <= e0 else min(abs(s0 - cx), abs(e0 - cx)) for s0, e0 in zip(starts, ends)]))
                  head[y, starts[k]:ends[k] + 1] = True
                  cx = (starts[k] + ends[k]) / 2
              # and only a narrow strip above the face, so a raised flipper can't get caught
              W = xs.max() - xs.min()
              sw = strip
              strip = np.zeros_like(al)
              if sw is None:
                  strip[:] = True
              else:
                  strip[:, max(0, int(tip - W * sw)):int(tip + W * sw) + 1] = True
              # measure against the whole penguin's outline (eyes and beak included), not just the coloured part
              from scipy.ndimage import binary_fill_holes
              shape = binary_fill_holes(al | solid if solid is not None else al)
              centres = distance_transform_edt(shape) >= r
              keep = distance_transform_edt(~centres) <= r
              cut = al & ~keep & head & strip
              a[cut, 3] = 0
              return Image.fromarray(a, "RGBA")


          def dome_top(col, frac=0.16, tall=0.55, solid=None):
              """Side views: the pack draws a narrow, pointed head. Replace the top of the head with a rounded cap
              as wide as the head is at `frac` of the way down, `tall` times as high as it is wide."""
              a = np.asarray(col).copy()
              al = a[:, :, 3] > 100
              sh = (al | solid) if solid is not None else al      # the whole penguin (eyes and beak included)
              ys, xs = np.nonzero(sh)
              if len(ys) < 10:
                  return col
              y0, y1 = ys.min(), ys.max()
              yc = y0 + int((y1 - y0) * frac)
              row = np.nonzero(sh[yc])[0]
              tip = float(xs[ys <= y0 + 3].mean())
              cuts = np.nonzero(np.diff(row) > 1)[0]
              starts = np.r_[row[0], row[cuts + 1]]
              ends = np.r_[row[cuts], row[-1]]
              k = int(np.argmin([0 if s0 <= tip <= e0 else min(abs(s0 - tip), abs(e0 - tip)) for s0, e0 in zip(starts, ends)]))
              xl, xr = starts[k], ends[k]
              cx, rx = (xl + xr) / 2.0, (xr - xl) / 2.0
              ry = (xr - xl) * tall
              grey = int(np.median(a[yc:yc + 6, xl:xr + 1, 0][al[yc:yc + 6, xl:xr + 1]])) if al[yc:yc + 6, xl:xr + 1].any() else 200
              Y, X = np.mgrid[0:a.shape[0], 0:a.shape[1]]
              inside = ((X - cx) / max(rx, 1)) ** 2 + ((Y - yc) / max(ry, 1)) ** 2 <= 1
              band = (Y < yc) & (X >= xl - 2) & (X <= xr + 2)
              a[band & ~inside, 3] = 0        # only trims the point; never adds colour
              return Image.fromarray(a, "RGBA")


          def cap_round(col, ov, h_scale=1.0, w_scale=1.05):
              """Round head top: measure the head at eye level and give it a dome that wide.
              Colour is added inside the dome (only within the head's eye-level width, never behind it)
              and the point sticking up out of the dome is trimmed."""
              a = np.asarray(col).copy()
              o = np.asarray(ov).copy()
              al = a[:, :, 3] > 100
              sol = al | (o[:, :, 3] > 100)
              ys, xs = np.nonzero(sol)
              if len(ys) < 10:
                  return col, ov
              y0, y1 = ys.min(), ys.max()
              white = (o[:, :, 0] > 220) & (o[:, :, 1] > 220) & (o[:, :, 2] > 220) & (o[:, :, 3] > 200)
              white[y0 + int((y1 - y0) * 0.4):, :] = False
              wy, wx = np.nonzero(white)
              if len(wy) < 10:
                  return col, ov
              ye = int(np.median(wy))
              ex = float(np.median(wx))
              row = np.nonzero(sol[ye])[0]
              cuts = np.nonzero(np.diff(row) > 1)[0]
              starts = np.r_[row[0], row[cuts + 1]]
              ends = np.r_[row[cuts], row[-1]]
              k = int(np.argmin([0 if s0 <= ex <= e0 else min(abs(s0 - ex), abs(e0 - ex)) for s0, e0 in zip(starts, ends)]))
              xl, xr = starts[k], ends[k]
              cx, rx = (xl + xr) / 2.0, (xr - xl) / 2.0 * w_scale
              # the face (eyes, beak) sits at the front edge: leave everything in front of the eyes alone
              front = int(wx.max()) + 2 if ex < cx else int(wx.min()) - 2
              colx = np.nonzero(sol[:, int(cx)])[0]
              top = colx.min() if len(colx) else y0
              ry = (ye - top) * h_scale
              Y, X = np.mgrid[0:a.shape[0], 0:a.shape[1]]
              inside = ((X - cx) / max(rx, 1)) ** 2 + ((Y - ye) / max(ry, 1)) ** 2 <= 1
              band = (Y < wy.min() - 2) & (X >= xl - 4) & (X <= xr + 4)
              grey = int(np.median(a[al & band, 0])) if (al & band).any() else 200
              cut = band & ~inside
              a[cut, 3] = 0
              o[cut & ~white, 3] = 0        # trims only; never adds colour
              return Image.fromarray(a, "RGBA"), Image.fromarray(o, "RGBA")


          def eye_centre(o, sol):
              ys, xs = np.nonzero(sol)
              y0, y1 = ys.min(), ys.max()
              white = (o[:, :, 0] > 220) & (o[:, :, 1] > 220) & (o[:, :, 2] > 220) & (o[:, :, 3] > 200)
              white[y0 + int((y1 - y0) * 0.4):, :] = False
              wy, wx = np.nonzero(white)
              if len(wy) < 10:
                  return None
              return float(np.median(wx)), float(np.median(wy))


          def head_template(col, ov):
              """The head dome above the eyes (as a mask relative to the eyes' centre), from a frame that looks right."""
              a = np.asarray(col)
              o = np.asarray(ov)
              sol = (a[:, :, 3] > 100) | (o[:, :, 3] > 100)
              ec = eye_centre(o, sol)
              ex, ey = int(ec[0]), int(ec[1])
              row = np.nonzero(sol[ey])[0]
              cuts = np.nonzero(np.diff(row) > 1)[0]
              starts = np.r_[row[0], row[cuts + 1]]
              ends = np.r_[row[cuts], row[-1]]
              k = int(np.argmin([0 if s0 <= ex <= e0 else min(abs(s0 - ex), abs(e0 - ex)) for s0, e0 in zip(starts, ends)]))
              xl, xr = starts[k], ends[k]
              ys = np.nonzero(sol[:, ex])[0]
              top = ys.min()
              m = sol[top - 2:ey, xl:xr + 1].copy()
              return {"mask": m, "dx": xl - ex, "dy": top - 2 - ey}


          def apply_head(col, ov, T, sides=False):
              """Give a frame the template's head: fill colour inside the dome, trim the point outside it."""
              a = np.asarray(col).copy()
              o = np.asarray(ov).copy()
              al = a[:, :, 3] > 100
              sol = al | (o[:, :, 3] > 100)
              ec = eye_centre(o, sol)
              if ec is None:
                  return col, ov
              ex, ey = int(ec[0]), int(ec[1])
              m = T["mask"]
              x0, y0 = ex + T["dx"], ey + T["dy"]
              h, w = m.shape
              if x0 < 0 or y0 < 0 or x0 + w > a.shape[1] or y0 + h > a.shape[0]:
                  return col, ov
              region = np.zeros_like(al)
              region[y0:y0 + h, x0:x0 + w] = True
              T2 = np.zeros_like(al)
              T2[y0:y0 + h, x0:x0 + w] = m
              # only the part of the frame above the eyes that belongs to the head (connected to it under the dome's top)
              white = (o[:, :, 0] > 220) & (o[:, :, 1] > 220) & (o[:, :, 2] > 220) & (o[:, :, 3] > 200)
              band = region.copy()
              band[ey:, :] = False
              head_grey = int(np.median(a[al & band, 0])) if (al & band).any() else 200
              add = band & T2 & ~sol
              a[add] = (head_grey, head_grey, head_grey, 255)
              # trim only what pokes up above the dome in each column (so a flipper beside the head is left alone)
              tt = np.where(T2.any(0), T2.argmax(0), a.shape[0])
              Y = np.arange(a.shape[0])[:, None]
              anyp = (a[:, :, 3] > 0) | (o[:, :, 3] > 0)
              cut = band & anyp & ~white & (Y < tt[None, :])
              a[cut, 3] = 0
              o[cut, 3] = 0
              if sides:
                  # the old head's sides sticking out past the dome (above the eyes, just beside the head): trim them
                  side = np.zeros_like(al)
                  pw2 = w // 3
                  side[:ey - 2, max(0, x0 - pw2):x0] = True
                  side[:ey - 2, x0 + w:min(a.shape[1], x0 + w + pw2)] = True
                  # only where it hugs the head: a raised flipper reaching well out is left alone
                  rows_ok = np.zeros_like(al)
                  rows_ok[max(0, y0 - 4):ey - 2, :] = True
                  sc = side & rows_ok & ~white
                  a[sc, 3] = 0
                  o[sc, 3] = 0
              # thin slivers of the old pointed head left at the dome's sides: open them away (flippers are thick, they stay)
              from scipy.ndimage import binary_opening
              near = np.zeros_like(al)
              pw = w // 3
              near[max(0, y0 - 4):ey, max(0, x0 - pw):min(a.shape[1], x0 + w + pw)] = True
              m_all = (a[:, :, 3] > 0) | (o[:, :, 3] > 0)
              yy, xx = np.ogrid[-4:5, -4:5]
              thin = m_all & ~binary_opening(m_all, structure=(xx * xx + yy * yy <= 16)) & near & ~white
              a[thin, 3] = 0
              o[thin, 3] = 0
              # anything above the dome's top, straight over the head, is the old point: trim it too
              above = np.zeros_like(al)
              above[:y0, x0 + w // 4:x0 + 3 * w // 4] = True
              if above.any():
                  from scipy.ndimage import label
                  lab, n = label(sol & above)
                  for k in range(1, n + 1):
                      comp = lab == k
                      if comp.any() and np.nonzero(comp)[0].max() >= y0 - 1:     # touching the head: part of the point
                          a[comp, 3] = 0
                          o[comp, 3] = 0
              return Image.fromarray(a, "RGBA"), Image.fromarray(o, "RGBA")


          def belly_to_bottom(col, ov, epos, e):
              """Paint the belly white straight down to the bottom of the penguin (stopping at the feet or the outline)."""
              o = np.asarray(ov).copy()
              ca = np.asarray(col)[:, :, 3] > 100
              ea = np.asarray(e)[:, :, 3] > 128
              H, W = ca.shape
              em = np.zeros((H, W), bool)
              em[epos[1]:epos[1] + ea.shape[0], epos[0]:epos[0] + ea.shape[1]] = ea
              r, g, b, al = o[:, :, 0].astype(int), o[:, :, 1].astype(int), o[:, :, 2].astype(int), o[:, :, 3]
              orange = (r > 150) & (g > 60) & (g < 200) & (b < 90) & (al > 128)
              dark = (al > 160) & ((r + g + b) / 3 < 150) & ~orange
              from scipy.ndimage import binary_erosion
              inner = binary_erosion(ca, iterations=5)
              line = (al > 100) & ~em
              xs = np.nonzero(em.any(0))[0]
              for x in xs[6:-6]:                       # leave the belly's rounded side edges as they are
                  y = np.nonzero(em[:, x])[0].max() + 1
                  while y < H and inner[y, x] and not line[y, x] and not orange[y, x] and not dark[y, x]:
                      if o[y, x, 3] < 200:
                          o[y, x] = (255, 255, 255, 255)
                      y += 1
              return Image.fromarray(o, "RGBA")


          def fill_belly_gap(col, ov, epos, e, reach=14):
              """Body colour showing in the thin gap between the belly and the outline (lower/outer side) becomes white."""
              from scipy.ndimage import distance_transform_edt
              o = np.asarray(ov).copy()
              ca = np.asarray(col)[:, :, 3] > 100
              H, W = ca.shape
              ea = np.asarray(e)[:, :, 3] > 128
              em = np.zeros((H, W), bool)
              em[epos[1]:epos[1] + ea.shape[0], epos[0]:epos[0] + ea.shape[1]] = ea
              em &= ca
              r, g, b, al = o[:, :, 0].astype(int), o[:, :, 1].astype(int), o[:, :, 2].astype(int), o[:, :, 3]
              orange = (r > 150) & (g > 60) & (g < 200) & (b < 90) & (al > 128)
              stroke = (al > 100) & ~em & ~orange
              bare = ca & (al < 60)                      # plain body colour, nothing drawn over it
              near_belly = distance_transform_edt(~em) <= reach
              near_line = distance_transform_edt(~(stroke | ~ca)) <= reach
              ys, xs = np.nonzero(em)
              cyb = ys.mean()
              Y = np.arange(H)[:, None]
              lower = Y > ys.min() + (ys.max() - ys.min()) * 0.25
              gap = bare & near_belly & near_line & lower
              from scipy.ndimage import binary_dilation
              seam = binary_dilation(gap, iterations=2) & ca & ~stroke & ~orange & (al < 250)   # the belly's soft edge next to it
              o[gap | seam] = (255, 255, 255, 255)
              return Image.fromarray(o, "RGBA")


