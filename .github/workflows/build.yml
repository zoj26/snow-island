                  t.setTypeface(Typeface.create(Typeface.SERIF, Typeface.BOLD));
                  t.setTextSize(17 * sc);
                  t.setTextAlign(Paint.Align.CENTER);
                  float tw = t.measureText(name) + 30 * sc, th = 26 * sc;
                  w.setColor(0x55000000);
                  rf.set(cx - tw / 2 + 2, cy - th / 2 + 3, cx + tw / 2 + 2, cy + th / 2 + 3);
                  c.drawRoundRect(rf, 5 * sc, 5 * sc, w);
                  rf.set(cx - tw / 2, cy - th / 2, cx + tw / 2, cy + th / 2);
                  w.setShader(new LinearGradient(0, cy - th / 2, 0, cy + th / 2, 0xfff3d98b, 0xffb8892e, Shader.TileMode.CLAMP));
                  c.drawRoundRect(rf, 5 * sc, 5 * sc, w);
                  w.setShader(null);
                  w.setStyle(Paint.Style.STROKE);
                  w.setStrokeWidth(1.5f * sc);
                  w.setColor(0xff8a6420);
                  rf.set(cx - tw / 2 + 4 * sc, cy - th / 2 + 4 * sc, cx + tw / 2 - 4 * sc, cy + th / 2 - 4 * sc);
                  c.drawRoundRect(rf, 3 * sc, 3 * sc, w);
                  w.setStyle(Paint.Style.FILL);
                  // little screws
                  w.setColor(0xff8a6420);
                  c.drawCircle(cx - tw / 2 + 9 * sc, cy, 1.8f * sc, w);
                  c.drawCircle(cx + tw / 2 - 9 * sc, cy, 1.8f * sc, w);
                  // engraved letters: light edge under dark text
                  t.setColor(0x88fff4c8);
                  c.drawText(name, cx, cy + 6.5f * sc, t);
                  t.setColor(0xff4e3510);
                  c.drawText(name, cx, cy + 5.5f * sc, t);
              }

              void initParticles() {
                  Random r = new Random(3);
                  int nw = 0;
                  waveX = new float[180]; waveY = new float[180]; wavePh = new float[180];
                  while (nw < 180) {
                      float x = r.nextFloat() * WW, y = r.nextFloat() * WH;
                      float ex = (x - CX) / (RX + 80), ey = (y - CY) / (RY + 65);
                      if (ex * ex + ey * ey < 1f) continue;
                      waveX[nw] = x; waveY[nw] = y; wavePh[nw] = r.nextFloat() * 6.28f;
                      nw++;
                  }
                  int ns = 240;
                  flX = new float[ns]; flY = new float[ns]; flSpd = new float[ns]; flR = new float[ns];
                  for (int i = 0; i < ns; i++) {
                      flX[i] = r.nextFloat() * VW;
                      flY[i] = r.nextFloat() * VH;
                      flSpd[i] = 0.6f + r.nextFloat() * 0.8f;
                      flR[i] = 1.2f + r.nextFloat() * 2f;
                  }
                  drX = new float[80]; drY = new float[80]; drS = new float[80]; drR = new float[80];
                  drW = new float[80]; drA = new float[80]; drP = new float[80];
                  for (int i = 0; i < drX.length; i++) {
                      drX[i] = r.nextFloat() * VW;
                      drY[i] = r.nextFloat() * VH;
                      drS[i] = 35 + r.nextFloat() * 65;            // falling speed
                      drR[i] = 1.6f + r.nextFloat() * 2.4f;
                      drW[i] = 0.8f + r.nextFloat() * 1.6f;        // how fast it swirls round
                      drA[i] = 10 + r.nextFloat() * 34;            // how wide the swirl is
                      drP[i] = r.nextFloat() * 6.28f;
                  }
                  int nst = 45;
                  stX = new float[nst]; stY = new float[nst]; stLen = new float[nst];
                  for (int i = 0; i < nst; i++) {
                      stX[i] = r.nextFloat() * VW;
                      stY[i] = r.nextFloat() * VH;
                      stLen[i] = 25 + r.nextFloat() * 45;
                  }
              }

              // ================================================================== main loop

              void renderLoop() {
                  while (running) {
                      Canvas c = null;
                      try { c = holder.lockHardwareCanvas(); } catch (Exception ignored) { }
                      if (c == null) {
                          try { c = holder.lockCanvas(); } catch (Exception ignored) { }
                      }
                      if (c == null) {
                          try { Thread.sleep(16); } catch (InterruptedException ignored) { }
                          continue;
                      }
                      try {
                          long now = System.nanoTime();
                          float dt = Math.min(0.05f, (now - lastNs) / 1e9f);
                          lastNs = now;
                          time += dt;
                          List<AppPeng> list;
                          synchronized (lock) { list = apps; }
                          update(dt, list);
                          if (scene == SCENE_ISLAND) drawIsland(c, list);
                          else if (scene == SCENE_IGLOO) drawRoom(c);
                          else drawFire(c);
                          if (afkDim > 0) drawSleepy(c);
                          drawOverlays(c);
                      } catch (Exception ex) {
                          // keep the loop alive no matter what
                      } finally {
                          try { holder.unlockCanvasAndPost(c); } catch (Exception ignored) { }
                      }
                  }
              }

              // ================================================================== update

              void update(float dt, List<AppPeng> list) {
                  // Scene fade
                  if (pendingScene >= 0) {
                      if (fadingOut) {
                          fade = Math.min(1, fade + dt * 4);
                          if (fade >= 1) { enterScene(pendingScene); fadingOut = false; }
                      } else {
                          fade = Math.max(0, fade - dt * 4);
                          if (fade <= 0) pendingScene = -1;
                      }
                  }

                  Runnable task;
                  while ((task = gameTasks.poll()) != null) {
                      try { task.run(); } catch (Exception ignored) { }
                  }

                  Integer k;
                  while ((k = keyQueue.poll()) != null) handleKey(k & ~REPEAT_FLAG, (k & REPEAT_FLAG) != 0, list);

                  // Controller stick / d-pad moves through menus: one step per push, keeps going if held
                  int sdir = -1;
                  if (Math.abs(axX) > 0.55f || Math.abs(axY) > 0.55f) {
                      sdir = Math.abs(axX) > Math.abs(axY)
                              ? (axX > 0 ? KeyEvent.KEYCODE_DPAD_RIGHT : KeyEvent.KEYCODE_DPAD_LEFT)
                              : (axY > 0 ? KeyEvent.KEYCODE_DPAD_DOWN : KeyEvent.KEYCODE_DPAD_UP);
                  }
                  boolean menuNav = overlay == OV_LIST || overlay == OV_FOLDER || overlay == OV_PLAYER;
                  if (menuNav) {
                      if (!wasMenu) { navDir = sdir; navT = 0.4f; }      // ignore a stick that was already held when the menu opened
                      else if (sdir != navDir) { navDir = sdir; navT = 0.4f; if (sdir > 0) handleKey(sdir, false, list); }
                      else if (sdir > 0) { navT -= dt; if (navT <= 0) { navT = 0.12f; handleKey(sdir, true, list); } }
                  }
                  wasMenu = menuNav;

                  // Fell asleep? Dim the screen and let snow blow across it (protects the TV from burn-in)
                  boolean anyInput = kUp || kDown || kLeft || kRight || axX != 0 || axY != 0;
                  if (anyInput) afkT = 0; else afkT += dt;
                  boolean sleepy = afkT > 45 && overlay == OV_NONE && scene != SCENE_FIRE && launching == null;
                  afkDim = sleepy ? Math.min(1, afkDim + dt / 4f) : Math.max(0, afkDim - dt * 3);
                  if (afkDim > 0) {
                      for (int i = 0; i < drX.length; i++) {
                          drY[i] += drS[i] * dt;
                          drX[i] += (float) Math.sin(time * 0.35f + i * 0.7f) * 14 * dt;      // a slow sideways drift
                          if (drY[i] > VH + 50) { drY[i] = -50; drX[i] = rnd.nextFloat() * VW; }
                          if (drX[i] < -60) drX[i] += VW + 120;
                          if (drX[i] > VW + 60) drX[i] -= VW + 120;
                      }
                  }

                  // CD folder slides up from the bottom of the screen, and back down when closed
                  if (overlay == OV_FOLDER) {
                      if (folderClosing) {
                          folderAnim = Math.max(0, folderAnim - dt * 4.5f);
                          if (folderAnim <= 0) {
                              overlay = OV_NONE;
                              folderClosing = false;
                              Runnable after = afterFolderClose;
                              afterFolderClose = null;
                              if (after != null) after.run();
                          }
                      } else {
                          folderAnim = Math.min(1, folderAnim + dt * 4f);
                      }
                      if (flipT > 0) { flipT += dt / 0.42f; if (flipT >= 1) flipT = 0; }
                  }

                  // Newly copied songs ask which disc they belong on
                  if (!newSongs.isEmpty() && overlay == OV_NONE && !dialogOpen && pendingScene < 0
                          && launching == null && sittingChair == null && scene != SCENE_FIRE) {
                      showSongPrompt();
                  }

                  // Little notes float up from the CD player while it plays
                  if (scene == SCENE_ISLAND && nowDisc != null && radioBusy()) {
                      nextCdNote -= dt;
                      if (nextCdNote <= 0) { nextCdNote = 0.7f + rnd.nextFloat() * 0.6f; spawnNote(CD_X + (rnd.nextBoolean() ? -26 : 26), CD_Y - 36); }
                  }

                  boolean inputHeld = kUp || kDown || kLeft || kRight || axX != 0 || axY != 0;
                  boolean frozen = overlay != OV_NONE || pendingScene >= 0 || launching != null || sittingChair != null || scene == SCENE_FIRE;

                  if (launching != null) {
                      launchT += dt;
                      if (launchT > 0.35f) { launch(launching); launching = null; }
                  }
                  if (sittingChair != null) {
                      chairT += dt;
                      if (chairT > 0.7f) {
                          Chair ch = sittingChair;
                          sittingChair = null;
                          startIntent(ch.intent, ch.label);
                      }
                  }
                  if (scene == SCENE_FIRE) updateFire(dt);
                  // Little sparks rising up the chimney inside the igloo
                  if (scene == SCENE_IGLOO && rnd.nextFloat() < dt * 4) {
                      Part q = part(640 + (rnd.nextFloat() - 0.5f) * 60, 280, true);
                      q.vx = (rnd.nextFloat() - 0.5f) * 20; q.vy = -50 - rnd.nextFloat() * 50;
                      q.max = q.life = 1.6f; q.size = 1 + rnd.nextFloat() * 1.2f;
                      q.color = rnd.nextBoolean() ? 0xffffe082 : 0xffffab40;
                      q.flue = true; q.flueX = 640; q.flueTop = 196;
                  }
                  // Smoke curling out of the igloo's chimney
                  if (scene == SCENE_ISLAND) {
                      nextSmoke -= dt;
                      if (nextSmoke <= 0) {
                          nextSmoke = 0.28f + rnd.nextFloat() * 0.25f;
                          Part q = part(IGLOO_X + 80 + (rnd.nextFloat() - 0.5f) * 8, IGLOO_Y - 140, true);
                          q.vx = 8 + rnd.nextFloat() * 10; q.vy = -22 - rnd.nextFloat() * 10;
                          q.max = q.life = 3.2f; q.size = 4 + rnd.nextFloat() * 2; q.grow = 4f;
                          q.color = 0xffcfd8dc;
                          if (rnd.nextFloat() < 0.12f) {
                              Part e = part(IGLOO_X + 80, IGLOO_Y - 142, true);
                              e.vx = (rnd.nextFloat() - 0.5f) * 20; e.vy = -40 - rnd.nextFloat() * 30;
                              e.max = e.life = 1.1f; e.size = 1.6f; e.color = 0xffffab40;
                          }
                      }
                  }

                  // Player emotes
                  if (pEmote != E_NONE) {
                      pEmoteT += dt;
                      if (pEmote == E_THROW && pEmoteT >= 0.22f && pEmoteT - dt < 0.22f) throwBall(true, null, px, py, facing);
                      if (pEmote == E_HUG) {
                          nextHeartFx -= dt;
                          if (nextHeartFx <= 0) { nextHeartFx = 0.35f; spawnHeart(px + (facing == LEFT ? -20 : 20), py - 80); }
                      }
                      if (pEmote == E_DANCE && rnd.nextFloat() < dt * 3) spawnNote(px, py - 95);
                      if (pEmote == E_NAP) {
                          nextZ -= dt;
                          if (nextZ <= 0) { nextZ = 1.2f; spawnZ(px + 12, py - 70); }
                      }
                      boolean ends = pEmoteDur > 0 && pEmoteT >= pEmoteDur;
                      boolean cancel = (pEmote == E_NAP || pEmote == E_SIT || pEmote == E_LOOK) && inputHeld && !frozen;
                      if (ends || cancel) pEmote = E_NONE;
                  }

                  moving = false;
                  if (freeCam && (scene != SCENE_ISLAND || overlay != OV_NONE)) freeCam = false;
                  if (freeCam) {
                      float cdx = (kRight ? 1 : 0) - (kLeft ? 1 : 0) + axX, cdy = (kDown ? 1 : 0) - (kUp ? 1 : 0) + axY;
                      fcX += cdx * 700 * dt; fcY += cdy * 700 * dt;
                      clampFreeCam();
                  } else if (!frozen) {
                      if (pEmote == E_SLIDE) {
                          movePlayer(slideDX, slideDY, 520, dt, true);
                          moving = true;
                      } else if (pEmote == E_NONE || pEmote == E_LOOK) {
                          float dx = (kRight ? 1 : 0) - (kLeft ? 1 : 0) + axX;
                          float dy = (kDown ? 1 : 0) - (kUp ? 1 : 0) + axY;
                          float len = (float) Math.sqrt(dx * dx + dy * dy);
                          if (len > 0.2f) {
                              if (len > 1) { dx /= len; dy /= len; }
                              movePlayer(dx, dy, PLAYER_SPEED, dt, false);
                              moving = true;
                              if (Math.abs(dx) > Math.abs(dy)) facing = dx < 0 ? LEFT : RIGHT;
                              else facing = dy < 0 ? UP : DOWN;
                          }
                      }
                  }
                  walkPhase += dt * (moving ? 14f : 3f);
                  if (moving && pEmote != E_SLIDE) {
                      int stepNow = (int) (walkPhase / Math.PI);
                      if (stepNow != lastStep) {
                          lastStep = stepNow;
                          play(S_STEP, scene == SCENE_ISLAND ? 0.22f : 0.15f, 0.85f + rnd.nextFloat() * 0.3f);
                      }
                  }

                  // Idle animations
                  if (inputHeld || pEmote != E_NONE || frozen) {
                      if (inputHeld) idleT = 0;
                  } else {
                      idleT += dt;
                      if (idleT > 40 && scene == SCENE_ISLAND) {
                          startEmote(E_NAP, 0);
                      } else if (idleT > nextIdle) {
                          nextIdle = idleT + 4 + rnd.nextFloat() * 4;
                          int pick = rnd.nextInt(3);
                          if (pick == 0) { startEmote(E_LOOK, 1.6f); }
                          else if (pick == 1) startEmote(E_FLAP, 0.8f);
                          else startEmote(E_HOP, 0.6f);
                      }
                  }
                  if (idleT == 0) nextIdle = 7f;

                  pHitT = Math.max(0, pHitT - dt);
                  pNextBlink -= dt;
                  if (pNextBlink <= 0) { pBlinkT = 0.13f; pNextBlink = 2 + rnd.nextFloat() * 4; }
                  pBlinkT = Math.max(0, pBlinkT - dt);

                  for (int i = 0; i < trailAge.length; i++) if (trailAge[i] > 0) trailAge[i] += dt;

                  if (scene == SCENE_ISLAND) updateIsland(dt, list);

                  // "Say hi" chirp when a new thing comes into reach
                  String nk = "";
                  Object tgt = scene == SCENE_ISLAND ? nearestTarget(list) : null;
                  AppPeng near = tgt instanceof AppPeng ? (AppPeng) tgt : null;
                  if (near != null) nk = near.pkg;
                  else if (tgt instanceof Chair) nk = ((Chair) tgt).key;
                  else {
                      String obj = nearObject();
                      if (obj != null) nk = obj;
                  }
                  if (!nk.equals(lastNearKey)) {
                      if (near != null) play(S_CHIRP, 0.16f, 0.9f + (near.pkg.hashCode() & 7) * 0.03f);
                      lastNearKey = nk;
                  }

                  updateEzio(dt);
                  updateParticles(dt);
              }

              void movePlayer(float dx, float dy, float speed, float dt, boolean slide) {
                  float nx = px + dx * speed * dt;
                  float ny = py + dy * speed * dt;
                  if (scene == SCENE_ISLAND) {
                      float ex = (nx - CX) / (RX - 35), ey = (ny - CY) / (RY - 30);
                      float e = ex * ex + ey * ey;
                      if (e > 1) {
                          float kk = (float) (1 / Math.sqrt(e));
                          nx = CX + (nx - CX) * kk;
                          ny = CY + (ny - CY) * kk;
                      }
                      // Igloo: blocks only its round base, so you can walk around and behind it
                      float ix = (nx - IGLOO_X) / 136f, iy = (ny - (IGLOO_Y - 22)) / 36f;
                      float ie = ix * ix + iy * iy;
                      if (ie < 1) {
                          float kk = (float) (1 / Math.sqrt(Math.max(ie, 0.0001f)));
                          nx = IGLOO_X + (nx - IGLOO_X) * kk;
                          ny = (IGLOO_Y - 22) + (ny - (IGLOO_Y - 22)) * kk;
                      }
                      // CD player table
                      float cx2 = (nx - CD_X) / 44f, cy2 = (ny - (CD_Y - 5)) / 14f;
                      float ce = cx2 * cx2 + cy2 * cy2;
                      if (ce < 1) {
                          float kk = (float) (1 / Math.sqrt(Math.max(ce, 0.0001f)));
                          nx = CD_X + (nx - CD_X) * kk;
                          ny = (CD_Y - 6) + (ny - (CD_Y - 6)) * kk;
                      }
                  } else {
                      nx = Math.max(170, Math.min(1110, nx));
                      ny = Math.max(380, Math.min(660, ny));
                      // furniture
                      if (ny < 440 && nx > 160 && nx < 360) ny = 440;
                      if (ny < 440 && nx > 920 && nx < 1120) ny = 440;
                      // stay on the round floor
                      float rx = (nx - 640) / (ROOM_FA - 50), ry = (ny - 720) / (ROOM_FB - 40);
                      float re = rx * rx + ry * ry;
                      if (re > 1) {
                          float kk = (float) (1 / Math.sqrt(re));
                          nx = 640 + (nx - 640) * kk;
                          ny = 720 + (ny - 720) * kk;
                      }
                  }
                  float moved = Math.abs(nx - px) + Math.abs(ny - py);
                  px = nx;
                  py = ny;
                  trailDist += moved;
                  if (scene == SCENE_ISLAND && trailDist > (slide ? 7 : 16)) {
                      trailDist = 0;
                      trailHead = (trailHead + 1) % trailX.length;
                      trailX[trailHead] = px + (slide ? 0 : (trailHead % 2 == 0 ? -6 : 6));
                      trailY[trailHead] = py;
                      trailAge[trailHead] = 0.001f;
                      trailSlide[trailHead] = slide;
                  }
              }

              void startEmote(int e, float dur) {
                  pEmote = e;
                  pEmoteT = 0;
                  pEmoteDur = dur;
                  switch (e) {
                      case E_WAVE:
                          facing = DOWN;
                          if (scene == SCENE_ISLAND) for (AppPeng a : apps) {
                              if (dist2(a.x, a.y, px, py) < 320 * 320) npcEmote(a, E_WAVE, 1.4f, 0.3f + rnd.nextFloat() * 0.4f);
                          }
                          play(S_CHIRP, 0.22f, 1f);
                          break;
                      case E_DANCE:
                          if (scene == SCENE_ISLAND) for (AppPeng a : apps) {
                              if (dist2(a.x, a.y, px, py) < 280 * 280) npcEmote(a, E_DANCE, 3.2f, 0.2f + rnd.nextFloat() * 0.5f);
                          }
                          break;
                      case E_SLIDE:
                          slideDX = facing == LEFT ? -1 : facing == RIGHT ? 1 : 0;
                          slideDY = facing == UP ? -1 : facing == DOWN ? 1 : 0;
                          play(S_WHOOSH, 0.5f, 0.8f);
                          break;
                      case E_THROW:
                          play(S_WHOOSH, 0.3f, 1f);
                          break;
                      case E_LOOK:
                          break;
                      default:
                          break;
                  }
              }

              void npcEmote(AppPeng a, int e, float dur, float delay) {
                  a.emote = e;
                  a.emoteT = 0;
                  a.emoteDur = dur;
                  a.emoteDelay = delay;
              }

              void updateIsland(float dt, List<AppPeng> list) {
                  boolean playerMoving = kUp || kDown || kLeft || kRight || axX != 0 || axY != 0;
                  if (rallyT > 0) {
                      // the 9 seconds only start once everyone has made it into the circle (or after 12 s of trying)
                      boolean formed = true;
                      for (AppPeng a : list) if (dist2(a.x, a.y, a.rallyX, a.rallyY) > 16) { formed = false; break; }
                      rallyFormT -= dt;
                      if (formed || rallyFormT <= 0) rallyT -= dt;
                      if (rallyT <= 0) {
                          for (AppPeng a : list) { a.tx = a.hx + (rnd.nextFloat() - 0.5f) * 80; a.ty = a.hy + (rnd.nextFloat() - 0.5f) * 50; a.wait = 0; }
                      }
                  }
                  int starers = 0;
                  for (AppPeng a : list) if (a.noticeT > 0 || (!a.moving && a.facing == DOWN && a.emote == E_NONE && a.chatWith == null && a.joinOf == null)) starers++;
                  tvStarers = starers;
                  for (AppPeng a : list) {
                      if (rallyT > 0) {
                          // rush to their spot in the circle, then stand still facing you
                          a.blinkT = Math.max(0, a.blinkT - dt);
                          a.nextBlink -= dt;
                          if (a.nextBlink <= 0) { a.blinkT = 0.13f; a.nextBlink = 1.4f + rnd.nextFloat() * 3.6f; }
                          float dx = a.rallyX - a.x, dy = a.rallyY - a.y, d = (float) Math.sqrt(dx * dx + dy * dy);
                          if (d > 3) {
                              float stp = Math.min(d, 210 * dt);
                              a.x += dx / d * stp; a.y += dy / d * stp;
                              a.moving = true;
                              a.facing = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? LEFT : RIGHT) : (dy < 0 ? UP : DOWN);
                              a.phase += dt * 12f;
                          } else {
                              a.moving = false;
                              a.facing = faceToward(a.x, a.y, px, py);
                              a.phase += dt * 3f;
                          }
                          continue;
                      }
                      if (a.hugWalk) {
                          if (playerMoving) { a.hugWalk = false; }
                          else {
                              float dx = a.hugX - a.x, dy = a.hugY - a.y;
                              float d = (float) Math.sqrt(dx * dx + dy * dy);
                              if (d < 3) {
                                  a.hugWalk = false;
                                  a.x = a.hugX; a.y = a.hugY;
                                  boolean onRight = a.x >= px;
                                  a.facing = onRight ? LEFT : RIGHT;
                                  facing = onRight ? RIGHT : LEFT;
                                  npcEmote(a, E_HUG, 2.4f, 0);
                                  startEmote(E_HUG, 2.4f);
                                  nextHeartFx = 0;
                              } else {
                                  float step = Math.min(d, 120 * dt);
                                  a.x += dx / d * step;
                                  a.y += dy / d * step;
                                  a.moving = true;
                                  a.facing = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? LEFT : RIGHT) : (dy < 0 ? UP : DOWN);
                                  a.phase += dt * 10f;
                              }
                              continue;
                          }
                      }
                      a.hitT = Math.max(0, a.hitT - dt);
                      a.nextBlink -= dt;
                      if (a.nextBlink <= 0) { a.blinkT = 0.13f; a.nextBlink = 1.4f + rnd.nextFloat() * 3.6f; }
                      a.blinkT = Math.max(0, a.blinkT - dt);

                      if (a.throwBackT > 0) {
                          a.throwBackT -= dt;
                          if (a.throwBackT <= 0) {
                              if (a.throwBackAt != null) a.facing = faceToward(a.x, a.y, a.throwBackAt.x, a.throwBackAt.y);
                              else a.facing = faceToward(a.x, a.y, px, py);
                              npcEmote(a, E_THROW, 0.45f, 0);
                              a.ballT = 0.22f;
                          }
                      }
                      if (a.ballT > 0) {
                          a.ballT -= dt;
                          if (a.ballT <= 0) {
                              if (a.throwBackAt != null) { throwAtPeng(a, a.throwBackAt, a.throwBackDepth); a.throwBackAt = null; }
                              else throwBall(false, a, a.x, a.y, a.facing);
                          }
                      }

                      if (a.spreeT > 0 && a.emote == E_NONE) {
                          // playing with snowballs: one throw usually, now and then a few (never more than 4)
                          a.spreeT -= dt;
                          a.spreeNext -= dt;
                          if (a.spreeLeft <= 0) a.spreeT = Math.min(a.spreeT, 0.6f);
                          AppPeng mark = null;
                          if (a.spreeNext <= 0 && a.spreeLeft > 0 && (fightCool <= 0 || fightCool2 <= 0) && rnd.nextFloat() < 0.35f) {
                              // ...sometimes at another penguin
                              for (AppPeng o : list) {
                                  if (o == a || o.chatWith != null || o.emote != E_NONE || o.hugWalk) continue;
                                  if (dist2(o.x, o.y, a.x, a.y) < 380 * 380 && dist2(o.x, o.y, a.x, a.y) > 60 * 60) { mark = o; break; }
                              }
                          }
                          if (mark != null) {
                              // up to two snowball fights can be going at once
                              if (fightCool <= 0) fightCool = 25 + rnd.nextFloat() * 25; else fightCool2 = 25 + rnd.nextFloat() * 25;
                              a.spreeNext = 1.2f + rnd.nextFloat() * 1f;
                              a.spreeLeft--;
                              a.facing = faceToward(a.x, a.y, mark.x, mark.y);
                              npcEmote(a, E_THROW, 0.45f, 0);
                              throwAtPeng(a, mark, 0);
                          } else if (a.spreeNext <= 0 && a.spreeLeft > 0) {
                              a.spreeLeft--;
                              a.spreeNext = 1.2f + rnd.nextFloat() * 1f;
                              double ang = rnd.nextDouble() * Math.PI * 2;
                              float lx = a.x + (float) Math.cos(ang) * (150 + rnd.nextFloat() * 120), ly = a.y + (float) Math.sin(ang) * (90 + rnd.nextFloat() * 70);
                              a.facing = faceToward(a.x, a.y, lx, ly);
                              npcEmote(a, E_THROW, 0.45f, 0);
                              Ball b = new Ball();
                              b.x = a.x; b.y = a.y;
                              b.dur = 0.75f;
                              b.vx = (lx - a.x) / b.dur; b.vy = (ly - a.y) / b.dur;
                              b.toy = true;
                              b.owner = a;
                              balls.add(b);
                              playAt(S_WHOOSH, 0.2f, 1f, a.x, a.y);
                          }
                      }
                      if (a.emote != E_NONE) {
                          if (a.emoteDelay > 0) {
                              a.emoteDelay -= dt;
                              if (a.emote == E_WAVE || a.emote == E_DANCE) a.facing = a.faceAt != null ? faceToward(a.x, a.y, a.faceAt.x, a.faceAt.y) : faceToward(a.x, a.y, px, py);
                          } else {
                              a.emoteT += dt;
                              if (a.emote == E_DANCE) {
                                  a.facing = ((int) (a.emoteT / 0.2f)) % 4;
                              }
                              if (a.emote == E_HUG) {
                                  float k2 = Math.min(1, dt * 8);
                                  a.x += (a.hugX - a.x) * k2;
                                  a.y += (a.hugY - a.y) * k2;
                                  if (a.facing == RIGHT && rnd.nextFloat() < dt * 2.5f) spawnHeart(a.x + 20, a.y - 80);
                              }
                              if (a.emoteT >= a.emoteDur) {
                                  if (a.emote == E_NAP && rnd.nextFloat() < 0.25f) {
                                      // stirs... and drifts back off
                                      a.emoteT = 0; a.emoteDur = 4 + rnd.nextFloat() * 6;
                                  } else {
                                      if (a.emote == E_NAP) {
                                          // sometimes a neighbour wakes up with them (together, or just after)
                                          AppPeng grp = a.napHost != null ? a.napHost : a;
                                          if (rnd.nextFloat() < 0.3f) for (AppPeng o : list) {
                                              if (o == a || o.emote != E_NAP || (o != grp && o.napHost != grp)) continue;
                                              o.emoteDur = Math.min(o.emoteDur, o.emoteT + 0.2f + rnd.nextFloat() * 2.5f);
                                              break;
                                          }
                                          a.napHost = null;
                                      }
                                      a.emote = E_NONE;
                                      a.faceAt = null;
                                  }
                              }
                          }
                          a.moving = false;
                          a.phase += dt * 3;
                          continue;
                      }

                      npcThink(a, dt, list);
                      a.phase += dt * (a.moving ? 10f : 3f);
                  }

                  // Nobody walks through the igloo or the boombox: anyone inside the base gets nudged back out
                  for (AppPeng a : list) {
                      float ix = (a.x - IGLOO_X) / 160f, iy = (a.y - (IGLOO_Y - 22)) / 46f;
                      float ie = ix * ix + iy * iy;
                      if (ie < 1) {
                          float k = (float) (1 / Math.sqrt(Math.max(ie, 0.0001f)));
                          a.x = IGLOO_X + (a.x - IGLOO_X) * k;
                          a.y = (IGLOO_Y - 22) + (a.y - (IGLOO_Y - 22)) * k;
                          // and if they were headed through it, send them around instead
                          float tix = (a.tx - IGLOO_X) / 170f, tiy = (a.ty - (IGLOO_Y - 22)) / 54f;
                          if (tix * tix + tiy * tiy < 1) a.ty = a.y < IGLOO_Y - 22 ? IGLOO_Y - 80 : IGLOO_Y + 40;
                      }
                      float cx2 = (a.x - CD_X) / 48f, cy2 = (a.y - (CD_Y - 5)) / 18f;
                      float ce = cx2 * cx2 + cy2 * cy2;
                      if (ce < 1) {
                          float k = (float) (1 / Math.sqrt(Math.max(ce, 0.0001f)));
                          a.x = CD_X + (a.x - CD_X) * k;
                          a.y = (CD_Y - 5) + (a.y - (CD_Y - 5)) * k;
                      }
                      // Ezio's bed: solid too, whether he's in it or not; slide round it, and never aim for a spot in it
                      {
                          float bx = (a.x - BED_X) / 44f, by = (a.y - BED_Y) / 20f;
                          float be = bx * bx + by * by;
                          if (be < 1) {
                              float k = (float) (1 / Math.sqrt(Math.max(be, 0.0001f)));
                              a.x = BED_X + (a.x - BED_X) * k;
                              a.y = BED_Y + (a.y - BED_Y) * k;
                          }
                          float tbx = (a.tx - BED_X) / 50f, tby = (a.ty - BED_Y) / 26f;
                          if (tbx * tbx + tby * tby < 1) a.ty = a.ty < BED_Y ? BED_Y - 34 : BED_Y + 34;
                      }
                      // lawn chairs: nobody walks through them; they slide round the edge instead
                      for (Chair ch : chairs) {
                          float hx = (a.x - ch.x) / 30f, hy = (a.y - (ch.y - 2)) / 15f;
                          float he = hx * hx + hy * hy;
                          if (he < 1) {
                              float k = (float) (1 / Math.sqrt(Math.max(he, 0.0001f)));
                              a.x = ch.x + (a.x - ch.x) * k;
                              a.y = (ch.y - 2) + (a.y - (ch.y - 2)) * k;
                          }
                          // and nobody aims for a spot inside one
                          float tx2 = (a.tx - ch.x) / 34f, ty2 = (a.ty - (ch.y - 2)) / 19f;
                          if (tx2 * tx2 + ty2 * ty2 < 1) a.ty = ch.y + 26;
                      }
                      // give sleepers some room (penguins and you)
                      if (a.emote != E_NAP && a.napWith == null && a.napHost == null) {
                          for (AppPeng o : list) {
                              if (o == a || o.emote != E_NAP) continue;
                              float sx2 = (a.x - o.x) / 46f, sy2 = (a.y - o.y) / 26f;
                              float se = sx2 * sx2 + sy2 * sy2;
                              if (se < 1) { float k = (float) (1 / Math.sqrt(Math.max(se, 0.0001f))); a.x = o.x + (a.x - o.x) * k; a.y = o.y + (a.y - o.y) * k; }
                          }
                      }
                      if (pEmote == E_NAP) {
                          float sx2 = (a.x - px) / 60f, sy2 = (a.y - py) / 34f;
                          float se = sx2 * sx2 + sy2 * sy2;
                          if (se < 1) { float k = (float) (1 / Math.sqrt(Math.max(se, 0.0001f))); a.x = px + (a.x - px) * k; a.y = py + (a.y - py) * k; }
                      }
                      // getting nowhere for a couple of seconds while trying to walk? pick somewhere else
                      if (a.moving) {
                          a.stuckT += dt;
                          if (a.stuckT > 2f) {
                              if (dist2(a.x, a.y, a.sx, a.sy) < 12 * 12 && a.chatWith == null && a.joinOf == null && a.ev == null) {
                                  freshTarget(a, 300);
                                  a.hx = a.tx; a.hy = a.ty;
                              }
                              a.stuckT = 0; a.sx = a.x; a.sy = a.y;
                          }
                      } else { a.stuckT = 0; a.sx = a.x; a.sy = a.y; }
                      // walking in circles, not getting any closer to where they're going? new plan
                      if (a.moving && a.chatWith == null && a.ev == null && a.napWith == null) {
                          float gd = (float) Math.sqrt(dist2(a.x, a.y, a.tx, a.ty));
                          if (a.joinOf != null) gd = (float) Math.sqrt(dist2(a.x, a.y, (a.joinOf.x + (a.joinOf.chatWith != null ? a.joinOf.chatWith.x : a.joinOf.x)) / 2, a.joinOf.y));
                          if (gd < a.bestD - 20) { a.bestD = gd; a.progT = 0; }
                          else {
                              a.progT += dt;
                              if (a.progT > 1.4f) {
                                  // getting nowhere: forget that destination and pick a different, clear one
                                  a.progT = 0; a.bestD = 1e9f;
                                  if (a.joinOf != null) leaveGroup(a);
                                  freshTarget(a, 300);
                                  a.hx = a.tx; a.hy = a.ty;
                                  a.wait = 0;
                              }
                          }
                      } else { a.progT = 0; a.bestD = 1e9f; }
                  }
                  // personal space: penguins that aren't together gently drift apart if they overlap (not during the whistle circle)
                  for (int i = 0; i < list.size() && rallyT <= 0; i++) {
                      AppPeng a = list.get(i);
                      for (int j = i + 1; j < list.size(); j++) {
                          AppPeng b = list.get(j);
                          float dx = b.x - a.x, dy = (b.y - a.y) * 1.5f;
                          float d2 = dx * dx + dy * dy;
                          if (d2 >= 38 * 38 || together(a, b)) continue;
                          float d = (float) Math.sqrt(Math.max(d2, 0.01f));
                          if (d < 0.5f) { dx = rnd.nextFloat() - 0.5f; dy = 0.3f; d = 0.6f; }
                          float push = (38 - d) * Math.min(1, dt * 1.5f) * 0.5f;
                          boolean aFixed = a.chatWith != null || a.joinOf != null || a.emote == E_NAP;
                          boolean bFixed = b.chatWith != null || b.joinOf != null || b.emote == E_NAP;
                          float ka = aFixed && !bFixed ? 0 : bFixed && !aFixed ? 2 : 1;
                          float kb = bFixed && !aFixed ? 0 : aFixed && !bFixed ? 2 : 1;
                          if (aFixed && bFixed) { ka = kb = 0.5f; }
                          float ax2 = a.x - dx / d * push * ka, ay2 = a.y - dy / d * push * ka / 1.5f;
                          float bx2 = b.x + dx / d * push * kb, by2 = b.y + dy / d * push * kb / 1.5f;
                          if (!blockedSpot(ax2, ay2, -6)) { a.x = ax2; a.y = ay2; }
                          if (!blockedSpot(bx2, by2, -6)) { b.x = bx2; b.y = by2; }
                      }
                  }

                  fightCool = Math.max(0, fightCool - dt);
                  fightCool2 = Math.max(0, fightCool2 - dt);
                  // Snowballs
                  for (Iterator<Ball> it = balls.iterator(); it.hasNext(); ) {
                      Ball b = it.next();
                      b.t += dt;
                      b.x += b.vx * dt;
                      b.y += b.vy * dt;
                      float z = ballZ(b);
                      boolean done = false;
                      if (b.toy) {
                          // a snowball tossed for Ezio to chase: it doesn't hit anyone
                      } else if (b.target != null) {
                          // penguin vs penguin
                          for (AppPeng a : list) {
                              if (a == b.owner) continue;
                              if (z < 75 && dist2(a.x, a.y - 10, b.x, b.y) < 30 * 30) {
                                  a.hitT = 2.2f;
                                  if (b.owner != null) a.facing = faceToward(a.x, a.y, b.owner.x, b.owner.y);
                                  npcEmote(a, E_FLINCH, 0.5f, 0);
                                  playAt(S_SPLAT, 0.4f, 0.95f, a.x, a.y);
                                  // sometimes they throw one back (and the odd one back again), sometimes they just shrug it off
                                  if (b.owner != null && b.depth < 2 && rnd.nextFloat() < (b.depth == 0 ? 0.55f : 0.3f)) {
                                      a.throwBackT = 0.9f + rnd.nextFloat() * 0.5f;
                                      a.throwBackAt = b.owner;
                                      a.throwBackDepth = b.depth + 1;
                                  } else if (b.owner != null) {
                                      // not throwing one back: a long, silent glare at whoever did it instead
                                      a.stareAt = b.owner;
                                      a.stareT = 3 + rnd.nextFloat() * 2.5f;
                                      if (a.chatWith != null) endChat(a);
                                  }
                                  splat(b.x, b.y - z * 0.3f - 40);
                                  done = true;
                                  break;
                              }
                          }
                      } else if (b.fromPlayer) {
                          for (AppPeng a : list) {
                              if (z < 75 && dist2(a.x, a.y - 10, b.x, b.y) < 30 * 30) {
                                  a.hitT = 2.2f;
                                  a.facing = faceToward(a.x, a.y, px, py);
                                  npcEmote(a, E_FLINCH, 0.5f, 0);
                                  play(S_SPLAT, 0.4f, 0.95f);
                                  play(S_CHIRP, 0.18f, 1.15f);
                                  if (rnd.nextFloat() < 0.6f) { a.throwBackT = 0.9f + rnd.nextFloat() * 0.5f; a.throwBackAt = null; }
                                  splat(b.x, b.y - z * 0.3f - 40);
                                  done = true;
                                  break;
                              }
                          }
                      } else if (z < 75 && dist2(px, py - 10, b.x, b.y) < 30 * 30) {
                          pHitT = 2.2f;
                          play(S_SPLAT, 0.4f, 0.9f);
                          splat(b.x, b.y - 45);
                          done = true;
                      }
                      if (!done && b.t >= b.dur) {
                          float ex = (b.x - CX) / RX, ey = (b.y - CY) / RY;
                          if (ex * ex + ey * ey > 1) splash(b.x, b.y); else splat(b.x, b.y);
                          playAt(S_SPLAT, 0.22f, 1f, b.x, b.y);
                          done = true;
                      }
                      if (done) it.remove();
                  }

                  // Seasonal extras
                  int season = activeSeason();
                  if (season == SEASON_NEWYEAR) {
                      nextFirework -= dt;
                      if (nextFirework <= 0) { nextFirework = 0.6f + rnd.nextFloat() * 1.2f; firework(); }
                  } else if (season == SEASON_VALENTINE) {
                      nextHeart -= dt;
                      if (nextHeart <= 0) { nextHeart = 0.5f + rnd.nextFloat(); heart(); }
                  }

                  // Weather particles
                  Weather w = weatherFx ? weather : null;
                  float windVX = 0, windVY = 0;
                  if (w != null && w.ok) {
                      double toward = Math.toRadians(w.windFromDeg + 180);
                      windVX = (float) Math.sin(toward) * w.windKmh * 5f;
                      windVY = (float) -Math.cos(toward) * w.windKmh * 2f;
                      if (w.thunder && rnd.nextFloat() < dt * 0.08f) flash = 1f;
                  }
                  flash = Math.max(0, flash - dt * 2.5f);
                  boolean rain = w != null && w.ok && w.precip == Weather.RAIN;
                  for (int i = 0; i < flX.length; i++) {
                      float fall = rain ? 700 * flSpd[i] : 45 * flSpd[i];
                      flY[i] += (fall + windVY * 0.3f) * dt;
                      flX[i] += (windVX * (rain ? 0.5f : 1f) + (rain ? 0 : (float) Math.sin(time * 0.8f + i) * 12f)) * dt;
                      if (flY[i] > VH + 10) { flY[i] = -10; flX[i] = rnd.nextFloat() * VW; }
                      if (flY[i] < -12) flY[i] = VH + 8;
                      if (flX[i] < -20) flX[i] += VW + 40;
                      if (flX[i] > VW + 20) flX[i] -= VW + 40;
                  }
                  for (int i = 0; i < stX.length; i++) {
                      stX[i] += windVX * 2.2f * dt;
                      stY[i] += windVY * 1.0f * dt;
                      if (stX[i] < -80) { stX[i] = VW + 60; stY[i] = rnd.nextFloat() * VH; }
                      if (stX[i] > VW + 80) { stX[i] = -60; stY[i] = rnd.nextFloat() * VH; }
                      if (stY[i] < -20) stY[i] = VH + 10;
                      if (stY[i] > VH + 20) stY[i] = -10;
                  }
              }

              void npcThink(AppPeng a, float dt, List<AppPeng> list) {
                  if (a.ev != null && petEvent(a, dt)) return;
                  if (a == ezStarePeng && ezStareT > 0) {
                      // in a slow-blink stare-off with Ezio: not going anywhere until it's done
                      a.moving = false;
                      a.facing = faceToward(a.x, a.y, ezX, ezY);
                      return;
                  }
                  if (a.flutterT > 0) {
                      // shaking off a stare: a quick flutter of blinks
                      a.flutterT -= dt;
                      a.moving = false;
                      if (((int) (a.flutterT / 0.09f)) % 2 == 0) a.blinkT = 0.05f;
                      return;
                  }
                  if (a.napWith != null) {
                      // going over to nap beside someone
                      AppPeng h = a.napWith;
                      if (h.emote != E_NAP) { a.napWith = null; }
                      else {
                          float tx = h.x + (a.napSide != 0 ? a.napSide * 46 : 0), ty = h.y + (a.napSide != 0 ? 4 : 38);
                          float dx = tx - a.x, dy = ty - a.y, d = (float) Math.sqrt(dx * dx + dy * dy);
                          if (d > 3) {
                              if (a.speedMul == 0) a.speedMul = 0.82f + rnd.nextFloat() * 0.36f;
                              float st = Math.min(d, 50 * a.speedMul * dt);
                              float[] dir = steer(a, dx, dy, st);
                              a.x += dir[0] * st; a.y += dir[1] * st;
                              a.moving = true;
                              a.facing = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? LEFT : RIGHT) : (dy < 0 ? UP : DOWN);
                              return;
                          }
                          a.napWith = null;
                          a.napHost = h;
                          a.facing = DOWN;
                          npcEmote(a, E_NAP, 7 + rnd.nextFloat() * 12, 0);
                          return;
                      }
                  }
                  if (a.stareT > 0 && a.stareAt != null) {
                      a.stareT -= dt;
                      a.moving = false;
                      a.facing = faceToward(a.x, a.y, a.stareAt.x, a.stareAt.y);
                      if (a.stareT <= 0) {
                          // ...and then turns its back on them
                          int f = a.facing;
                          a.facing = f == LEFT ? RIGHT : f == RIGHT ? LEFT : f == UP ? DOWN : UP;
                          a.turnAwayT = 1.2f + rnd.nextFloat() * 1f;
                          a.stareAt = null;
                          if (rnd.nextFloat() < 0.3f) a.flutterT = 0.55f;
                      }
                      return;
                  }
                  if (a.turnAwayT > 0) { a.turnAwayT -= dt; a.moving = false; return; }
                  float pdx = px - a.x, pdy = py - a.y;
                  a.ignoreT = Math.max(0, a.ignoreT - dt);
                  boolean playerClose = pdx * pdx + pdy * pdy < 130 * 130;
                  if (!playerClose) a.noticeT = 0;
                  if (playerClose && a.ignoreT <= 0 && a.noticeT <= 0 && tvStarers >= 2) a.ignoreT = 6;     // enough are staring already
                  if (playerClose && a.ignoreT <= 0) {
                      // they turn to look at you for a few seconds... then lose interest and get on with things
                      a.noticeT += dt;
                      if (a.noticeT > 4 + ((a.label == null ? 0 : a.label.length()) % 4)) {
                          a.noticeT = 0; a.ignoreT = 25; a.wait = 0;
                          if (rnd.nextFloat() < 0.3f) a.flutterT = 0.55f;
                      }
                      else {
                          if (a.chatWith != null) endChat(a);
                          if (a.joinOf != null) leaveGroup(a);
                          a.moving = false;
                          a.facing = faceToward(a.x, a.y, px, py);
                          return;
                      }
                  }
                  if (a.joinOf != null) {
                      AppPeng h = a.joinOf, h2 = h.chatWith;
                      if (h2 == null || !list.contains(h)) { leaveGroup(a); return; }
                      float mx = (h.x + h2.x) / 2, my = (h.y + h2.y) / 2;
                      float gx = mx, gy = my + (a.joinSlot == 0 ? -34 : 30);
                      // go round the pair rather than through them: line up above/below first, then step in
                      float tgx = gx, tgy = gy;
                      if (Math.abs(gx - a.x) > 30) tgy = gy + (a.joinSlot == 0 ? -40 : 40);
                      float jdx = tgx - a.x, jdy = tgy - a.y, jd = (float) Math.sqrt(jdx * jdx + jdy * jdy);
                      if (Math.abs(gx - a.x) <= 30) { jdx = gx - a.x; jdy = gy - a.y; jd = (float) Math.sqrt(jdx * jdx + jdy * jdy); }
                      if (jd > 3) {
                          a.joinWalkT += dt;
                          if (a.joinWalkT > 9 || blockedSpot(gx, gy, 10)) { leaveGroup(a); return; }    // can't get there: never mind
                          if (a.speedMul == 0) a.speedMul = 0.82f + rnd.nextFloat() * 0.36f;
                          float st = Math.min(jd, 42 * a.speedMul * dt);
                          float[] dir = steer(a, jdx, jdy, st);
                          a.x += dir[0] * st; a.y += dir[1] * st;
                          a.moving = true;
                          a.facing = Math.abs(jdx) > Math.abs(jdy) ? (jdx < 0 ? LEFT : RIGHT) : (jdy < 0 ? UP : DOWN);
                          return;
                      }
                      a.moving = false;
                      a.facing = faceToward(a.x, a.y, mx, my);
                      a.chatTalking = true;
                      if (!a.joinArrived) {
                          // a third has joined: the conversation gets more time
                          a.joinArrived = true;
                          float extra = 10 + rnd.nextFloat() * 6;
                          h.chatDur = Math.max(h.chatDur, h.chatT + extra);
                          h2.chatDur = Math.max(h2.chatDur, h2.chatT + extra);
                      }
                      // now and then one of the three wanders off and the other two carry on
                      if (rnd.nextFloat() < dt * 0.03f) {
                          int who = rnd.nextInt(3);
                          if (who == 0) { leaveGroup(a); return; }
                          AppPeng goes = who == 1 ? h : h2, stays = who == 1 ? h2 : h;
                          float left = Math.max(5, stays.chatDur - stays.chatT);
                          goes.chatWith = null;
                          goes.chatTalking = goes.speaking = goes.arrived = false;
                          goes.bubble = null;
                          goes.tx = goes.hx + (rnd.nextFloat() - 0.5f) * 60;
                          goes.ty = goes.hy + (rnd.nextFloat() - 0.5f) * 40;
                          goes.wait = 0;
                          a.joinOf = null;
                          a.chatWith = stays; stays.chatWith = a;
                          a.chatTalking = stays.chatTalking = true;
                          a.arrived = stays.arrived = true;
                          a.chatT = stays.chatT = 0;
                          a.chatDur = stays.chatDur = left + 4;
                          a.speaking = false; a.replyT = 0.8f;
                          return;
                      }
                      a.joinSpeakT -= dt;
                      if (a.joinSpeakT <= 0) {
                          a.speaking = !a.speaking;
                          if (a.speaking) a.bubble = CHAT_BITS[rnd.nextInt(CHAT_BITS.length)];
                          a.joinSpeakT = a.speaking ? speakTime(a.bubble) : 2.5f + rnd.nextFloat() * 3.5f;
                          if (a.speaking) {
                              if (rnd.nextFloat() < 0.3f) npcEmote(a, E_FLAP, 0.6f, 0);
                          }
                      }
                      return;
                  }
                  if (a.chatWith != null && a.chatTalking) {
                      AppPeng o = a.chatWith;
                      a.moving = false;
                      a.facing = faceToward(a.x, a.y, o.x, o.y);
                      for (AppPeng q : list) {
                          if ((q.joinOf == a || q.joinOf == o) && q.joinArrived && q.faceMe) {
                              a.facing = faceToward(a.x, a.y, q.x, q.y);
                              break;
                          }
                      }
                      a.chatT += dt;
                      if (a.speaking) {
                          a.speakT -= dt;
                          if (a.speakT <= 0) {
                              // done talking: a little pause before the other one answers
                              a.speaking = false;
                              o.replyT = 0.6f + rnd.nextFloat() * 1.2f;
                          }
                      } else if (a.replyT > 0) {
                          a.replyT -= dt;
                          if (a.replyT <= 0) {
                              a.speaking = true;
                              a.bubble = CHAT_BITS[rnd.nextInt(CHAT_BITS.length)];
                              a.speakT = speakTime(a.bubble);
                              float roll = rnd.nextFloat();
                              if (roll < 0.088f) { hugPair(a, o); return; }
                              if (roll < 0.24f) npcEmote(a, E_FLAP, 0.6f, 0);
                              else if (roll < 0.38f) npcEmote(o, E_HOP, 0.5f, 0);
                              if (rnd.nextFloat() < 0.3f && dist2(a.x, a.y, px, py) < 450 * 450) play(S_CHIRP, 0.05f, 0.95f + rnd.nextFloat() * 0.2f);
                          }
                      }
                      if (a.chatT > a.chatDur) endChat(a);
                      return;
                  }
                  if (a.spreeT > 0) { a.moving = false; return; }
                  if (a.chatWith == null && a.joinOf == null && a.wait > 0) {
                      a.wait -= dt;
                      a.moving = false;
                      float roll = rnd.nextFloat();
                      // (everything about 12% less often than before; chats about half as often)
                      if (roll < dt * 0.035f) {
                          int e = rnd.nextBoolean() ? E_HOP : E_FLAP;
                          if (time - emoteStartAt[e] > 1.2f) { emoteStartAt[e] = time; npcEmote(a, e, 0.7f, 0); }
                      }
                      else if (roll < dt * 0.062f) soloEmote(a);
                      else if (roll < dt * (a.hangout ? 0.09f : 0.11f)) tryStartChat(a, list);
                      if (a.wait <= 0) a.hangout = false;
                      // glance about now and then, so standing penguins don't all stare straight out at you
                      a.lookT -= dt;
                      if (a.lookT <= 0 && a.emote == E_NONE) {
                          a.lookT = 1.5f + rnd.nextFloat() * 2.5f;
                          float lr = rnd.nextFloat();
                          a.facing = lr < 0.35f ? LEFT : lr < 0.7f ? RIGHT : lr < 0.85f || tvStarers >= 2 ? UP : DOWN;
                      }
                      return;
                  }
                  if (a.chatWith != null) {
                      a.chatT += dt;
                      if (a.chatT > 9) { endChat(a); return; }
                  }
                  float dx = a.tx - a.x, dy = a.ty - a.y;
                  float d = (float) Math.sqrt(dx * dx + dy * dy);
                  if (d < 2) {
                      a.moving = false;
                      if (a.chatWith != null) {
                          AppPeng o = a.chatWith;
                          a.arrived = true;
                          a.facing = faceToward(a.x, a.y, o.x, o.y);
                          if (o.arrived) {
                              float dur = 11 + rnd.nextFloat() * 9;
                              a.chatTalking = o.chatTalking = true;
                              a.chatT = o.chatT = 0;
                              a.chatDur = o.chatDur = dur;
                              a.replyT = o.replyT = 0;
                              a.speaking = true;
                              a.bubble = CHAT_BITS[rnd.nextInt(CHAT_BITS.length)];
                              a.speakT = speakTime(a.bubble);
                          }
                          return;
                      }
                      // sometimes they just hang out where they are for a good while
                      a.hangout = rnd.nextFloat() < 0.35f;
                      a.wait = a.hangout ? 6 + rnd.nextFloat() * 8 : 1.5f + rnd.nextFloat() * 3.5f;
                      a.lookT = 0.8f + rnd.nextFloat() * 1.5f;
                      if (a.longAfter <= 0) a.longAfter = 4 + rnd.nextInt(3);
                      a.shortWalks++;
                      if (a.shortWalks >= a.longAfter) {
                          // a proper walk: pick somewhere a good way off and make that the new home spot
                          a.shortWalks = 0; a.longAfter = 4 + rnd.nextInt(3);
                          for (int tries = 0; tries < 8; tries++) {
                              double ang = rnd.nextDouble() * Math.PI * 2;
                              float dist = 180 + rnd.nextFloat() * 225;
                              float nx = a.x + (float) Math.cos(ang) * dist, ny = a.y + (float) Math.sin(ang) * dist * 0.7f;
                              float ex = (nx - CX) / (RX - 90), ey = (ny - CY) / (RY - 80);
                              float ix = (nx - IGLOO_X) / 190f, iy = (ny - (IGLOO_Y - 22)) / 80f;
                              if (ex * ex + ey * ey < 1 && ix * ix + iy * iy > 1) { a.hx = nx; a.hy = ny; break; }
                          }
                          a.hangout = false;
                          a.wait = 0.5f;
                      }
                      a.tx = a.hx + (rnd.nextFloat() - 0.5f) * 90;
                      a.ty = a.hy + (rnd.nextFloat() - 0.5f) * 60;
                      a.walkMul = 0.9f + rnd.nextFloat() * 0.2f;
                      a.hasWp = false;
                      if (blockedSpot(a.tx, a.ty, 16)) freshTarget(a, 220);
                  } else {
                      if (a.speedMul == 0) a.speedMul = 0.82f + rnd.nextFloat() * 0.36f;
                      float speed = (d > 150 && a.chatWith == null ? 65f : 42f) * a.speedMul * a.walkMul;
                      // plan round anything solid between here and there: head for a stop-off point beside it first
                      if (!a.hasWp && !pathClear(a.x, a.y, a.tx, a.ty)) {
                          float[] w = detour(a.x, a.y, a.tx, a.ty);
                          if (w != null) { a.hasWp = true; a.wpX = w[0]; a.wpY = w[1]; }
                          else if (a.chatWith == null) { freshTarget(a, 260); }
                      }
                      float gx = a.tx, gy = a.ty;
                      if (a.hasWp) {
                          gx = a.wpX; gy = a.wpY;
                          if (dist2(a.x, a.y, gx, gy) < 10 * 10) { a.hasWp = false; gx = a.tx; gy = a.ty; }
                      }
                      float gdx = gx - a.x, gdy = gy - a.y, gd = (float) Math.max(0.001, Math.sqrt(gdx * gdx + gdy * gdy));
                      float stepLen = Math.min(gd, speed * dt);
                      float[] dir = a.chatWith == null ? steer(a, gdx, gdy, stepLen) : new float[]{gdx / gd, gdy / gd};
                      a.x += dir[0] * stepLen;
                      a.y += dir[1] * stepLen;
                      dx = gdx; dy = gdy;
                      if (ezSleeping && ezScene == SCENE_ISLAND) {
                          // don't trample the sleeping cat
                          float ex2 = (a.x - ezX) / 48f, ey2 = (a.y - ezY) / 30f;
                          float e2 = ex2 * ex2 + ey2 * ey2;
                          if (e2 < 1) { float k = (float) (1 / Math.sqrt(Math.max(e2, 0.0001f))); a.x = ezX + (a.x - ezX) * k; a.y = ezY + (a.y - ezY) * k; }
                      }
                      a.moving = true;
                      a.facing = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? LEFT : RIGHT) : (dy < 0 ? UP : DOWN);
                  }
              }

              /** Starts the moment: someone in the conversation hosted by `a` leaves it to pet Ezio. */
              void startPetEvent(AppPeng a, List<AppPeng> list) {
                  AppPeng o = a.chatWith;
                  if (o == null || !a.chatTalking) return;
                  ArrayList<AppPeng> joiners = new ArrayList<>();
                  for (AppPeng q : list) if ((q.joinOf == a || q.joinOf == o) && q.joinArrived) joiners.add(q);
                  ArrayList<AppPeng> group = new ArrayList<>();
                  group.add(a); group.add(o); group.addAll(joiners);
                  PetEvent ev = new PetEvent();
                  ev.petter = group.get(rnd.nextInt(group.size()));
                  ev.three = group.size() >= 3;
                  AppPeng pt = ev.petter;
                  // take the petter out of the conversation, keeping the rest of it together
                  if (joiners.contains(pt)) {
                      pt.joinOf = null;
                      ev.host = a;
                  } else {
                      AppPeng other = pt == a ? o : a;
                      ev.host = other;
                      joiners.remove(pt);
                      if (!joiners.isEmpty()) {
                          AppPeng j = joiners.get(0);
                          j.joinOf = null;
                          j.chatWith = other; other.chatWith = j;
                          j.chatTalking = other.chatTalking = true;
                          j.arrived = other.arrived = true;
                          j.chatT = other.chatT; j.chatDur = other.chatDur;
                          for (int i = 1; i < joiners.size(); i++) joiners.get(i).joinOf = other;
                      } else {
                          other.chatWith = null;
                          other.chatTalking = other.arrived = false;
                      }
                  }
                  pt.chatWith = null;
                  pt.chatTalking = pt.speaking = pt.arrived = false;
                  pt.bubble = null;
                  ev.spotX = pt.x; ev.spotY = pt.y;
                  for (AppPeng q : group) {
                      if (q == pt) continue;
                      ev.others.add(q);
                      q.speaking = false; q.bubble = null;
                      q.ev = ev;
                      q.evPauseT = 0.5f + rnd.nextFloat() * 1.5f;      // a moment's pause, watching
                  }
                  // what happens next: (1) the rest carry on, (2) the petter comes back and rejoins, (3) the petter wanders
                  // off, (4) the rest break up, (5) the rest break up and the petter comes back to find them gone
                  int[] choices = ev.three ? new int[]{1, 2, 3, 4, 5} : new int[]{2, 3, 5};
                  ev.outcome = choices[rnd.nextInt(choices.length)];
                  pt.ev = ev;
                  petEv = ev;
              }

              void endPetEvent(PetEvent ev) {
                  if (ev.petter != null && ev.petter.ev == ev) ev.petter.ev = null;
                  for (AppPeng q : ev.others) if (q.ev == ev) q.ev = null;
                  if (petEv == ev) petEv = null;
              }

              /** A penguin's part in the moment. Returns true while it's busy with it. */
              boolean petEvent(AppPeng a, float dt) {
                  PetEvent ev = a.ev;
                  if (a == ev.petter) {
                      ev.t += dt;
                      if (ev.t > 30) { endPetEvent(ev); return false; }
                      if (ev.phase == 0) {
                          // over to Ezio
                          float side = a.x < ezX ? -1 : 1;
                          float tx = ezX + side * 46, ty = ezY - 3;
                          float dx = tx - a.x, dy = ty - a.y, d = (float) Math.sqrt(dx * dx + dy * dy);
                          if (ezScene != SCENE_ISLAND || ev.t > 12) { ev.phase = 2; return true; }
                          if (d > 3) {
                              float st = Math.min(d, 60 * (a.speedMul == 0 ? 1 : a.speedMul) * dt);
                              float[] dir = steer(a, dx, dy, st);
                              a.x += dir[0] * st; a.y += dir[1] * st;
                              a.moving = true;
                              a.facing = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? LEFT : RIGHT) : (dy < 0 ? UP : DOWN);
                              return true;
                          }
                          a.moving = false;
                          a.facing = ezX < a.x ? LEFT : RIGHT;
                          npcEmote(a, E_PAT, 1.6f, 0);
                          ezPatPeng = a; ezPatX = ezX; ezPatY = ezY;
                          ezHappyT = 1.6f;
                          ev.phase = 1;
                          return true;
                      }
                      if (ev.phase == 1) {
                          // the pat's done
                          ezWait = Math.min(ezWait, 1.2f);
                          if (ev.outcome == 2 || ev.outcome == 5) { ev.phase = 2; return true; }
                          a.ev = null;
                          if (petEv == ev) petEv = null;      // (the others finish their part on their own)
                          a.wait = 0;
                          return false;
                      }
                      if (ev.phase == 2) {
                          // back to where they were standing (or near it, if someone's standing there now)
                          float dx = ev.spotX - a.x, dy = ev.spotY - a.y, d = (float) Math.sqrt(dx * dx + dy * dy);
                          boolean taken = false;
                          for (AppPeng q : apps) if (q != a && q.ev != ev && dist2(q.x, q.y, ev.spotX, ev.spotY) < 50 * 50) { taken = true; break; }
                          if (taken && d < 75) d = 0;
                          if (d > 3) {
                              float st = Math.min(d, 55 * (a.speedMul == 0 ? 1 : a.speedMul) * dt);
                              float[] dir = steer(a, dx, dy, st);
                              a.x += dir[0] * st; a.y += dir[1] * st;
                              a.moving = true;
                              a.facing = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? LEFT : RIGHT) : (dy < 0 ? UP : DOWN);
                              return true;
                          }
                          a.moving = false;
                          if (ev.outcome == 2) {
                              // rejoin the conversation
                              AppPeng h = ev.host;
                              if (ev.three && h != null && h.chatWith != null && h.chatTalking) {
                                  a.joinOf = h;
                                  a.joinSlot = a.y < (h.y + h.chatWith.y) / 2 ? 0 : 1;
                                  a.joinArrived = false;
                                  a.faceMe = rnd.nextBoolean();
                              } else if (!ev.three && !ev.others.isEmpty() && ev.others.get(0).ev == ev) {
                                  AppPeng o = ev.others.get(0);
                                  a.chatWith = o; o.chatWith = a;
                                  a.chatTalking = o.chatTalking = true;
                                  a.arrived = o.arrived = true;
                                  a.chatT = o.chatT = 0;
                                  a.chatDur = o.chatDur = 6 + rnd.nextFloat() * 7;
                                  a.replyT = o.replyT = 0;
                                  a.speaking = true;
                                  a.bubble = CHAT_BITS[rnd.nextInt(CHAT_BITS.length)];
                                  a.speakT = speakTime(a.bubble);
                                  o.ev = null;
                              }
                              endPetEvent(ev);
                              return false;
                          }
                          // outcome 5: everyone's gone. A blank stare out front, or looking left and right for them
                          ev.phase = 3;
                          ev.confMode = rnd.nextBoolean() ? 0 : 1;
                          ev.confT = 2 + rnd.nextFloat() * 3;
                          ev.flipsLeft = 2 + rnd.nextInt(5);          // 1 to 3 back-and-forths, can stop halfway
                          ev.flipT = 0.45f + rnd.nextFloat() * 0.2f;
                          a.facing = ev.confMode == 0 ? DOWN : (rnd.nextBoolean() ? LEFT : RIGHT);
                          if (rnd.nextFloat() < 0.4f) { a.bubble = "?"; a.speaking = true; a.chatTalking = true; }
                          return true;
                      }
                      // phase 3: confused
                      a.moving = false;
                      boolean done;
                      if (ev.confMode == 0) { ev.confT -= dt; done = ev.confT <= 0; }
                      else {
                          ev.flipT -= dt;
                          if (ev.flipT <= 0) {
                              ev.flipsLeft--;
                              if (ev.flipsLeft > 0) { a.facing = a.facing == LEFT ? RIGHT : LEFT; ev.flipT = 0.45f + rnd.nextFloat() * 0.2f; }
                          }
                          done = ev.flipsLeft <= 0;
                      }
                      if (done) {
                          a.bubble = null; a.speaking = false; a.chatTalking = false;
                          endPetEvent(ev);
                          a.wait = 0;
                          return false;
                      }
                      return true;
                  }
                  // one of the others: watch for a moment, then react
                  if (a.evPauseT > 0) {
                      a.evPauseT -= dt;
                      a.moving = false;
                      if (ev.petter != null) a.facing = faceToward(a.x, a.y, ev.petter.x, ev.petter.y);
                      return true;
                  }
                  switch (ev.outcome) {
                      case 2:
                          if (ev.three) { a.ev = null; return false; }      // carry on; they'll rejoin
                          // just the two of them: wait for the petter to come back
                          if (ev.t > 25) { a.ev = null; return false; }
                          a.moving = false;
                          if (ev.petter != null) a.facing = faceToward(a.x, a.y, ev.petter.x, ev.petter.y);
                          return true;
                      case 4:
                      case 5:
                          // the conversation breaks up
                          if (a.chatWith != null) endChat(a);
                          if (a.joinOf != null) leaveGroup(a);
                          a.ev = null;
                          a.wait = 0;
                          return false;
                      default:
                          // carry on (or, if they were the only one left, wander off)
                          a.ev = null;
                          if (a.chatWith == null && a.joinOf == null) a.wait = 0;
                          return false;
                  }
              }

              /** A penguin doing its own thing for 7-15 seconds: waving, dancing, throwing snowballs or having a nap. */
              void soloEmote(AppPeng a) {
                  float dur = 7 + rnd.nextFloat() * 8;
                  // don't emote right on top of someone who's asleep
                  if (pEmote == E_NAP && dist2(a.x, a.y, px, py) < 160 * 160) return;
                  int pick = rnd.nextInt(5);
                  int[] kinds = {E_WAVE, E_DANCE, -1, E_NAP, E_SCRATCH};
                  // nobody starts the same thing at the same moment as a penguin they're not with (no copy-paste crowds)
                  for (int tries = 0; tries < 5 && kinds[pick] > 0 && time - emoteStartAt[kinds[pick]] < 1.5f; tries++) pick = (pick + 1) % 5;
                  if (kinds[pick] > 0 && time - emoteStartAt[kinds[pick]] < 1.5f) return;
                  if (kinds[pick] > 0) emoteStartAt[kinds[pick]] = time;
                  if (pick == 4) { npcEmote(a, E_SCRATCH, 1 + rnd.nextFloat() * 3, 0); a.wait = Math.max(a.wait, 1.5f); return; }
                  if (pick == 3) { startNap(a, dur); a.wait = Math.max(a.wait, 1.5f); return; }
                  switch (pick) {
                      case 0: npcEmote(a, E_WAVE, dur, 0); echoEmote(a, E_WAVE); break;
                      case 1: npcEmote(a, E_DANCE, dur, 0); echoEmote(a, E_DANCE); break;
                      case 2: {
                          float r = rnd.nextFloat();
                          a.spreeLeft = r < 0.55f ? 1 : r < 0.8f ? 2 : r < 0.93f ? 3 : 4;
                          a.spreeT = 30; a.spreeNext = 0.2f;
                          break;
                      }
                      default: break;
                  }
                  a.wait = Math.max(a.wait, 1.5f);
              }

              /** Now and then one or two penguins close by join in (or wave back) a moment later. Never ones mid-conversation. */
              void echoEmote(AppPeng a, int e) {
                  if (rnd.nextFloat() > 0.18f) return;
                  int n = 0, max = 1 + (rnd.nextFloat() < 0.3f ? 1 : 0);
                  for (AppPeng o : apps) {
                      if (o == a || o.chatWith != null || o.joinOf != null || o.emote != E_NONE || o.ev != null || o.hugWalk || o.spreeT > 0) continue;
                      if (dist2(o.x, o.y, a.x, a.y) > 82 * 82) continue;
                      o.faceAt = a;
                      npcEmote(o, e, Math.max(2, a.emoteDur - 1 - rnd.nextFloat() * 2), 0.4f + rnd.nextFloat() * 0.9f);
                      if (++n >= max) break;
                  }
              }

              /** A nap; sometimes one or two others wander over and nap alongside. */
              void startNap(AppPeng a, float dur) {
                  a.facing = DOWN;
                  a.napHost = null;
                  npcEmote(a, E_NAP, dur + 3, 0);
                  if (rnd.nextFloat() > 0.3f) return;
                  int n = 0, max = 1 + rnd.nextInt(2), firstSide = 1;
                  for (AppPeng o : apps) {
                      if (o == a || o.chatWith != null || o.joinOf != null || o.emote != E_NONE || o.ev != null || o.hugWalk || o.spreeT > 0 || o.napWith != null) continue;
                      if (dist2(o.x, o.y, a.x, a.y) > 380 * 380) continue;
                      o.napWith = a;
                      if (n == 0) o.napSide = rnd.nextBoolean() ? -1 : 1;
                      else o.napSide = -firstSide;
                      if (n == 0) firstSide = o.napSide;
                      if (++n >= max) break;
                  }
              }

              /** How long a speech bubble stays up: longer lines get more time. */
              float speakTime(String bubble) {
                  int len = bubble == null ? 1 : bubble.length();
                  return 1.6f + Math.min(len, 6) * 0.35f + rnd.nextFloat() * 1.2f;
              }

              /** True if (x, y) is inside the igloo, the CD player, a lawn chair or Ezio's bed (pad = extra margin). */
              boolean blockedSpot(float x, float y, float pad) {
                  float ix = (x - IGLOO_X) / (165 + pad), iy = (y - (IGLOO_Y - 22)) / (50 + pad);
                  if (ix * ix + iy * iy < 1) return true;
                  float cx = (x - CD_X) / (52 + pad), cy = (y - (CD_Y - 5)) / (22 + pad);
                  if (cx * cx + cy * cy < 1) return true;
                  float bx = (x - BED_X) / (48 + pad), by = (y - BED_Y) / (22 + pad);
                  if (bx * bx + by * by < 1) return true;
                  for (Chair ch : chairs) {
                      float hx = (x - ch.x) / (34 + pad), hy = (y - (ch.y - 2)) / (19 + pad);
                      if (hx * hx + hy * hy < 1) return true;
                  }
                  return false;
              }

              /**
               * Which way to actually step when heading in direction (dx, dy): straight on if it's clear, otherwise
               * the nearest clear angle, trying the side the target is on first. Walks round things instead of into them.
               */
              float[] steer(AppPeng a, float dx, float dy, float step) {
                  float d = (float) Math.sqrt(dx * dx + dy * dy);
                  if (d < 0.001f) return new float[]{0, 0};
                  float ux = dx / d, uy = dy / d;
                  float look = Math.max(step, 14);
                  float[] angs = {0, 35, -35, 70, -70, 105, -105, 140, -140};
                  for (float ang : angs) {
                      double r = Math.toRadians(ang);
                      float vx = (float) (ux * Math.cos(r) - uy * Math.sin(r)), vy = (float) (ux * Math.sin(r) + uy * Math.cos(r));
                      float nx = a.x + vx * look, ny = a.y + vy * look;
                      if (blockedSpot(nx, ny, -4) && !blockedSpot(a.x, a.y, -4)) continue;
                      boolean bump = false;
                      for (AppPeng o : apps) {
                          if (o == a || o.moving || together(a, o)) continue;
                          float ox = nx - o.x, oy = (ny - o.y) * 1.5f;
                          if (ox * ox + oy * oy < 30 * 30 && ox * ox + oy * oy < (a.x - o.x) * (a.x - o.x) + (a.y - o.y) * (a.y - o.y) * 2.25f) { bump = true; break; }
                      }
                      if (bump) continue;
                      return new float[]{vx, vy};
                  }
                  return new float[]{ux, uy};
              }

              /** True if walking straight from (x0,y0) to (x1,y1) doesn't pass through anything solid. */
              boolean pathClear(float x0, float y0, float x1, float y1) {
                  float d = (float) Math.sqrt((x1 - x0) * (x1 - x0) + (y1 - y0) * (y1 - y0));
                  int n = Math.max(2, (int) (d / 12));
                  for (int i = 1; i <= n; i++) {
                      float t = i / (float) n;
                      if (blockedSpot(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, 6)) return false;
                  }
                  return true;
              }

              /** A stop-off point beside whatever's in the way, on the side nearer the destination. Null if none found. */
              float[] detour(float x0, float y0, float x1, float y1) {
                  float d = (float) Math.sqrt((x1 - x0) * (x1 - x0) + (y1 - y0) * (y1 - y0));
                  if (d < 1) return null;
                  int n = Math.max(2, (int) (d / 12));
                  float bx = x1, by = y1;
                  for (int i = 1; i <= n; i++) {
                      float t = i / (float) n;
                      float sx = x0 + (x1 - x0) * t, sy = y0 + (y1 - y0) * t;
                      if (blockedSpot(sx, sy, 6)) { bx = sx; by = sy; break; }
                  }
                  float ux = (x1 - x0) / d, uy = (y1 - y0) / d, nx = -uy, ny = ux;
                  for (float off = 50; off <= 300; off += 25) {
                      for (int side = 0; side < 2; side++) {
                          float sg = side == 0 ? 1 : -1;
                          float wx = bx + nx * off * sg, wy = by + ny * off * sg * 0.7f;
                          if (blockedSpot(wx, wy, 14)) continue;
                          if (!pathClear(x0, y0, wx, wy)) continue;
                          return new float[]{wx, wy};
                      }
                  }
                  return null;
              }

              /** A random spot nearby that's clear of anything solid. */
              void freshTarget(AppPeng a, float range) {
                  for (int tries = 0; tries < 12; tries++) {
                      float tx = a.x + (rnd.nextFloat() - 0.5f) * range, ty = a.y + (rnd.nextFloat() - 0.5f) * range * 0.6f;
                      float ex = (tx - CX) / (RX - 90), ey = (ty - CY) / (RY - 80);
                      if (ex * ex + ey * ey < 1 && !blockedSpot(tx, ty, 20)) { a.tx = tx; a.ty = ty; a.hasWp = false; return; }
                  }
              }

              /** True if a and b are together right now (chatting, joining, hugging, napping together...). */
              boolean together(AppPeng a, AppPeng b) {
                  if (a.chatWith == b || b.chatWith == a) return true;
                  if (a.joinOf != null && (a.joinOf == b || a.joinOf.chatWith == b || a.joinOf == b.joinOf)) return true;
                  if (b.joinOf != null && (b.joinOf == a || b.joinOf.chatWith == a)) return true;
                  if (a.napHost == b || b.napHost == a || (a.napHost != null && a.napHost == b.napHost) || a.napWith == b || b.napWith == a) return true;
                  if (a.ev != null && a.ev == b.ev) return true;
                  if (a.emote == E_HUG || b.emote == E_HUG || a.hugWalk || b.hugWalk) return true;
                  return false;
              }

              /** Plays a sound from somewhere on the island: quieter the further from you, silent when far off. */
              void playAt(int snd, float vol, float rate, float x, float y) {
                  float d = (float) Math.sqrt(dist2(x, y, px, py));
                  float k = 1 - d / 650f;
                  if (k <= 0.03f) return;
                  play(snd, vol * k, rate);
              }

              /** Throws a snowball from penguin a straight at another penguin. */
              void throwAtPeng(AppPeng a, AppPeng o, int depth) {
                  Ball b = new Ball();
                  float dx = o.x - a.x, dy = o.y - a.y, d = (float) Math.max(1, Math.sqrt(dx * dx + dy * dy));
                  b.x = a.x + dx / d * 20; b.y = a.y + dy / d * 10;
                  b.dur = Math.max(0.45f, Math.min(0.9f, d / 520f));
                  b.vx = (o.x - b.x) / b.dur; b.vy = (o.y - 10 - b.y) / b.dur;
                  b.owner = a; b.target = o; b.depth = depth;
                  balls.add(b);
                  playAt(S_WHOOSH, 0.22f, 1f, a.x, a.y);
              }

              void tryStartChat(AppPeng a, List<AppPeng> list) {
                  // Sometimes walk over and join a conversation that's already going (up to 4 penguins)
                  if (rnd.nextFloat() < 0.25f) {
                      for (AppPeng h : list) {
                          if (h == a || h.chatWith == null || !h.chatTalking) continue;
                          if (dist2(h.x, h.y, a.x, a.y) > 480 * 480) continue;
                          int joined = 0, taken = -1;
                          for (AppPeng q : list) if (q.joinOf == h || q.joinOf == h.chatWith) { joined++; taken = q.joinSlot; }
                          if (joined >= 2) continue;
                          a.joinOf = h;
                          // join from whichever side they're coming from: above (slot 0) or below (slot 1)
                          int slot = a.y < (h.y + h.chatWith.y) / 2 ? 0 : 1;
                          if (slot == taken) slot = 1 - slot;
                          float hmx = (h.x + h.chatWith.x) / 2, hmy = (h.y + h.chatWith.y) / 2;
                          if (blockedSpot(hmx, hmy + (slot == 0 ? -34 : 30), 12)) slot = 1 - slot;
                          if (slot == taken || blockedSpot(hmx, hmy + (slot == 0 ? -34 : 30), 12)) { a.joinOf = null; continue; }
                          a.joinWalkT = 0;
                          a.joinSlot = slot;
                          a.faceMe = rnd.nextBoolean();
                          a.joinArrived = false;
                          float walk = (float) Math.sqrt(dist2(h.x, h.y, a.x, a.y)) / 42f + 4;
                          h.chatDur = Math.max(h.chatDur, h.chatT + walk + 4);
                          h.chatWith.chatDur = Math.max(h.chatWith.chatDur, h.chatWith.chatT + walk + 4);
                          a.joinSpeakT = 1 + rnd.nextFloat() * 2;
                          a.wait = 0;
                          return;
                      }
                  }
                  // Pick a random free penguin from a wide area, so different penguins get to meet
                  ArrayList<AppPeng> pool = new ArrayList<>();
                  for (AppPeng o : list) {
                      if (o == a || o.chatWith != null || o.joinOf != null || o.emote != E_NONE || o.hugWalk || o == ezStarePeng || o.ev != null || o.napWith != null) continue;
                      if (dist2(o.x, o.y, px, py) < 160 * 160) continue;
                      if (dist2(o.x, o.y, a.x, a.y) < 480 * 480) pool.add(o);
                  }
                  if (pool.isEmpty()) return;
                  AppPeng best = pool.get(rnd.nextInt(pool.size()));
                  AppPeng o = best;
                  float mx = (a.x + o.x) / 2, my = (a.y + o.y) / 2;
                  AppPeng leftOne = a.x <= o.x ? a : o, rightOne = leftOne == a ? o : a;
                  // meet somewhere with room: not on top of another conversation...
                  for (AppPeng q : list) {
                      AppPeng qo = q.chatWith;
                      if (qo == null || q == a || q == o || q.x > qo.x) continue;
                      float cx = (q.tx + qo.tx) / 2, cy = (q.ty + qo.ty) / 2;
                      float ddx = mx - cx, ddy = my - cy, dd = (float) Math.sqrt(ddx * ddx + ddy * ddy);
                      if (dd < 170) {
                          if (dd < 1) { ddx = 1; ddy = 0; dd = 1; }
                          mx = cx + ddx / dd * 170; my = cy + ddy / dd * 170;
                      }
                  }
                  // ...not where someone else is already standing...
                  for (AppPeng q : list) {
                      if (q == a || q == o) continue;
                      float ddx = mx - q.x, ddy = my - q.y, dd = (float) Math.sqrt(ddx * ddx + ddy * ddy);
                      if (dd < 70) { if (dd < 1) { ddx = 0; ddy = 1; dd = 1; } mx = q.x + ddx / dd * 70; my = q.y + ddy / dd * 70; }
                  }
                  // ...not on the bed, a chair or the CD player (or with a joiner's spot stuck inside one)...
                  for (int tries = 0; tries < 6 && (blockedSpot(mx, my, 30) || (blockedSpot(mx, my - 34, 14) && blockedSpot(mx, my + 30, 14))); tries++) {
                      my += my < CY ? -45 : 45;
                  }
                  // ...and not inside the igloo
                  float mix = (mx - IGLOO_X) / 190f, miy = (my - (IGLOO_Y - 22)) / 70f;
                  if (mix * mix + miy * miy < 1) my = my < IGLOO_Y - 22 ? IGLOO_Y - 100 : IGLOO_Y + 60;
                  leftOne.tx = mx - 30; rightOne.tx = mx + 30;
                  leftOne.ty = rightOne.ty = my;
                  a.chatWith = o; o.chatWith = a;
                  a.chatTalking = o.chatTalking = false;
                  a.arrived = o.arrived = false;
                  a.chatT = o.chatT = 0;
                  a.wait = o.wait = 0;
              }

              void leaveGroup(AppPeng a) {
                  a.joinOf = null;
                  a.chatTalking = false;
                  a.speaking = false;
                  a.bubble = null;
                  a.tx = a.hx + (rnd.nextFloat() - 0.5f) * 60;
                  a.ty = a.hy + (rnd.nextFloat() - 0.5f) * 40;
                  a.wait = 0;
              }

              void endChat(AppPeng a) {
                  AppPeng o = a.chatWith;
                  AppPeng[] both = o != null ? new AppPeng[]{a, o} : new AppPeng[]{a};
                  for (AppPeng q : both) {
                      q.chatWith = null;
                      q.chatTalking = q.speaking = q.arrived = false;
                      q.bubble = null;
                      q.tx = q.hx + (rnd.nextFloat() - 0.5f) * 60;
                      q.ty = q.hy + (rnd.nextFloat() - 0.5f) * 40;
                      q.wait = 0;
                  }
              }

              /** The top of flame i tears off: a lick of flame floats up, and now and then a burnt flake with it. */
              void breakFlameTip(int i) {
                  float base = 250 * (1 - Math.abs(i - 5) / 7f);
                  float lean = fireLean * (0.6f + 0.4f * (1 - Math.abs(i - 5) / 5f));
                  float tx = 640 + (i - 5) * FSP + lean, ty = 596 - base * flameH[i] * 0.95f;
                  for (int k = 0; k < lickX.length; k++) {
                      if (lickLife[k] > 0) continue;
                      lickX[k] = tx; lickY[k] = ty;
                      lickSize[k] = 6 + rnd.nextFloat() * 7;
                      lickShape[k] = rnd.nextFloat();
                      lickMax[k] = lickLife[k] = 0.35f + rnd.nextFloat() * 0.35f;
                      break;
                  }
                  if (rnd.nextFloat() < 0.12f) {
                      for (int k = 0; k < ashX.length; k++) {
                          if (ashLife[k] > 0) continue;
                          ashX[k] = tx; ashY[k] = ty + 6;
                          ashVX[k] = (rnd.nextFloat() - 0.5f) * 40; ashVY[k] = -45 - rnd.nextFloat() * 40;
                          ashRot[k] = rnd.nextFloat() * 360; ashSpin[k] = (rnd.nextFloat() - 0.5f) * 260;
                          ashMax[k] = ashLife[k] = 1.6f + rnd.nextFloat() * 1.4f;
                          ashSize[k] = 6 + rnd.nextFloat() * 6;
                          ashSeed[k] = rnd.nextFloat();
                          break;
                      }
                  }
              }

              void updateFire(float dt) {
                  fireHintT += dt;
                  // whole-fire sway, slow and gentle
                  fireLean = (float) Math.sin(time * 1.3f) * 9 + (float) Math.sin(time * 2.9f + 1) * 5;
                  // each flame picks a new height every so often and eases toward it; middle flames reach higher
                  // Each flame climbs on its own, and when it reaches its peak the tip tears off and floats away
                  // (a lick of flame, sometimes a burnt flake), and the flame drops back and climbs again.
                  // Every flame is at a different point in that cycle, so the fire never swells as one.
                  for (int i = 0; i < 11; i++) {
                      float centre = 1 - Math.abs(i - 5) / 5f;
                      if (flamePeak[i] <= 0) { flamePeak[i] = (0.72f + 0.33f * centre) * (0.85f + rnd.nextFloat() * 0.35f); flameGrow[i] = 0.22f + rnd.nextFloat() * 0.25f; }
                      if (flameDropTo[i] > 0) {
                          // settling back down after its tip broke off: a smooth ease, not a snap
                          flameBase[i] += (flameDropTo[i] - flameBase[i]) * Math.min(1, dt * 5);
                          if (Math.abs(flameBase[i] - flameDropTo[i]) < 0.01f) flameDropTo[i] = 0;
                      } else {
                          flameBase[i] += flameGrow[i] * dt;
                          if (flameBase[i] >= flamePeak[i]) {
                              if (rnd.nextFloat() < 0.6f) breakFlameTip(i);
                              flameDropTo[i] = flameBase[i] * (0.78f + rnd.nextFloat() * 0.1f);
                              flamePeak[i] = (0.72f + 0.33f * centre) * (0.85f + rnd.nextFloat() * 0.35f);
                              flameGrow[i] = 0.22f + rnd.nextFloat() * 0.25f;
                          }
                      }
                      // small, quick wobble on top
                      flameT[i] -= dt;
                      if (flameT[i] <= 0) {
                          flameTarget[i] = 0.94f + rnd.nextFloat() * 0.12f;
                          flameT[i] = 0.05f + rnd.nextFloat() * 0.14f;
                      }
                      flameChar[i] += (flameTarget[i] - flameChar[i]) * Math.min(1, dt * 16f);
                      flameH[i] = flameBase[i] * flameChar[i];
                  }
                  // burnt flakes: lift, tumble, crumple and crumble away
                  for (int k = 0; k < ashX.length; k++) {
                      if (ashLife[k] <= 0) continue;
                      ashLife[k] -= dt;
                      ashVY[k] -= 12 * dt;
                      ashVX[k] += ((640 - ashX[k]) * 0.25f + (float) Math.sin(time * 3 + ashSeed[k] * 5) * 30) * dt;
                      ashX[k] += ashVX[k] * dt;
                      ashY[k] += ashVY[k] * dt;
                      ashRot[k] += ashSpin[k] * dt;
                      if (ashY[k] < 300) ashLife[k] -= dt * 3;
                  }
                  updateFireEzio(dt);
                  // flame licks: spawn near the flame tips, rise and shrink
                  for (int k = 0; k < lickX.length; k++) {
                      if (lickLife[k] > 0) {
                          lickLife[k] -= dt;
                          lickY[k] -= (70 + lickSize[k] * 3) * dt;
                          lickX[k] += (float) Math.sin(time * 6 + k) * 18 * dt;
                      } else if (rnd.nextFloat() < dt * 0.22f) {
                          // break off the tip of one of the flames, right where it is this moment
                          int i = 2 + rnd.nextInt(7);
                          float base = 250 * (1 - Math.abs(i - 5) / 7f);
                          float n = flameH[i];
                          float lean = fireLean * (0.6f + 0.4f * (1 - Math.abs(i - 5) / 5f));
                          lickX[k] = 640 + (i - 5) * FSP + lean;
                          lickY[k] = 596 - base * n * 0.92f;
                          lickSize[k] = 4 + rnd.nextFloat() * 6;
                          lickShape[k] = rnd.nextFloat();
                          lickMax[k] = lickLife[k] = 0.3f + rnd.nextFloat() * 0.35f;
                      }
                  }
                  // A few stray sparks drifting up
                  if (rnd.nextFloat() < dt * 2.5f) spark(640 + (rnd.nextFloat() - 0.5f) * 220, 560, false);
                  // Every so often a log pops: a quick snappy burst of sparks
                  if (rnd.nextFloat() < dt * 0.5f) {
                      float x = 640 + (rnd.nextFloat() - 0.5f) * 180;
                      int count = 6 + rnd.nextInt(12);
                      for (int i = 0; i < count; i++) spark(x, 572, true);
                  }
                  // Smoke: wide and soft down by the fire, narrowing to a point as it's drawn up the chimney
                  if (rnd.nextFloat() < dt * 3f) {
                      Part q = part(640 + (rnd.nextFloat() - 0.5f) * 240, 540 + rnd.nextFloat() * 40, false);
                      q.vx = 0; q.vy = -40 - rnd.nextFloat() * 14;
                      q.max = q.life = 6f; q.size = 34 + rnd.nextFloat() * 14; q.grow = 1f;
                      q.color = 0xff736b66;      // mid grey: clean-burning, but you can see it
                      q.seed = rnd.nextFloat() * 6.28f;
                      q.flue = true; q.flueX = 640; q.flueTop = 290;
                  }
                  // Bigger embers breaking off the flames: some rise away, some just fade, some wander about
                  if (rnd.nextFloat() < dt * 2.2f) {
                      Part q = part(640 + (rnd.nextFloat() - 0.5f) * 160, 420 + rnd.nextFloat() * 80, false);
                      q.size = 4 + rnd.nextFloat() * 5;
                      q.color = rnd.nextBoolean() ? 0xffffa726 : 0xffffcc80;
                      q.seed = rnd.nextFloat() * 6.28f;
                      float kind = rnd.nextFloat();
                      if (kind < 0.35f) {            // rises up the chimney
                          q.vx = (rnd.nextFloat() - 0.5f) * 30; q.vy = -80 - rnd.nextFloat() * 50;
                          q.max = q.life = 2f + rnd.nextFloat() * 1.2f; q.grow = -1.2f;
                          q.flue = true; q.flueX = 640; q.flueTop = 300;
                      } else if (kind < 0.65f) {     // fades out where it is
                          q.vx = (rnd.nextFloat() - 0.5f) * 16; q.vy = -18 - rnd.nextFloat() * 14;
                          q.max = q.life = 0.5f + rnd.nextFloat() * 0.5f; q.grow = -3f;
                      } else {                       // wanders around, then dies out
                          q.vx = 0; q.vy = -25 - rnd.nextFloat() * 20;
                          q.wander = 40 + rnd.nextFloat() * 50;
                          q.max = q.life = 1.6f + rnd.nextFloat() * 1.4f; q.grow = -1.5f;
                      }
                  }
              }

              // Ezio in the fireplace view: 0 sitting on his bed, 1 asleep on it, 2 on the move, 3 standing about
              static final float FX_BED = 1146;          // bed on the hearth in front of the right pillar (left edge at the middle of its two stones)
              static final float FX_HEARTH_TOP = 610;    // back edge of the hearth's top
              static final float FX_HEARTH_FACE = 654;   // where the top meets the front face
              static final float FX_FLOOR_TOP = 686;     // where the hearth's front meets the snowy floor
              static final float FX_BED_Y = 638;         // where the bed rests on the hearth top
              static final float FX_HEARTH_Y = 636;      // Ezio's feet when he's up on the hearth
              static final float FX_FLOOR_Y = 710;       // Ezio's feet when he's on the floor in front of the hearth
              static final float FX_NOGO_L = 335, FX_NOGO_R = 925;   // in front of the fire: he won't walk on the hearth here
              static final float WALK = 105, RUN = 270, SPRINT = 440;
              static final float FX_SPRAWL_X = 245;      // middle of the stone to the left of the fire opening
              int fxCarry;                               // 0 nothing, 1 sock, 2 toy mouse, 3 feather, 4 ribbon
              float fxY = FX_HEARTH_Y, fxHopT, fxHopFrom, fxHopTo;
              float fxX = FX_BED, fxT;
              int fxState, fxFacing = LEFT, fxNext;
              // the plan he's following: a list of stops {x, level (0 hearth / 1 floor), speed, pause after, jump-to x (or NaN)}
              final ArrayList<float[]> fxPlan = new ArrayList<>();

              void startFireEzio() {
                  fxPresent = ezScene == SCENE_IGLOO;
                  fxX = FX_BED;
                  fxY = FX_HEARTH_Y;
                  fxHopT = 0;
                  fxFacing = LEFT;
                  fxPlan.clear();
                  fxState = ezFollow || rnd.nextBoolean() ? 0 : 1;
                  fxT = 6 + rnd.nextFloat() * 8;
              }

              boolean fxOnHearth() { return fxY < (FX_HEARTH_Y + FX_FLOOR_Y) / 2; }

              void fxHop(boolean up) {
                  fxHopFrom = fxY;
                  fxHopTo = up ? FX_HEARTH_Y : FX_FLOOR_Y;
                  fxHopT = 0.42f;
              }

              void fxStop(float x, int level, float speed, float pause) { fxPlan.add(new float[]{x, level, speed, pause, Float.NaN}); }

              /** A random spot: up on the hearth (either side of the fire, not over the bed) or down on the floor. */
              float[] fxSpot(float hearthChance) {
                  if (rnd.nextFloat() < hearthChance) {
                      float x = rnd.nextBoolean() ? 50 + rnd.nextFloat() * (FX_NOGO_L - 80) : FX_NOGO_R + 30 + rnd.nextFloat() * 110;
                      return new float[]{x, 0};
                  }
                  return new float[]{80 + rnd.nextFloat() * 1120, 1};
              }

              /** Picks what he does next: nap in bed, potter about, get the zoomies, or go out and come tearing back. */
              void fxPlanNext() {
                  float r = rnd.nextFloat();
                  boolean inBed = Math.abs(fxX - FX_BED) < 8 && fxOnHearth();
                  if (inBed && r < 0.55f) {
                      // already in bed and fancies staying: sitting there he may curl up; asleep he sleeps on
                      fxState = fxState == 1 || rnd.nextFloat() < 0.6f ? 1 : 0;
                      fxT = fxState == 1 ? 30 + rnd.nextFloat() * 30 : 10 + rnd.nextFloat() * 10;
                      return;
                  }
                  if (r < 0.55f) {
                      // bed: sit and stare, or curl up and sleep
                      fxNext = rnd.nextFloat() < 0.5f ? 0 : 1;
                      fxStop(FX_BED, 0, WALK, -1);
                  } else if (r < 0.65f) {
                      // the Maine Coon sprawl: flops over on his side on the floor, in line with the left of the fireplace
                      fxStop(FX_SPRAWL_X, 1, WALK, -2);
                  } else if (r < 0.80f) {
                      // potter about: a few slow walks, hopping up and down between the hearth and the floor
                      int n = 2 + rnd.nextInt(3);
                      for (int i = 0; i < n; i++) {
                          float[] sp = fxSpot(0.45f);
                          fxStop(sp[0], (int) sp[1], WALK, 1.2f + rnd.nextFloat() * 3);
                      }
                  } else if (r < 0.92f) {
                      // zoomies: tearing back and forth, with the odd leap up onto the hearth
                      int n = 4 + rnd.nextInt(4);
                      for (int i = 0; i < n; i++) {
                          float[] sp = fxSpot(0.25f);
                          fxStop(sp[0], (int) sp[1], RUN, 0.15f + rnd.nextFloat() * 0.5f);
                      }
                  } else {
                      // out of the room and back: walks off one side, then sprints across
                      boolean leftOut = rnd.nextBoolean();
                      float out = leftOut ? -160 : VW + 160, other = leftOut ? VW + 160 : -160;
                      fxStop(out, 1, WALK, 1 + rnd.nextFloat() * 2.5f);
                      // Scooby-Doo style: sometimes he comes back from the side he left by, sometimes the other side
                      boolean same = rnd.nextBoolean();
                      float from = same ? out : other, to = same ? other : out;
                      float[] dash = {to, 1, SPRINT, 0.8f + rnd.nextFloat() * 2, from};
                      fxPlan.add(dash);
                      // now and then he comes tearing through with something in his mouth
                      fxCarry = rnd.nextFloat() < 0.3f ? 1 + rnd.nextInt(4) : 0;
                      if (rnd.nextFloat() < 0.4f) {
                          float[] back = {from, 1, SPRINT, 1 + rnd.nextFloat() * 2, to};
                          fxPlan.add(back);
                      }
                      // then wanders back in
                      float[] sp = fxSpot(0.2f);
                      float[] in = {sp[0], sp[1], WALK, 1.5f + rnd.nextFloat() * 2, rnd.nextBoolean() ? -160 : VW + 160};
                      fxPlan.add(in);
                  }
              }

              boolean fxPresent;

              void updateFireEzio(float dt) {
                  if (ezScene != SCENE_IGLOO) { fxPresent = false; return; }
                  if (!fxPresent) {
                      // he's just come in: trots in from the side and heads for bed
                      fxPresent = true;
                      fxPlan.clear();
                      fxHopT = 0;
                      fxX = rnd.nextBoolean() ? -160 : VW + 160; fxY = FX_FLOOR_Y;
                      fxNext = 1;
                      fxStop(FX_BED, 0, WALK, -1);
                      fxState = 2;
                  }
                  fxT -= dt;
                  if (fxHopT > 0) {
                      // a little hop between the hearth and the floor
                      fxHopT = Math.max(0, fxHopT - dt);
                      float u = 1 - fxHopT / 0.42f;
                      fxY = fxHopFrom + (fxHopTo - fxHopFrom) * u - (float) Math.sin(u * Math.PI) * 34;
                      if (fxHopT <= 0) fxY = fxHopTo;
                      return;
                  }
                  if (fxState == 2 && !fxPlan.isEmpty()) {
                      float[] wp = fxPlan.get(0);
                      if (!Float.isNaN(wp[4])) { fxX = wp[4]; fxY = FX_FLOOR_Y; wp[4] = Float.NaN; }   // pops in from off screen
                      float tx = wp[0];
                      boolean wantHearth = wp[1] == 0, onHearth = fxOnHearth();
                      float speed = wp[2];
                      float goX = tx;
                      if (onHearth) {
                          // up on the hearth he can't cross in front of the fire: walk to the edge of it and hop down
                          boolean leftSide = fxX <= FX_NOGO_L;
                          boolean crosses = leftSide ? tx > FX_NOGO_L : tx < FX_NOGO_R;
                          if (crosses) {
                              goX = leftSide ? FX_NOGO_L : FX_NOGO_R;
                              if (Math.abs(fxX - goX) < 3) { fxX = goX; fxHop(false); return; }
                          } else if (!wantHearth) { fxHop(false); return; }
                      }
                      float d = goX - fxX;
                      if (Math.abs(d) > 3) {
                          fxFacing = d < 0 ? LEFT : RIGHT;
                          fxX += Math.signum(d) * Math.min(Math.abs(d), speed * dt);
                          ezPhase += dt * (speed >= SPRINT ? 14 : speed >= RUN ? 10 : 0);
                          return;
                      }
                      fxX = goX;
                      if (goX != tx) return;
                      if (wantHearth && !onHearth) { fxHop(true); return; }       // hop up right here (always outside the fire)
                      fxPlan.remove(0);
                      if (wp[3] == -2) {
                          // flop over on one side or the other for a good long lounge
                          fxState = 4; fxFacing = rnd.nextBoolean() ? LEFT : RIGHT;
                          fxT = 15 + rnd.nextFloat() * 20;
                          fxPlan.clear();
                          return;
                      }
                      if (Math.abs(fxX - FX_BED) < 4 && wantHearth && wp[3] < 0) {
                          fxState = fxNext; fxFacing = LEFT;
                          fxT = fxState == 1 ? 30 + rnd.nextFloat() * 30 : 10 + rnd.nextFloat() * 10;    // naps last a good while
                          fxPlan.clear();
                          return;
                      }
                      fxState = 3;
                      fxT = Math.max(0.05f, wp[3]);
                      return;
                  }
                  if (fxT > 0) return;
                  int before = fxState;
                  if (fxPlan.isEmpty()) fxPlanNext();
                  if (fxPlan.isEmpty() && fxT > 0 && (fxState == 0 || fxState == 1)) return;     // stayed in bed
                  fxState = 2;
              }

              /** Ezio's bed from the side: a soft round bed with raised bolster edges. front=true draws just the front lip. */
              void drawPetBed(Canvas c, float x, float y, float s, boolean front) {
                  c.save();
                  c.translate(x, y);
                  c.scale(s, s);
                  if (!front) {
                      p.setColor(0x33000000);
                      c.drawOval(-46, -5, 46, 5, p);
                      // back bolster
                      p.setColor(0xff9c3d4a);
                      rf.set(-42, -30, 42, -4);
                      c.drawRoundRect(rf, 13, 13, p);
                      p.setColor(0xffb24a57);
                      rf.set(-40, -30, 40, -18);
                      c.drawRoundRect(rf, 8, 8, p);
                      // inside cushion
                      p.setColor(0xfff1e3d3);
                      rf.set(-30, -18, 30, -6);
                      c.drawRoundRect(rf, 6, 6, p);
                      // side bolsters
                      p.setColor(0xffa8424f);
                      c.drawCircle(-36, -12, 11, p);
                      c.drawCircle(36, -12, 11, p);
                  } else {
                      // front lip (drawn over him when he's in the bed)
                      p.setColor(0xffb24a57);
                      rf.set(-40, -12, 40, 2);
                      c.drawRoundRect(rf, 7, 7, p);
                      p.setColor(0xffc95e6b);
                      rf.set(-38, -12, 38, -7);
                      c.drawRoundRect(rf, 4, 4, p);
                      p.setColor(0xffa8424f);
                      c.drawCircle(-36, -6, 8, p);
                      c.drawCircle(36, -6, 8, p);
                  }
                  c.restore();
              }

              void spark(float x, float y, boolean pop) {
                  Part q = part(x, y, false);
                  if (pop) {
                      // fast and sharp, then quickly slowed by the air: a snap, not a fountain
                      double a = -Math.PI / 2 + (rnd.nextDouble() - 0.5) * 2.2;
                      float sp = 320 + rnd.nextFloat() * 380;
                      q.vx = (float) Math.cos(a) * sp;
                      q.vy = (float) Math.sin(a) * sp;
                      q.g = 140;
                      q.drag = 4.5f;
                      q.max = q.life = rnd.nextFloat() < 0.75f ? 0.35f + rnd.nextFloat() * 0.4f : 1.1f + rnd.nextFloat() * 0.8f;
                      q.size = 1.6f + rnd.nextFloat() * 1.2f;
                  } else {
                      q.vx = (rnd.nextFloat() - 0.5f) * 60;
                      q.vy = -120 - rnd.nextFloat() * 160;
                      q.g = 20;
                      q.max = q.life = 1.2f + rnd.nextFloat() * 1.5f;
                      q.size = 1.4f + rnd.nextFloat() * 1.4f;
                      q.flue = true; q.flueX = 640; q.flueTop = 300;
                  }
                  q.color = rnd.nextBoolean() ? 0xffffe082 : 0xffffab40;
              }

              List<AppPeng> pickList;

              /**
               * What you'd use if you pressed OK on the island: an app penguin, a chair, or a thing ("cd", "door", "ezio").
               * Things in front of you win over things beside or behind you, so facing something picks it.
               */
              Object pickIsland(List<AppPeng> list) {
                  if (list != null) pickList = list; else list = pickList;
                  Object best = null;
                  float bs = Float.MAX_VALUE;
                  if (list != null) for (AppPeng a : list) {
                      float sc = pickScore(a.x, a.y, NEAR_DIST);
                      if (sc < bs) { bs = sc; best = a; }
                  }
                  for (Chair c : chairs) {
                      float sc = pickScore(c.x, c.y + 12, 75);
                      if (sc < bs) { bs = sc; best = c; }
                  }
                  float sc = pickScore(CD_X, CD_Y, 70);
                  if (sc < bs) { bs = sc; best = "cd"; }
                  sc = pickScore(DOOR_X, DOOR_Y + 20, 70);
                  if (sc < bs) { bs = sc; best = "door"; }
                  if (ezScene == SCENE_ISLAND) {
                      sc = pickScore(ezX, ezY, 62);
                      if (sc < bs) { bs = sc; best = "ezio"; }
                  }
                  return best;
              }

              /** Distance to something, made bigger when it's off to the side or behind you. MAX_VALUE if out of reach. */
              float pickScore(float tx, float ty, float reach) {
                  float dx = tx - px, dy = ty - py;
                  float d = (float) Math.sqrt(dx * dx + dy * dy);
                  if (d >= reach) return Float.MAX_VALUE;
                  if (d < 1) return 0;
                  float fx = facing == LEFT ? -1 : facing == RIGHT ? 1 : 0;
                  float fy = facing == UP ? -1 : facing == DOWN ? 1 : 0;
                  float cos = (dx * fx + dy * fy) / d;
                  return d * (1.7f - 0.7f * cos);
              }

              Object nearestTarget(List<AppPeng> list) {
                  Object o = pickIsland(list);
                  return o instanceof String ? null : o;
              }

              float ballZ(Ball b) {
                  float u = b.t / b.dur;
                  return 30 * (1 - u) + 4 * 45 * u * (1 - u);
              }

              void throwBall(boolean fromPlayer, AppPeng owner, float x, float y, int face) {
                  Ball b = new Ball();
                  float dx = face == LEFT ? -1 : face == RIGHT ? 1 : 0;
                  float dy = face == UP ? -1 : face == DOWN ? 1 : 0;
                  if (!fromPlayer) {
                      float ddx = px - x, ddy = py - y;
                      float d = (float) Math.max(1, Math.sqrt(ddx * ddx + ddy * ddy));
                      dx = ddx / d; dy = ddy / d;
                  }
                  b.x = x + dx * 20;
                  b.y = y + dy * 10;
                  b.vx = dx * 520;
                  b.vy = dy * 520;
                  b.dur = 0.75f;
                  b.fromPlayer = fromPlayer;
                  b.owner = owner;
                  balls.add(b);
                  if (!fromPlayer) playAt(S_WHOOSH, 0.22f, 1f, x, y);
                  else if (ezFollow && ezScene == SCENE_ISLAND && !ezFetch) {
                      // Ezio chases your snowball to where it lands, then comes back to you
                      float lx = b.x + b.vx * b.dur, ly = b.y + b.vy * b.dur;
                      float ex = (lx - CX) / (RX - 60), ey = (ly - CY) / (RY - 60);
                      float e = ex * ex + ey * ey;
                      if (e > 1) { float k = (float) (1 / Math.sqrt(e)); lx = CX + (lx - CX) * k; ly = CY + (ly - CY) * k; }
                      ezFetch = true; ezFetchX = lx; ezFetchY = ly; ezFetchWait = -1;
                      ezSleeping = false;
                  }
              }

              int faceToward(float x, float y, float tx, float ty) {
                  float dx = tx - x, dy = ty - y;
                  return Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? LEFT : RIGHT) : (dy < 0 ? UP : DOWN);
              }

              static float dist2(float x1, float y1, float x2, float y2) {
                  float dx = x1 - x2, dy = y1 - y2;
                  return dx * dx + dy * dy;
              }

              AppPeng nearestApp(List<AppPeng> list) {
                  AppPeng best = null;
                  float bd = NEAR_DIST * NEAR_DIST;
                  for (AppPeng a : list) {
                      float d = dist2(a.x, a.y, px, py);
                      if (d < bd) { bd = d; best = a; }
                  }
                  return best;
              }

              /** Non-penguin things you can use: the igloo door outside, furniture inside. */
              String nearObject() {
                  if (scene == SCENE_ISLAND) {
                      Object o = pickIsland(null);
                      return o instanceof String ? (String) o : null;
                  }
                  if (py > 615 && Math.abs(px - 640) < 75 && facing == DOWN) return "exit";
                  if (ezScene == SCENE_IGLOO && pickScore(ezX, ezY, 62) < 62) return "ezio";
                  if (py > 615 && Math.abs(px - 640) < 75) return "exit";
                  if (px < 400 && py < 520) return "tv";
                  if (px > 880 && py < 520) return "shelf";
                  if (Math.abs(px - 640) < 140 && py < 470) return "fire";
                  return null;
              }

              String objectLabel(String o) {
                  switch (o) {
                      case "door": return null;
                      case "exit": return null;
                      case "tv": return emulatorApp() != null ? null : "Press OK for TV Settings";
                      case "shelf": return "Press OK for Island settings";
                      case "fire": return "Press OK to sit by the fire";
                      case "cd": return null;
                      default: return null;
                  }
              }

              // ================================================================== key handling

              void handleKey(int code, boolean repeat, List<AppPeng> list) {
                  if (pendingScene >= 0) return;
                  boolean ok = code == KeyEvent.KEYCODE_DPAD_CENTER || code == KeyEvent.KEYCODE_ENTER
                          || code == KeyEvent.KEYCODE_NUMPAD_ENTER || code == KeyEvent.KEYCODE_BUTTON_A;
                  boolean back = code == KeyEvent.KEYCODE_BACK || code == KeyEvent.KEYCODE_BUTTON_B;
                  boolean menu = code == KeyEvent.KEYCODE_INFO || code == KeyEvent.KEYCODE_MENU
                          || code == KeyEvent.KEYCODE_GUIDE || code == KeyEvent.KEYCODE_BUTTON_Y
                          || code == KeyEvent.KEYCODE_BUTTON_START;
                  idleT = 0;
                  afkT = 0;
                  if (freeCam && (ok || back || menu) && !repeat) { freeCam = false; play(S_TICK, 0.3f, 1f); return; }
                  if (pEmote == E_NAP || pEmote == E_SIT || pEmote == E_LOOK) {
                      if (overlay == OV_NONE) pEmote = E_NONE;
                  }

                  if (overlay == OV_WHEEL) {
                      if (back || menu) { overlay = OV_NONE; play(S_TICK, 0.4f, 0.8f); return; }
                      if (code == KeyEvent.KEYCODE_DPAD_RIGHT || code == KeyEvent.KEYCODE_DPAD_DOWN) {
                          wheelSel = (wheelSel + 1) % WN; play(S_TICK, 0.4f, 1f);
                      } else if (code == KeyEvent.KEYCODE_DPAD_LEFT || code == KeyEvent.KEYCODE_DPAD_UP) {
                          wheelSel = (wheelSel + WN - 1) % WN; play(S_TICK, 0.4f, 1f);
                      } else if (ok) {
                          overlay = OV_NONE;
                          wheelAction(wheelSel);
                      }
                      return;
                  }
                  if (overlay == OV_FOLDER) {
                      if (folderClosing) return;
                      int n = discs.size();
                      if (back) { closeFolder(nowDisc != null ? this::openPlayer : null); return; }
                      int total = folderSlots();
                      folderSel = Math.max(0, Math.min(total - 1, folderSel));
                      int page = folderSel / 8, slot = folderSel % 8;
                      int col = (slot % 4) % 2 + (slot >= 4 ? 2 : 0), row = (slot % 4) / 2;
                      int target = -1;
                      if (code == KeyEvent.KEYCODE_DPAD_RIGHT) target = col < 3 ? slotIndex(page, col + 1, row) : slotIndex(page + 1, 0, row);
                      else if (code == KeyEvent.KEYCODE_DPAD_LEFT) target = col > 0 ? slotIndex(page, col - 1, row) : (page > 0 ? slotIndex(page - 1, 3, row) : -1);
                      else if (code == KeyEvent.KEYCODE_DPAD_DOWN && row == 0) target = slotIndex(page, col, 1);
                      else if (code == KeyEvent.KEYCODE_DPAD_UP && row == 1) target = slotIndex(page, col, 0);
                      if (target >= 0 && target < total && target != folderSel) {
                          boolean flip = target / 8 != page;
                          if (flip) { flipFrom = page; flipDir = target / 8 > page ? 1 : -1; flipT = 0.001f; }
                          folderSel = target;
                          play(flip ? S_WHOOSH : S_TICK, flip ? 0.35f : 0.35f, flip ? 1.6f : 1.05f);
                          return;
                      }
                      if (folderSel >= n) {
                          if (ok && !repeat) play(S_TICK, 0.3f, 0.7f);   // empty sleeve
                          return;
                      }
                      if (ok && !repeat) {
                          final Disc d = discs.get(folderSel);
                          play(S_OPEN, 0.45f, 1f);
                          closeFolder(() -> playDisc(d, -1));
                          return;
                      }
                      if (menu) { openDiscMenu(discs.get(folderSel)); return; }
                      return;
                  }
                  if (overlay == OV_PLAYER) {
                      if (back || menu) { overlay = OV_NONE; play(S_TICK, 0.4f, 0.8f); return; }
                      // The volume slider stands on the left: Left from the first button reaches it, Up/Down set it, Right goes back
                      if (playerRow == 1) {
                          if (code == KeyEvent.KEYCODE_DPAD_UP || code == KeyEvent.KEYCODE_DPAD_DOWN) {
                              // 1% a press; hold it down and it speeds up
                              if (!repeat) volHoldAt = time;
                              float held = repeat ? time - volHoldAt : 0;
                              float step = held < 0.7f ? 0.01f : held < 1.6f ? 0.02f : 0.05f;
                              int before = Math.round(cdVolume * 100);
                              setCdVolume(cdVolume + (code == KeyEvent.KEYCODE_DPAD_UP ? step : -step));
                              int after = Math.round(cdVolume * 100);
                              if (!repeat || before / 10 != after / 10) play(S_TICK, 0.3f * cdVolume + 0.05f, 0.8f + cdVolume * 0.6f);
                          } else if (code == KeyEvent.KEYCODE_DPAD_RIGHT) { playerRow = 0; playerSel = 0; play(S_TICK, 0.35f, 1.1f); }
                          return;
                      }
                      if (code == KeyEvent.KEYCODE_DPAD_LEFT && playerSel == 0) { playerRow = 1; play(S_TICK, 0.35f, 0.9f); return; }
                      if (code == KeyEvent.KEYCODE_DPAD_RIGHT) { playerSel = Math.min(PLAYER_BTNS.length - 1, playerSel + 1); play(S_TICK, 0.35f, 1f); }
                      else if (code == KeyEvent.KEYCODE_DPAD_LEFT) { playerSel = Math.max(0, playerSel - 1); play(S_TICK, 0.35f, 1f); }
                      else if (ok && !repeat) {
                          switch (playerSel) {
                              case 0: stopRadio(); overlay = OV_NONE; play(S_TOGGLE, 0.45f, 0.7f); break;
                              case 1: radioSkip(-1); break;
                              case 2: radioToggle(); break;
                              case 3: radioSkip(1); break;
                              case 4: setShuffle(!shuffleOn); break;
                              case 5: if (nowDisc != null) openSongList(nowDisc, () -> { overlay = OV_PLAYER; }); break;
                              case 6: overlay = OV_NONE; openFolder(); break;
                          }
                          if (nowDisc == null && overlay == OV_PLAYER) overlay = OV_NONE;
                      }
                      return;
                  }
                  if (overlay == OV_LIST) {
                      if (back) {
                          play(S_TICK, 0.4f, 0.8f);
                          if (listOnBack != null) listOnBack.run(); else overlay = OV_NONE;
                          return;
                      }
                      if (code == KeyEvent.KEYCODE_DPAD_DOWN) { listSel = Math.min(listItems.size() - 1, listSel + 1); play(S_TICK, 0.3f, 1f); }
                      else if (code == KeyEvent.KEYCODE_DPAD_UP) { listSel = Math.max(0, listSel - 1); play(S_TICK, 0.3f, 1f); }
                      else if (ok && !repeat && listSel < listItems.size()) {
                          Runnable r = listItems.get(listSel).action;
                          if (r != null) r.run();
                      }
                      return;
                  }

                  if (scene == SCENE_FIRE) {
                      if (back || ok) goScene(SCENE_IGLOO);
                      return;
                  }
                  if (launching != null || sittingChair != null) return;
                  if (back) {
                      if (scene == SCENE_IGLOO) { goScene(SCENE_ISLAND); return; }
                      runOnUiThread(this::finish);
                      return;
                  }
                  if (menu) { openWheel(); return; }
                  if (code == KeyEvent.KEYCODE_BUTTON_X) { doSnowball(); return; }
                  if (code == KeyEvent.KEYCODE_BUTTON_L1) { startEmote(E_WAVE, 1.8f); return; }
                  if (code == KeyEvent.KEYCODE_BUTTON_R1) { startEmote(E_DANCE, 3.2f); return; }
                  if (ok) {
                      if (scene == SCENE_ISLAND) {
                          Object tgt = nearestTarget(list);
                          if (tgt instanceof AppPeng) {
                              launching = (AppPeng) tgt; launchT = 0;
                              pEmote = E_NONE;
                              play(S_OPEN, 0.5f, 1f);
                              return;
                          }
                          if (tgt instanceof Chair) {
                              Chair ch = (Chair) tgt;
                              sittingChair = ch;
                              chairT = 0;
                              px = ch.x; py = ch.y + 1; facing = DOWN;
                              pEmote = E_SIT; pEmoteT = 0; pEmoteDur = 0;
                              play(S_OPEN, 0.5f, 0.85f);
                              return;
                          }
                      }
                      String o = nearObject();
                      if (o != null) { useObject(o); return; }
                      if (pHasBall && scene == SCENE_ISLAND) { pHasBall = false; startEmote(E_THROW, 0.45f); return; }   // the one Ezio brought back
                      // OK in open space does nothing; the (i) / Info button opens the wheel
                  }
              }

              void openWheel() {
                  overlay = OV_WHEEL;
                  pEmote = E_NONE;
                  play(S_TICK, 0.45f, 1.2f);
              }

              void wheelAction(int i) {
                  switch (i) {
                      case 0: startEmote(E_WAVE, 1.8f); break;
                      case 1: startEmote(E_DANCE, 3.2f); break;
                      case 2: doHug(); break;
                      case 3: doSnowball(); break;
                      case 4: startEmote(E_SLIDE, 1.1f); break;
                      case 5:
                          if (nowDisc != null) openPlayer();
                          else toast("No disc playing. Walk over to the boombox to put one on.");
                          break;
                      case 6: toggleEzio(); break;
                      case 7: blowWhistle(); break;
                      case 8: openAppsList(null); break;
                      case 9: openSettings(); break;
                      case 10: setMusic(!musicOn); break;
                      case 11: startEmote(E_SCRATCH, 1.5f + rnd.nextFloat() * 2.5f); break;
                      case 12: startFreeCam(); break;
                  }
              }

              // free camera: look around the island without moving your penguin
              volatile boolean freeCam;
              volatile float fcX, fcY;
              float tpLastX, tpLastY;
              long tpLastT;

              void startFreeCam() {
                  if (scene != SCENE_ISLAND) { toast("Look around works out on the island"); return; }
                  if (!freeCam) { fcX = px; fcY = py - 40; }
                  freeCam = true;
                  toast("Looking around: move to pan · OK or Back to return");
              }

              void clampFreeCam() {
                  fcX = Math.max(VW / 2f, Math.min(WW - VW / 2f, fcX));
                  fcY = Math.max(VH / 2f, Math.min(WH - VH / 2f, fcY));
              }

              /** Two penguins step in and hug. */
              /**
               * Blow the whistle: every penguin rushes over and stands in a loose circle around you for
               * a few seconds, so you can pick one; then they all go back to what they were doing.
               */
              void blowWhistle() {
                  if (scene != SCENE_ISLAND) { toast("The penguins can't hear you in here"); return; }
                  List<AppPeng> list = apps;
                  int n = list.size();
                  if (n == 0) return;
                  play(S_WHISTLE, 0.55f, 1f);
                  rallyT = 9f;
                  rallyFormT = 12f;
                  petEv = null;
                  float rx = Math.max(210, n * 15), ry = rx * 0.6f;
                  for (int k = 0; k < n; k++) {
                      AppPeng a = list.get(k);
                      if (a.chatWith != null) endChat(a);
                      if (a.joinOf != null) leaveGroup(a);
                      a.hugWalk = false;
                      double ang = Math.PI * 2 * k / n - Math.PI / 2;
                      float gx = px + (float) Math.cos(ang) * rx, gy = py + (float) Math.sin(ang) * ry;
                      float ex = (gx - CX) / (RX - 50), ey = (gy - CY) / (RY - 45);
                      float e = ex * ex + ey * ey;
                      if (e > 1) { float kk = (float) (1 / Math.sqrt(e)); gx = CX + (gx - CX) * kk; gy = CY + (gy - CY) * kk; }
                      float ix = (gx - IGLOO_X) / 150f, iy = (gy - (IGLOO_Y - 22)) / 50f;
                      if (ix * ix + iy * iy < 1) gy = gy < IGLOO_Y - 22 ? IGLOO_Y - 85 : IGLOO_Y + 45;
                      a.rallyX = gx; a.rallyY = gy;
                      a.emote = E_NONE;
                      a.spreeT = 0;
                      a.hangout = false;
                      a.ev = null;
                  }
              }

              void hugPair(AppPeng a, AppPeng o) {
                  AppPeng l = a.x <= o.x ? a : o, r = l == a ? o : a;
                  float mx = (l.x + r.x) / 2, my = (l.y + r.y) / 2;
                  l.hugX = mx - 19; r.hugX = mx + 19;
                  l.hugY = r.hugY = my;
                  l.facing = RIGHT; r.facing = LEFT;
                  a.speaking = o.speaking = false;
                  a.bubble = o.bubble = null;
                  npcEmote(l, E_HUG, 2.4f, 0);
                  npcEmote(r, E_HUG, 2.4f, 0);
                  endChatAfterHug(a);
              }

              void endChatAfterHug(AppPeng a) {
                  AppPeng o = a.chatWith;
                  a.chatWith = null; a.chatTalking = false; a.arrived = false;
                  if (o != null) { o.chatWith = null; o.chatTalking = false; o.arrived = false; o.speaking = false; o.bubble = null; }
                  for (AppPeng q : new AppPeng[]{a, o}) {
                      if (q == null) continue;
                      q.tx = q.hx + (rnd.nextFloat() - 0.5f) * 60;
                      q.ty = q.hy + (rnd.nextFloat() - 0.5f) * 40;
                      q.wait = 1.5f;
                  }
              }

              /** You hug the nearest penguin. */
              void doHug() {
                  if (scene != SCENE_ISLAND) return;
                  AppPeng best = null;
                  float bd = 170 * 170;
                  for (AppPeng a : apps) {
                      float d = dist2(a.x, a.y, px, py);
                      if (d < bd) { bd = d; best = a; }
                  }
                  if (best == null) { toast("Walk up to a penguin first, then hug"); return; }
                  if (best.chatWith != null) endChat(best);
                  // They waddle over to you, then the hug starts
                  boolean onRight = best.x >= px;
                  facing = onRight ? RIGHT : LEFT;
                  best.hugX = px + (onRight ? 40 : -40);
                  best.hugY = py;
                  best.hugWalk = true;
                  best.emote = E_NONE;
                  play(S_CHIRP, 0.2f, 1.05f);
              }

              void spawnHeart(float x, float y) {
                  Part q = part(x + (rnd.nextFloat() - 0.5f) * 16, y, true);
                  q.vx = (rnd.nextFloat() - 0.5f) * 20;
                  q.vy = -40;
                  q.max = q.life = 1.3f;
                  q.glyph = "♥";
                  q.size = 18 + rnd.nextFloat() * 6;
                  q.color = rnd.nextBoolean() ? 0xffe91e63 : 0xffff80ab;
              }

              void doSnowball() {
                  if (scene != SCENE_ISLAND) return;
                  startEmote(E_THROW, 0.45f);
              }

              void useObject(String o) {
                  switch (o) {
                      case "door": play(S_DOOR, 0.5f, 1f); goScene(SCENE_IGLOO); break;
                      case "exit": play(S_DOOR, 0.5f, 0.9f); goScene(SCENE_ISLAND); break;
                      case "tv": {
                          play(S_OPEN, 0.5f, 0.9f);
                          AppPeng emu = emulatorApp();
                          if (emu != null && emu.intent != null) { emu.launches++; startIntent(emu.intent, emu.label); }
                          else startIntent(new Intent(Settings.ACTION_SETTINGS), "Settings");
                          break;
                      }
                      case "shelf": openSettings(); break;
                      case "fire": play(S_DOOR, 0.3f, 1.3f); goScene(SCENE_FIRE); break;
                      case "ezio": petEzio(); break;
                      case "cd":
                          facing = faceToward(px, py, CD_X, CD_Y);
                          if (nowDisc != null) openPlayer(); else openFolder();
                          break;
                  }
              }

              void goScene(int s) {
                  pendingScene = s;
                  fadingOut = true;
                  pEmote = E_NONE;
              }

              void enterScene(int s) {
                  parts.clear();
                  lastCamX = -1;
                  if (s == SCENE_FIRE) {
                      fireHintT = 0;
                      startFireEzio();
                      parts.clear();
                      startCrackle();
                  } else if (s == SCENE_IGLOO) {
                      if (scene == SCENE_FIRE) {
                          stopCrackle();
                          parts.clear();
                          px = 640; py = 455; facing = UP;
                          pEmote = E_SIT; pEmoteT = 0; pEmoteDur = 0;
                      } else {
                          islandX = px; islandY = py;
                          px = 640; py = 640; facing = UP;
                      }
                  } else {
                      px = DOOR_X; py = DOOR_Y + 40; facing = DOWN;
                  }
                  int from = scene;
                  scene = s;
                  lastNearKey = "";
                  ezioSceneChange(from, s);
              }

              // ================================================================== Ezio the cat

              /** The scene Ezio cares about: the fullscreen fire counts as being inside the igloo. */
              int ezPlayerScene() {
                  return scene == SCENE_FIRE ? SCENE_IGLOO : scene;
              }

              void ezioSceneChange(int from, int to) {
                  int pf = from == SCENE_FIRE ? SCENE_IGLOO : from, pt = to == SCENE_FIRE ? SCENE_IGLOO : to;
                  if (pf == pt) return;
                  if (ezFollow) {
                      // He comes along, right behind you
                      ezScene = pt;
                      if (pt == SCENE_IGLOO) { ezX = 600; ezY = 660; } else { ezX = DOOR_X - 40; ezY = DOOR_Y + 60; }
                      ezTX = ezX; ezTY = ezY;
                      ezSleeping = false;
                      ezFetch = false;
                      return;
                  }
                  if (pt == SCENE_IGLOO && ezScene == SCENE_ISLAND) {
                      // Maybe he'll wander in after a while
                      ezVisitT = rnd.nextFloat() < 0.5f ? 15 + rnd.nextFloat() * 30 : -1;
                  } else if (pt == SCENE_ISLAND && ezScene == SCENE_IGLOO) {
                      // He stays by the fire for a bit, then comes back out
                      ezReturnT = 10 + rnd.nextFloat() * 20;
                  }
              }

              void toggleEzio() {
                  ezFollow = !ezFollow;
                  prefs.edit().putBoolean("ezfollow", ezFollow).apply();
                  int ps = ezPlayerScene();
                  if (ezFollow) {
                      if (ezScene != ps) {
                          // He trots in from nearby
                          ezScene = ps;
                          if (ps == SCENE_IGLOO) { ezX = 640; ezY = 700; }
                          else { ezX = px + (rnd.nextBoolean() ? 380 : -380); ezY = py + 60; }
                      }
                      ezSleeping = false;
                      ezLeaving = false;
                      ezVisiting = false;
                      ezHappyT = 1.2f;
                      play(S_CHIRP, 0.22f, 0.62f);
                      toast("Ezio is following you");
                  } else {
                      ezWait = 1.5f;
                      if (ezScene == SCENE_IGLOO) { ezVisiting = true; ezStayT = 60 + rnd.nextFloat() * 60; }
                      play(S_CHIRP, 0.15f, 0.55f);
                      toast("Ezio wanders off to do cat things");
                  }
              }

              void petEzio() {
                  ezSleeping = false;
                  ezHappyT = 1.6f;
                  facing = ezX < px ? LEFT : RIGHT;
                  float side = ezX < px ? -1 : 1;
                  ezPatX = px + side * 46; ezPatY = py + 3;
                  ezPatByYou = true;
                  ezFacing = side < 0 ? RIGHT : LEFT;
                  startEmote(E_PAT, 1.6f);
                  ezWait = 3;
                  play(S_CHIRP, 0.2f, 0.6f);
                  for (int i = 0; i < 4; i++) spawnHeart(ezX + (rnd.nextFloat() - 0.5f) * 20, ezY - 40);
              }

              void updateEzio(float dt) {
                  int ps = ezPlayerScene();
                  ezWhipT = Math.max(0, ezWhipT - dt);
                  // in the fireplace view the fireplace Ezio is in charge; the room version waits until you leave it
                  if (scene == SCENE_FIRE && ezScene == SCENE_IGLOO) {
                      ezHappyT = Math.max(0, ezHappyT - dt);
                      ezNextBlink -= dt;
                      if (ezNextBlink <= 0) { ezBlinkT = 0.15f; ezNextBlink = 2.5f + rnd.nextFloat() * 4; }
                      ezBlinkT = Math.max(0, ezBlinkT - dt);
                      ezPhase += dt * 2f;
                      return;
                  }
                  ezPhase += dt * (ezMoving ? 13f : 2f);
                  ezHappyT = Math.max(0, ezHappyT - dt);
                  ezNextBlink -= dt;
                  if (ezNextBlink <= 0) { ezBlinkT = 0.15f; ezNextBlink = 2.5f + rnd.nextFloat() * 4; }
                  ezBlinkT = Math.max(0, ezBlinkT - dt);
                  if (ezStareT > 0) {
                      // A slow-blink conversation: one blinks (Ezio one eye then the other), a second later the
                      // other answers; once or twice round
                      ezStareT -= dt;
                      float t = ezStareLen - ezStareT;
                      boolean ezClosed = false;
                      ezEyeLClosed = ezEyeRClosed = false;
                      boolean pgClosed = false;
                      for (int k = 0; k < ezStareSets; k++) {
                          float t0 = 1.0f + k * 2.6f;                       // the opening blink of this round
                          float tEz = ezStareEzFirst ? t0 : t0 + 1.1f;      // Ezio's turn
                          float tPg = ezStareEzFirst ? t0 + 1.1f : t0;      // the penguin's turn
                          float e1 = tEz, e2 = tEz + ezStareGap;            // first eye, then the other
                          boolean firstOpen = !(t > e1 && t < e1 + 0.6f), secondOpen = !(t > e2 && t < e2 + 0.6f);
                          if (ezStareLFirst) { ezEyeLClosed |= !firstOpen; ezEyeRClosed |= !secondOpen; }
                          else { ezEyeRClosed |= !firstOpen; ezEyeLClosed |= !secondOpen; }
                          pgClosed |= t > tPg && t < tPg + 0.6f;
                      }
                      ezNextBlink = Math.max(ezNextBlink, 1f);
                      if (ezClosed) ezBlinkT = 0.05f;
                      AppPeng a = ezStarePeng;
                      if (a != null) {
                          a.facing = faceToward(a.x, a.y, ezX, ezY);
                          a.nextBlink = Math.max(a.nextBlink, 1f);
                          if (pgClosed) a.blinkT = 0.05f;
                          a.wait = Math.max(a.wait, 0.5f);
                      }
                      if (ezStareT <= 0) { ezStarePeng = null; ezEyeLClosed = ezEyeRClosed = false; }
                  }

                  if (ezScene != ps) {
                      // Off-screen: he might show up in your scene
                      if (ps == SCENE_IGLOO && ezVisitT > 0) {
                          ezVisitT -= dt;
                          if (ezVisitT <= 0) {
                              ezScene = SCENE_IGLOO; ezX = 640; ezY = 705;
                              ezVisiting = true; ezLeaving = false; ezSleeping = false;
                              ezStayT = 45 + rnd.nextFloat() * 55;
                              ezGoBed = true;
                              ezTX = ROOM_BED_X; ezTY = ROOM_BED_Y + 2;
                              ezWait = 0;
                          }
                      } else if (ps == SCENE_ISLAND && ezReturnT > 0) {
                          ezReturnT -= dt;
                          if (ezReturnT <= 0) {
                              ezScene = SCENE_ISLAND; ezX = DOOR_X; ezY = DOOR_Y + 40;
                              ezVisiting = false; ezLeaving = false; ezSleeping = false;
                              ezWait = 0; ezTX = ezX + 80; ezTY = ezY + 60;
                          }
                      }
                      ezMoving = false;
                      return;
                  }

                  boolean inside = ezScene == SCENE_IGLOO;
                  // Stuck? (trying to walk but not getting anywhere, e.g. pushing against the igloo wall)
                  // After a second and a half of that he steps off sideways and, if roaming, picks somewhere else to go.
                  if (ezBlocked) ezStuckT += dt; else ezStuckT = 0;
                  ezBlocked = false;
                  if (ezStuckT > 1.5f) {
                      ezStuckT = 0;
                      float side = rnd.nextBoolean() ? 1 : -1;
                      ezDetourX = -ezLastUY * side; ezDetourY = ezLastUX * side;
                      if (ezDetourX == 0 && ezDetourY == 0) ezDetourX = side;
                      ezDetourT = 0.8f + rnd.nextFloat() * 0.6f;
                      if (!ezFollow) { ezPeng = null; ezRun = false; ezGoBed = false; pickEzRoam(inside); }
                  }
                  ezMoving = false;
                  if (ezDetourT > 0) {
                      ezDetourT -= dt;
                      ezStep(ezDetourX, ezDetourY, 110 * dt, inside);
                      return;
                  }
                  ezNapCool = Math.max(0, ezNapCool - dt);
                  if (ezHappyT <= 0) { ezPatPeng = null; ezPatPeng2 = null; ezPatByYou = false; }
                  if (ezHappyT > 0 && (ezPatPeng != null || ezPatByYou)) {
                      // being patted: slide into place beside them, facing them, and stay put until it's done
                      float dx = ezPatX - ezX, dy = ezPatY - ezY, d = (float) Math.sqrt(dx * dx + dy * dy);
                      if (d > 1) { float st = Math.min(d, 220 * dt); ezX += dx / d * st; ezY += dy / d * st; }
                      if (ezPatPeng2 == null) {
                          float lookX = ezPatByYou ? px : ezPatPeng.x;
                          ezFacing = lookX < ezX ? LEFT : RIGHT;
                      }
                      ezMoving = false;
                      return;
                  }
                  if (!ezFollow && ezTail != null && (ezHappyT > 0 || ezPatPeng != null)) ezTail = null;    // one thing at a time
                  if (!ezFollow && ezTail != null) {
                      ezTailT -= dt;
                      AppPeng a = ezTail;
                      if (ezTailT <= 0 || a.chatWith != null || a.joinOf != null || !apps.contains(a)) { ezTail = null; ezWait = 1 + rnd.nextFloat(); return; }
                      if (ezTailStare) {
                          // "what are you looking at?" "what are YOU looking at?"
                          ezFacing = a.x < ezX ? LEFT : RIGHT;
                          return;
                      }
                      // trot along behind it
                      float back = a.facing == LEFT ? 48 : a.facing == RIGHT ? -48 : (ezX < a.x ? -40 : 40);
                      float tx = a.x + back, ty = a.y + (a.facing == UP ? 34 : a.facing == DOWN ? -20 : 6);
                      float dx = tx - ezX, dy = ty - ezY, d = (float) Math.sqrt(dx * dx + dy * dy);
                      if (!ezTailGo && d > 40) ezTailGo = true;
                      if (ezTailGo && d < 10) ezTailGo = false;
                      if (ezTailGo) ezStep(dx / d, dy / d, Math.min(d, 95 * dt), false);
                      else ezFacing = a.x < ezX ? LEFT : RIGHT;
                      return;
                  }
                  if (!ezFollow && ezChatA != null && ezChatT > 0) {
                      // watching a conversation: sat in front, looking at whoever's talking
                      AppPeng a = ezChatA, o = a.chatWith;
                      ezChatT -= dt;
                      if (o == null || !a.chatTalking || ezChatT <= 0) { ezChatA = null; ezWait = 1 + rnd.nextFloat(); return; }
                      float sx = (a.x + o.x) / 2, sy = (a.y + o.y) / 2 + 36;
                      for (AppPeng q : apps) if ((q.joinOf == a || q.joinOf == o) && q.joinSlot == 1) sy += 30;
                      float dx = sx - ezX, dy = sy - ezY, d = (float) Math.sqrt(dx * dx + dy * dy);
                      if (d > 3) { ezStep(dx / d, dy / d, Math.min(d, 90 * dt), false); return; }
                      AppPeng talker = a.speaking ? a : o.speaking ? o : null;
                      if (talker != null) ezFacing = talker.x < ezX ? LEFT : RIGHT;
                      return;
                  }
                  if (ezFollow) {
                      ezSleeping = false;
                      ezPeng = null;
                      ezRun = false;
                      if (ezFetch) {
                          // you threw a snowball: off he goes after it, has a sniff where it landed, then trots back
                          float dx = ezFetchX - ezX, dy = ezFetchY - ezY, d = (float) Math.sqrt(dx * dx + dy * dy);
                          if (d > 4 && ezFetchWait < 0) {
                              ezStep(dx / d, dy / d, Math.min(d, 300 * dt), inside);
                              return;
                          }
                          if (ezFetchWait < 0) {
                              // arrived: hunt round for it, once to three times round
                              int circles = 1 + rnd.nextInt(3);
                              ezFetchWait = 0.5f + circles * 1.5f;
                              ezSearchA = (float) Math.atan2(ezY - ezFetchY, ezX - ezFetchX);
                              ezFound = rnd.nextFloat() < 0.55f;
                              ezFindAt = ezFound ? 0.5f + rnd.nextFloat() * (ezFetchWait - 0.5f) : -1;   // he might find it any time
                          }
                          ezFetchWait -= dt;
                          if (ezFound && ezFetchWait <= ezFindAt) {
                              // found it! a pounce and a whippy tail; then either he leaves it, or carries it back to you
                              splat(ezX + (ezFacing == LEFT ? -12 : 12), ezY - 6);
                              ezFound = false;
                              ezWhipT = rnd.nextFloat() < 0.33f ? 1.8f : 0;
                              ezCarryBall = rnd.nextBoolean();
                              ezFetchWait = 0.45f;
                          }
                          if (ezFetchWait > 0.5f) {
                              // trotting round in a little circle, nose down
                              ezSearchA += dt * 4.2f;
                              float tx = ezFetchX + (float) Math.cos(ezSearchA) * 28, ty = ezFetchY + (float) Math.sin(ezSearchA) * 16;
                              float sx = tx - ezX, sy = ty - ezY, sd = (float) Math.sqrt(sx * sx + sy * sy);
                              if (sd > 0.5f) ezStep(sx / sd, sy / sd, Math.min(sd, 170 * dt), inside);
                              return;
                          }

                          if (ezFetchWait <= 0) ezFetch = false;
                          return;
                      }
                      boolean playerMoving = kUp || kDown || kLeft || kRight || axX != 0 || axY != 0;
                      float pdx = px - ezX, pdy = py - ezY, pd = (float) Math.sqrt(pdx * pdx + pdy * pdy);
                      if (ezCarryBall) {
                          // bringing your snowball back
                          if (pd > 50) { ezStep(pdx / pd, pdy / pd, Math.min(pd - 48, 230 * dt), inside); return; }
                          ezCarryBall = false;
                          pHasBall = true;
                          ezHappyT = 0;
                          play(S_TICK, 0.35f, 1.4f);
                          toast("Ezio brought your snowball back! Press OK to throw it");
                          return;
                      }
                      if (!playerMoving) {
                          // You're standing still (maybe just turned to look at him): he stays where he is,
                          // only coming closer if he's drifted far away
                          if (pd > 138) {
                              float tx = px + (ezX < px ? -56 : 56), ty = py + 8;
                              float dx = tx - ezX, dy = ty - ezY, d = (float) Math.sqrt(dx * dx + dy * dy);
                              if (d > 4) ezStep(dx / d, dy / d, Math.min(d, 170 * dt), inside);
                          } else if (rnd.nextFloat() < dt * 0.4f) {
                              ezFacing = px < ezX ? LEFT : RIGHT;
                          }
                          return;
                      }
                      float behind = facing == LEFT ? 55 : facing == RIGHT ? -55 : (ezX < px ? -45 : 45);
                      float tx = px + behind, ty = py + (facing == UP ? 40 : 8);
                      float dx = tx - ezX, dy = ty - ezY, d = (float) Math.sqrt(dx * dx + dy * dy);
                      if (!ezFollowGo && d > 46) ezFollowGo = true;
                      if (ezFollowGo && d < 12) ezFollowGo = false;
                      if (ezFollowGo) {
                          float sp = d > 300 ? 340 : d > 120 ? 250 : 150;
                          ezStep(dx / d, dy / d, Math.min(d, sp * dt), inside);
                      } else if (rnd.nextFloat() < dt * 0.3f) {
                          ezFacing = px < ezX ? LEFT : RIGHT;
                      }
                      return;
                  }
                  if (inside && ezVisiting) {
                      ezStayT -= dt;
                      if (ezStayT <= 0 && !ezLeaving) {
                          ezLeaving = true; ezSleeping = false;
                          ezTX = 640; ezTY = 700; ezWait = 0;
                      }
                  }
                  if (ezSleeping) {
                      ezSleepT -= dt;
                      if (ezSleepT <= 0) { ezSleeping = false; ezWait = 1 + rnd.nextFloat() * 2; ezNapCool = 60; }
                      return;
                  }
                  if (ezWait > 0) { ezWait -= dt; return; }
                  if (ezPeng != null && !inside) {
                      // keep heading for the penguin he picked
                      ezTX = ezPeng.x + (ezX < ezPeng.x ? -34 : 34);
                      ezTY = ezPeng.y + 4;
                  }
                  float dx = ezTX - ezX, dy = ezTY - ezY, d = (float) Math.sqrt(dx * dx + dy * dy);
                  if (d > 3) {
                      ezStep(dx / d, dy / d, Math.min(d, (ezRun ? 240 : 95) * dt), inside);
                      return;
                  }
                  if (ezRun) {
                      // caught the snowball! hearts, and that tail goes everywhere
                      ezRun = false;
                      ezHappyT = 1.2f;
                      ezWhipT = rnd.nextFloat() < 0.33f ? 1.8f : 0;
                      ezWait = 2 + rnd.nextFloat() * 2;
                      splat(ezX + (ezFacing == LEFT ? -12 : 12), ezY - 6);
                      return;
                  }
                  if (ezPeng != null && !inside) {
                      AppPeng a = ezPeng;
                      ezPeng = null;
                      ezFacing = a.x < ezX ? LEFT : RIGHT;
                      a.facing = faceToward(a.x, a.y, ezX, ezY);
                      a.wait = 2.5f;
                      float roll = rnd.nextFloat();
                      if (roll < 0.4f) {
                          // a pat on the head: two or three gentle pats
                          a.facing = ezX < a.x ? LEFT : RIGHT;
                          npcEmote(a, E_PAT, 1.6f, 0);
                          ezPatPeng = a;
                          float side = ezX < a.x ? -1 : 1;
                          ezPatX = a.x + side * 46; ezPatY = a.y + 3;
                          ezHappyT = 1.8f;
                          ezWait = 2.5f;
                          play(S_CHIRP, 0.12f, 0.6f);
                      } else if (roll < 0.75f) {
                          // the penguin tosses a snowball and Ezio runs after it
                          double ang = Math.atan2(a.y - ezY, a.x - ezX) + (rnd.nextDouble() - 0.5) * 1.6;
                          float lx = a.x + (float) Math.cos(ang) * 230, ly = a.y + (float) Math.sin(ang) * 140;
                          float ex = (lx - CX) / (RX - 60), ey = (ly - CY) / (RY - 60);
                          float e = ex * ex + ey * ey;
                          if (e > 1) { float k = (float) (1 / Math.sqrt(e)); lx = CX + (lx - CX) * k; ly = CY + (ly - CY) * k; }
                          a.facing = faceToward(a.x, a.y, lx, ly);
                          npcEmote(a, E_THROW, 0.45f, 0);
                          Ball b = new Ball();
                          b.x = a.x; b.y = a.y;
                          b.dur = 0.75f;
                          b.vx = (lx - a.x) / b.dur; b.vy = (ly - a.y) / b.dur;
                          b.toy = true;
                          b.owner = a;
                          balls.add(b);
                          playAt(S_WHOOSH, 0.22f, 1f, a.x, a.y);
                          ezTX = lx; ezTY = ly;
                          ezRun = true;
                          ezWait = 0.3f;
                      } else {
                          // a stare-off: a long cross-eyed look, then slow blinks back and forth, once or twice round
                          ezStareSets = 1 + rnd.nextInt(2);
                          ezStareEzFirst = rnd.nextFloat() < 0.65f;
                          ezStareLFirst = rnd.nextBoolean();
                          ezStareGap = 0.1f + rnd.nextFloat() * 0.12f;
                          ezStareLen = 1.0f + ezStareSets * 2.6f + 0.6f;
                          ezWait = ezStareLen;
                          a.wait = ezStareLen + 0.4f;
                          ezStareT = ezStareLen;
                          ezStarePeng = a;
                      }
                      return;
                  }
                  // Arrived somewhere
                  if (!inside && ezPetGroup != null) {
                      AppPeng g = ezPetGroup;
                      ezPetGroup = null;
                      if (petEv == null && g.chatWith != null && g.chatTalking) {
                          startPetEvent(g, apps);
                          ezWait = 9;                      // sits and waits for them
                          ezFacing = g.x < ezX ? LEFT : RIGHT;
                          return;
                      }
                  }
                  if (!inside && ezChatA != null && ezChatT < 0) {
                      AppPeng a = ezChatA, o = a.chatWith;
                      if (o == null || !a.chatTalking) { ezChatA = null; }
                      else {
                          ezChatT = 7 + rnd.nextFloat() * 5;
                          if (rnd.nextFloat() < 0.35f && a.emote == E_NONE && o.emote == E_NONE) {
                              // they both stop, look down, and give him a few pats on the head
                              float mx = (a.x + o.x) / 2, my = (a.y + o.y) / 2;
                              a.facing = RIGHT; o.facing = LEFT;
                              npcEmote(a, E_PAT, 1.6f, 0);
                              npcEmote(o, E_PAT, 1.6f, 0.15f);
                              ezPatPeng = a; ezPatPeng2 = o;
                              ezPatX = mx; ezPatY = my + 3;
                              ezHappyT = 1.9f;
                              play(S_CHIRP, 0.12f, 0.6f);
                          }
                          return;
                      }
                  }
                  if (inside && ezLeaving) {
                      // Out the door he goes
                      ezScene = SCENE_ISLAND; ezX = DOOR_X; ezY = DOOR_Y + 40;
                      ezLeaving = false; ezVisiting = false;
                      ezTX = ezX + 60; ezTY = ezY + 70; ezWait = 0;
                      return;
                  }
                  if (inside && !ezGoBed && rnd.nextFloat() < 0.5f) {
                      // nap time: his bed on the hearth, or the cushion on the other side
                      ezGoBed = true;
                      ezTX = ROOM_BED_X; ezTY = ROOM_BED_Y + 2;
                      return;
                  }
                  if (ezGoBed) {
                      ezGoBed = false;
                      ezSleeping = true;
                      ezSleepT = inside ? 25 + rnd.nextFloat() * 30 : 20 + rnd.nextFloat() * 40;
                      return;
                  }
                  ezWait = 2 + rnd.nextFloat() * 4;
                  if (ezHappyT > 0 || ezPatPeng != null || ezStareT > 0 || ezRun) { ezWait = 0.6f; return; }   // still busy
                  if (!inside && rnd.nextFloat() < 0.25f) {
                      // tag along behind a penguin that happens to be walking past (or just sit and stare at it)
                      AppPeng pick = null;
                      for (AppPeng a : apps) {
                          if (!a.moving || a.chatWith != null || a.joinOf != null || a.ev != null) continue;
                          if (dist2(a.x, a.y, ezX, ezY) > 170 * 170) continue;
                          if (pick == null || rnd.nextBoolean()) pick = a;
                      }
                      if (pick != null) {
                          ezTail = pick;
                          ezTailStare = rnd.nextFloat() < 0.25f;
                          ezTailT = ezTailStare ? 3 + rnd.nextFloat() * 4 : 5 + rnd.nextFloat() * 15;
                          return;
                      }
                  }
                  if (!inside && petEv == null && rnd.nextFloat() < 0.2f) {
                      // wander up beside a conversation: one of them might come over to say hello
                      for (AppPeng a : apps) {
                          AppPeng o = a.chatWith;
                          if (o == null || !a.chatTalking || a.x > o.x || a.ev != null) continue;
                          if (dist2(a.x, a.y, ezX, ezY) > 200 * 200) continue;
                          float side = ezX < (a.x + o.x) / 2 ? -1 : 1;
                          ezPetGroup = a;
                          ezTX = (a.x + o.x) / 2 + side * 115; ezTY = (a.y + o.y) / 2 + 12;
                          return;
                      }
                  }
                  if (!inside && rnd.nextFloat() < 0.3f) {
                      // nosy: trot over to two penguins chatting nearby and sit in front of them
                      for (AppPeng a : apps) {
                          AppPeng o = a.chatWith;
                          if (o == null || !a.chatTalking || a.x > o.x) continue;
                          if (dist2(a.x, a.y, ezX, ezY) > 200 * 200) continue;
                          boolean joined = false;
                          for (AppPeng q : apps) if (q.joinOf == a || q.joinOf == o) joined = true;
                          if (joined) continue;
                          ezChatA = a; ezChatT = -1;
                          ezTX = (a.x + o.x) / 2; ezTY = (a.y + o.y) / 2 + 36;
                          return;
                      }
                  }
                  if (!inside && rnd.nextFloat() < 0.6f) {
                      AppPeng best = null;
                      float bd = 170 * 170;
                      for (AppPeng a : apps) {
                          if (a.emote != E_NONE || a.chatWith != null || a.hugWalk) continue;
                          float dd = dist2(a.x, a.y, ezX, ezY);
                          if (dd < bd && rnd.nextFloat() < 0.6f) { bd = dd; best = a; }
                      }
                      if (best != null) { ezPeng = best; return; }
                  }
                  if (!inside && ezNapCool <= 0 && rnd.nextFloat() < 0.15f) {
                      ezGoBed = true; ezTX = BED_X; ezTY = BED_Y + 2;
                  } else pickEzRoam(inside);
              }

              /** Somewhere for Ezio to wander to: inside, around the rug; outside, near his bed or right across the island. */
              void pickEzRoam(boolean inside) {
                  if (inside) {
                      ezTX = 520 + rnd.nextFloat() * 240; ezTY = 460 + rnd.nextFloat() * 70;
                  } else if (rnd.nextFloat() < 0.3f) {
                      double a = rnd.nextDouble() * Math.PI * 2;
                      float r = 60 + rnd.nextFloat() * 170;
                      ezTX = BED_X + (float) Math.cos(a) * r; ezTY = BED_Y + (float) Math.sin(a) * r * 0.6f;
                  } else {
                      // a proper wander, anywhere on the island
                      double a = rnd.nextDouble() * Math.PI * 2;
                      float r = (float) Math.sqrt(rnd.nextFloat()) * 0.85f;
                      ezTX = CX + (float) Math.cos(a) * (RX - 80) * r; ezTY = CY + (float) Math.sin(a) * (RY - 70) * r;
                      float ix = (ezTX - IGLOO_X) / 170f, iy = (ezTY - (IGLOO_Y - 22)) / 70f;
                      if (ix * ix + iy * iy < 1) ezTY = IGLOO_Y + 60;
                  }
              }

              /** One step for Ezio, kept on the island (and off the igloo and boombox) or inside the room. */
              void ezStep(float ux, float uy, float len, boolean inside) {
                  float nx = ezX + ux * len, ny = ezY + uy * len;
                  float ox = ezX, oy = ezY;
                  ezLastUX = ux; ezLastUY = uy;
                  if (inside) {
                      nx = Math.max(170, Math.min(1110, nx));
                      ny = Math.max(nx > 740 && nx < 840 ? 300 : nx > 380 && nx < 900 ? 345 : 400, Math.min(705, ny));
                      float rxe = (nx - 640) / (ROOM_FA - 40), rye = (ny - 720) / (ROOM_FB - 30);
                      float re = rxe * rxe + rye * rye;
                      if (re > 1 && !(nx > 740 && nx < 840 && ny < 340)) { float k = (float) (1 / Math.sqrt(re)); nx = 640 + (nx - 640) * k; ny = 720 + (ny - 720) * k; }
                  } else {
                      float ex = (nx - CX) / (RX - 45), ey = (ny - CY) / (RY - 40);
                      float e = ex * ex + ey * ey;
                      if (e > 1) { float k = (float) (1 / Math.sqrt(e)); nx = CX + (nx - CX) * k; ny = CY + (ny - CY) * k; }
                      float ix = (nx - IGLOO_X) / 136f, iy = (ny - (IGLOO_Y - 22)) / 36f;
                      float ie = ix * ix + iy * iy;
                      if (ie < 1) { float k = (float) (1 / Math.sqrt(Math.max(ie, 0.0001f))); nx = IGLOO_X + (nx - IGLOO_X) * k; ny = (IGLOO_Y - 22) + (ny - (IGLOO_Y - 22)) * k; }
                  }
                  if (Math.abs(ux) > 0.45f) ezFacing = ux < 0 ? LEFT : RIGHT;
                  ezX = nx; ezY = ny;
                  ezMoving = true;
                  if (len > 0.4f && Math.hypot(nx - ox, ny - oy) < len * 0.3f) ezBlocked = true;
              }

              /**
               * Ezio: a round, fluffy black cat with a little head, stubby legs, a big fluffy tail and big
               * derpy eyes. At Christmas he's wrapped in lights with a star on his head.
               */
              void drawEzio(Canvas c, float x, float y, float s, int face, boolean moving, boolean sleeping, float phase, boolean blink, int season) {
                  final int FUR = 0xff16141b, FUR2 = 0xff24212b;
                  c.save();
                  c.translate(x, y);
                  c.scale(face == LEFT ? -s : s, s);
                  p.setColor(0x30000000);
                  c.drawOval(-22, -5, 22, 5, p);
                  float bob = moving ? (float) Math.abs(Math.sin(phase)) * 2.5f : (float) Math.sin(phase * 0.6f) * 0.8f;
                  if (sleeping) {
                      // curled-up loaf with the tail wrapped round
                      p.setColor(FUR);
                      c.drawOval(-20, -20, 20, 0, p);
                      for (int i = 0; i < 10; i++) {
                          double a = Math.PI + Math.PI * i / 9.0;
                          c.drawCircle((float) Math.cos(a) * 19, -10 + (float) Math.sin(a) * 9, 4.2f, p);
                      }
                      c.drawOval(-24, -9, 8, 2, p);
                      c.drawCircle(12, -13, 9, p);
                      path.reset();
                      path.moveTo(6, -19); path.lineTo(9, -27); path.lineTo(13, -20); path.close();
                      path.moveTo(13, -20); path.lineTo(18, -27); path.lineTo(20, -17); path.close();
                      c.drawPath(path, p);
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(1.6f);
                      p.setColor(0xfff2f2f2);
                      c.drawLine(9, -13, 13, -13, p);
                      c.drawLine(15, -13, 19, -13, p);
                      p.setStyle(Paint.Style.FILL);
                      if (season == SEASON_XMAS) ezLights(c, true);
                      c.restore();
                      if (rnd.nextFloat() < 0.012f) spawnZ(x + 10, y - 30);
                      return;
                  }
                  c.translate(0, -bob);
                  // fluffy tail curling up behind (whipping about like a flame after he catches something)
                  float sway = (float) Math.sin(phase * (moving ? 0.6f : 0.35f)) * 6;
                  boolean whip = ezWhipT > 0 && s < 1.5f;
                  p.setColor(FUR);
                  for (int i = 0; i < 9; i++) {
                      float t = i / 8f;
                      float tx = -16 - t * 12 + (float) Math.sin(t * 3) * 4, ty = -12 - t * 26;
                      float off = whip ? (float) Math.sin(time * 13 - t * 3.2f) * 14 * t : sway * t;
                      c.drawCircle(tx + off, ty, 5 + t * 3.5f, p);
                  }
                  // stubby legs
                  float lift = moving ? (float) Math.sin(phase) * 2.5f : 0;
                  p.setColor(FUR);
                  rf.set(-13, -9 - Math.max(0, lift), -6, 1 - Math.max(0, lift)); c.drawRoundRect(rf, 3, 3, p);
                  rf.set(6, -9 - Math.max(0, -lift), 13, 1 - Math.max(0, -lift)); c.drawRoundRect(rf, 3, 3, p);
                  p.setColor(FUR2);
                  rf.set(-4, -9 - Math.max(0, -lift), 3, 0 - Math.max(0, -lift)); c.drawRoundRect(rf, 3, 3, p);
                  // round fluffy body
                  p.setColor(FUR);
                  c.drawCircle(0, -20, 16, p);
                  for (int i = 0; i < 14; i++) {
                      double a = Math.PI * 2 * i / 14.0;
                      float j = (i % 3) * 0.8f;
                      c.drawCircle((float) Math.cos(a) * (15 + j), -20 + (float) Math.sin(a) * (15 + j), 3.6f, p);
                  }
                  // small head on top, a bit forward
                  float hx = 6, hy = -38;
                  c.drawCircle(hx, hy, 10, p);
                  for (int i = 0; i < 8; i++) {
                      double a = Math.PI * 2 * i / 8.0;
                      c.drawCircle(hx + (float) Math.cos(a) * 9.5f, hy + (float) Math.sin(a) * 9.5f, 2.6f, p);
                  }
                  boolean earsBack = ezHappyT > 0 && (ezPatPeng != null || ezPatByYou) && s < 1.5f;
                  path.reset();
                  if (earsBack) {
                      // ears folded out to the sides so the pat lands on top of his head
                      path.moveTo(hx - 8, hy - 3); path.lineTo(hx - 16, hy - 9); path.lineTo(hx - 5, hy - 8); path.close();
                      path.moveTo(hx + 5, hy - 8); path.lineTo(hx + 17, hy - 9); path.lineTo(hx + 9, hy - 2); path.close();
                  } else {
                      path.moveTo(hx - 9, hy - 4); path.lineTo(hx - 7, hy - 17); path.lineTo(hx - 1, hy - 8); path.close();
                      path.moveTo(hx + 2, hy - 8); path.lineTo(hx + 9, hy - 17); path.lineTo(hx + 10, hy - 3); path.close();
                  }
                  c.drawPath(path, p);
                  p.setColor(0xffd88a9a);
                  path.reset();
                  if (earsBack) {
                      path.moveTo(hx - 8, hy - 4.5f); path.lineTo(hx - 13.5f, hy - 8.5f); path.lineTo(hx - 6, hy - 7.5f); path.close();
                      path.moveTo(hx + 6, hy - 7.5f); path.lineTo(hx + 14.5f, hy - 8.5f); path.lineTo(hx + 9, hy - 4); path.close();
                  } else {
                      path.moveTo(hx - 7.5f, hy - 6); path.lineTo(hx - 6.5f, hy - 13); path.lineTo(hx - 3, hy - 8); path.close();
                      path.moveTo(hx + 4, hy - 8); path.lineTo(hx + 8, hy - 13); path.lineTo(hx + 8.5f, hy - 5); path.close();
                  }
                  c.drawPath(path, p);
                  // big derpy eyes
                  if (!blink && ezStareT > 0 && ezStarePeng != null && s < 1.5f) {
                      // a slow blink: one eye shuts a moment before the other
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(1.6f);
                      p.setColor(0xfff2f2f2);
                      if (ezEyeLClosed) c.drawLine(hx - 7, hy, hx - 1, hy, p);
                      if (ezEyeRClosed) c.drawLine(hx + 2, hy, hx + 8, hy, p);
                      p.setStyle(Paint.Style.FILL);
                      // open eyes drift a little outward (a derpy, wall-eyed look up at the penguin)
                      if (!ezEyeLClosed) {
                          p.setColor(0xffffffff); c.drawCircle(hx - 4, hy, 4.4f, p);
                          p.setColor(0xff111111); c.drawCircle(hx - 5.4f, hy - 1.0f, 1.9f, p);
                      }
                      if (!ezEyeRClosed) {
                          p.setColor(0xffffffff); c.drawCircle(hx + 5, hy, 4.4f, p);
                          p.setColor(0xff111111); c.drawCircle(hx + 6.4f, hy - 1.0f, 1.9f, p);
                      }
                  } else if (blink) {
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(1.6f);
                      p.setColor(0xfff2f2f2);
                      c.drawLine(hx - 7, hy, hx - 1, hy, p);
                      c.drawLine(hx + 2, hy, hx + 8, hy, p);
                      p.setStyle(Paint.Style.FILL);
                  } else {
                      p.setColor(0xffffffff);
                      c.drawCircle(hx - 4, hy, 4.4f, p);
                      c.drawCircle(hx + 5, hy, 4.4f, p);
                      p.setColor(0xff111111);
                      c.drawCircle(hx - 3.2f, hy + 0.6f, 1.9f, p);
                      c.drawCircle(hx + 5.6f, hy - 0.2f, 1.9f, p);
                  }
                  // whiskers
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(0.8f);
                  p.setColor(0x88ffffff);
                  c.drawLine(hx + 8, hy + 4, hx + 16, hy + 2, p);
                  c.drawLine(hx + 8, hy + 5, hx + 16, hy + 6, p);
                  c.drawLine(hx - 6, hy + 4, hx - 14, hy + 2, p);
                  p.setStyle(Paint.Style.FILL);
                  if (season == SEASON_XMAS) {
                      ezLights(c, false);
                      p.setColor(0xffe53935);
                      drawStar(c, hx, hy - 16, 6);
                  }
                  c.restore();
                  if (ezHappyT > 0 && ezWhipT <= 0 && rnd.nextFloat() < 0.15f) spawnHeart(x, y - 52 * s);
                  if (ezCarryBall && s < 1.5f) {
                      float bx = x + (face == LEFT ? -20 : 20) * s, by = y - 26 * s;
                      p.setColor(0xffffffff);
                      c.drawCircle(bx, by, 5 * s, p);
                  }
              }

              /**
               * Ezio lounging on the floor: his curled-up bed pose, but bigger and stretched out long like a
               * Maine Coon does, eyes open, with his big fluffy tail laid out to the side.
               */
              void drawEzioSprawl(Canvas c, float x, float y, float s, int face, float phase, boolean blink, int season) {
                  final int FUR = 0xff16141b, FUR2 = 0xff24212b;
                  c.save();
                  c.translate(x, y);
                  c.scale((face == LEFT ? -s : s) * 1.2f, s * 1.2f);
                  p.setColor(0x30000000);
                  c.drawOval(-52, -5, 36, 5, p);
                  float br = (float) Math.sin(phase * 0.8f) * 0.6f;      // breathing
                  // tail stretched out behind, curving up a little at the end, the tip twitching now and then
                  float flick = (float) Math.sin(phase * 0.5f) * 2.5f;
                  p.setColor(FUR);
                  for (int i = 0; i < 10; i++) {
                      float t = i / 9f;
                      c.drawCircle(-24 - t * 28, -7 - t * t * 10 - (t > 0.7f ? flick * (t - 0.7f) * 3 : 0), 4.5f + t * 2.5f, p);
                  }
                  // nub legs sticking out, like when he flops on his side: back pair out behind, front pair reaching forward
                  p.setColor(FUR2);
                  rf.set(-34, -6, -18, 0); c.drawRoundRect(rf, 3, 3, p);
                  rf.set(18, -9, 34, -3); c.drawRoundRect(rf, 3, 3, p);
                  p.setColor(FUR);
                  rf.set(-30, -3, -14, 3); c.drawRoundRect(rf, 3, 3, p);
                  rf.set(16, -5, 33, 1); c.drawRoundRect(rf, 3, 3, p);
                  // the long fluffy body lying on its side
                  c.drawOval(-27, -21 - br, 22, -1, p);
                  for (int i = 0; i < 12; i++) {
                      double a = Math.PI + Math.PI * i / 11.0;
                      c.drawCircle(-2.5f + (float) Math.cos(a) * 24, -11 - br + (float) Math.sin(a) * 9.5f, 4.2f, p);
                  }
                  // head up at the front, eyes open
                  float hx = 17, hy = -19 - br;
                  c.drawCircle(hx, hy, 9.5f, p);
                  for (int i = 0; i < 8; i++) {
                      double a = Math.PI * 2 * i / 8.0;
                      c.drawCircle(hx + (float) Math.cos(a) * 9, hy + (float) Math.sin(a) * 9, 2.4f, p);
                  }
                  path.reset();
                  path.moveTo(hx - 8, hy - 5); path.lineTo(hx - 6, hy - 16); path.lineTo(hx - 1, hy - 8); path.close();
                  path.moveTo(hx + 2, hy - 8); path.lineTo(hx + 8, hy - 16); path.lineTo(hx + 9, hy - 4); path.close();
                  c.drawPath(path, p);
                  p.setColor(0xffd88a9a);
                  path.reset();
                  path.moveTo(hx - 6.5f, hy - 7); path.lineTo(hx - 5.5f, hy - 13); path.lineTo(hx - 2.5f, hy - 8.5f); path.close();
                  path.moveTo(hx + 3.5f, hy - 8.5f); path.lineTo(hx + 7, hy - 13); path.lineTo(hx + 7.5f, hy - 6); path.close();
                  c.drawPath(path, p);
                  if (blink) {
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(1.4f);
                      p.setColor(0xfff2f2f2);
                      c.drawLine(hx - 6, hy, hx - 1, hy, p);
                      c.drawLine(hx + 2, hy, hx + 7, hy, p);
                      p.setStyle(Paint.Style.FILL);
                  } else {
                      p.setColor(0xffffffff);
                      c.drawCircle(hx - 3.5f, hy, 3.8f, p);
                      c.drawCircle(hx + 4.5f, hy, 3.8f, p);
                      p.setColor(0xff111111);
                      c.drawCircle(hx - 2.8f, hy + 0.5f, 1.7f, p);
                      c.drawCircle(hx + 5f, hy - 0.2f, 1.7f, p);
                  }
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(0.8f);
                  p.setColor(0x88ffffff);
                  c.drawLine(hx + 7, hy + 4, hx + 14, hy + 2, p);
                  c.drawLine(hx + 7, hy + 5, hx + 14, hy + 6, p);
                  p.setStyle(Paint.Style.FILL);
                  if (season == SEASON_XMAS) ezLights(c, true);
                  c.restore();
              }

              /** Whatever Ezio's running off with: a sock, a toy mouse, a feather or a ribbon, held in his mouth. */
              void drawCarried(Canvas c, float x, float y, float s, int face, int what) {
                  c.save();
                  c.translate(x, y);
                  c.scale(face == LEFT ? -s : s, s);
                  float mx = 16, my = -26;      // just in front of his mouth
                  switch (what) {
                      case 1: // red sock dangling
                          p.setColor(0xffe53935);
                          rf.set(mx - 2, my - 2, mx + 4, my + 12); c.drawRoundRect(rf, 3, 3, p);
                          rf.set(mx - 2, my + 7, mx + 10, my + 13); c.drawRoundRect(rf, 3, 3, p);
                          p.setColor(0xffffffff);
                          c.drawRect(mx - 2, my - 2, mx + 4, my + 1, p);
                          break;
                      case 2: // grey toy mouse with a pink tail
                          p.setColor(0xff9e9e9e);
                          c.drawOval(mx, my - 3, mx + 12, my + 5, p);
                          c.drawCircle(mx + 11, my - 2, 2.2f, p);
                          p.setStyle(Paint.Style.STROKE); p.setStrokeWidth(1.2f); p.setColor(0xfff48fb1);
                          c.drawLine(mx, my + 1, mx - 6, my + 4, p);
                          p.setStyle(Paint.Style.FILL);
                          break;
                      case 3: // fluffy feather
                          p.setColor(0xff4fc3f7);
                          c.save(); c.rotate(-25, mx, my);
                          c.drawOval(mx, my - 2.5f, mx + 16, my + 2.5f, p);
                          p.setColor(0xff0288d1);
                          c.drawRect(mx - 3, my - 0.5f, mx + 16, my + 0.5f, p);
                          c.restore();
                          break;
                      default: // pink ribbon trailing
                          p.setStyle(Paint.Style.STROKE); p.setStrokeWidth(2.2f); p.setColor(0xfff06292);
                          path.reset();
                          path.moveTo(mx, my);
                          path.quadTo(mx - 8, my + 6 + (float) Math.sin(time * 18) * 3, mx - 18, my + 2);
                          c.drawPath(path, p);
                          p.setStyle(Paint.Style.FILL);
                          break;
                  }
                  c.restore();
              }

              /** A string of twinkling Christmas lights wrapped around Ezio. */
              void ezLights(Canvas c, boolean loaf) {
                  float[][] spots = loaf
                          ? new float[][]{{-14, -8}, {-6, -14}, {3, -9}, {-10, -2}, {12, -6}}
                          : new float[][]{{-11, -26}, {-3, -31}, {7, -27}, {12, -20}, {-13, -14}, {-4, -10}, {6, -12}};
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(0.9f);
                  p.setColor(0xff3a3a3a);
                  path.reset();
                  for (int i = 0; i < spots.length; i++) {
                      if (i == 0) path.moveTo(spots[i][0], spots[i][1]); else path.lineTo(spots[i][0], spots[i][1]);
                  }
                  c.drawPath(path, p);
                  p.setStyle(Paint.Style.FILL);
                  for (int i = 0; i < spots.length; i++) {
                      int col = LIGHT_COLS[i % LIGHT_COLS.length];
                      boolean on = ((int) (time * 2.2f) + i) % 3 != 0;
                      p.setColor(on ? col : blend(col, 0xff000000, 0.5f));
                      c.drawCircle(spots[i][0], spots[i][1], 2.4f, p);
                  }
              }

              /** Ezio's little round bed. */
              void drawEzioBed(Canvas c) {
                  drawEzioBed(c, BED_X, BED_Y, 1f);
              }

              void drawEzioBed(Canvas c, float bx, float by, float bs) {
                  c.save();
                  c.translate(bx, by);
                  c.scale(bs, bs);
                  float x = 0, y = 0;
                  p.setColor(0x30000000);
                  c.drawOval(x - 34, y - 8, x + 34, y + 10, p);
                  p.setColor(0xff8e3b46);
                  c.drawOval(x - 32, y - 16, x + 32, y + 6, p);
                  p.setColor(0xffb24a57);
                  c.drawOval(x - 32, y - 20, x + 32, y + 1, p);
                  p.setColor(0xfff1e3d3);
                  c.drawOval(x - 22, y - 15, x + 22, y - 2, p);
                  p.setColor(0xffe2d0bc);
                  c.drawOval(x - 14, y - 12, x + 14, y - 4, p);
                  c.restore();
              }

              void setMusic(boolean on) {
                  musicOn = on;
                  prefs.edit().putBoolean("music", on).apply();
                  play(S_TOGGLE, 0.5f, 1f);
                  updateMusic();
              }

              void openSettings() {
                  play(S_TICK, 0.45f, 1.1f);
                  listTitle = "Island settings";
                  listOnBack = null;
                  listItems.clear();
                  listItems.add(new Item("Choose which apps live on the island", "›", null, () -> openAppsList(() -> { listSel = 0; openSettings(); })));
                  listItems.add(new Item("Music", musicOn ? "On" : "Off", null, () -> { setMusic(!musicOn); refreshSettings(); }));
                  listItems.add(new Item("Sound effects", soundOn ? "On" : "Off", null, () -> {
                      soundOn = !soundOn;
                      prefs.edit().putBoolean("sound", soundOn).apply();
                      play(S_TOGGLE, 0.5f, 1f);
                      refreshSettings();
                  }));
                  listItems.add(new Item("Penguin icons", bellyIcons ? "On belly" : "Above head", null, () -> {
                      bellyIcons = !bellyIcons;
                      prefs.edit().putBoolean("belly", bellyIcons).apply();
                      play(S_TOGGLE, 0.5f, 1f);
                      refreshSettings();
                  }));
                  listItems.add(new Item("Names over belly-icon penguins", namesAlways ? "Always" : "When close", null, () -> {
                      namesAlways = !namesAlways;
                      prefs.edit().putBoolean("namesalways", namesAlways).apply();
                      play(S_TOGGLE, 0.5f, 1f);
                      refreshSettings();
                  }));
                  listItems.add(new Item("Name tags", namesBelow ? "Below penguins" : "Above penguins", null, () -> {
                      namesBelow = !namesBelow;
                      prefs.edit().putBoolean("namesbelow", namesBelow).apply();
                      play(S_TOGGLE, 0.5f, 1f);
                      refreshSettings();
                  }));
                  listItems.add(new Item("Name tag colour", tagColour ? "Penguin colour" : "Dark", null, () -> {
                      tagColour = !tagColour;
                      prefs.edit().putBoolean("tagcolour", tagColour).apply();
                      play(S_TOGGLE, 0.5f, 1f);
                      refreshSettings();
                  }));
                  listItems.add(new Item("Clock size", CLOCK_SIZE_NAMES[clockSize], null, () -> {
                      clockSize = (clockSize + 1) % CLOCK_SIZES.length;
                      prefs.edit().putInt("clocksize", clockSize).apply();
                      play(S_TOGGLE, 0.5f, 1f);
                      refreshSettings();
                  }));
                  listItems.add(new Item("Return here after YouTube starts", autoReturn ? "On" : "Off", null, () -> {
                      autoReturn = !autoReturn;
                      prefs.edit().putBoolean("autoreturn", autoReturn).apply();
                      play(S_TOGGLE, 0.5f, 1f);
                      refreshSettings();
                  }));
                  listItems.add(new Item("Season", SEASON_PREF_NAMES[seasonPref], null, () -> {
                      seasonPref = (seasonPref + 1) % SEASON_PREF_NAMES.length;
                      prefs.edit().putInt("season", seasonPref).apply();
                      play(S_TOGGLE, 0.5f, 1f);
                      refreshSettings();
                  }));
                  listItems.add(new Item("Weather on the island", weatherFx ? "On" : "Off", null, () -> {
                      weatherFx = !weatherFx;
                      prefs.edit().putBoolean("weatherfx", weatherFx).apply();
                      play(S_TOGGLE, 0.5f, 1f);
                      refreshSettings();
                  }));
                  listItems.add(new Item("Reset most-used order", "", null, () -> {
                      SharedPreferences.Editor ed = prefs.edit();
                      synchronized (lock) {
                          for (AppPeng a : allApps) { a.launches = 0; ed.remove("n_" + a.pkg); }
                          relayout();
                      }
                      ed.apply();
                      play(S_TOGGLE, 0.5f, 0.8f);
                  }));
                  listItems.add(new Item("Close", "", null, () -> overlay = OV_NONE));
                  listSel = Math.min(listSel, listItems.size() - 1);
                  if (overlay != OV_LIST) { listSel = 0; listScroll = 0; }
                  overlay = OV_LIST;
              }

              // ================================================================== CD folder, player and song lists

              /** The folder always has at least 6 pages of sleeves you can flip through, empty or not. */
              int folderSlots() {
                  return Math.max(48, ((discs.size() + 7) / 8) * 8);
              }

              static int slotIndex(int page, int col, int row) {
                  return page * 8 + (col >= 2 ? 4 : 0) + row * 2 + (col % 2);
              }

              void openFolder() {
                  overlay = OV_FOLDER;
                  folderClosing = false;
                  folderAnim = 0;
                  afterFolderClose = null;
                  if (nowDisc != null) {
                      int i = discs.indexOf(nowDisc);
                      if (i >= 0) folderSel = i;
                  }
                  folderSel = Math.max(0, Math.min(discs.size() - 1, folderSel));
                  pEmote = E_NONE;
                  play(S_WHOOSH, 0.4f, 0.9f);
              }

              void closeFolder(Runnable after) {
                  folderClosing = true;
                  afterFolderClose = after;
                  play(S_WHOOSH, 0.3f, 1.1f);
              }

              /**
               * Volume for the CD player. MP3 discs are turned down inside Snow Island. YouTube discs play
               * in SmartTube, which only lets Snow Island ask for a volume if SmartTube allows it.
               */
              void setCdVolume(float v) {
                  cdVolume = Math.max(0, Math.min(1, Math.round(v * 100) / 100f));
                  prefs.edit().putFloat("cdvol", cdVolume).apply();
                  runOnUiThread(() -> { try { if (cdPlayer != null) cdPlayer.setVolume(cdVolume, cdVolume); } catch (Exception ignored) { } });
              }

              void openPlayer() {
                  overlay = OV_PLAYER;
                  playerSel = 2;
                  playerRow = 0;
                  pEmote = E_NONE;
                  play(S_TICK, 0.45f, 1.2f);
              }

              void openDiscMenu(Disc d) {
                  play(S_TICK, 0.45f, 1.1f);
                  listTitle = d.name;
                  listOnBack = () -> { overlay = OV_FOLDER; folderAnim = 1; };
                  listItems.clear();
                  listItems.add(new Item("Play this disc", "", null, () -> { overlay = OV_NONE; playDisc(d, -1); }));
                  listItems.add(new Item("🔍  Song list", "›", null, () -> openSongList(d, () -> openDiscMenu(d))));
                  if (!d.yt) {
                      listItems.add(new Item("Rename this disc", "", null, () -> {
                          overlay = OV_NONE;
                          askName("Rename disc", d.name, v -> {
                              if (v != null) { d.name = v; saveDiscs(); }
                              openDiscMenu(d);
                          });
                      }));
                      listItems.add(new Item("Remove this disc", "", null, () -> {
                          if (nowDisc == d) stopRadio();
                          discs.remove(d);
                          saveDiscs();
                          folderSel = Math.max(0, Math.min(discs.size() - 1, folderSel));
                          play(S_TOGGLE, 0.5f, 0.7f);
                          toast("Disc removed. Its songs will ask for a new disc next time.");
                          overlay = OV_FOLDER;
                          folderAnim = 1;
                      }));
                  } else {
                      listItems.add(new Item("Open the playlist in SmartTube", "", null, () -> {
                          overlay = OV_NONE;
                          if (!smartTubeInstalled()) { toast("Install SmartTube to play YouTube discs"); return; }
                          stopRadio();
                          nowDisc = d; nowYT = true; ytActive = true; radioPaused = false; nowTitle = d.name;
                          ytQuietSince = 0; ytGraceUntil = System.currentTimeMillis() + 30000;
                          updateMusic();
                          openInSmartTube("https://www.youtube.com/playlist?list=" + d.list);
                      }));
                  }
                  listItems.add(new Item("Back to the folder", "", null, () -> listOnBack.run()));
                  listSel = 0;
                  listScroll = 0;
                  overlay = OV_LIST;
              }

              /** The magnifying glass: every song on a disc. Pick one to start there. */
              void openSongList(Disc d, Runnable onBack) {
                  play(S_TICK, 0.45f, 1.1f);
                  listTitle = "🔍  " + d.name;
                  listOnBack = onBack;
                  listItems.clear();
                  listSel = 0;
                  listScroll = 0;
                  overlay = OV_LIST;
                  if (d.yt) {
                      ArrayList<String[]> tr = d.tracks;
                      if (tr == null) {
                          listItems.add(new Item("Loading songs…", "", null, null));
                          if (!d.loading) {
                              d.loading = true;
                              new Thread(() -> {
                                  fetchTracks(d);
                                  d.loading = false;
                                  gameTasks.add(() -> {
                                      if (overlay == OV_LIST && listTitle.equals("🔍  " + d.name)) {
                                          if (d.tracks == null || d.tracks.isEmpty()) {
                                              listItems.clear();
                                              listItems.add(new Item("Couldn't load the songs", "", null, null));
                                              listItems.add(new Item("Open the playlist in SmartTube instead", "", null, () -> { overlay = OV_NONE; playYouTube(d, null, null); }));
                                          } else {
                                              openSongList(d, onBack);
                                          }
                                      }
                                  });
                              }, "island-tracks").start();
                          }
                          return;
                      }
                      for (int i = 0; i < tr.size(); i++) {
                          final int idx = i;
                          listItems.add(new Item((i + 1) + ".  " + tr.get(i)[1], "", null, () -> { overlay = OV_NONE; playDisc(d, idx); }));
                      }
                  } else {
                      if (d.songs.isEmpty()) listItems.add(new Item("No songs on this disc yet", "", null, null));
                      for (int i = 0; i < d.songs.size(); i++) {
                          final int idx = i;
                          listItems.add(new Item((i + 1) + ".  " + prettySong(d.songs.get(i)), "", null, () -> { overlay = OV_NONE; playDisc(d, idx); }));
                      }
                  }
              }

              /** "New song on the TV: which disc should it go on?" */
              void showSongPrompt() {
                  if (newSongs.isEmpty()) return;
                  final String song = newSongs.get(0);
                  play(S_TOGGLE, 0.45f, 1.2f);
                  listTitle = "New song: " + prettySong(song);
                  listOnBack = () -> { newSongs.remove(song); skippedSongs.add(song); overlay = OV_NONE; };
                  listItems.clear();
                  for (Disc d : discs) {
                      if (d.yt) continue;
                      listItems.add(new Item("Add to  " + d.name, d.songs.size() + " songs", null, () -> {
                          newSongs.remove(song);
                          d.songs.add(song);
                          saveDiscs();
                          play(S_OPEN, 0.45f, 1.1f);
                          toast("Added to " + d.name);
                          overlay = OV_NONE;
                      }));
                  }
                  listItems.add(new Item("💿  Put it on a new disc", "", null, () -> {
                      overlay = OV_NONE;
                      int count = 0;
                      for (Disc d : discs) if (!d.yt) count++;
                      final int mixes = count;
                      askName("Name the new disc", "Mix " + (mixes + 1), v -> {
                          if (v == null) return;     // cancelled: the prompt comes back
                          Disc d = new Disc();
                          d.name = v;
                          d.yt = false;
                          d.color = MIX_COLS[mixes % MIX_COLS.length];
                          d.songs.add(song);
                          discs.add(d);
                          newSongs.remove(song);
                          saveDiscs();
                          play(S_OPEN, 0.45f, 1.1f);
                          toast("New disc: " + v);
                      });
                  }));
                  listItems.add(new Item("Not now", "", null, () -> listOnBack.run()));
                  listItems.add(new Item("Never ask about this song", "", null, () -> {
                      newSongs.remove(song);
                      Set<String> ign = new HashSet<>(prefs.getStringSet("ignoredsongs", new HashSet<String>()));
                      ign.add(song);
                      prefs.edit().putStringSet("ignoredsongs", ign).apply();
                      overlay = OV_NONE;
                  }));
                  listSel = 0;
                  listScroll = 0;
                  overlay = OV_LIST;
              }

              void refreshSettings() {
                  int keep = listSel;
                  openSettings();
                  listSel = keep;
              }

              void openAppsList(Runnable onBack) {
                  play(S_TICK, 0.45f, 1.1f);
                  listTitle = "Apps on the island";
                  listOnBack = onBack;
                  listItems.clear();
                  List<AppPeng> all;
                  synchronized (lock) { all = allApps; }
                  for (AppPeng a : all) {
                      final AppPeng app = a;
                      final Item[] holderItem = new Item[1];
                      holderItem[0] = new Item(a.label, hidden.contains(a.pkg) ? "Hidden" : "On island", a.icon, () -> {
                          if (hidden.contains(app.pkg)) hidden.remove(app.pkg); else hidden.add(app.pkg);
                          prefs.edit().putStringSet("hidden", new HashSet<>(hidden)).apply();
                          holderItem[0].value = hidden.contains(app.pkg) ? "Hidden" : "On island";
                          synchronized (lock) { relayout(); }
                          play(S_TOGGLE, 0.5f, hidden.contains(app.pkg) ? 0.8f : 1.1f);
                      });
                      listItems.add(holderItem[0]);
                  }
                  List<Chair> allCh;
                  synchronized (lock) { allCh = allChairs; }
                  for (Chair ch : allCh) {
                      final Chair chair = ch;
                      final Item[] hi = new Item[1];
                      String lab = ch.label + (ch.sub != null ? " · " + ch.sub : "") + "  (chair)";
                      hi[0] = new Item(lab, hidden.contains(ch.key) ? "Hidden" : "On island", null, () -> {
                          if (hidden.contains(chair.key)) hidden.remove(chair.key); else hidden.add(chair.key);
                          prefs.edit().putStringSet("hidden", new HashSet<>(hidden)).apply();
                          hi[0].value = hidden.contains(chair.key) ? "Hidden" : "On island";
                          synchronized (lock) { relayout(); }
                          play(S_TOGGLE, 0.5f, 1f);
                      });
                      listItems.add(hi[0]);
                  }
                  listItems.add(new Item("Done", "", null, () -> {
                      if (listOnBack != null) listOnBack.run(); else overlay = OV_NONE;
                  }));
                  listSel = 0;
                  listScroll = 0;
                  overlay = OV_LIST;
              }

              // ================================================================== particles

              Part part(float x, float y, boolean world) {
                  if (parts.size() > 500) parts.remove(0);
                  Part q = new Part();
                  q.x = x; q.y = y; q.world = world;
                  parts.add(q);
                  return q;
              }

              void splat(float x, float y) {
                  for (int i = 0; i < 12; i++) {
                      Part q = part(x, y, true);
                      double a = rnd.nextDouble() * Math.PI * 2;
                      float s = 60 + rnd.nextFloat() * 110;
                      q.vx = (float) Math.cos(a) * s; q.vy = (float) Math.sin(a) * s - 60;
                      q.g = 320; q.max = q.life = 0.5f + rnd.nextFloat() * 0.3f;
                      q.size = 2 + rnd.nextFloat() * 3; q.color = 0xffffffff;
                  }
              }

              void splash(float x, float y) {
                  for (int i = 0; i < 10; i++) {
                      Part q = part(x, y, true);
                      double a = rnd.nextDouble() * Math.PI * 2;
                      float s = 40 + rnd.nextFloat() * 70;
                      q.vx = (float) Math.cos(a) * s; q.vy = (float) Math.sin(a) * s - 90;
                      q.g = 300; q.max = q.life = 0.6f; q.size = 2.5f; q.color = 0xffbbdefb;
                  }
              }

              void spawnNote(float x, float y) {
                  Part q = part(x + (rnd.nextFloat() - 0.5f) * 30, y, true);
                  q.vx = (rnd.nextFloat() - 0.5f) * 30; q.vy = -45; q.max = q.life = 1.4f;
                  q.glyph = rnd.nextBoolean() ? "♪" : "♫"; q.size = 24; q.color = 0xff3949ab;
              }

              void spawnZ(float x, float y) {
                  Part q = part(x, y, true);
                  q.vx = 14; q.vy = -28; q.max = q.life = 1.8f;
                  q.glyph = "z"; q.size = 20; q.color = 0xff5c6bc0;
              }

              void firework() {
                  float x = 150 + rnd.nextFloat() * (VW - 300), y = 70 + rnd.nextFloat() * 220;
                  int col = SCARVES[rnd.nextInt(SCARVES.length)];
                  for (int i = 0; i < 36; i++) {
                      Part q = part(x, y, false);
                      double a = Math.PI * 2 * i / 36;
                      float s = 110 + rnd.nextFloat() * 90;
                      q.vx = (float) Math.cos(a) * s; q.vy = (float) Math.sin(a) * s;
                      q.g = 70; q.max = q.life = 1.3f + rnd.nextFloat() * 0.4f; q.size = 2.6f; q.color = col;
                  }
              }

              void heart() {
                  Part q = part(rnd.nextFloat() * VW, VH + 20, false);
                  q.vx = (rnd.nextFloat() - 0.5f) * 20; q.vy = -50 - rnd.nextFloat() * 40;
                  q.max = q.life = 9; q.glyph = "♥"; q.size = 22 + rnd.nextFloat() * 16;
                  q.color = rnd.nextBoolean() ? 0xffe91e63 : 0xffff80ab;
              }

              void updateParticles(float dt) {
                  for (Iterator<Part> it = parts.iterator(); it.hasNext(); ) {
                      Part q = it.next();
                      q.life -= dt;
                      q.age += dt;
                      if (q.life <= 0) { it.remove(); continue; }
                      q.vy += q.g * dt;
                      if (q.flue) {
                          // Sparks drift to the middle and disappear up the chimney
                          q.vx += (q.flueX - q.x) * 1.4f * dt;
                          q.vx *= 1 - Math.min(1, dt * 1.5f);
                          if (q.vy > -40) q.vy -= 120 * dt;
                          if (q.y < q.flueTop) { it.remove(); continue; }
                          if (q.y < q.flueTop + 60) q.life -= dt * 2.5f;
                      }
                      if (q.drag > 0) { float k = Math.max(0, 1 - q.drag * dt); q.vx *= k; q.vy *= k; }
                      q.size = Math.max(0.3f, q.size + q.grow * dt);
                      q.x += (q.vx + (q.wander > 0 ? (float) Math.sin(time * 2.3f + q.seed) * q.wander : 0)) * dt;
                      q.y += q.vy * dt;
                  }
              }

              void drawParts(Canvas c, boolean world) {
                  drawParts(c, world, 0);
              }

              /** mode 0: everything, 1: only smoke, 2: everything but smoke */
              void drawParts(Canvas c, boolean world, int mode) {
                  for (Part q : parts) {
                      if (q.world != world) continue;
                      if (mode == 1 && q.grow <= 0) continue;
                      if (mode == 2 && q.grow > 0) continue;
                      int a = (int) (255 * Math.min(1, q.life / q.max * 1.5f));
                      if (q.grow > 0) a = (int) (a * 0.5f);     // smoke is see-through
                      int col = (a << 24) | (q.color & 0xffffff);
                      if (!q.world && q.grow > 0) {
                          // fireplace smoke: soft-edged puffs, wide at the bottom, squeezed thinner as they rise
                          float fadeIn = Math.min(1, q.age / 1.5f);
                          int sa = (int) (a * 0.55f * fadeIn);
                          float sx = q.x + (float) Math.sin(time * 0.9f + q.seed) * 8;
                          float narrow = Math.max(0.15f, Math.min(1f, (q.y - q.flueTop) / 260f));
                          float rr = q.size * narrow;
                          if (rr < 2 || sa < 2) continue;
                          p.setShader(new RadialGradient(sx, q.y, rr, (sa << 24) | (q.color & 0xffffff), q.color & 0xffffff, Shader.TileMode.CLAMP));
                          c.drawCircle(sx, q.y, rr, p);
                          p.setShader(null);
                          continue;
                      }
                      if (q.glyph != null) {
                          tp.setColor(col);
                          tp.setTextSize(q.size);
                          tp.setTextAlign(Paint.Align.CENTER);
                          c.drawText(q.glyph, q.x, q.y, tp);
                      } else {
                          p.setColor(col);
                          c.drawCircle(q.x, q.y, q.size, p);
                      }
                  }
              }

              // ================================================================== drawing: island

              void drawIsland(Canvas c, List<AppPeng> list) {
                  // While napping, the view drifts slowly so nothing sits still on the screen
                  float driftX = (float) Math.sin(time * 0.07f) * 70 * afkDim, driftY = (float) Math.cos(time * 0.05f) * 35 * afkDim;
                  float ccx = freeCam ? fcX : px, ccy = freeCam ? fcY + 40 : py;
                  int camX = (int) Math.max(0, Math.min(WW - VW, ccx - VW / 2f + driftX));
                  int camY = (int) Math.max(0, Math.min(WH - VH, ccy - VH / 2f - 40 + driftY));
                  // Falling snow stays put in the world: when the view moves, the flakes slide the other way
                  if (lastCamX >= 0) {
                      float cdx = camX - lastCamX, cdy = camY - lastCamY;
                      if (Math.abs(cdx) < 200 && Math.abs(cdy) < 200 && (cdx != 0 || cdy != 0)) {
                          for (int i = 0; i < flX.length; i++) { flX[i] -= cdx; flY[i] -= cdy; }
                          for (int i = 0; i < stX.length; i++) { stX[i] -= cdx; stY[i] -= cdy; }
                      }
                  }
                  lastCamX = camX;
                  lastCamY = camY;
                  int season = activeSeason();
                  float night = nightAmount();

                  src.set(camX, camY, camX + VW, camY + VH);
                  dst.set(0, 0, VW, VH);
                  c.drawBitmap(world, src, dst, null);

                  c.save();
                  c.translate(-camX, -camY);

                  // Waves
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(2.2f);
                  for (int i = 0; i < waveX.length; i++) {
                      float x = waveX[i] + (float) Math.sin(time * 0.6f + wavePh[i]) * 8;
                      float y = waveY[i];
                      if (x < camX - 30 || x > camX + VW + 30 || y < camY - 20 || y > camY + VH + 20) continue;
                      int alpha = (int) (70 + 70 * Math.sin(time * 1.4f + wavePh[i]));
                      p.setColor((Math.max(0, alpha) << 24) | 0xffffff);
                      rf.set(x - 10, y - 4, x + 10, y + 4);
                      c.drawArc(rf, 200, 140, false, p);
                  }
                  p.setStyle(Paint.Style.FILL);

                  // Footprints and slide marks
                  for (int i = 0; i < trailX.length; i++) {
                      float age = trailAge[i];
                      if (age <= 0 || age > 7) continue;
                      int alpha = (int) (110 * (1 - age / 7f));
                      p.setColor((alpha << 24) | 0xa9bfd0);
                      if (trailSlide[i]) c.drawOval(trailX[i] - 9, trailY[i] - 4, trailX[i] + 9, trailY[i] + 4, p);
                      else c.drawOval(trailX[i] - 4, trailY[i] - 2, trailX[i] + 4, trailY[i] + 2, p);
                  }

                  // Seasonal ground decorations
                  drawSeasonGround(c, season, night);

                  // Snowball shadows
                  p.setColor(0x33000000);
                  for (Ball b : balls) c.drawOval(b.x - 6, b.y - 2.5f, b.x + 6, b.y + 2.5f, p);

                  // Penguins, back to front
                  Object tgt = launching != null ? launching : (sittingChair != null ? sittingChair : nearestTarget(list));
                  AppPeng near = tgt instanceof AppPeng ? (AppPeng) tgt : null;
                  Chair nearCh = tgt instanceof Chair ? (Chair) tgt : null;
                  List<Chair> chs = chairs;
                  drawList.clear();
                  drawList.addAll(list);
                  drawList.addAll(chs);
                  drawList.add(cdSpot);
                  drawList.add(iglooSpot);
                  drawList.add(bedSpot);
                  if (ezScene == SCENE_ISLAND) drawList.add(ezSpot);
                  drawList.add(this);
                  Collections.sort(drawList, (a, b) -> Float.compare(yOf(a), yOf(b)));
                  boolean xmas = season == SEASON_XMAS;
                  for (Object o : drawList) {
                      if (o == this) {
                          drawPlayer(c);
                      } else if (o == cdSpot) {
                          drawCdPlayer(c);
                      } else if (o == bedSpot) {
                          drawEzioBed(c);
                      } else if (o == ezSpot) {
                          drawEzio(c, ezX, ezY, 1f, ezFacing, ezMoving, ezSleeping, ezPhase, ezBlinkT > 0 || (ezHappyT > 0 && ezWhipT <= 0), season);
                      } else if (o == iglooSpot) {
                          c.drawBitmap(iglooBmp, IGLOO_X - 160, IGLOO_Y - 150, null);
                          if (xmas) drawIglooLights(c, night);
                      } else if (o instanceof Chair) {
                          drawChair(c, (Chair) o);
                      } else {
                          AppPeng a = (AppPeng) o;
                          if (a.x < camX - 80 || a.x > camX + VW + 80 || a.y < camY - 40 || a.y > camY + VH + 160) continue;
                          int e = a.emoteDelay > 0 ? E_NONE : a.emote;
                          drawPenguin(c, a.x, a.y, 1f, a.scarf, a.facing, a.phase, a.moving, false,
                                  e, a.emoteT, a.blinkT > 0 || e == E_NAP, xmas, a.hitT,
                                  bellyIcons ? a.bodyCol : PENGUIN_BLACK, bellyIcons ? a.icon : null,
                                  a.speaking && a.chatTalking);
                      }
                  }

                  // Snowballs in the air
                  p.setColor(0xffffffff);
                  for (Ball b : balls) {
                      float z = ballZ(b);
                      c.drawCircle(b.x, b.y - z, 6, p);
                  }
                  drawParts(c, true);

                  if (night > 0.05f) {
                      // firelight from the doorway: a soft glow made once, gently breathing (no hard flashes)
                      if (doorGlow == null) {
                          doorGlow = Bitmap.createBitmap(128, 128, Bitmap.Config.ARGB_8888);
                          Paint gp = new Paint(Paint.ANTI_ALIAS_FLAG);
                          gp.setShader(new RadialGradient(64, 64, 64, 0xffffb74d, 0x00ffb74d, Shader.TileMode.CLAMP));
                          new Canvas(doorGlow).drawCircle(64, 64, 64, gp);
                      }
                      float breathe = 0.85f + 0.1f * (float) Math.sin(time * 1.7f) + 0.05f * (float) Math.sin(time * 4.1f + 1);
                      Paint gpaint = new Paint();
                      gpaint.setAlpha((int) Math.max(0, Math.min(255, night * 150 * breathe)));
                      rf.set(IGLOO_X - 60, IGLOO_Y - 74, IGLOO_X + 60, IGLOO_Y + 46);
                      c.drawBitmap(doorGlow, null, rf, gpaint);
                  }
                  c.restore();

                  // Sky tint: night, clouds, fog
                  Weather w = weatherFx ? weather : null;
                  if (night > 0.01f) {
                      int tint = season == SEASON_HALLOWEEN ? 0x2a0f45 : 0x0a1440;
                      c.drawColor((((int) (night * 115)) << 24) | tint);
                  }
                  if (w != null && w.ok) {
                      if (w.cloud > 0) c.drawColor((((int) (w.cloud * 120)) << 24) | 0x5a6672);
                      if (w.fog > 0) c.drawColor((((int) (w.fog * 255)) << 24) | 0xe8eef2);
                  }

                  // Signs stay bright
                  c.save();
                  c.translate(-camX, -camY);
                  // Chair and CD player names only show when you walk up to them
                  if (nearCh != null && overlay == OV_NONE) drawChairSign(c, nearCh, true);
                  if (overlay == OV_NONE && "cd".equals(nearObject())) drawCdSign(c, true);
                  if (overlay == OV_NONE && "door".equals(nearObject())) drawNameTag(c, DOOR_X, DOOR_Y - 84, "Inside?");
                  for (AppPeng a : list) {
                      if (a.x < camX - 80 || a.x > camX + VW + 80 || a.y < camY - 40 || a.y > camY + VH + 160) continue;
                      drawSign(c, a, a == near);
                      if (a.speaking && a.chatTalking && a.bubble != null) {
                          drawBubble(c, a.x + (a.facing == LEFT ? -42 : 42), a.y - 58, a.bubble, a.facing == LEFT);
                      }
                  }
                  c.restore();

                  drawWeatherFx(c, w);
                  drawParts(c, false);
                  if (flash > 0) c.drawColor(((int) (flash * 170) << 24) | 0xffffff);

                  String msg = null;
                  if (overlay == OV_NONE && launching == null) {
                      if (near != null) msg = null;
                      else if (nearCh != null && sittingChair == null) msg = null;
                      else if (sittingChair != null) msg = "Switching to " + sittingChair.label + "…";
                      else {
                          String o = nearObject();
                          if (o != null) msg = objectLabel(o);
                          else if (time < 10) msg = "Arrows to waddle  ·  OK on a penguin opens it  ·  (i) opens the wheel";
                      }
                  }
                  drawHud(c, msg);
              }

              void drawPlayer(Canvas c) {
                  float hop = launching != null ? (float) Math.abs(Math.sin(launchT * 18)) * 14 : 0;
                  if (pEmote == E_SLIDE) {
                      drawSlider(c, px, py, facing, PLAYER_SCARF);
                      return;
                  }
                  int f = facing;
                  if (pEmote == E_LOOK) f = ((int) (pEmoteT / 0.55f)) % 3 == 1 ? LEFT : ((int) (pEmoteT / 0.55f)) % 3 == 2 ? RIGHT : DOWN;
                  if (pEmote == E_DANCE) f = ((int) (pEmoteT / 0.2f)) % 4;
                  drawPenguin(c, px, py - hop, 1.12f, PLAYER_SCARF, f, walkPhase, moving, true,
                          pEmote, pEmoteT, pBlinkT > 0 || pEmote == E_NAP, false, pHitT, PENGUIN_BLACK, null, false);
                  if (pHasBall && pEmote != E_THROW) {
                      // holding the snowball Ezio brought back
                      float bx = px + (f == LEFT ? -28 : 28), by = py - hop - 30;
                      p.setColor(0xffffffff);
                      c.drawCircle(bx, by, 6, p);
                      p.setColor(0xffcfd8dc);
                      c.drawCircle(bx + 1.5f, by + 1.5f, 3, p);
                  }
              }

              void drawSeasonGround(Canvas c, int season, float night) {
                  if (season == SEASON_XMAS) {
                      // Decorated tree with presents (right of the igloo; the CD player is on the left)
                      float tx = IGLOO_X + 215, ty = IGLOO_Y - 70;
                      drawTree(c, p, tx, ty, 1.5f);
                      int[] orn = {0xffe53935, 0xfffdd835, 0xff1e88e5, 0xffff80ab};
                      float[][] spots = {{-25, -40}, {18, -48}, {-12, -70}, {14, -88}, {-4, -100}, {28, -30}, {-30, -25}};
                      for (int i = 0; i < spots.length; i++) {
                          boolean tw = ((int) (time * 3) + i) % 4 != 0;
                          p.setColor(tw ? orn[i % orn.length] : 0xffffffff);
                          c.drawCircle(tx + spots[i][0], ty + spots[i][1], 4.5f, p);
                      }
                      p.setColor(0xffffd54f);
                      drawStar(c, tx, ty - 132, 11);
                      p.setColor(0xffe53935); c.drawRect(tx - 40, ty - 4, tx - 16, ty + 18, p);
                      p.setColor(0xfffdd835); c.drawRect(tx - 30, ty - 4, tx - 26, ty + 18, p);
                      p.setColor(0xff1e88e5); c.drawRect(tx + 14, ty - 2, tx + 36, ty + 18, p);
                      p.setColor(0xffffffff); c.drawRect(tx + 23, ty - 2, tx + 27, ty + 18, p);
                  } else if (season == SEASON_HALLOWEEN) {
                      float[][] pk = {{-48, 100}, {48, 100}, {-52, 160}, {52, 160}};
                      for (float[] q : pk) drawPumpkin(c, IGLOO_X + q[0], IGLOO_Y + q[1], night);
                  }
              }

              /** Christmas lights along the igloo, drawn on top of it. */
              void drawIglooLights(Canvas c, float night) {
                  for (int i = 0; i < 15; i++) {
                      double a = Math.toRadians(192 + i * (156.0 / 14));
                      float lx = IGLOO_X + (float) Math.cos(a) * 127;
                      float ly = IGLOO_Y + (float) Math.sin(a) * 127;
                      int col = LIGHT_COLS[i % LIGHT_COLS.length];
                      boolean on = ((int) (time * 2.5f) + i) % 3 != 0;
                      p.setColor(on ? col : 0xff555555);
                      c.drawCircle(lx, ly, 5, p);
                      if (on && night > 0.1f) {
                          p.setColor(((int) (night * 70) << 24) | (col & 0xffffff));
                          c.drawCircle(lx, ly, 12, p);
                      }
                  }
              }

              void drawStar(Canvas c, float x, float y, float r) {
                  path.reset();
                  for (int i = 0; i < 10; i++) {
                      double a = -Math.PI / 2 + i * Math.PI / 5;
                      float rr = i % 2 == 0 ? r : r * 0.45f;
                      float sx = x + (float) Math.cos(a) * rr, sy = y + (float) Math.sin(a) * rr;
                      if (i == 0) path.moveTo(sx, sy); else path.lineTo(sx, sy);
                  }
                  path.close();
                  c.drawPath(path, p);
              }

              void drawPumpkin(Canvas c, float x, float y, float night) {
                  p.setColor(0x30000000);
                  c.drawOval(x - 20, y - 5, x + 20, y + 5, p);
                  p.setColor(0xffef6c00);
                  c.drawOval(x - 20, y - 30, x + 20, y, p);
                  p.setColor(0xfff57c00);
                  c.drawOval(x - 9, y - 31, x + 9, y, p);
                  p.setColor(0xff558b2f);
                  c.drawRect(x - 2, y - 38, x + 2, y - 28, p);
                  float flick = 0.7f + 0.3f * (float) Math.sin(time * 13 + x);
                  p.setColor(night > 0.1f ? (0xff000000 | ((int) (255 * flick) << 16) | ((int) (200 * flick) << 8)) : 0xff3e2723);
                  path.reset();
                  path.moveTo(x - 10, y - 20); path.lineTo(x - 4, y - 20); path.lineTo(x - 7, y - 25); path.close();
                  path.moveTo(x + 4, y - 20); path.lineTo(x + 10, y - 20); path.lineTo(x + 7, y - 25); path.close();
                  c.drawPath(path, p);
                  rf.set(x - 10, y - 15, x + 10, y - 6);
                  c.drawArc(rf, 0, 180, true, p);
              }

              void drawWeatherFx(Canvas c, Weather w) {
                  int count;
                  boolean rain = false;
                  if (w == null || !w.ok) count = (int) (flX.length * 0.35f);
                  else if (w.precip == Weather.NONE) count = 0;
                  else { count = (int) (flX.length * Math.max(0.15f, w.intensity)); rain = w.precip == Weather.RAIN; }

                  if (rain) {
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(1.6f);
                      p.setColor(0x90cfe3f2);
                      float slant = w.windKmh * 0.25f * (float) Math.sin(Math.toRadians(w.windFromDeg + 180));
                      for (int i = 0; i < count; i++) c.drawLine(flX[i], flY[i], flX[i] + slant, flY[i] + 16, p);
                      p.setStyle(Paint.Style.FILL);
                  } else {
                      p.setColor(0xd0ffffff);
                      for (int i = 0; i < count; i++) c.drawCircle(flX[i], flY[i], flR[i], p);
                  }
                  // Blowing snow streaks on windy days
                  if (w != null && w.ok && w.windKmh > 18) {
                      float strength = Math.min(1, (w.windKmh - 18) / 30f);
                      double toward = Math.toRadians(w.windFromDeg + 180);
                      float ux = (float) Math.sin(toward), uy = (float) -Math.cos(toward) * 0.45f;
                      float ul = (float) Math.sqrt(ux * ux + uy * uy);
                      ux /= ul; uy /= ul;
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(2f);
                      p.setColor(((int) (strength * 110) << 24) | 0xffffff);
                      int n = (int) (stX.length * strength);
                      for (int i = 0; i < n; i++) c.drawLine(stX[i], stY[i], stX[i] - ux * stLen[i], stY[i] - uy * stLen[i], p);
                      p.setStyle(Paint.Style.FILL);
                  }
              }

              float yOf(Object o) {
                  if (o == this) return py;
                  if (o == cdSpot) return CD_Y;
                  if (o == iglooSpot) return IGLOO_Y - 12;
                  if (o == ezSpot) {
                      // whoever's patting him stands in front, so the flipper lands on top of his head
                      float y = ezY;
                      if (ezPatPeng != null && ezHappyT > 0) y = Math.min(y, ezPatPeng.y - 1);
                      if (ezPatPeng2 != null && ezHappyT > 0) y = Math.min(y, ezPatPeng2.y - 1);
                      if (pEmote == E_PAT || ezPatByYou) y = Math.min(y, py - 1);
                      return y;
                  }
                  if (o == bedSpot) return BED_Y - 6;
                  if (o instanceof Chair) return ((Chair) o).y;
                  return ((AppPeng) o).y;
              }

              float nightAmount() {
                  Calendar cal = Calendar.getInstance();
                  float hr = cal.get(Calendar.HOUR_OF_DAY) + cal.get(Calendar.MINUTE) / 60f;
                  if (hr >= 19) return Math.min(1f, (hr - 19) / 2f);
                  if (hr < 6) return 1f;
                  if (hr < 8) return 1f - (hr - 6) / 2f;
                  return 0f;
              }

              // ================================================================== drawing: igloo inside

              void drawRoom(Canvas c) {
                  c.drawBitmap(room, 0, 0, null);
                  int season = activeSeason();
                  // Fire
                  float fx = 640, fy = 290;
                  float flick = (float) Math.sin(time * 11) * 0.5f + (float) Math.sin(time * 17.3f) * 0.5f;
                  p.setShader(new RadialGradient(fx, fy + 40, 330 + flick * 12,
                          0x55ffb74d, 0x00ffb74d, Shader.TileMode.CLAMP));
                  c.drawCircle(fx, fy + 40, 330 + flick * 12, p);
                  p.setShader(null);
                  int[] flameCols = {0xffff7043, 0xffffa726, 0xffffeb3b};
                  for (int layer = 0; layer < 3; layer++) {
                      float scale = 1 - layer * 0.28f;
                      for (int i = -2; i <= 2; i++) {
                          float h = (55 + (float) Math.sin(time * (9 + i) + i * 2 + layer) * 14) * scale;
                          float bx = fx + i * 18 * scale;
                          path.reset();
                          path.moveTo(bx - 14 * scale, fy - 6);
                          path.quadTo(bx - 10 * scale, fy - h * 0.6f, bx + (float) Math.sin(time * 7 + i) * 5, fy - h);
                          path.quadTo(bx + 10 * scale, fy - h * 0.6f, bx + 14 * scale, fy - 6);
                          path.close();
                          p.setColor(flameCols[layer]);
                          c.drawPath(path, p);
                      }
                  }
                  // Seasonal touches
                  if (season == SEASON_XMAS) {
                      for (int i = 0; i < 3; i++) {
                          float sx = 560 + i * 70;
                          p.setColor(i == 1 ? 0xff43a047 : 0xffe53935);
                          c.drawRect(sx, 184, sx + 22, 222, p);
                          c.drawOval(sx - 4, 210, sx + 30, 230, p);
                          p.setColor(0xffffffff);
                          c.drawRect(sx - 2, 180, sx + 24, 192, p);
                      }
                  } else if (season == SEASON_HALLOWEEN) {
                      drawPumpkin(c, 735, 151, 1);
                  }

                  // Ezio's bed beside the fire
                  drawPetBed(c, ROOM_BED_X, ROOM_BED_Y + 7, 0.8f, false);
                  // Player (and a cozy chirp when sitting), with Ezio in front or behind depending on who's lower
                  boolean ezHere = ezScene == SCENE_IGLOO;
                  boolean ezInBed = ezHere && !ezMoving && Math.abs(ezX - ROOM_BED_X) < 14 && Math.abs(ezY - ROOM_BED_Y - 2) < 10;
                  boolean ezBehind = ezY < py || pEmote == E_PAT || ezPatByYou;     // you're patting him: your flipper goes on top
                  if (ezHere && ezBehind) drawEzio(c, ezX, ezInBed ? ROOM_BED_Y + 2 : ezY, 1.15f, ezFacing, ezMoving, ezSleeping, ezPhase, ezBlinkT > 0 || (ezHappyT > 0 && ezWhipT <= 0), season);
                  if (ezInBed && ezBehind) drawPetBed(c, ROOM_BED_X, ROOM_BED_Y + 7, 0.8f, true);
                  drawPlayer(c);
                  if (ezHere && !ezBehind) drawEzio(c, ezX, ezInBed ? ROOM_BED_Y + 2 : ezY, 1.15f, ezFacing, ezMoving, ezSleeping, ezPhase, ezBlinkT > 0 || (ezHappyT > 0 && ezWhipT <= 0), season);
                  if (ezInBed && !ezBehind) drawPetBed(c, ROOM_BED_X, ROOM_BED_Y + 7, 0.8f, true);
                  drawParts(c, true);
                  if (overlay == OV_NONE && "exit".equals(nearObject())) drawNameTag(c, 640, 712, "Outside");
                  if (overlay == OV_NONE && "tv".equals(nearObject()) && emulatorApp() != null) drawNameTag(c, 260, 204, "Games");

                  String msg = null;
                  if (overlay == OV_NONE) {
                      String o = nearObject();
                      msg = o != null ? objectLabel(o) : null;
                  }
                  drawHud(c, msg);
              }

              // ================================================================== drawing: penguins

              void drawPenguin(Canvas c, float x, float y, float s, int scarf, int face, float phase, boolean walking,
                               boolean player, int emote, float et, boolean blink, boolean xmasHat, float hitT,
                               int bodyCol, Bitmap bellyIcon, boolean talking) {
                  boolean sitting = emote == E_NAP || emote == E_SIT;
                  float hop = 0;
                  if (emote == E_HOP) hop = (float) Math.abs(Math.sin(et / 0.6f * Math.PI)) * 12;
                  if (emote == E_DANCE) hop = (float) Math.abs(Math.sin(et * 10)) * 10;
                  float shake = emote == E_FLINCH ? (float) Math.sin(et * 60) * 3 : 0;
                  final float bw = 24;

                  c.save();
                  c.translate(x + shake, y);
                  c.scale(s, s);

                  p.setColor(0x30000000);
                  c.drawOval(-27, -6, 27, 6, p);
                  c.translate(0, -hop);

                  float sway = walking ? (float) Math.sin(phase) * 7f : (float) Math.sin(phase * 0.5f) * 1.5f;
                  if (emote == E_DANCE) sway = (float) Math.sin(et * 9) * 12;
                  if (emote == E_HUG) sway = (face == RIGHT ? 9 : -9) + (float) Math.sin(et * 6) * 2;
                  c.rotate(sway);

                  float headY = sitting ? -43 : -52;

                  // Feet
                  p.setColor(0xffef8a3c);
                  if (sitting) {
                      c.drawOval(-16, -6, -3, 4, p);
                      c.drawOval(3, -6, 16, 4, p);
                  } else {
                      float lift = walking ? (float) Math.sin(phase) * 3f : 0;
                      float l1 = Math.max(0, lift), l2 = Math.max(0, -lift);
                      c.drawOval(-17, -5 - l1, -4, 2 - l1, p);
                      c.drawOval(4, -5 - l2, 17, 2 - l2, p);
                  }

                  // Flippers
                  float leftA = 18, rightA = -18;
                  float flap = walking ? (float) Math.sin(phase) * 14f : 0;
                  leftA += flap; rightA -= flap;
                  if (emote == E_FLAP || emote == E_DANCE) {
                      float f = (float) Math.sin(et * 22) * 35 + 25;
                      leftA = 18 + f; rightA = -18 - f;
                  } else if (emote == E_WAVE) {
                      rightA = -150 + (float) Math.sin(et * 16) * 28;
                  } else if (emote == E_SCRATCH) {
                      // flipper up to the side of the head, rubbing a little
                      float rub = (float) Math.sin(et * 14) * 8;
                      if (face == LEFT) rightA = -150 + rub; else if (face == RIGHT) leftA = 150 - rub; else rightA = -150 + rub;
                  } else if (emote == E_PAT) {
                      // front flipper reaches out and pats down three times
                      float lift = 0.5f + 0.5f * (float) Math.cos(et / 1.6f * 3 * 2 * Math.PI);
                      float ang = 110 + 30 * lift;        // up and over, coming down on top of his head
                      if (face == LEFT) leftA = ang; else rightA = -ang;
                  } else if (emote == E_THROW) {
                      // Overhand throw: wind the flipper up and back, then swing it over and across the body
                      float u = et / 0.45f;
                      if (u < 0.4f) rightA = -18 - (u / 0.4f) * 152;
                      else if (u < 0.62f) rightA = -170 + ((u - 0.4f) / 0.22f) * 215;
                      else rightA = 45 - Math.min(1, (u - 0.62f) / 0.38f) * 63;
                      leftA = 18 + (u > 0.4f && u < 0.7f ? 18 : 0);
                  } else if (emote == E_HUG) {
                      // Lean in and wrap the front flipper around the other penguin
                      float squeeze = (float) Math.sin(et * 6) * 6;
                      if (face == RIGHT) { rightA = -100 + squeeze; leftA = -35; }
                      else { leftA = 100 - squeeze; rightA = 35; }
                  } else if (emote == E_FLINCH) {
                      leftA = 60; rightA = -60;
                  } else if (talking) {
                      rightA = -30 - (float) Math.abs(Math.sin(time * 5)) * 25;
                  }
                  float shoulder = headY + 18;
                  p.setColor(bodyCol);
                  c.save();
                  c.rotate(leftA, -bw + 2, shoulder);
                  c.drawOval(-bw - 5, headY + 14, -bw + 6, headY + 38, p);
                  c.restore();
                  c.save();
                  c.rotate(rightA, bw - 2, shoulder);
                  c.drawOval(bw - 6, headY + 14, bw + 5, headY + 38, p);
                  c.restore();

                  // Body and head
                  c.drawOval(sitting ? -bw - 1 : -bw, headY - 2, sitting ? bw + 1 : bw, 0, p);
                  c.drawCircle(0, headY, 16, p);

                  if (face != UP) {
                      p.setColor(0xfffafcff);
                      float bcx;
                      if (face == DOWN) { c.drawOval(-18, headY + 9, 18, -3, p); bcx = 0; }
                      else if (face == LEFT) { c.drawOval(-22, headY + 11, 5, -4, p); bcx = -8; }
                      else { c.drawOval(-5, headY + 11, 22, -4, p); bcx = 8; }

                      if (bellyIcon != null) {
                          float bcy = (headY + 9 - 3) / 2f + 3;
                          float hw = face == DOWN ? 12 : 8, hh = face == DOWN ? 12 : 11;
                          rf.set(bcx - hw, bcy - hh, bcx + hw, bcy + hh);
                          c.drawBitmap(bellyIcon, null, rf, p);
                      }

                      float ex1, ex2, bx;
                      boolean twoEyes = face == DOWN;
                      if (face == DOWN) { ex1 = -6.5f; ex2 = 6.5f; bx = 0; }
                      else if (face == LEFT) { ex1 = -7.5f; ex2 = -7.5f; bx = -1; }
                      else { ex1 = 7.5f; ex2 = 7.5f; bx = 1; }
                      float eyeY = headY - 4 + (emote == E_PAT ? 1.2f : 0);
                      if (blink) {
                          p.setStyle(Paint.Style.STROKE);
                          p.setStrokeWidth(2);
                          p.setColor(0xfffafcff);
                          c.drawLine(ex1 - 3.5f, eyeY, ex1 + 3.5f, eyeY, p);
                          if (twoEyes) c.drawLine(ex2 - 3.5f, eyeY, ex2 + 3.5f, eyeY, p);
                          p.setStyle(Paint.Style.FILL);
                      } else {
                          p.setColor(0xffffffff);
                          c.drawCircle(ex1, eyeY, 4.4f, p);
                          if (twoEyes) c.drawCircle(ex2, eyeY, 4.4f, p);
                          p.setColor(0xff111111);
                          float look = face == LEFT ? -1 : face == RIGHT ? 1 : 0;
                          float down = emote == E_PAT ? 1.9f : 0.5f;     // looking down at Ezio while patting (eyes dip a touch too)
                          c.drawCircle(ex1 + look * (emote == E_PAT ? 1.6f : 1), eyeY + down, 2.2f, p);
                          if (twoEyes) c.drawCircle(ex2 + look * (emote == E_PAT ? 1.6f : 1), eyeY + down, 2.2f, p);
                      }
                      p.setColor(0xffffa726);
                      boolean open = talking && Math.sin(time * 22) > 0;
                      path.reset();
                      if (bx == 0) {
                          if (open) {
                              path.moveTo(-4.5f, headY + 1); path.lineTo(4.5f, headY + 1); path.lineTo(0, headY + 5); path.close();
                              path.moveTo(-3.5f, headY + 6); path.lineTo(3.5f, headY + 6); path.lineTo(0, headY + 10); path.close();
                          } else {
                              path.moveTo(-4.5f, headY + 1); path.lineTo(4.5f, headY + 1); path.lineTo(0, headY + 8); path.close();
                          }
                      } else {
                          if (open) {
                              path.moveTo(bx * 12, headY - 2); path.lineTo(bx * 12, headY + 1); path.lineTo(bx * 22, headY - 1); path.close();
                              path.moveTo(bx * 12, headY + 3); path.lineTo(bx * 12, headY + 6); path.lineTo(bx * 20, headY + 6); path.close();
                          } else {
                              path.moveTo(bx * 12, headY - 1); path.lineTo(bx * 12, headY + 5); path.lineTo(bx * 22, headY + 2); path.close();
                          }
                      }
                      c.drawPath(path, p);
                  }

                  // Scarf
                  p.setColor(scarf);
                  rf.set(-19, headY + 9, 19, headY + 16);
                  c.drawRoundRect(rf, 4, 4, p);
                  float tailX = face == LEFT ? 9 : face == RIGHT ? -16 : 6;
                  float wv = walking ? (float) Math.sin(phase * 1.3f) * 2 : 0;
                  rf.set(tailX, headY + 13, tailX + 7, headY + 27 + wv);
                  c.drawRoundRect(rf, 3, 3, p);

                  if (player) {
                      rf.set(-16, headY - 22, 16, headY + 2);
                      c.drawArc(rf, 180, 180, true, p);
                      p.setColor(0xffffffff);
                      rf.set(-17, headY - 13, 17, headY - 8);
                      c.drawRoundRect(rf, 2, 2, p);
                      c.drawCircle(0, headY - 22, 4.5f, p);
                  } else if (xmasHat) {
                      p.setColor(0xffd32f2f);
                      path.reset();
                      path.moveTo(-13, headY - 10); path.lineTo(13, headY - 10); path.lineTo(11, headY - 30); path.close();
                      c.drawPath(path, p);
                      p.setColor(0xffffffff);
                      rf.set(-14, headY - 13, 14, headY - 8);
                      c.drawRoundRect(rf, 2, 2, p);
                      c.drawCircle(11, headY - 30, 3.5f, p);
                  }

                  if (hitT > 0) {
                      int a = (int) (255 * Math.min(1, hitT));
                      p.setColor((a << 24) | 0xffffff);
                      c.drawCircle(-5, headY - 13, 7, p);
                      c.drawCircle(5, headY - 15, 6, p);
                      c.drawCircle(0, headY - 19, 5, p);
                  }
                  c.restore();
              }

              void drawSlider(Canvas c, float x, float y, int face, int scarf) {
                  c.save();
                  c.translate(x, y);
                  p.setColor(0x30000000);
                  c.drawOval(-36, -7, 36, 7, p);
                  if (face == LEFT || face == RIGHT) {
                      float d = face == LEFT ? -1 : 1;
                      c.scale(d, 1);
                      p.setColor(0xfffafcff);
                      c.drawOval(-30, -10, 26, 2, p);
                      p.setColor(0xff1b2230);
                      c.drawOval(-34, -24, 28, -2, p);
                      c.drawCircle(30, -12, 13, p);
                      c.drawOval(-12, -30, 6, -20, p);
                      p.setColor(0xffffa726);
                      path.reset(); path.moveTo(40, -15); path.lineTo(40, -9); path.lineTo(50, -12); path.close();
                      c.drawPath(path, p);
                      p.setColor(0xffffffff); c.drawCircle(35, -16, 3.5f, p);
                      p.setColor(0xff111111); c.drawCircle(36, -16, 1.8f, p);
                      p.setColor(scarf);
                      rf.set(14, -22, 20, -2);
                      c.drawRoundRect(rf, 3, 3, p);
                      p.setColor(0xffef8a3c);
                      c.drawOval(-44, -12, -32, -4, p);
                  } else {
                      boolean toward = face == DOWN;
                      p.setColor(0xff1b2230);
                      c.drawOval(-16, -44, 16, 0, p);
                      float hy = toward ? -6 : -40;
                      c.drawCircle(0, hy, 13, p);
                      c.drawOval(-30, -30, -12, -18, p);
                      c.drawOval(12, -30, 30, -18, p);
                      p.setColor(scarf);
                      rf.set(-14, toward ? -18 : -32, 14, toward ? -13 : -27);
                      c.drawRoundRect(rf, 3, 3, p);
                      if (toward) {
                          p.setColor(0xffffffff);
                          c.drawCircle(-5, -9, 3.6f, p); c.drawCircle(5, -9, 3.6f, p);
                          p.setColor(0xff111111);
                          c.drawCircle(-5, -8.5f, 1.8f, p); c.drawCircle(5, -8.5f, 1.8f, p);
                          p.setColor(0xffffa726);
                          path.reset(); path.moveTo(-4, -3); path.lineTo(4, -3); path.lineTo(0, 3); path.close();
                          c.drawPath(path, p);
                      } else {
                          p.setColor(0xffef8a3c);
                          c.drawOval(-12, -6, -2, 2, p); c.drawOval(2, -6, 12, 2, p);
                      }
                  }
                  c.restore();
              }

              void drawSign(Canvas c, AppPeng a, boolean highlight) {
                  float bob = (float) Math.sin(time * 2f + a.phase) * 3f;
                  if (bellyIcons) {
                      // Name floats over the head like a username in a game (above the Santa hat at Christmas)
                      // (or under their feet, so it doesn't fight with speech bubbles)
                      float bottom = a.y - (activeSeason() == SEASON_XMAS ? 92 : 74);
                      int body = a.bodyCol & 0xffffff;
                      if (namesBelow) {
                          if (highlight) drawNameTag(c, a.x, a.y + 40, a.label, tagColour ? 0xf0000000 | body : 0xe0263238);
                          else if (namesAlways) drawUsername(c, a.x, a.y + 26, a.label, tagColour ? 0xd8000000 | body : 0x99263238);
                          return;
                      }
                      if (highlight) drawNameTag(c, a.x, bottom - 4 + bob, a.label, tagColour ? 0xf0000000 | body : 0xe0263238);
                      else if (namesAlways) drawUsername(c, a.x, bottom, a.label, tagColour ? 0xd8000000 | body : 0x99263238);
                      return;
                  }
                  float s = highlight ? 1.35f : 1f;
                  float cx = a.x, cy = a.y - 86 + bob - (highlight ? 8 : 0);
                  float half = 20 * s;

                  p.setColor(0xffffffff);
                  path.reset();
                  path.moveTo(cx - 5, cy + half - 1); path.lineTo(cx + 5, cy + half - 1); path.lineTo(cx, cy + half + 7);
                  path.close();
                  c.drawPath(path, p);

                  p.setColor(0x40000000);
                  rf.set(cx - half + 2, cy - half + 3, cx + half + 2, cy + half + 3);
                  c.drawRoundRect(rf, 9, 9, p);
                  p.setColor(0xffffffff);
                  rf.set(cx - half, cy - half, cx + half, cy + half);
                  c.drawRoundRect(rf, 9, 9, p);
                  if (highlight) {
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(3.5f);
                      p.setColor(a.scarf);
                      c.drawRoundRect(rf, 9, 9, p);
                      p.setStyle(Paint.Style.FILL);
                  }
                  if (a.icon != null) {
                      float ih = 15.5f * s;
                      rf.set(cx - ih, cy - ih, cx + ih, cy + ih);
                      c.drawBitmap(a.icon, null, rf, p);
                  } else {
                      tp.setColor(0xff37474f);
                      tp.setTextSize(20 * s);
                      tp.setTextAlign(Paint.Align.CENTER);
                      c.drawText(a.label.substring(0, 1).toUpperCase(Locale.getDefault()), cx, cy + 7 * s, tp);
                  }
                  if (highlight) drawNameTag(c, cx, cy - half - 6, a.label);
              }

              void drawNameTag(Canvas c, float cx, float bottom, String label) {
                  drawNameTag(c, cx, bottom, label, 0xe0263238);
              }

              void drawNameTag(Canvas c, float cx, float bottom, String label, int bg) {
                  String name = label.length() > 22 ? label.substring(0, 21) + "…" : label;
                  tp.setTextSize(21);
                  tp.setTextAlign(Paint.Align.CENTER);
                  float tw = tp.measureText(name);
                  rf.set(cx - tw / 2 - 12, bottom - 32, cx + tw / 2 + 12, bottom);
                  p.setColor(bg);
                  c.drawRoundRect(rf, 14, 14, p);
                  tp.setColor(0xffffffff);
                  c.drawText(name, cx, bottom - 9, tp);
              }

              void drawUsername(Canvas c, float cx, float bottom, String label) {
                  drawUsername(c, cx, bottom, label, 0x99263238);
              }

              void drawUsername(Canvas c, float cx, float bottom, String label, int bg) {
                  String name = label.length() > 16 ? label.substring(0, 15) + "…" : label;
                  tp.setTextSize(14);
                  tp.setTextAlign(Paint.Align.CENTER);
                  float tw = tp.measureText(name);
                  rf.set(cx - tw / 2 - 7, bottom - 20, cx + tw / 2 + 7, bottom);
                  p.setColor(bg);
                  c.drawRoundRect(rf, 10, 10, p);
                  tp.setColor(0xffffffff);
                  c.drawText(name, cx, bottom - 5.5f, tp);
              }

              /** The CD player: a silver 2000s boombox with round speakers, a CD lid on top, a handle and an antenna. */
              void drawCdPlayer(Canvas c) {
                  float x = CD_X, y = CD_Y;
                  boolean playing = nowDisc != null && radioBusy();
                  float beat = playing ? (float) Math.abs(Math.sin(time * 7.5)) : 0;
                  c.save();
                  c.scale(0.6f, 0.6f, x, y);     // drawn at full detail, then shrunk to fit next to the igloo
                  // shadow
                  p.setColor(0x30000000);
                  c.drawOval(x - 72, y - 9, x + 72, y + 9, p);
                  // antenna (behind the body)
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(3);
                  p.setColor(0xff9aa4ae);
                  c.drawLine(x + 46, y - 66, x + 78, y - 128, p);
                  p.setStyle(Paint.Style.FILL);
                  p.setColor(0xffcfd6dd);
                  c.drawCircle(x + 78, y - 128, 3.5f, p);
                  // carry handle
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(7);
                  p.setColor(0xff8c96a0);
                  rf.set(x - 46, y - 104, x + 46, y - 50);
                  c.drawArc(rf, 195, 150, false, p);
                  p.setStrokeWidth(3);
                  p.setColor(0xffc5ccd3);
                  c.drawArc(rf, 200, 140, false, p);
                  p.setStyle(Paint.Style.FILL);
                  // rounded silver body
                  rf.set(x - 70, y - 72, x + 70, y - 2);
                  p.setShader(new LinearGradient(0, y - 72, 0, y - 2, 0xfff1f4f7, 0xff9ea8b2, Shader.TileMode.CLAMP));
                  c.drawRoundRect(rf, 32, 32, p);
                  p.setShader(null);
                  // darker band around the front
                  p.setColor(0xff7d8791);
                  rf.set(x - 66, y - 40, x + 66, y - 6);
                  c.drawRoundRect(rf, 18, 18, p);
                  // CD lid on top
                  p.setColor(0xffdfe5ea);
                  c.drawOval(x - 36, y - 80, x + 36, y - 58, p);
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(1.5f);
                  p.setColor(0xff8e98a2);
                  c.drawOval(x - 36, y - 80, x + 36, y - 58, p);
                  c.drawOval(x - 24, y - 75, x + 24, y - 63, p);
                  p.setStyle(Paint.Style.FILL);
                  // round speakers with mesh
                  for (int side = -1; side <= 1; side += 2) {
                      float sx = x + side * 44, sy = y - 28, r = 22 + beat * 1.5f;
                      p.setColor(0xff59626b);
                      c.drawCircle(sx, sy, r + 3, p);
                      p.setColor(0xffaab3bb);
                      c.drawCircle(sx, sy, r, p);
                      p.setColor(0xff6c757e);
                      for (float dx = -r + 3; dx < r; dx += 4.5f) {
                          for (float dy = -r + 3; dy < r; dy += 4.5f) {
                              if (dx * dx + dy * dy < (r - 2) * (r - 2)) c.drawCircle(sx + dx, sy + dy, 0.9f, p);
                          }
                      }
                  }
                  // middle panel: little display and buttons
                  p.setColor(0xffc9d0d7);
                  rf.set(x - 18, y - 52, x + 18, y - 10);
                  c.drawRoundRect(rf, 8, 8, p);
                  p.setColor(0xff1d2a24);
                  rf.set(x - 13, y - 47, x + 13, y - 34);
                  c.drawRoundRect(rf, 3, 3, p);
                  tp.setTextAlign(Paint.Align.CENTER);
                  tp.setTextSize(11);
                  tp.setColor(playing ? 0xff7cffb2 : (nowDisc != null ? 0xff3f8f63 : 0xff2f4a3c));
                  String lcd = nowDisc == null ? "--" : (playing ? (((int) (time * 1.5f)) % 2 == 0 ? "▶ " : "▶·") : "II");
                  c.drawText(lcd, x, y - 36.5f, tp);
                  p.setColor(0xff7d8791);
                  c.drawCircle(x - 8, y - 24, 3, p);
                  c.drawCircle(x, y - 24, 3, p);
                  c.drawCircle(x + 8, y - 24, 3, p);
                  p.setColor(playing ? 0xffff5252 : 0xff8d6e63);
                  c.drawCircle(x, y - 15, 2.2f, p);
                  // round buttons along the bottom edge
                  p.setColor(0xffe4e9ee);
                  for (int b = -1; b <= 1; b++) c.drawOval(x + b * 14 - 5, y - 8, x + b * 14 + 5, y - 3, p);
                  c.restore();
              }

              void drawCdSign(Canvas c, boolean highlight) {
                  String t = nowDisc != null ? "♪ " + nowDisc.name + (radioBusy() ? "" : " (paused)") : "CD player";
                  tp.setTextSize(highlight ? 19 : 15);
                  tp.setTextAlign(Paint.Align.CENTER);
                  float tw = tp.measureText(t);
                  float h = highlight ? 30 : 24;
                  float cy = CD_Y - 82 - (highlight ? 6 : 0);
                  rf.set(CD_X - tw / 2 - 14, cy - h, CD_X + tw / 2 + 14, cy);
                  p.setColor(highlight ? 0xff6a1b9a : 0xd0263238);
                  c.drawRoundRect(rf, h / 2, h / 2, p);
