              void initParticles() {
                  Random r = new Random(3);
                  int nw = 0;
                  waveX = new float[180]; waveY = new float[180]; wavePh = new float[180];
                  while (nw < 180) {
                      float x = r.nextFloat() * WW, y = r.nextFloat() * WH;
                      float ex = (x - CX) / (RX + 80), ey = (y - CY) / (RY + 65);
                      if (ex * ex + ey * ey < 1f) continue;
                      waveX[nw] = x; waveY[nw] = y; wavePh[nw] = r.nextFloat() * 6.28f;
                      nw++;
                  }
                  int ns = 240;
                  flX = new float[ns]; flY = new float[ns]; flSpd = new float[ns]; flR = new float[ns];
                  for (int i = 0; i < ns; i++) {
                      flX[i] = r.nextFloat() * VW;
                      flY[i] = r.nextFloat() * VH;
                      flSpd[i] = 0.6f + r.nextFloat() * 0.8f;
                      flR[i] = 1.2f + r.nextFloat() * 2f;
                  }
                  int nst = 45;
                  stX = new float[nst]; stY = new float[nst]; stLen = new float[nst];
                  for (int i = 0; i < nst; i++) {
                      stX[i] = r.nextFloat() * VW;
                      stY[i] = r.nextFloat() * VH;
                      stLen[i] = 25 + r.nextFloat() * 45;
                  }
              }

              // ================================================================== main loop

              void renderLoop() {
                  while (running) {
                      Canvas c = null;
                      try { c = holder.lockHardwareCanvas(); } catch (Exception ignored) { }
                      if (c == null) {
                          try { c = holder.lockCanvas(); } catch (Exception ignored) { }
                      }
                      if (c == null) {
                          try { Thread.sleep(16); } catch (InterruptedException ignored) { }
                          continue;
                      }
                      try {
                          long now = System.nanoTime();
                          float dt = Math.min(0.05f, (now - lastNs) / 1e9f);
                          lastNs = now;
                          time += dt;
                          List<AppPeng> list;
                          synchronized (lock) { list = apps; }
                          update(dt, list);
                          if (scene == SCENE_ISLAND) drawIsland(c, list);
                          else drawRoom(c);
                          drawOverlays(c);
                      } catch (Exception ex) {
                          // keep the loop alive no matter what
                      } finally {
                          try { holder.unlockCanvasAndPost(c); } catch (Exception ignored) { }
                      }
                  }
              }

              // ================================================================== update

              void update(float dt, List<AppPeng> list) {
                  // Scene fade
                  if (pendingScene >= 0) {
                      if (fadingOut) {
                          fade = Math.min(1, fade + dt * 4);
                          if (fade >= 1) { enterScene(pendingScene); fadingOut = false; }
                      } else {
                          fade = Math.max(0, fade - dt * 4);
                          if (fade <= 0) pendingScene = -1;
                      }
                  }

                  Integer k;
                  while ((k = keyQueue.poll()) != null) handleKey(k & ~REPEAT_FLAG, (k & REPEAT_FLAG) != 0, list);

                  boolean inputHeld = kUp || kDown || kLeft || kRight || axX != 0 || axY != 0;
                  boolean frozen = overlay != OV_NONE || pendingScene >= 0 || launching != null;

                  if (launching != null) {
                      launchT += dt;
                      if (launchT > 0.35f) { launch(launching); launching = null; }
                  }

                  // Player emotes
                  if (pEmote != E_NONE) {
                      pEmoteT += dt;
                      if (pEmote == E_THROW && pEmoteT >= 0.12f && pEmoteT - dt < 0.12f) throwBall(true, null, px, py, facing);
                      if (pEmote == E_DANCE && rnd.nextFloat() < dt * 3) spawnNote(px, py - 95);
                      if (pEmote == E_NAP) {
                          nextZ -= dt;
                          if (nextZ <= 0) { nextZ = 1.2f; spawnZ(px + 12, py - 70); }
                      }
                      boolean ends = pEmoteDur > 0 && pEmoteT >= pEmoteDur;
                      boolean cancel = (pEmote == E_NAP || pEmote == E_SIT || pEmote == E_LOOK) && inputHeld && !frozen;
                      if (ends || cancel) pEmote = E_NONE;
                  }

                  moving = false;
                  if (!frozen) {
                      if (pEmote == E_SLIDE) {
                          movePlayer(slideDX, slideDY, 520, dt, true);
                          moving = true;
                      } else if (pEmote == E_NONE || pEmote == E_LOOK) {
                          float dx = (kRight ? 1 : 0) - (kLeft ? 1 : 0) + axX;
                          float dy = (kDown ? 1 : 0) - (kUp ? 1 : 0) + axY;
                          float len = (float) Math.sqrt(dx * dx + dy * dy);
                          if (len > 0.2f) {
                              if (len > 1) { dx /= len; dy /= len; }
                              movePlayer(dx, dy, PLAYER_SPEED, dt, false);
                              moving = true;
                              if (Math.abs(dx) > Math.abs(dy)) facing = dx < 0 ? LEFT : RIGHT;
                              else facing = dy < 0 ? UP : DOWN;
                          }
                      }
                  }
                  walkPhase += dt * (moving ? 14f : 3f);
                  if (moving && pEmote != E_SLIDE) {
                      int stepNow = (int) (walkPhase / Math.PI);
                      if (stepNow != lastStep) {
                          lastStep = stepNow;
                          play(S_STEP, scene == SCENE_ISLAND ? 0.35f : 0.25f, 0.85f + rnd.nextFloat() * 0.3f);
                      }
                  }

                  // Idle animations
                  if (inputHeld || pEmote != E_NONE || frozen) {
                      if (inputHeld) idleT = 0;
                  } else {
                      idleT += dt;
                      if (idleT > 40 && scene == SCENE_ISLAND) {
                          startEmote(E_NAP, 0);
                      } else if (idleT > nextIdle) {
                          nextIdle = idleT + 4 + rnd.nextFloat() * 4;
                          int pick = rnd.nextInt(3);
                          if (pick == 0) { startEmote(E_LOOK, 1.6f); }
                          else if (pick == 1) startEmote(E_FLAP, 0.8f);
                          else startEmote(E_HOP, 0.6f);
                      }
                  }
                  if (idleT == 0) nextIdle = 7f;

                  pHitT = Math.max(0, pHitT - dt);
                  pNextBlink -= dt;
                  if (pNextBlink <= 0) { pBlinkT = 0.13f; pNextBlink = 2 + rnd.nextFloat() * 4; }
                  pBlinkT = Math.max(0, pBlinkT - dt);

                  for (int i = 0; i < trailAge.length; i++) if (trailAge[i] > 0) trailAge[i] += dt;

                  if (scene == SCENE_ISLAND) updateIsland(dt, list);

                  // "Say hi" chirp when a new thing comes into reach
                  String nk = "";
                  AppPeng near = scene == SCENE_ISLAND ? nearestApp(list) : null;
                  if (near != null) nk = near.pkg;
                  else {
                      String obj = nearObject();
                      if (obj != null) nk = obj;
                  }
                  if (!nk.equals(lastNearKey)) {
                      if (near != null) play(S_CHIRP, 0.4f, 0.85f + (near.pkg.hashCode() & 7) * 0.05f);
                      lastNearKey = nk;
                  }

                  updateParticles(dt);
              }

              void movePlayer(float dx, float dy, float speed, float dt, boolean slide) {
                  float nx = px + dx * speed * dt;
                  float ny = py + dy * speed * dt;
                  if (scene == SCENE_ISLAND) {
                      float ex = (nx - CX) / (RX - 35), ey = (ny - CY) / (RY - 30);
                      float e = ex * ex + ey * ey;
                      if (e > 1) {
                          float kk = (float) (1 / Math.sqrt(e));
                          nx = CX + (nx - CX) * kk;
                          ny = CY + (ny - CY) * kk;
                      }
                      float ix = (nx - IGLOO_X) / 140f, iy = (ny - (IGLOO_Y - 35)) / 58f;
                      float ie = ix * ix + iy * iy;
                      if (ie < 1) {
                          float kk = (float) (1 / Math.sqrt(Math.max(ie, 0.0001f)));
                          nx = IGLOO_X + (nx - IGLOO_X) * kk;
                          ny = (IGLOO_Y - 35) + (ny - (IGLOO_Y - 35)) * kk;
                      }
                  } else {
                      nx = Math.max(170, Math.min(1110, nx));
                      ny = Math.max(380, Math.min(660, ny));
                      // furniture
                      if (ny < 440 && nx > 160 && nx < 360) ny = 440;
                      if (ny < 440 && nx > 920 && nx < 1120) ny = 440;
                  }
                  float moved = Math.abs(nx - px) + Math.abs(ny - py);
                  px = nx;
                  py = ny;
                  trailDist += moved;
                  if (scene == SCENE_ISLAND && trailDist > (slide ? 7 : 16)) {
                      trailDist = 0;
                      trailHead = (trailHead + 1) % trailX.length;
                      trailX[trailHead] = px + (slide ? 0 : (trailHead % 2 == 0 ? -6 : 6));
                      trailY[trailHead] = py;
                      trailAge[trailHead] = 0.001f;
                      trailSlide[trailHead] = slide;
                  }
              }

              void startEmote(int e, float dur) {
                  pEmote = e;
                  pEmoteT = 0;
                  pEmoteDur = dur;
                  switch (e) {
                      case E_WAVE:
                          facing = DOWN;
                          if (scene == SCENE_ISLAND) for (AppPeng a : apps) {
                              if (dist2(a.x, a.y, px, py) < 320 * 320) npcEmote(a, E_WAVE, 1.4f, 0.3f + rnd.nextFloat() * 0.4f);
                          }
                          play(S_CHIRP, 0.45f, 1.1f);
                          break;
                      case E_DANCE:
                          if (scene == SCENE_ISLAND) for (AppPeng a : apps) {
                              if (dist2(a.x, a.y, px, py) < 280 * 280) npcEmote(a, E_DANCE, 3.2f, 0.2f + rnd.nextFloat() * 0.5f);
                          }
                          break;
                      case E_SLIDE:
                          slideDX = facing == LEFT ? -1 : facing == RIGHT ? 1 : 0;
                          slideDY = facing == UP ? -1 : facing == DOWN ? 1 : 0;
                          play(S_WHOOSH, 0.5f, 0.8f);
                          break;
                      case E_THROW:
                          play(S_WHOOSH, 0.45f, 1.3f);
                          break;
                      case E_LOOK:
                          break;
                      default:
                          break;
                  }
              }

              void npcEmote(AppPeng a, int e, float dur, float delay) {
                  a.emote = e;
                  a.emoteT = 0;
                  a.emoteDur = dur;
                  a.emoteDelay = delay;
              }

              void updateIsland(float dt, List<AppPeng> list) {
                  for (AppPeng a : list) {
                      a.hitT = Math.max(0, a.hitT - dt);
                      a.nextBlink -= dt;
                      if (a.nextBlink <= 0) { a.blinkT = 0.13f; a.nextBlink = 2 + rnd.nextFloat() * 5; }
                      a.blinkT = Math.max(0, a.blinkT - dt);

                      if (a.throwBackT > 0) {
                          a.throwBackT -= dt;
                          if (a.throwBackT <= 0) {
                              a.facing = faceToward(a.x, a.y, px, py);
                              npcEmote(a, E_THROW, 0.45f, 0);
                              throwBall(false, a, a.x, a.y, a.facing);
                          }
                      }

                      if (a.emote != E_NONE) {
                          if (a.emoteDelay > 0) {
                              a.emoteDelay -= dt;
                              if (a.emote == E_WAVE || a.emote == E_DANCE) a.facing = faceToward(a.x, a.y, px, py);
                          } else {
                              a.emoteT += dt;
                              if (a.emote == E_DANCE) {
                                  a.facing = ((int) (a.emoteT / 0.2f)) % 4;
                              }
                              if (a.emoteT >= a.emoteDur) a.emote = E_NONE;
                          }
                          a.moving = false;
                          a.phase += dt * 3;
                          continue;
                      }

                      float pdx = px - a.x, pdy = py - a.y;
                      if (pdx * pdx + pdy * pdy < 130 * 130 && scene == SCENE_ISLAND) {
                          a.moving = false;
                          a.facing = faceToward(a.x, a.y, px, py);
                      } else if (a.wait > 0) {
                          a.wait -= dt;
                          a.moving = false;
                          if (rnd.nextFloat() < dt * 0.06f) npcEmote(a, rnd.nextBoolean() ? E_HOP : E_FLAP, 0.7f, 0);
                      } else {
                          float dx = a.tx - a.x, dy = a.ty - a.y;
                          float d = (float) Math.sqrt(dx * dx + dy * dy);
                          if (d < 2) {
                              a.wait = 1.5f + rnd.nextFloat() * 3.5f;
                              a.tx = a.hx + (rnd.nextFloat() - 0.5f) * 90;
                              a.ty = a.hy + (rnd.nextFloat() - 0.5f) * 60;
                              a.moving = false;
                          } else {
                              float speed = d > 150 ? 110f : 32f;
                              float stepLen = Math.min(d, speed * dt);
                              a.x += dx / d * stepLen;
                              a.y += dy / d * stepLen;
                              a.moving = true;
                              a.facing = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? LEFT : RIGHT) : (dy < 0 ? UP : DOWN);
                          }
                      }
                      a.phase += dt * (a.moving ? 10f : 3f);
                  }

                  // Snowballs
                  for (Iterator<Ball> it = balls.iterator(); it.hasNext(); ) {
                      Ball b = it.next();
                      b.t += dt;
                      b.x += b.vx * dt;
                      b.y += b.vy * dt;
                      float z = ballZ(b);
                      boolean done = false;
                      if (b.fromPlayer) {
                          for (AppPeng a : list) {
                              if (z < 75 && dist2(a.x, a.y - 10, b.x, b.y) < 30 * 30) {
                                  a.hitT = 2.2f;
                                  a.facing = faceToward(a.x, a.y, px, py);
                                  npcEmote(a, E_FLINCH, 0.5f, 0);
                                  play(S_SPLAT, 0.6f, 1f);
                                  play(S_CHIRP, 0.45f, 1.35f);
                                  if (rnd.nextFloat() < 0.6f) a.throwBackT = 0.9f + rnd.nextFloat() * 0.5f;
                                  splat(b.x, b.y - z * 0.3f - 40);
                                  done = true;
                                  break;
                              }
                          }
                      } else if (z < 75 && dist2(px, py - 10, b.x, b.y) < 30 * 30) {
                          pHitT = 2.2f;
                          play(S_SPLAT, 0.6f, 0.9f);
                          splat(b.x, b.y - 45);
                          done = true;
                      }
                      if (!done && b.t >= b.dur) {
                          float ex = (b.x - CX) / RX, ey = (b.y - CY) / RY;
                          if (ex * ex + ey * ey > 1) splash(b.x, b.y); else splat(b.x, b.y);
                          play(S_SPLAT, 0.35f, 1.2f);
                          done = true;
                      }
                      if (done) it.remove();
                  }

                  // Seasonal extras
                  int season = activeSeason();
                  if (season == SEASON_NEWYEAR) {
                      nextFirework -= dt;
                      if (nextFirework <= 0) { nextFirework = 0.6f + rnd.nextFloat() * 1.2f; firework(); }
                  } else if (season == SEASON_VALENTINE) {
                      nextHeart -= dt;
                      if (nextHeart <= 0) { nextHeart = 0.5f + rnd.nextFloat(); heart(); }
                  }

                  // Weather particles
                  Weather w = weatherFx ? weather : null;
                  float windVX = 0, windVY = 0;
                  if (w != null && w.ok) {
                      double toward = Math.toRadians(w.windFromDeg + 180);
                      windVX = (float) Math.sin(toward) * w.windKmh * 5f;
                      windVY = (float) -Math.cos(toward) * w.windKmh * 2f;
                      if (w.thunder && rnd.nextFloat() < dt * 0.08f) flash = 1f;
                  }
                  flash = Math.max(0, flash - dt * 2.5f);
                  boolean rain = w != null && w.ok && w.precip == Weather.RAIN;
                  for (int i = 0; i < flX.length; i++) {
                      float fall = rain ? 700 * flSpd[i] : 45 * flSpd[i];
                      flY[i] += (fall + windVY * 0.3f) * dt;
                      flX[i] += (windVX * (rain ? 0.5f : 1f) + (rain ? 0 : (float) Math.sin(time * 0.8f + i) * 12f)) * dt;
                      if (flY[i] > VH + 10) { flY[i] = -10; flX[i] = rnd.nextFloat() * VW; }
                      if (flY[i] < -12) flY[i] = VH + 8;
                      if (flX[i] < -20) flX[i] += VW + 40;
                      if (flX[i] > VW + 20) flX[i] -= VW + 40;
                  }
                  for (int i = 0; i < stX.length; i++) {
                      stX[i] += windVX * 2.2f * dt;
                      stY[i] += windVY * 1.0f * dt;
                      if (stX[i] < -80) { stX[i] = VW + 60; stY[i] = rnd.nextFloat() * VH; }
                      if (stX[i] > VW + 80) { stX[i] = -60; stY[i] = rnd.nextFloat() * VH; }
                      if (stY[i] < -20) stY[i] = VH + 10;
                      if (stY[i] > VH + 20) stY[i] = -10;
                  }
              }

              float ballZ(Ball b) {
                  float u = b.t / b.dur;
                  return 30 * (1 - u) + 4 * 45 * u * (1 - u);
              }

              void throwBall(boolean fromPlayer, AppPeng owner, float x, float y, int face) {
                  Ball b = new Ball();
                  float dx = face == LEFT ? -1 : face == RIGHT ? 1 : 0;
                  float dy = face == UP ? -1 : face == DOWN ? 1 : 0;
                  if (!fromPlayer) {
                      float ddx = px - x, ddy = py - y;
                      float d = (float) Math.max(1, Math.sqrt(ddx * ddx + ddy * ddy));
                      dx = ddx / d; dy = ddy / d;
                  }
                  b.x = x + dx * 20;
                  b.y = y + dy * 10;
                  b.vx = dx * 520;
                  b.vy = dy * 520;
                  b.dur = 0.75f;
                  b.fromPlayer = fromPlayer;
                  b.owner = owner;
                  balls.add(b);
                  if (!fromPlayer) play(S_WHOOSH, 0.35f, 1.4f);
              }

              int faceToward(float x, float y, float tx, float ty) {
                  float dx = tx - x, dy = ty - y;
                  return Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? LEFT : RIGHT) : (dy < 0 ? UP : DOWN);
              }

              static float dist2(float x1, float y1, float x2, float y2) {
                  float dx = x1 - x2, dy = y1 - y2;
                  return dx * dx + dy * dy;
              }

              AppPeng nearestApp(List<AppPeng> list) {
                  AppPeng best = null;
                  float bd = NEAR_DIST * NEAR_DIST;
                  for (AppPeng a : list) {
                      float d = dist2(a.x, a.y, px, py);
                      if (d < bd) { bd = d; best = a; }
                  }
                  return best;
              }

              /** Non-penguin things you can use: the igloo door outside, furniture inside. */
              String nearObject() {
                  if (scene == SCENE_ISLAND) {
                      return dist2(px, py, DOOR_X, DOOR_Y + 20) < 70 * 70 ? "door" : null;
                  }
                  if (py > 615 && Math.abs(px - 640) < 110) return "exit";
                  if (px < 400 && py < 520) return "tv";
                  if (px > 880 && py < 520) return "shelf";
                  if (Math.abs(px - 640) < 140 && py < 470) return "fire";
                  return null;
              }

              String objectLabel(String o) {
                  switch (o) {
                      case "door": return "Press OK to go inside";
                      case "exit": return "Press OK to go outside";
                      case "tv": return "Press OK for TV Settings";
                      case "shelf": return "Press OK for Island settings";
                      case "fire": return "Press OK to warm up by the fire";
                      default: return "";
                  }
              }

              // ================================================================== key handling

              void handleKey(int code, boolean repeat, List<AppPeng> list) {
                  if (pendingScene >= 0) return;
                  boolean ok = code == KeyEvent.KEYCODE_DPAD_CENTER || code == KeyEvent.KEYCODE_ENTER
                          || code == KeyEvent.KEYCODE_NUMPAD_ENTER || code == KeyEvent.KEYCODE_BUTTON_A;
                  boolean back = code == KeyEvent.KEYCODE_BACK || code == KeyEvent.KEYCODE_BUTTON_B;
                  boolean menu = code == KeyEvent.KEYCODE_INFO || code == KeyEvent.KEYCODE_MENU
                          || code == KeyEvent.KEYCODE_GUIDE || code == KeyEvent.KEYCODE_BUTTON_Y
                          || code == KeyEvent.KEYCODE_BUTTON_START;
                  idleT = 0;
                  if (pEmote == E_NAP || pEmote == E_SIT || pEmote == E_LOOK) {
                      if (overlay == OV_NONE) pEmote = E_NONE;
                  }

                  if (overlay == OV_WHEEL) {
                      if (back || menu) { overlay = OV_NONE; play(S_TICK, 0.4f, 0.8f); return; }
                      if (code == KeyEvent.KEYCODE_DPAD_RIGHT || code == KeyEvent.KEYCODE_DPAD_DOWN) {
                          wheelSel = (wheelSel + 1) % 8; play(S_TICK, 0.4f, 1f);
                      } else if (code == KeyEvent.KEYCODE_DPAD_LEFT || code == KeyEvent.KEYCODE_DPAD_UP) {
                          wheelSel = (wheelSel + 7) % 8; play(S_TICK, 0.4f, 1f);
                      } else if (ok) {
                          overlay = OV_NONE;
                          wheelAction(wheelSel);
                      }
                      return;
                  }
                  if (overlay == OV_LIST) {
                      if (back) {
                          play(S_TICK, 0.4f, 0.8f);
                          if (listOnBack != null) listOnBack.run(); else overlay = OV_NONE;
                          return;
                      }
                      if (code == KeyEvent.KEYCODE_DPAD_DOWN) { listSel = Math.min(listItems.size() - 1, listSel + 1); play(S_TICK, 0.3f, 1f); }
                      else if (code == KeyEvent.KEYCODE_DPAD_UP) { listSel = Math.max(0, listSel - 1); play(S_TICK, 0.3f, 1f); }
                      else if (ok && !repeat && listSel < listItems.size()) {
                          Runnable r = listItems.get(listSel).action;
                          if (r != null) r.run();
                      }
                      return;
                  }

                  if (launching != null) return;
                  if (back) {
                      if (scene == SCENE_IGLOO) { goScene(SCENE_ISLAND); return; }
                      runOnUiThread(this::finish);
                      return;
                  }
                  if (menu) { openWheel(); return; }
                  if (code == KeyEvent.KEYCODE_BUTTON_X) { doSnowball(); return; }
                  if (code == KeyEvent.KEYCODE_BUTTON_L1) { startEmote(E_WAVE, 1.8f); return; }
                  if (code == KeyEvent.KEYCODE_BUTTON_R1) { startEmote(E_DANCE, 3.2f); return; }
                  if (ok) {
                      if (scene == SCENE_ISLAND) {
                          AppPeng a = nearestApp(list);
                          if (a != null) {
                              launching = a; launchT = 0;
                              pEmote = E_NONE;
                              play(S_OPEN, 0.5f, 1f);
                              return;
                          }
                      }
                      String o = nearObject();
                      if (o != null) { useObject(o); return; }
                      openWheel();
                  }
              }

              void openWheel() {
                  overlay = OV_WHEEL;
                  pEmote = E_NONE;
                  play(S_TICK, 0.45f, 1.2f);
              }

              void wheelAction(int i) {
                  switch (i) {
                      case 0: startEmote(E_WAVE, 1.8f); break;
                      case 1: startEmote(E_DANCE, 3.2f); break;
                      case 2: doSnowball(); break;
                      case 3: startEmote(E_SLIDE, 1.1f); break;
                      case 4: nextZ = 0.4f; startEmote(E_NAP, 0); break;
                      case 5: openAppsList(null); break;
                      case 6: openSettings(); break;
                      case 7: setMusic(!musicOn); break;
                  }
              }

              void doSnowball() {
                  if (scene != SCENE_ISLAND) return;
                  startEmote(E_THROW, 0.45f);
              }

              void useObject(String o) {
                  switch (o) {
                      case "door": play(S_DOOR, 0.5f, 1f); goScene(SCENE_IGLOO); break;
                      case "exit": play(S_DOOR, 0.5f, 0.9f); goScene(SCENE_ISLAND); break;
                      case "tv": play(S_OPEN, 0.5f, 0.9f); startIntent(new Intent(Settings.ACTION_SETTINGS), "Settings"); break;
                      case "shelf": openSettings(); break;
                      case "fire": facing = UP; startEmote(E_SIT, 0); break;
                  }
              }

              void goScene(int s) {
                  pendingScene = s;
                  fadingOut = true;
                  pEmote = E_NONE;
              }

              void enterScene(int s) {
                  if (s == SCENE_IGLOO) {
                      islandX = px; islandY = py;
                      px = 640; py = 640; facing = UP;
                  } else {
                      px = DOOR_X; py = DOOR_Y + 40; facing = DOWN;
                  }
                  scene = s;
                  lastNearKey = "";
              }

              void setMusic(boolean on) {
                  musicOn = on;
                  prefs.edit().putBoolean("music", on).apply();
                  play(S_TOGGLE, 0.5f, 1f);
                  updateMusic();
              }

              void openSettings() {
                  play(S_TICK, 0.45f, 1.1f);
                  listTitle = "Island settings";
                  listOnBack = null;
                  listItems.clear();
                  listItems.add(new Item("Choose which apps live on the island", "›", null, () -> openAppsList(() -> { listSel = 0; openSettings(); })));
                  listItems.add(new Item("Music", musicOn ? "On" : "Off", null, () -> { setMusic(!musicOn); refreshSettings(); }));
                  listItems.add(new Item("Sound effects", soundOn ? "On" : "Off", null, () -> {
                      soundOn = !soundOn;
                      prefs.edit().putBoolean("sound", soundOn).apply();
                      play(S_TOGGLE, 0.5f, 1f);
                      refreshSettings();
                  }));
                  listItems.add(new Item("Season", SEASON_PREF_NAMES[seasonPref], null, () -> {
                      seasonPref = (seasonPref + 1) % SEASON_PREF_NAMES.length;
                      prefs.edit().putInt("season", seasonPref).apply();
                      play(S_TOGGLE, 0.5f, 1f);
                      refreshSettings();
                  }));
                  listItems.add(new Item("Weather on the island", weatherFx ? "On" : "Off", null, () -> {
                      weatherFx = !weatherFx;
                      prefs.edit().putBoolean("weatherfx", weatherFx).apply();
                      play(S_TOGGLE, 0.5f, 1f);
                      refreshSettings();
                  }));
                  listItems.add(new Item("Reset most-used order", "", null, () -> {
                      SharedPreferences.Editor ed = prefs.edit();
                      synchronized (lock) {
                          for (AppPeng a : allApps) { a.launches = 0; ed.remove("n_" + a.pkg); }
                          relayout();
                      }
                      ed.apply();
                      play(S_TOGGLE, 0.5f, 0.8f);
                  }));
                  listItems.add(new Item("Close", "", null, () -> overlay = OV_NONE));
                  listSel = Math.min(listSel, listItems.size() - 1);
                  if (overlay != OV_LIST) { listSel = 0; listScroll = 0; }
                  overlay = OV_LIST;
              }

              void refreshSettings() {
                  int keep = listSel;
                  openSettings();
                  listSel = keep;
              }

              void openAppsList(Runnable onBack) {
                  play(S_TICK, 0.45f, 1.1f);
                  listTitle = "Apps on the island";
                  listOnBack = onBack;
                  listItems.clear();
                  List<AppPeng> all;
                  synchronized (lock) { all = allApps; }
                  for (AppPeng a : all) {
                      final AppPeng app = a;
                      final Item[] holderItem = new Item[1];
                      holderItem[0] = new Item(a.label, hidden.contains(a.pkg) ? "Hidden" : "On island", a.icon, () -> {
                          if (hidden.contains(app.pkg)) hidden.remove(app.pkg); else hidden.add(app.pkg);
                          prefs.edit().putStringSet("hidden", new HashSet<>(hidden)).apply();
                          holderItem[0].value = hidden.contains(app.pkg) ? "Hidden" : "On island";
                          synchronized (lock) { relayout(); }
                          play(S_TOGGLE, 0.5f, hidden.contains(app.pkg) ? 0.8f : 1.1f);
                      });
                      listItems.add(holderItem[0]);
                  }
                  listItems.add(new Item("Done", "", null, () -> {
                      if (listOnBack != null) listOnBack.run(); else overlay = OV_NONE;
                  }));
                  listSel = 0;
                  listScroll = 0;
                  overlay = OV_LIST;
              }

              // ================================================================== particles

              Part part(float x, float y, boolean world) {
                  if (parts.size() > 500) parts.remove(0);
                  Part q = new Part();
                  q.x = x; q.y = y; q.world = world;
                  parts.add(q);
                  return q;
              }

              void splat(float x, float y) {
                  for (int i = 0; i < 12; i++) {
                      Part q = part(x, y, true);
                      double a = rnd.nextDouble() * Math.PI * 2;
                      float s = 60 + rnd.nextFloat() * 110;
                      q.vx = (float) Math.cos(a) * s; q.vy = (float) Math.sin(a) * s - 60;
                      q.g = 320; q.max = q.life = 0.5f + rnd.nextFloat() * 0.3f;
                      q.size = 2 + rnd.nextFloat() * 3; q.color = 0xffffffff;
                  }
              }

              void splash(float x, float y) {
                  for (int i = 0; i < 10; i++) {
                      Part q = part(x, y, true);
                      double a = rnd.nextDouble() * Math.PI * 2;
                      float s = 40 + rnd.nextFloat() * 70;
                      q.vx = (float) Math.cos(a) * s; q.vy = (float) Math.sin(a) * s - 90;
                      q.g = 300; q.max = q.life = 0.6f; q.size = 2.5f; q.color = 0xffbbdefb;
                  }
              }

              void spawnNote(float x, float y) {
                  Part q = part(x + (rnd.nextFloat() - 0.5f) * 30, y, true);
                  q.vx = (rnd.nextFloat() - 0.5f) * 30; q.vy = -45; q.max = q.life = 1.4f;
                  q.glyph = rnd.nextBoolean() ? "♪" : "♫"; q.size = 24; q.color = 0xff3949ab;
              }

              void spawnZ(float x, float y) {
                  Part q = part(x, y, true);
                  q.vx = 14; q.vy = -28; q.max = q.life = 1.8f;
                  q.glyph = "z"; q.size = 20; q.color = 0xff5c6bc0;
              }

              void firework() {
                  float x = 150 + rnd.nextFloat() * (VW - 300), y = 70 + rnd.nextFloat() * 220;
                  int col = SCARVES[rnd.nextInt(SCARVES.length)];
                  for (int i = 0; i < 36; i++) {
                      Part q = part(x, y, false);
                      double a = Math.PI * 2 * i / 36;
                      float s = 110 + rnd.nextFloat() * 90;
                      q.vx = (float) Math.cos(a) * s; q.vy = (float) Math.sin(a) * s;
                      q.g = 70; q.max = q.life = 1.3f + rnd.nextFloat() * 0.4f; q.size = 2.6f; q.color = col;
                  }
              }

              void heart() {
                  Part q = part(rnd.nextFloat() * VW, VH + 20, false);
                  q.vx = (rnd.nextFloat() - 0.5f) * 20; q.vy = -50 - rnd.nextFloat() * 40;
                  q.max = q.life = 9; q.glyph = "♥"; q.size = 22 + rnd.nextFloat() * 16;
                  q.color = rnd.nextBoolean() ? 0xffe91e63 : 0xffff80ab;
              }

              void updateParticles(float dt) {
                  for (Iterator<Part> it = parts.iterator(); it.hasNext(); ) {
                      Part q = it.next();
                      q.life -= dt;
                      if (q.life <= 0) { it.remove(); continue; }
                      q.vy += q.g * dt;
                      q.x += q.vx * dt;
                      q.y += q.vy * dt;
                  }
              }

              void drawParts(Canvas c, boolean world) {
                  for (Part q : parts) {
                      if (q.world != world) continue;
                      int a = (int) (255 * Math.min(1, q.life / q.max * 1.5f));
                      int col = (a << 24) | (q.color & 0xffffff);
                      if (q.glyph != null) {
                          tp.setColor(col);
                          tp.setTextSize(q.size);
                          tp.setTextAlign(Paint.Align.CENTER);
                          c.drawText(q.glyph, q.x, q.y, tp);
                      } else {
                          p.setColor(col);
                          c.drawCircle(q.x, q.y, q.size, p);
                      }
                  }
              }

              // ================================================================== drawing: island

              void drawIsland(Canvas c, List<AppPeng> list) {
                  int camX = (int) Math.max(0, Math.min(WW - VW, px - VW / 2f));
                  int camY = (int) Math.max(0, Math.min(WH - VH, py - VH / 2f - 40));
                  int season = activeSeason();
                  float night = nightAmount();

                  src.set(camX, camY, camX + VW, camY + VH);
                  dst.set(0, 0, VW, VH);
                  c.drawBitmap(world, src, dst, null);

                  c.save();
                  c.translate(-camX, -camY);

                  // Waves
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(2.2f);
                  for (int i = 0; i < waveX.length; i++) {
                      float x = waveX[i] + (float) Math.sin(time * 0.6f + wavePh[i]) * 8;
                      float y = waveY[i];
                      if (x < camX - 30 || x > camX + VW + 30 || y < camY - 20 || y > camY + VH + 20) continue;
                      int alpha = (int) (70 + 70 * Math.sin(time * 1.4f + wavePh[i]));
                      p.setColor((Math.max(0, alpha) << 24) | 0xffffff);
                      rf.set(x - 10, y - 4, x + 10, y + 4);
                      c.drawArc(rf, 200, 140, false, p);
                  }
                  p.setStyle(Paint.Style.FILL);

                  // Footprints and slide marks
                  for (int i = 0; i < trailX.length; i++) {
                      float age = trailAge[i];
                      if (age <= 0 || age > 7) continue;
                      int alpha = (int) (110 * (1 - age / 7f));
                      p.setColor((alpha << 24) | 0xa9bfd0);
                      if (trailSlide[i]) c.drawOval(trailX[i] - 9, trailY[i] - 4, trailX[i] + 9, trailY[i] + 4, p);
                      else c.drawOval(trailX[i] - 4, trailY[i] - 2, trailX[i] + 4, trailY[i] + 2, p);
                  }

                  // Seasonal ground decorations
                  drawSeasonGround(c, season, night);

                  // Snowball shadows
                  p.setColor(0x33000000);
                  for (Ball b : balls) c.drawOval(b.x - 6, b.y - 2.5f, b.x + 6, b.y + 2.5f, p);

                  // Penguins, back to front
                  AppPeng near = launching != null ? launching : nearestApp(list);
                  drawList.clear();
                  drawList.addAll(list);
                  drawList.add(this);
                  Collections.sort(drawList, (a, b) -> Float.compare(yOf(a), yOf(b)));
                  boolean xmas = season == SEASON_XMAS;
                  for (Object o : drawList) {
                      if (o == this) {
                          drawPlayer(c);
                      } else {
                          AppPeng a = (AppPeng) o;
                          if (a.x < camX - 80 || a.x > camX + VW + 80 || a.y < camY - 40 || a.y > camY + VH + 160) continue;
                          int e = a.emoteDelay > 0 ? E_NONE : a.emote;
                          drawPenguin(c, a.x, a.y, 1f, a.scarf, a.facing, a.phase, a.moving, false,
                                  e, a.emoteT, a.blinkT > 0, xmas, a.hitT);
                      }
                  }

                  // Snowballs in the air
                  p.setColor(0xffffffff);
                  for (Ball b : balls) {
                      float z = ballZ(b);
                      c.drawCircle(b.x, b.y - z, 6, p);
                  }
                  drawParts(c, true);

                  if (night > 0.05f) {
                      p.setShader(new RadialGradient(IGLOO_X, IGLOO_Y - 14, 60,
                              (((int) (night * 150)) << 24) | 0xffb74d, 0x00ffb74d, Shader.TileMode.CLAMP));
                      c.drawCircle(IGLOO_X, IGLOO_Y - 14, 60, p);
                      p.setShader(null);
                  }
                  c.restore();

                  // Sky tint: night, clouds, fog
                  Weather w = weatherFx ? weather : null;
                  if (night > 0.01f) {
                      int tint = season == SEASON_HALLOWEEN ? 0x2a0f45 : 0x0a1440;
                      c.drawColor((((int) (night * 115)) << 24) | tint);
                  }
                  if (w != null && w.ok) {
                      if (w.cloud > 0) c.drawColor((((int) (w.cloud * 120)) << 24) | 0x5a6672);
                      if (w.fog > 0) c.drawColor((((int) (w.fog * 255)) << 24) | 0xe8eef2);
                  }

                  // Signs stay bright
                  c.save();
                  c.translate(-camX, -camY);
                  for (AppPeng a : list) {
                      if (a.x < camX - 80 || a.x > camX + VW + 80 || a.y < camY - 40 || a.y > camY + VH + 160) continue;
                      drawSign(c, a, a == near);
                  }
                  c.restore();

                  drawWeatherFx(c, w);
                  drawParts(c, false);
                  if (flash > 0) c.drawColor(((int) (flash * 170) << 24) | 0xffffff);

                  String msg = null;
                  if (overlay == OV_NONE && launching == null) {
                      if (near != null) msg = "Press OK to open " + near.label;
                      else {
                          String o = nearObject();
                          if (o != null) msg = objectLabel(o);
                          else if (time < 10) msg = "Arrows to waddle  ·  OK on a penguin opens it  ·  OK anywhere else opens the wheel";
                      }
                  }
                  drawHud(c, msg);
              }

              void drawPlayer(Canvas c) {
                  float hop = launching != null ? (float) Math.abs(Math.sin(launchT * 18)) * 14 : 0;
                  if (pEmote == E_SLIDE) {
                      drawSlider(c, px, py, facing, PLAYER_SCARF);
                      return;
                  }
                  int f = facing;
                  if (pEmote == E_LOOK) f = ((int) (pEmoteT / 0.55f)) % 3 == 1 ? LEFT : ((int) (pEmoteT / 0.55f)) % 3 == 2 ? RIGHT : DOWN;
                  if (pEmote == E_DANCE) f = ((int) (pEmoteT / 0.2f)) % 4;
                  drawPenguin(c, px, py - hop, 1.12f, PLAYER_SCARF, f, walkPhase, moving, true,
                          pEmote, pEmoteT, pBlinkT > 0 || pEmote == E_NAP, false, pHitT);
              }

              void drawSeasonGround(Canvas c, int season, float night) {
                  if (season == SEASON_XMAS) {
                      // Lights along the igloo
                      for (int i = 0; i < 15; i++) {
                          double a = Math.toRadians(192 + i * (156.0 / 14));
                          float lx = IGLOO_X + (float) Math.cos(a) * 127;
                          float ly = IGLOO_Y + (float) Math.sin(a) * 127;
                          int col = LIGHT_COLS[i % LIGHT_COLS.length];
                          boolean on = ((int) (time * 2.5f) + i) % 3 != 0;
                          p.setColor(on ? col : 0xff555555);
                          c.drawCircle(lx, ly, 5, p);
                          if (on && night > 0.1f) {
                              p.setColor(((int) (night * 70) << 24) | (col & 0xffffff));
                              c.drawCircle(lx, ly, 12, p);
                          }
                      }
                      // Decorated tree with presents
                      float tx = IGLOO_X + 200, ty = IGLOO_Y + 15;
                      drawTree(c, p, tx, ty, 1.5f);
                      int[] orn = {0xffe53935, 0xfffdd835, 0xff1e88e5, 0xffff80ab};
                      float[][] spots = {{-25, -40}, {18, -48}, {-12, -70}, {14, -88}, {-4, -100}, {28, -30}, {-30, -25}};
                      for (int i = 0; i < spots.length; i++) {
                          boolean tw = ((int) (time * 3) + i) % 4 != 0;
                          p.setColor(tw ? orn[i % orn.length] : 0xffffffff);
                          c.drawCircle(tx + spots[i][0], ty + spots[i][1], 4.5f, p);
                      }
                      p.setColor(0xffffd54f);
                      drawStar(c, tx, ty - 132, 11);
                      p.setColor(0xffe53935); c.drawRect(tx - 40, ty - 4, tx - 16, ty + 18, p);
                      p.setColor(0xfffdd835); c.drawRect(tx - 30, ty - 4, tx - 26, ty + 18, p);
                      p.setColor(0xff1e88e5); c.drawRect(tx + 14, ty - 2, tx + 36, ty + 18, p);
                      p.setColor(0xffffffff); c.drawRect(tx + 23, ty - 2, tx + 27, ty + 18, p);
                  } else if (season == SEASON_HALLOWEEN) {
                      float[][] pk = {{-170, 50}, {-110, 75}, {110, 75}, {170, 50}, {230, 10}, {-230, 10}};
                      for (float[] q : pk) drawPumpkin(c, IGLOO_X + q[0], IGLOO_Y + q[1], night);
                  }
              }

              void drawStar(Canvas c, float x, float y, float r) {
                  path.reset();
                  for (int i = 0; i < 10; i++) {
                      double a = -Math.PI / 2 + i * Math.PI / 5;
                      float rr = i % 2 == 0 ? r : r * 0.45f;
                      float sx = x + (float) Math.cos(a) * rr, sy = y + (float) Math.sin(a) * rr;
                      if (i == 0) path.moveTo(sx, sy); else path.lineTo(sx, sy);
                  }
                  path.close();
                  c.drawPath(path, p);
              }

              void drawPumpkin(Canvas c, float x, float y, float night) {
                  p.setColor(0x30000000);
                  c.drawOval(x - 20, y - 5, x + 20, y + 5, p);
                  p.setColor(0xffef6c00);
                  c.drawOval(x - 20, y - 30, x + 20, y, p);
                  p.setColor(0xfff57c00);
                  c.drawOval(x - 9, y - 31, x + 9, y, p);
                  p.setColor(0xff558b2f);
                  c.drawRect(x - 2, y - 38, x + 2, y - 28, p);
                  float flick = 0.7f + 0.3f * (float) Math.sin(time * 13 + x);
                  p.setColor(night > 0.1f ? (0xff000000 | ((int) (255 * flick) << 16) | ((int) (200 * flick) << 8)) : 0xff3e2723);
                  path.reset();
                  path.moveTo(x - 10, y - 20); path.lineTo(x - 4, y - 20); path.lineTo(x - 7, y - 25); path.close();
                  path.moveTo(x + 4, y - 20); path.lineTo(x + 10, y - 20); path.lineTo(x + 7, y - 25); path.close();
                  c.drawPath(path, p);
                  rf.set(x - 10, y - 15, x + 10, y - 6);
                  c.drawArc(rf, 0, 180, true, p);
              }

              void drawWeatherFx(Canvas c, Weather w) {
                  int count;
                  boolean rain = false;
                  if (w == null || !w.ok) count = (int) (flX.length * 0.35f);
                  else if (w.precip == Weather.NONE) count = 0;
                  else { count = (int) (flX.length * Math.max(0.15f, w.intensity)); rain = w.precip == Weather.RAIN; }

                  if (rain) {
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(1.6f);
                      p.setColor(0x90cfe3f2);
                      float slant = w.windKmh * 0.25f * (float) Math.sin(Math.toRadians(w.windFromDeg + 180));
                      for (int i = 0; i < count; i++) c.drawLine(flX[i], flY[i], flX[i] + slant, flY[i] + 16, p);
                      p.setStyle(Paint.Style.FILL);
                  } else {
                      p.setColor(0xd0ffffff);
                      for (int i = 0; i < count; i++) c.drawCircle(flX[i], flY[i], flR[i], p);
                  }
                  // Blowing snow streaks on windy days
                  if (w != null && w.ok && w.windKmh > 18) {
                      float strength = Math.min(1, (w.windKmh - 18) / 30f);
                      double toward = Math.toRadians(w.windFromDeg + 180);
                      float ux = (float) Math.sin(toward), uy = (float) -Math.cos(toward) * 0.45f;
                      float ul = (float) Math.sqrt(ux * ux + uy * uy);
                      ux /= ul; uy /= ul;
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(2f);
                      p.setColor(((int) (strength * 110) << 24) | 0xffffff);
                      int n = (int) (stX.length * strength);
                      for (int i = 0; i < n; i++) c.drawLine(stX[i], stY[i], stX[i] - ux * stLen[i], stY[i] - uy * stLen[i], p);
                      p.setStyle(Paint.Style.FILL);
                  }
              }

              float yOf(Object o) {
                  return o == this ? py : ((AppPeng) o).y;
              }

              float nightAmount() {
                  Calendar cal = Calendar.getInstance();
                  float hr = cal.get(Calendar.HOUR_OF_DAY) + cal.get(Calendar.MINUTE) / 60f;
                  if (hr >= 19) return Math.min(1f, (hr - 19) / 2f);
                  if (hr < 6) return 1f;
                  if (hr < 8) return 1f - (hr - 6) / 2f;
                  return 0f;
              }

              // ================================================================== drawing: igloo inside

              void drawRoom(Canvas c) {
                  c.drawBitmap(room, 0, 0, null);
                  int season = activeSeason();
                  // Fire
                  float fx = 640, fy = 290;
                  float flick = (float) Math.sin(time * 11) * 0.5f + (float) Math.sin(time * 17.3f) * 0.5f;
                  p.setShader(new RadialGradient(fx, fy + 40, 330 + flick * 12,
                          0x55ffb74d, 0x00ffb74d, Shader.TileMode.CLAMP));
                  c.drawCircle(fx, fy + 40, 330 + flick * 12, p);
                  p.setShader(null);
                  int[] flameCols = {0xffff7043, 0xffffa726, 0xffffeb3b};
                  for (int layer = 0; layer < 3; layer++) {
                      float scale = 1 - layer * 0.28f;
                      for (int i = -2; i <= 2; i++) {
                          float h = (55 + (float) Math.sin(time * (9 + i) + i * 2 + layer) * 14) * scale;
                          float bx = fx + i * 18 * scale;
                          path.reset();
                          path.moveTo(bx - 14 * scale, fy - 6);
                          path.quadTo(bx - 10 * scale, fy - h * 0.6f, bx + (float) Math.sin(time * 7 + i) * 5, fy - h);
                          path.quadTo(bx + 10 * scale, fy - h * 0.6f, bx + 14 * scale, fy - 6);
                          path.close();
                          p.setColor(flameCols[layer]);
                          c.drawPath(path, p);
                      }
                  }
                  // Seasonal touches
                  if (season == SEASON_XMAS) {
                      for (int i = 0; i < 3; i++) {
                          float sx = 560 + i * 70;
                          p.setColor(i == 1 ? 0xff43a047 : 0xffe53935);
                          c.drawRect(sx, 128, sx + 22, 168, p);
                          c.drawOval(sx - 4, 156, sx + 30, 176, p);
                          p.setColor(0xffffffff);
                          c.drawRect(sx - 2, 124, sx + 24, 136, p);
                      }
                  } else if (season == SEASON_HALLOWEEN) {
                      drawPumpkin(c, 720, 108, 1);
                  }

                  // Player (and a cozy chirp when sitting)
                  drawPlayer(c);
                  drawParts(c, true);

                  String msg = null;
                  if (overlay == OV_NONE) {
                      String o = nearObject();
                      if (o != null) msg = objectLabel(o);
                      else msg = "Back to go outside";
                  }
                  drawHud(c, msg);
              }

              // ================================================================== drawing: penguins

              void drawPenguin(Canvas c, float x, float y, float s, int scarf, int face, float phase, boolean walking,
                               boolean player, int emote, float et, boolean blink, boolean xmasHat, float hitT) {
                  boolean sitting = emote == E_NAP || emote == E_SIT;
                  float hop = 0;
                  if (emote == E_HOP) hop = (float) Math.abs(Math.sin(et / 0.6f * Math.PI)) * 12;
                  if (emote == E_DANCE) hop = (float) Math.abs(Math.sin(et * 10)) * 10;
                  float shake = emote == E_FLINCH ? (float) Math.sin(et * 60) * 3 : 0;

                  c.save();
                  c.translate(x + shake, y);
                  c.scale(s, s);

                  p.setColor(0x30000000);
                  c.drawOval(-22, -6, 22, 6, p);
                  c.translate(0, -hop);

                  float sway = walking ? (float) Math.sin(phase) * 7f : (float) Math.sin(phase * 0.5f) * 1.5f;
                  if (emote == E_DANCE) sway = (float) Math.sin(et * 9) * 12;
                  c.rotate(sway);

                  float headY = sitting ? -48 : -60;

                  // Feet
                  p.setColor(0xffef8a3c);
                  if (sitting) {
                      c.drawOval(-14, -6, -2, 4, p);
                      c.drawOval(2, -6, 14, 4, p);
                  } else {
                      float lift = walking ? (float) Math.sin(phase) * 3f : 0;
                      c.drawOval(-15, -5 - Math.max(0, lift), -3, 2 - Math.max(0, lift), p);
                      c.drawOval(3, -5 - Math.max(0, -lift), 15, 2 - Math.max(0, -lift), p);
                  }

                  // Flippers
                  float leftA = 18, rightA = -18;
                  float flap = walking ? (float) Math.sin(phase) * 14f : 0;
                  leftA += flap; rightA -= flap;
                  if (emote == E_FLAP || emote == E_DANCE) {
                      float f = (float) Math.sin(et * 22) * 35 + 25;
                      leftA = 18 + f; rightA = -18 - f;
                  } else if (emote == E_WAVE) {
                      rightA = -150 + (float) Math.sin(et * 16) * 28;
                  } else if (emote == E_THROW) {
                      rightA = et < 0.12f ? 40 : -120;
                  } else if (emote == E_FLINCH) {
                      leftA = 60; rightA = -60;
                  }
                  float shoulder = headY + 20;
                  p.setColor(0xff1b2230);
                  c.save();
                  c.rotate(leftA, -18, shoulder);
                  c.drawOval(-25, headY + 16, -14, headY + 42, p);
                  c.restore();
                  c.save();
                  c.rotate(rightA, 18, shoulder);
                  c.drawOval(14, headY + 16, 25, headY + 42, p);
                  c.restore();

                  // Body and head
                  c.drawOval(sitting ? -21 : -20, headY - 2, sitting ? 21 : 20, 0, p);
                  c.drawCircle(0, headY, 15, p);

                  if (face != UP) {
                      p.setColor(0xfffafcff);
                      if (face == DOWN) c.drawOval(-14, headY + 10, 14, -3, p);
                      else if (face == LEFT) c.drawOval(-17, headY + 12, 5, -4, p);
                      else c.drawOval(-5, headY + 12, 17, -4, p);

                      float ex1, ex2, bx;
                      boolean twoEyes = face == DOWN;
                      if (face == DOWN) { ex1 = -6; ex2 = 6; bx = 0; }
                      else if (face == LEFT) { ex1 = -7; ex2 = -7; bx = -1; }
                      else { ex1 = 7; ex2 = 7; bx = 1; }
                      float eyeY = headY - 4;
                      if (blink) {
                          p.setStyle(Paint.Style.STROKE);
                          p.setStrokeWidth(2);
                          p.setColor(0xfffafcff);
                          c.drawLine(ex1 - 3.5f, eyeY, ex1 + 3.5f, eyeY, p);
                          if (twoEyes) c.drawLine(ex2 - 3.5f, eyeY, ex2 + 3.5f, eyeY, p);
                          p.setStyle(Paint.Style.FILL);
                      } else {
                          p.setColor(0xffffffff);
                          c.drawCircle(ex1, eyeY, 4.2f, p);
                          if (twoEyes) c.drawCircle(ex2, eyeY, 4.2f, p);
                          p.setColor(0xff111111);
                          float look = face == LEFT ? -1 : face == RIGHT ? 1 : 0;
                          c.drawCircle(ex1 + look, eyeY + 0.5f, 2.1f, p);
                          if (twoEyes) c.drawCircle(ex2 + look, eyeY + 0.5f, 2.1f, p);
                      }
                      p.setColor(0xffffa726);
                      path.reset();
                      if (bx == 0) {
                          path.moveTo(-4.5f, headY + 1); path.lineTo(4.5f, headY + 1); path.lineTo(0, headY + 8);
                      } else {
                          path.moveTo(bx * 11, headY - 1); path.lineTo(bx * 11, headY + 5); path.lineTo(bx * 21, headY + 2);
                      }
                      path.close();
                      c.drawPath(path, p);
                  }

                  // Scarf
                  p.setColor(scarf);
                  rf.set(-17, headY + 9, 17, headY + 16);
                  c.drawRoundRect(rf, 4, 4, p);
                  float tailX = face == LEFT ? 8 : face == RIGHT ? -14 : 5;
                  float wv = walking ? (float) Math.sin(phase * 1.3f) * 2 : 0;
                  rf.set(tailX, headY + 13, tailX + 7, headY + 28 + wv);
                  c.drawRoundRect(rf, 3, 3, p);

                  if (player) {
                      rf.set(-14, headY - 20, 14, headY);
                      c.drawArc(rf, 180, 180, true, p);
                      p.setColor(0xffffffff);
                      rf.set(-15, headY - 12, 15, headY - 7);
                      c.drawRoundRect(rf, 2, 2, p);
                      c.drawCircle(0, headY - 20, 4.5f, p);
                  } else if (xmasHat) {
                      p.setColor(0xffd32f2f);
                      path.reset();
                      path.moveTo(-12, headY - 9); path.lineTo(12, headY - 9); path.lineTo(10, headY - 28); path.close();
                      c.drawPath(path, p);
                      p.setColor(0xffffffff);
                      rf.set(-13, headY - 12, 13, headY - 7);
                      c.drawRoundRect(rf, 2, 2, p);
                      c.drawCircle(10, headY - 28, 3.5f, p);
                  }

                  // Got hit by a snowball
                  if (hitT > 0) {
                      int a = (int) (255 * Math.min(1, hitT));
                      p.setColor((a << 24) | 0xffffff);
                      c.drawCircle(-5, headY - 12, 7, p);
                      c.drawCircle(5, headY - 14, 6, p);
                      c.drawCircle(0, headY - 18, 5, p);
                  }
                  c.restore();
              }

              void drawSlider(Canvas c, float x, float y, int face, int scarf) {
                  c.save();
                  c.translate(x, y);
                  p.setColor(0x30000000);
                  c.drawOval(-36, -7, 36, 7, p);
                  if (face == LEFT || face == RIGHT) {
                      float d = face == LEFT ? -1 : 1;
                      c.scale(d, 1);
                      p.setColor(0xfffafcff);
                      c.drawOval(-30, -10, 26, 2, p);
                      p.setColor(0xff1b2230);
                      c.drawOval(-34, -24, 28, -2, p);
                      c.drawCircle(30, -12, 13, p);
                      c.drawOval(-12, -30, 6, -20, p);
                      p.setColor(0xffffa726);
                      path.reset(); path.moveTo(40, -15); path.lineTo(40, -9); path.lineTo(50, -12); path.close();
                      c.drawPath(path, p);
                      p.setColor(0xffffffff); c.drawCircle(35, -16, 3.5f, p);
                      p.setColor(0xff111111); c.drawCircle(36, -16, 1.8f, p);
                      p.setColor(scarf);
                      rf.set(14, -22, 20, -2);
                      c.drawRoundRect(rf, 3, 3, p);
                      p.setColor(0xffef8a3c);
                      c.drawOval(-44, -12, -32, -4, p);
                  } else {
                      boolean toward = face == DOWN;
                      p.setColor(0xff1b2230);
                      c.drawOval(-16, -44, 16, 0, p);
                      float hy = toward ? -6 : -40;
                      c.drawCircle(0, hy, 13, p);
                      c.drawOval(-30, -30, -12, -18, p);
                      c.drawOval(12, -30, 30, -18, p);
                      p.setColor(scarf);
                      rf.set(-14, toward ? -18 : -32, 14, toward ? -13 : -27);
                      c.drawRoundRect(rf, 3, 3, p);
                      if (toward) {
                          p.setColor(0xffffffff);
                          c.drawCircle(-5, -9, 3.6f, p); c.drawCircle(5, -9, 3.6f, p);
                          p.setColor(0xff111111);
                          c.drawCircle(-5, -8.5f, 1.8f, p); c.drawCircle(5, -8.5f, 1.8f, p);
                          p.setColor(0xffffa726);
                          path.reset(); path.moveTo(-4, -3); path.lineTo(4, -3); path.lineTo(0, 3); path.close();
                          c.drawPath(path, p);
                      } else {
                          p.setColor(0xffef8a3c);
                          c.drawOval(-12, -6, -2, 2, p); c.drawOval(2, -6, 12, 2, p);
                      }
                  }
                  c.restore();
              }

              void drawSign(Canvas c, AppPeng a, boolean highlight) {
                  float bob = (float) Math.sin(time * 2f + a.phase) * 3f;
                  float s = highlight ? 1.25f : 1f;
