                  tp.setTextSize(15);
                  tp.setColor(0xff90a4ae);
                  c.drawText("Up/Down to move  ·  OK to change  ·  Back to close", l + 32, t + 76, tp);

                  int rows = 7;
                  float rowH = 62, rowTop = t + 96;
                  if (listSel < listScroll) listScroll = listSel;
                  if (listSel >= listScroll + rows) listScroll = listSel - rows + 1;
                  for (int r = 0; r < rows; r++) {
                      int i = listScroll + r;
