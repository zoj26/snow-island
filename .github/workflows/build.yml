          import glob, os, sys, zipfile
          zips = glob.glob("*.zip")
          pz = [z for z in zips if "penguin" in z.lower() and "special" not in z.lower()]
          vz = [z for z in zips if "video" in z.lower()]
          if not pz:
              print("No penguin sprite zip in the repo: using the original drawn penguins")
              sys.exit(0)
          os.makedirs("sprite_src", exist_ok=True)
          zipfile.ZipFile(pz[0]).extractall("sprite_src")
          for root, dirs, files in os.walk("sprite_src"):
              if "Walk (1)" in dirs:
                  open("sprite_root.txt", "w").write(root)
                  break
          if vz:
              os.makedirs("sprite_video", exist_ok=True)
              zipfile.ZipFile(vz[0]).extractall("sprite_video")
              for root, dirs, files in os.walk("sprite_video"):
                  if "Video Wave" in dirs or "Video Dance" in dirs:
                      open("video_root.txt", "w").write(root)
                      break
