              /** A lawn chair for each HDMI input. */
              void drawChair(Canvas c, Chair ch) {
                  float x = ch.x, y = ch.y;
                  int col = ch.color;
                  int light = blend(col, 0xffffffff, 0.25f), dark = blend(col, 0xff000000, 0.3f);
                  p.setColor(0x30000000);
                  c.drawOval(x - 30, y - 6, x + 30, y + 9, p);
                  // tall back made of upright slats side by side, with a rounded top (tallest in the middle)
                  for (int i = -2; i <= 2; i++) {
                      float sxc = x + i * 9.5f;
                      float topY = y - 64 + i * i * 2.6f;
                      p.setColor(i % 2 == 0 ? light : col);
                      rf.set(sxc - 4.3f, topY, sxc + 4.3f, y - 14);
                      c.drawRoundRect(rf, 4, 4, p);
                  }
                  p.setColor(dark);
                  c.drawRect(x - 23, y - 52, x + 23, y - 48, p);
                  p.setColor(dark);
                  c.drawRect(x - 24, y - 30, x + 24, y - 26, p);
                  // seat
                  path.reset();
                  path.moveTo(x - 22, y - 18); path.lineTo(x + 22, y - 18); path.lineTo(x + 27, y); path.lineTo(x - 27, y);
                  path.close();
                  p.setColor(col);
                  c.drawPath(path, p);
                  p.setColor(light);
                  c.drawRect(x - 24, y - 11, x + 24, y - 8, p);
                  // arm rests and legs
                  p.setColor(dark);
                  rf.set(x - 36, y - 30, x - 24, y - 2);
                  c.drawRoundRect(rf, 4, 4, p);
                  rf.set(x + 24, y - 30, x + 36, y - 2);
                  c.drawRoundRect(rf, 4, 4, p);
                  c.drawRect(x - 27, y, x - 22, y + 6, p);
                  c.drawRect(x + 22, y, x + 27, y + 6, p);
              }

              void drawChairSign(Canvas c, Chair ch, boolean highlight) {
                  String t = ch.label;
                  tp.setTextSize(highlight ? 19 : 15);
                  tp.setTextAlign(Paint.Align.CENTER);
                  float tw = tp.measureText(t);
                  float cy = ch.y - 78 - (highlight ? 6 : 0);
                  float h = highlight ? 30 : 24;
                  // tiny TV icon on the left of the tag
                  float iconW = highlight ? 22 : 18;
                  float total = tw + iconW + 26;
                  float l = ch.x - total / 2;
                  rf.set(l, cy - h, l + total, cy);
                  p.setColor(highlight ? ch.color : 0xd0263238);
                  c.drawRoundRect(rf, h / 2, h / 2, p);
                  float ix = l + 12, iy = cy - h / 2;
                  p.setColor(0xffffffff);
                  rf.set(ix, iy - iconW * 0.32f, ix + iconW, iy + iconW * 0.32f);
                  c.drawRoundRect(rf, 3, 3, p);
                  p.setColor(highlight ? ch.color : 0xff263238);
                  rf.set(ix + 2.5f, iy - iconW * 0.32f + 2.5f, ix + iconW - 2.5f, iy + iconW * 0.32f - 2.5f);
                  c.drawRect(rf, p);
                  tp.setColor(0xffffffff);
                  c.drawText(t, ix + iconW + 8 + tw / 2, cy - h / 2 + (highlight ? 7 : 5.5f), tp);
                  if (highlight && ch.sub != null) {
                      tp.setTextSize(15);
                      c.drawText(ch.sub, ch.x, cy + 18, tp);
                  }
              }

              static int blend(int a, int b, float t) {
                  int ar = (a >> 16) & 0xff, ag = (a >> 8) & 0xff, ab = a & 0xff;
                  int br = (b >> 16) & 0xff, bg = (b >> 8) & 0xff, bb = b & 0xff;
                  return 0xff000000 | ((int) (ar + (br - ar) * t) << 16) | ((int) (ag + (bg - ag) * t) << 8) | (int) (ab + (bb - ab) * t);
              }

              // ================================================================== drawing: fullscreen fireplace

              void bakeFireBg() {
                  fireBg = Bitmap.createBitmap(VW, VH, Bitmap.Config.RGB_565);
                  Canvas c = new Canvas(fireBg);
                  Paint w = new Paint(Paint.ANTI_ALIAS_FLAG);
                  Random r = new Random(19);
                  // igloo ice wall around the fireplace
                  w.setShader(new LinearGradient(0, 0, 0, VH, 0xffc9e2f0, 0xff9fc4da, Shader.TileMode.CLAMP));
                  c.drawRect(0, 0, VW, VH, w);
                  w.setShader(null);
                  w.setStyle(Paint.Style.STROKE);
                  w.setStrokeWidth(2);
                  w.setColor(0xff8fb6cd);
                  for (int row = 0; row < 9; row++) {
                      float y = row * 84;
                      c.drawLine(0, y, VW, y, w);
                      for (float x = (row % 2) * 90; x < VW; x += 180) c.drawLine(x, y, x, y + 84, w);
                  }
                  w.setStyle(Paint.Style.FILL);
                  int[] stones = {0xff5d5550, 0xff665d58, 0xff746b66, 0xff57504c, 0xff6b625d};
                  // chimney column rising out of the top of the fireplace, like in the igloo
                  w.setColor(0xff3a3431);
                  c.drawRect(400, 0, VW - 400, 80, w);
                  c.save();
                  c.clipRect(400, 0, VW - 400, 80);
                  for (int row = 0; row < 3; row++) {
                      float y = row * 40 - 10;
                      float x = 400 - (row % 2) * 45;
                      while (x < VW - 400) {
                          w.setColor(stones[(row * 3 + (int) (x / 90)) % stones.length]);
                          rf.set(x + 3, y + 3, x + 87, y + 37);
                          c.drawRoundRect(rf, 9, 9, w);
                          x += 90;
                      }
                  }
                  c.restore();
                  // stone fireplace front with rounded top corners, sitting on the hearth
                  Path face = new Path();
                  rf.set(170, 40, VW - 170, 700);
                  face.addRoundRect(rf, 28, 28, Path.Direction.CW);
                  w.setColor(0xff3a3431);
                  c.drawPath(face, w);
                  c.save();
                  c.clipPath(face);
                  for (int row = 0; row < 13; row++) {
                      float y = 40 + row * 54 - 27;
                      float x = 170 - (row % 2) * 50 - r.nextInt(30);
                      while (x < VW - 170) {
                          float sw = 80 + r.nextInt(50);
                          w.setColor(stones[r.nextInt(stones.length)]);
                          rf.set(x + 3, y + 3, x + sw - 3, y + 51);
                          c.drawRoundRect(rf, 10, 10, w);
                          x += sw;
                      }
                  }
                  c.restore();

                  // the opening, and the firebox inside it with real depth: side walls, back wall, floor
                  float oL = 320, oR = 960, oTop = 260, oBot = 640;      // opening in the stone
                  float bL = 450, bR = 830, bTop = 345, bBot = 590;      // back wall, further away
                  Path open = new Path();
                  open.moveTo(oL, 400);
                  rf.set(oL, oTop, oR, oTop + 280);
                  open.arcTo(rf, 180, 180, false);
                  open.lineTo(oR, oBot);
                  open.lineTo(oL, oBot);
                  open.close();
                  fireArch = open;
                  c.save();
                  c.clipPath(open);
                  w.setColor(0xff120d0b);
                  c.drawRect(oL, oTop, oR, oBot, w);
                  // side walls (lit a little by the fire)
                  Path side = new Path();
                  side.moveTo(oL, oTop + 60); side.lineTo(bL, bTop + 40); side.lineTo(bL, bBot); side.lineTo(oL, oBot); side.close();
                  w.setShader(new LinearGradient(oL, 0, bL, 0, 0xff2a1c16, 0xff3d2a20, Shader.TileMode.CLAMP));
                  c.drawPath(side, w);
                  side.reset();
                  side.moveTo(oR, oTop + 60); side.lineTo(bR, bTop + 40); side.lineTo(bR, bBot); side.lineTo(oR, oBot); side.close();
                  w.setShader(new LinearGradient(oR, 0, bR, 0, 0xff2a1c16, 0xff3d2a20, Shader.TileMode.CLAMP));
                  c.drawPath(side, w);
                  // floor of the firebox
                  side.reset();
                  side.moveTo(bL, bBot); side.lineTo(bR, bBot); side.lineTo(oR, oBot); side.lineTo(oL, oBot); side.close();
                  w.setShader(new LinearGradient(0, bBot, 0, oBot, 0xff2b1d17, 0xff1a120f, Shader.TileMode.CLAMP));
                  c.drawPath(side, w);
                  w.setShader(null);
                  // back wall with smaller bricks (it's further away)
                  Path back = new Path();
                  back.moveTo(bL, bBot);
                  back.lineTo(bL, bTop + 40);
                  rf.set(bL, bTop, bR, bTop + 150);
                  back.arcTo(rf, 180, 180, false);
                  back.lineTo(bR, bBot);
                  back.close();
                  w.setColor(0xff3a2820);
                  c.drawPath(back, w);
                  c.save();
                  c.clipPath(back);
                  w.setStyle(Paint.Style.STROKE);
                  w.setStrokeWidth(1.5f);
                  w.setColor(0xff22160f);
                  for (int row = 0; row < 12; row++) {
                      float y = bTop + row * 22;
                      c.drawLine(bL, y, bR, y, w);
                      for (float x = bL + (row % 2) * 24; x < bR; x += 48) c.drawLine(x, y, x, y + 22, w);
                  }
                  c.restore();
                  // the ceiling of the firebox (lit warm by the fire), with the chimney's dark throat in the middle
                  Path ceil = new Path();
                  ceil.moveTo(oL, oTop + 60);
                  rf.set(oL, oTop, oR, oTop + 280);
                  ceil.arcTo(rf, 180, 180, false);
                  ceil.lineTo(oR, oTop + 60);
                  ceil.lineTo(bR, bTop + 40);
                  rf.set(bL, bTop, bR, bTop + 150);
                  ceil.arcTo(rf, 0, -180, false);
                  ceil.close();
                  w.setShader(new LinearGradient(0, oTop, 0, bTop + 40, 0xff3b271e, 0xff5a3a2a, Shader.TileMode.CLAMP));
                  c.drawPath(ceil, w);
                  w.setShader(null);
                  // the hole up into the chimney: black, fading out softly at its edges
                  for (int k = 0; k < 6; k++) {
                      float f = k / 5f;
                      float hw = 120 - f * 55, top = oTop + 6, bot = bTop + 6 - f * 30;
                      rf.set(640 - hw, top, 640 + hw, bot);
                      w.setColor(((int) (60 + f * 195)) << 24 | 0x050302);
                      c.drawRoundRect(rf, hw * 0.6f, 30, w);
                  }
                  // brick lines on the side walls, slanting toward the back
                  w.setColor(0xff1f150f);
                  for (int k = 1; k < 9; k++) {
                      float t = k / 9f;
                      float yo = oTop + 60 + (oBot - oTop - 60) * t, yb = bTop + 40 + (bBot - bTop - 40) * t;
                      c.drawLine(oL, yo, bL, yb, w);
                      c.drawLine(oR, yo, bR, yb, w);
                  }
                  w.setStyle(Paint.Style.FILL);
                  c.restore();
                  // stone edge around the opening
                  w.setStyle(Paint.Style.STROKE);
                  w.setStrokeWidth(6);
                  w.setColor(0xff4d4542);
                  c.drawPath(open, w);
                  w.setStyle(Paint.Style.FILL);

                  // snowy igloo floor, and a thick stone hearth bar running the full width
                  w.setShader(new LinearGradient(0, 708, 0, VH, 0xfff4f8fb, 0xffdde9f1, Shader.TileMode.CLAMP));
                  c.drawRect(0, 708, VW, VH, w);
                  w.setShader(null);
                  w.setColor(0xff4a4441);
                  c.drawRect(0, 636, VW, 710, w);
                  w.setColor(0xff5b5450);
                  c.drawRect(0, 636, VW, 652, w);
                  w.setColor(0xff3a3431);
                  c.drawRect(0, 704, VW, 712, w);

                  // thick wooden mantle that overhangs the stone on both sides
                  w.setColor(0x55000000);
                  rf.set(150, 190, VW - 150, 214);
                  c.drawRoundRect(rf, 12, 12, w);                       // shadow on the stone
                  w.setColor(0xff3e2723);
                  rf.set(130, 108, VW - 130, 198);
                  c.drawRoundRect(rf, 14, 14, w);                       // underside
                  w.setColor(0xff4e342e);
                  rf.set(130, 108, VW - 130, 190);
                  c.drawRoundRect(rf, 14, 14, w);                       // front face
                  w.setColor(0xff6d4c41);
                  rf.set(134, 110, VW - 134, 126);
                  c.drawRoundRect(rf, 10, 10, w);                       // top edge catching the light
                  drawNameplate(c, w, VW / 2f, 150, 2.1f);

                  // ember bed positions, on the firebox floor
                  emberX = new float[60]; emberY = new float[60]; emberPh = new float[60];
                  for (int i = 0; i < 60; i++) {
                      emberX[i] = 500 + r.nextFloat() * 280;
                      emberY[i] = 584 + r.nextFloat() * 20;
                      emberPh[i] = r.nextFloat() * 6.28f;
                  }
                  // a soft glow, made once and faded up and down while drawing
                  glowBmp = Bitmap.createBitmap(VW / 2, VH / 2, Bitmap.Config.ARGB_8888);
                  Canvas gc = new Canvas(glowBmp);
                  Paint gp = new Paint(Paint.ANTI_ALIAS_FLAG);
                  gp.setShader(new RadialGradient(VW / 4f, 270, 300, 0x99ff7a1a, 0x00ff7a1a, Shader.TileMode.CLAMP));
                  gc.drawRect(0, 0, VW / 2f, VH / 2f, gp);
              }

              void drawFire(Canvas c) {
                  if (fireBg == null) bakeFireBg();
                  c.drawBitmap(fireBg, 0, 0, null);
                  float flick = (float) (Math.sin(time * 9.7) * 0.5 + Math.sin(time * 15.3) * 0.3 + Math.sin(time * 23.1) * 0.2);
                  // glow behind the fire: slow, layered flicker that never drops out
                  float glow = 0.78f + 0.12f * (float) Math.sin(time * 2.1) + 0.06f * (float) Math.sin(time * 5.3 + 1) + 0.04f * (float) Math.sin(time * 11.7 + 2);
                  Paint gpaint = new Paint();
                  gpaint.setAlpha((int) (255 * Math.max(0.6f, Math.min(1f, glow))));
                  src.set(0, 0, VW / 2, VH / 2);
                  dst.set(0, 0, VW, VH);
                  c.drawBitmap(glowBmp, src, dst, gpaint);

                  // smoke sits behind the flames, and stays inside the fireplace opening
                  c.save();
                  if (fireArch != null) c.clipPath(fireArch);
                  drawParts(c, false, 1);

                  // glowing ember bed
                  for (int i = 0; i < emberX.length; i++) {
                      float g = 0.55f + 0.45f * (float) Math.sin(time * (2 + i % 5) + emberPh[i]);
                      int rr = 255, gg = (int) (60 + 120 * g), bb = (int) (20 * g);
                      p.setColor(0xff000000 | (rr << 16) | (gg << 8) | bb);
                      c.drawCircle(emberX[i], emberY[i], 3.5f + 3 * g, p);
                  }

                  // back logs (the flames grow out from between these), set back in the firebox
                  drawLog(c, 585, 575, 270, 36, 12, flick);
                  drawLog(c, 700, 577, 270, 36, -14, flick);

                  // flames: several tongues, four colour layers from deep orange to white-hot
                  int[] cols = {0xd9ff3d00, 0xe6ff8f00, 0xf0ffca28, 0xfffff3c4};
                  float[] scales = {1f, 0.78f, 0.55f, 0.3f};
                  float by = 596;
                  for (int layer = 0; layer < 4; layer++) {
                      p.setColor(cols[layer]);
                      float ls = scales[layer];
                      for (int i = 0; i < 11; i++) {
                          // Each flame grows and shrinks on its own (flameH), the middle ones reaching highest,
                          // while the whole fire sways together as one, so it stays one cohesive fire
                          float base = 250 * (1 - Math.abs(i - 5) / 7f);
                          float n = flameH[i] + 0.05f * (float) Math.sin(time * 9.1f + i * 2.3f);
                          float hgt = base * n * (0.55f + 0.45f * ls) * (layer == 3 ? 0.6f : 1f);
                          float w = 47 * ls + 6;
                          float fx = 640 + (i - 5) * 33;
                          float lean = fireLean * (0.6f + 0.4f * (1 - Math.abs(i - 5) / 5f)) + (float) Math.sin(time * 3.7f + i * 1.9f) * 4;
                          // A wiggle that travels up the flame, so it ripples and licks instead of just stretching
                          path.reset();
                          final int SEG = 7;
                          float[] cxs = new float[SEG + 1], hws = new float[SEG + 1], ys = new float[SEG + 1];
                          for (int j = 0; j <= SEG; j++) {
                              float u = j / (float) SEG;
                              ys[j] = by - hgt * u;
                              float wave = (float) Math.sin(time * 6.5f - u * 3.5f + i * 0.6f) * w * 0.1f * u;
                              float wave2 = 0;
                              cxs[j] = fx + lean * (float) Math.pow(u, 1.4) + wave + wave2;
                              hws[j] = w * (1 - (float) Math.pow(u, 1.15)) * (1 + 0.06f * (float) Math.sin(time * 7 + u * 5 + i));
                          }
                          path.moveTo(cxs[0] - hws[0], ys[0]);
                          for (int j = 1; j <= SEG; j++) path.lineTo(cxs[j] - hws[j], ys[j]);
                          for (int j = SEG - 1; j >= 0; j--) path.lineTo(cxs[j] + hws[j], ys[j]);
                          path.close();
                          c.drawPath(path, p);
                      }
                  }

                  // little bits of flame that break off the tips, float up and shrink away
                  for (int k = 0; k < lickX.length; k++) {
                      if (lickLife[k] <= 0) continue;
                      float f = lickLife[k] / lickMax[k];
                      float sz = lickSize[k] * f;
                      p.setColor(f > 0.6f ? 0xf0ffca28 : f > 0.3f ? 0xe6ff8f00 : 0xd9ff3d00);
                      // each one a bit different: some tall and thin, some round and stubby, some leaning
                      float tall = 1.4f + lickShape[k] * 1.6f, wide = 0.9f - lickShape[k] * 0.4f;
                      float tilt = (float) Math.sin(k * 2.7f + lickMax[k] * 10) * sz * 0.8f;
                      path.reset();
                      path.moveTo(lickX[k] - sz * wide, lickY[k]);
                      path.quadTo(lickX[k] - sz * wide * 0.8f, lickY[k] - sz * tall * 0.6f, lickX[k] + tilt, lickY[k] - sz * tall);
                      path.quadTo(lickX[k] + sz * wide * 0.8f, lickY[k] - sz * tall * 0.6f, lickX[k] + sz * wide, lickY[k]);
                      path.quadTo(lickX[k], lickY[k] + sz * 0.5f, lickX[k] - sz * wide, lickY[k]);
                      c.drawPath(path, p);
                  }

                  // front log sits in front of the flames, hiding where they start
                  drawLog(c, 640, 598, 440, 42, -3, flick);

                  drawParts(c, false, 2);
                  c.restore();

                  // seasonal mantle decor
                  int season = activeSeason();
                  if (season == SEASON_XMAS) {
                      for (int i = 0; i < 5; i++) {
                          float sx = 250 + i * 190;
                          p.setColor(i % 2 == 0 ? 0xffc62828 : 0xff2e7d32);
                          c.drawRect(sx, 196, sx + 36, 262, p);
                          c.drawOval(sx - 6, 246, sx + 50, 278, p);
                          p.setColor(0xffffffff);
                          c.drawRect(sx - 3, 192, sx + 39, 210, p);
                      }
                  } else if (season == SEASON_HALLOWEEN) {
                      drawPumpkin(c, 230, 108, 1);
                      drawPumpkin(c, VW - 230, 108, 1);
                  }

                  // Ezio's bed on the hearth bar, out past the stone front, and Ezio doing his thing
                  drawPetBed(c, FX_BED, 644, 2.5f, false);
                  if (ezScene == SCENE_IGLOO) {
                      boolean onBed = Math.abs(fxX - FX_BED) < 8 && (fxState == 0 || fxState == 1);
                      drawEzio(c, fxX, onBed ? 630 : 640, 2.4f, fxFacing, fxState == 2, fxState == 1, ezPhase, ezBlinkT > 0, season);
                      if (onBed) drawPetBed(c, FX_BED, 644, 2.5f, true);
                  }

                  // overall flicker on the room
                  int dim = (int) (40 + flick * 14);
                  c.drawColor(Math.max(0, dim) << 24);

                  if (fireHintT < 5) {
                      int a = (int) (255 * Math.min(1, (5 - fireHintT) / 1.5f));
                      tp.setTextAlign(Paint.Align.CENTER);
                      tp.setTextSize(20);
                      tp.setColor((a << 24) | 0xffffff);
                      c.drawText("Back or OK to step away from the fire", VW / 2f, VH - 30, tp);
                  }
              }

              void drawLog(Canvas c, float x, float y, float len, float thick, float angle, float flick) {
                  c.save();
                  c.rotate(angle, x, y);
                  p.setColor(0xff3e2723);
                  rf.set(x - len / 2, y - thick / 2, x + len / 2, y + thick / 2);
                  c.drawRoundRect(rf, thick / 2, thick / 2, p);
                  p.setColor(0xff5d4037);
                  rf.set(x - len / 2 + 6, y - thick / 2 + 5, x + len / 2 - 6, y - thick / 2 + 12);
                  c.drawRoundRect(rf, 4, 4, p);
                  // glowing cracks
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(3);
                  int ga = (int) (150 + flick * 60);
                  p.setColor((Math.max(40, Math.min(255, ga)) << 24) | 0xff6d00);
                  for (int i = 0; i < 4; i++) {
                      float cx = x - len / 2 + len * (0.2f + i * 0.2f);
                      c.drawLine(cx - 14, y + 4, cx + 10, y + thick / 2 - 6, p);
                  }
                  p.setStyle(Paint.Style.FILL);
                  // cut end
                  p.setColor(0xff8d6e63);
                  c.drawOval(x + len / 2 - 14, y - thick / 2 + 2, x + len / 2 + 8, y + thick / 2 - 2, p);
                  p.setColor(0xffa1887f);
                  c.drawOval(x + len / 2 - 8, y - thick / 4, x + len / 2 + 2, y + thick / 4, p);
                  c.restore();
              }

              // ================================================================== drawing: HUD + overlays

              void drawHud(Canvas c, String msg) {
                  long now = System.currentTimeMillis();
                  String t = timeFmt.format(now);
                  String d = dateFmt.format(now);
                  Weather w = weather;
                  String wl1 = null, wl2 = null;
                  if (w != null && w.ok) {
                      wl1 = w.emoji + "  " + Math.round(w.tempC) + "°  " + w.desc;
                      wl2 = (w.city.isEmpty() ? "" : w.city + "  ·  ") + "wind " + Math.round(w.windKmh) + " km/h";
                  }
                  String np = null;
                  if (nowDisc != null) {
                      String nt = nowTitle == null || nowTitle.isEmpty() ? nowDisc.name : nowTitle;
                      np = "♪  " + (radioBusy() ? "" : "Paused · ") + nt;
                  }

                  tp.setTextAlign(Paint.Align.RIGHT);
                  tp.setTextSize(40);
                  float wMax = tp.measureText(t);
                  tp.setTextSize(20);
                  wMax = Math.max(wMax, tp.measureText(d));
                  if (wl1 != null) {
                      wMax = Math.max(wMax, tp.measureText(wl1));
                      tp.setTextSize(16);
                      wMax = Math.max(wMax, tp.measureText(wl2));
                  }
                  if (np != null) wMax = Math.max(wMax, 190);   // long song names scroll instead of stretching the box
                  float right = VW - 30, top = 22;
                  // Clock box size is set in Island settings; it also creeps a few pixels over time to avoid burn-in
                  c.save();
                  c.translate((float) Math.sin(time * 0.013f) * 6, (float) Math.cos(time * 0.011f) * 4);
                  float cs = CLOCK_SIZES[Math.max(0, Math.min(CLOCK_SIZES.length - 1, clockSize))];
                  c.scale(cs, cs, right, top);
                  float bottom = wl1 != null ? 160 : 102;
                  float npY = bottom + 4;
                  if (np != null) bottom += 30;
                  rf.set(right - wMax - 36, top, right, bottom);
                  p.setColor(0x8c0f1c2a);
                  c.drawRoundRect(rf, 18, 18, p);

                  float tx = right - 18;
                  tp.setColor(0xffffffff);
                  tp.setTextSize(40);
                  c.drawText(t, tx, top + 46, tp);
                  tp.setTextSize(20);
                  tp.setColor(0xffcfd8dc);
                  c.drawText(d, tx, top + 72, tp);
                  if (wl1 != null) {
                      tp.setColor(0xffffffff);
                      tp.setTextSize(20);
                      c.drawText(wl1, tx, top + 104, tp);
                      tp.setTextSize(16);
                      tp.setColor(0xffb0bec5);
                      c.drawText(wl2, tx, top + 126, tp);
                  }
                  if (np != null) {
                      tp.setTextSize(17);
                      tp.setColor(0xffe1bee7);
                      float npW = tp.measureText(np), boxL = right - wMax - 18;
                      if (npW <= wMax) {
                          c.drawText(np, tx, npY + 12, tp);
                      } else {
                          // Scroll the song name across, pausing at the start
                          c.save();
                          c.clipRect(boxL, npY - 10, tx, npY + 20);
                          float travel = npW - wMax + 30;
                          float cyc = travel / 40f + 4f;
                          float ph = (time % cyc);
                          float off = ph < 2f ? 0 : Math.min(travel, (ph - 2f) * 40f);
                          tp.setTextAlign(Paint.Align.LEFT);
                          c.drawText(np, boxL - off, npY + 12, tp);
                          tp.setTextAlign(Paint.Align.RIGHT);
                          c.restore();
                      }
                  }
                  c.restore();

                  if (msg != null) {
                      tp.setTextAlign(Paint.Align.CENTER);
                      tp.setTextSize(22);
                      float tw = tp.measureText(msg);
                      rf.set(VW / 2f - tw / 2 - 22, VH - 74, VW / 2f + tw / 2 + 22, VH - 30);
                      p.setColor(0xc0172a3a);
                      c.drawRoundRect(rf, 22, 22, p);
                      tp.setColor(0xffffffff);
                      c.drawText(msg, VW / 2f, VH - 44, tp);
                  }
              }

              /** Screen dims while your penguin naps, with snow blowing across. */
              void drawSleepy(Canvas c) {
                  c.drawColor(((int) (afkDim * 120)) << 24);
                  int a = (int) (afkDim * 190);
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(1.6f);
                  for (int i = 0; i < drX.length; i++) {
                      p.setColor(((a / 2) << 24) | 0xffffff);
                      c.drawLine(drX[i], drY[i], drX[i] - drS[i] * 0.05f, drY[i] - 2, p);
                  }
                  p.setStyle(Paint.Style.FILL);
                  p.setColor((a << 24) | 0xffffff);
                  for (int i = 0; i < drX.length; i++) c.drawCircle(drX[i], drY[i], drR[i], p);
              }

              void drawOverlays(Canvas c) {
                  if (overlay == OV_WHEEL) drawWheel(c);
                  else if (overlay == OV_LIST) drawListPanel(c);
                  else if (overlay == OV_FOLDER) drawFolder(c);
                  else if (overlay == OV_PLAYER) drawPlayerPanel(c);
                  if (fade > 0) c.drawColor(((int) (fade * 255)) << 24);
              }

              /** A zip-up 2000s CD binder: two pages of plastic sleeves, four discs a page. */
              void drawFolder(Canvas c) {
                  float a = folderAnim;
                  float e = 1 - (1 - a) * (1 - a) * (1 - a);
                  c.drawColor(((int) (e * 150)) << 24);
                  float w = 1090, h = 610;
                  float l = (VW - w) / 2, t0 = (VH - h) / 2;
                  float t = t0 + (1 - e) * (VH - t0 + 20);

                  // nylon cover with a zipper all the way round
                  rf.set(l, t, l + w, t + h);
                  p.setColor(0xff151a24);
                  c.drawRoundRect(rf, 34, 34, p);
                  p.setColor(0xff5b626d);
                  for (float zx = l + 40; zx < l + w - 40; zx += 9) {
                      c.drawRect(zx, t + 7, zx + 5, t + 13, p);
                      c.drawRect(zx, t + h - 13, zx + 5, t + h - 7, p);
                  }
                  for (float zy = t + 40; zy < t + h - 40; zy += 9) {
                      c.drawRect(l + 7, zy, l + 13, zy + 5, p);
                      c.drawRect(l + w - 13, zy, l + w - 7, zy + 5, p);
                  }
                  p.setColor(0xffb7bec6);
                  rf.set(l + w - 92, t + 1, l + w - 62, t + 19);
                  c.drawRoundRect(rf, 5, 5, p);
                  p.setColor(0xff151a24);
                  rf.set(l + w - 84, t + 6, l + w - 70, t + 14);
                  c.drawRoundRect(rf, 3, 3, p);
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(2);
                  p.setColor(0xff2d3545);
                  rf.set(l + 20, t + 20, l + w - 20, t + h - 20);
                  c.drawRoundRect(rf, 22, 22, p);
                  p.setStyle(Paint.Style.FILL);
                  // spine
                  p.setColor(0xff0d1118);
                  c.drawRect(l + w / 2 - 14, t + 20, l + w / 2 + 14, t + h - 20, p);

                  int n = discs.size();
                  int sel = Math.max(0, Math.min(folderSlots() - 1, folderSel));
                  int page = sel / 8;
                  int pages = folderSlots() / 8;
                  float pw = w / 2 - 50, ph = h - 112;
                  float sw = pw / 2 - 18, sh = ph / 2 - 18;
                  float selX = 0, selY = 0;
                  float leftPl = l + 30, rightPl = l + w / 2 + 20, pt0 = t + 30;
                  if (flipT > 0) {
                      // Page turning: the pages underneath show where you're going, and one sheet swings over the spine
                      int from = flipFrom, to = page;
                      boolean fwd = flipDir > 0;
                      drawFolderSide(c, 0, fwd ? from : to, leftPl, pt0, pw, ph, sw, sh, n, -1);
                      drawFolderSide(c, 1, fwd ? to : from, rightPl, pt0, pw, ph, sw, sh, n, -1);
                      float fe = flipT < 0.5f ? 1 - flipT * 2 : flipT * 2 - 1;     // sheet width: 1 -> 0 -> 1
                      boolean firstHalf = flipT < 0.5f;
                      int sheetSide, sheetPage;
                      float pivot;
                      if (fwd) { sheetSide = firstHalf ? 1 : 0; sheetPage = firstHalf ? from : to; }
                      else { sheetSide = firstHalf ? 0 : 1; sheetPage = firstHalf ? from : to; }
                      pivot = sheetSide == 1 ? rightPl : leftPl + pw;
                      c.save();
                      c.scale(Math.max(0.02f, fe), 1, pivot, 0);
                      drawFolderSide(c, sheetSide, sheetPage, sheetSide == 0 ? leftPl : rightPl, pt0, pw, ph, sw, sh, n, -1);
                      // the sheet darkens as it turns edge-on
                      p.setColor(((int) ((1 - fe) * 150)) << 24);
                      rf.set(sheetSide == 0 ? leftPl : rightPl, pt0, (sheetSide == 0 ? leftPl : rightPl) + pw, pt0 + ph);
                      c.drawRoundRect(rf, 16, 16, p);
                      c.restore();
                  } else {
                      float[] sp = drawFolderSide(c, 0, page, leftPl, pt0, pw, ph, sw, sh, n, sel);
                      if (sp != null) { selX = sp[0]; selY = sp[1]; }
                      sp = drawFolderSide(c, 1, page, rightPl, pt0, pw, ph, sw, sh, n, sel);
                      if (sp != null) { selX = sp[0]; selY = sp[1]; }
                  }
                  // The chosen disc slides up out of its sleeve
                  if (sel >= n) {
                      tp.setTextAlign(Paint.Align.CENTER);
                      tp.setTextSize(23);
                      tp.setColor(0xffb0bec5);
                      c.drawText("Empty sleeve", VW / 2f, t + h - 50, tp);
                  } else if (n > 0 && flipT <= 0) {
                      Disc d = discs.get(sel);
                      float lift = 24 + (float) Math.sin(time * 3) * 3;
                      p.setColor(0x50000000);
                      c.drawOval(selX - 90, selY + 70, selX + 90, selY + 96, p);
                      drawDisc(c, selX, selY - lift, 100, d, true);

                      String info = d.yt ? "YouTube playlist" : d.songs.size() + (d.songs.size() == 1 ? " song" : " songs");
                      if (d == nowDisc) info += "  ·  in the player";
                      tp.setTextAlign(Paint.Align.CENTER);
                      tp.setTextSize(23);
                      tp.setColor(0xffffffff);
                      c.drawText(d.name + "   ·   " + info, VW / 2f, t + h - 50, tp);
                  }
                  tp.setTextAlign(Paint.Align.CENTER);
                  tp.setTextSize(14);
                  tp.setColor(0xff90a4ae);
                  c.drawText("Page " + (page + 1) + " of " + pages + "   ·   OK to play   ·   Info for the song list   ·   Back to close",
                          VW / 2f, t + h - 27, tp);
              }

              /** One page of the CD folder (side 0 = left, 1 = right). Returns where the selected disc sits, if it's on this page. */
              float[] drawFolderSide(Canvas c, int side, int page, float pl, float pt, float pw, float ph, float sw, float sh, int n, int sel) {
                  float[] selPos = null;
                      rf.set(pl, pt, pl + pw, pt + ph);
                      p.setColor(0xff222a37);
                      c.drawRoundRect(rf, 16, 16, p);
                      for (int k = 0; k < 4; k++) {
                          int idx = page * 8 + side * 4 + k;
                          float sl = pl + 12 + (k % 2) * (sw + 12), st = pt + 12 + (k / 2) * (sh + 12);
                          float dcx = sl + sw / 2, dcy = st + sh / 2 + 6;
                          if (idx < n && idx == sel) { selPos = new float[]{dcx, dcy}; }
                          else if (idx < n) drawDisc(c, dcx, dcy, 90, discs.get(idx), false);
                          if (idx >= n && idx == sel) {
                              // an empty sleeve you've landed on
                              p.setStyle(Paint.Style.STROKE);
                              p.setStrokeWidth(4);
                              p.setColor(0xccffffff);
                              rf.set(sl - 3, st - 3, sl + sw + 3, st + sh + 3);
                              c.drawRoundRect(rf, 12, 12, p);
                              p.setStyle(Paint.Style.FILL);
                          }
                          // clear plastic sleeve over the disc
                          rf.set(sl, st, sl + sw, st + sh);
                          p.setColor(0x1effffff);
                          c.drawRoundRect(rf, 10, 10, p);
                          p.setStyle(Paint.Style.STROKE);
                          p.setStrokeWidth(2);
                          p.setColor(0x50ffffff);
                          c.drawRoundRect(rf, 10, 10, p);
                          p.setStyle(Paint.Style.FILL);
                          p.setColor(0x40ffffff);
                          c.drawRect(sl + 8, st + 14, sl + sw - 8, st + 16, p);
                          p.setColor(0x14ffffff);
                          path.reset();
                          path.moveTo(sl + sw * 0.55f, st + 2);
                          path.lineTo(sl + sw * 0.8f, st + 2);
                          path.lineTo(sl + sw * 0.35f, st + sh - 2);
                          path.lineTo(sl + sw * 0.1f, st + sh - 2);
                          path.close();
                          c.drawPath(path, p);
                      }
                  return selPos;
              }

              void drawDisc(Canvas c, float cx, float cy, float r, Disc d, boolean sel) {
                  p.setColor(0x40000000);
                  c.drawCircle(cx + 3, cy + 5, r, p);
                  if (sel) {
                      p.setColor(0x55ffffff);
                      c.drawCircle(cx, cy, r + 7, p);
                  }
                  p.setColor(0xffdfe4ea);
                  c.drawCircle(cx, cy, r, p);
                  p.setShader(new LinearGradient(cx - r, cy - r, cx + r, cy + r,
                          blend(d.color, 0xffffffff, 0.22f), blend(d.color, 0xff000000, 0.28f), Shader.TileMode.CLAMP));
                  c.drawCircle(cx, cy, r * 0.95f, p);
                  p.setShader(null);
                  // shiny rainbow streaks
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(r * 0.09f);
                  rf.set(cx - r * 0.72f, cy - r * 0.72f, cx + r * 0.72f, cy + r * 0.72f);
                  p.setColor(0x38ffffff);
                  c.drawArc(rf, 205, 65, false, p);
                  p.setColor(0x3000e5ff);
                  c.drawArc(rf, 25, 55, false, p);
                  p.setColor(0x26ff4081);
                  rf.set(cx - r * 0.58f, cy - r * 0.58f, cx + r * 0.58f, cy + r * 0.58f);
                  c.drawArc(rf, 35, 40, false, p);
                  p.setStyle(Paint.Style.FILL);
                  // clear centre hub
                  p.setColor(0xffeef2f6);
                  c.drawCircle(cx, cy, r * 0.3f, p);
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(1.5f);
                  p.setColor(0x55000000);
                  c.drawCircle(cx, cy, r * 0.3f, p);
                  c.drawCircle(cx, cy, r * 0.19f, p);
                  p.setStyle(Paint.Style.FILL);
                  p.setColor(0xff1a212c);
                  c.drawCircle(cx, cy, r * 0.1f, p);
                  // label
                  String nm = d.name.length() > 13 ? d.name.substring(0, 12) + "…" : d.name;
                  tp.setTextAlign(Paint.Align.CENTER);
                  tp.setTextSize(r * 0.22f);
                  tp.setColor(0x66000000);
                  c.drawText(nm, cx + 1.5f, cy - r * 0.47f + 1.5f, tp);
                  tp.setColor(0xffffffff);
                  c.drawText(nm, cx, cy - r * 0.47f, tp);
                  tp.setTextSize(r * 0.13f);
                  tp.setColor(0xddffffff);
                  c.drawText(d.yt ? "▶ YouTube" : "♫ " + d.songs.size() + (d.songs.size() == 1 ? " song" : " songs"), cx, cy + r * 0.6f, tp);
              }

              /** The CD player up close: what's playing, plus buttons. */
              void drawPlayerPanel(Canvas c) {
                  c.drawColor(0x33000000);
                  Disc d = nowDisc;
                  float w = 640, h = 250;
                  float l = (VW - w) / 2, t = VH - h - 14;
                  rf.set(l, t, l + w, t + h);
                  p.setColor(0xc4161d29);
                  c.drawRoundRect(rf, 28, 28, p);
                  boolean playing = d != null && radioBusy();

                  // vertical volume slider on the left
                  float vx = l + 38, vTop = t + 44, vBot = t + h - 50;
                  p.setColor(0xff263142);
                  rf.set(vx - 4, vTop, vx + 4, vBot);
                  c.drawRoundRect(rf, 4, 4, p);
                  float vy = vBot - (vBot - vTop) * cdVolume;
                  p.setColor(playerRow == 1 ? 0xff2e7dbd : 0xff546e7a);
                  rf.set(vx - 4, vy, vx + 4, vBot);
                  c.drawRoundRect(rf, 4, 4, p);
                  p.setColor(0xffffffff);
                  c.drawCircle(vx, vy, playerRow == 1 ? 11 : 8, p);
                  tp.setTextAlign(Paint.Align.CENTER);
                  tp.setTextSize(18);
                  tp.setColor(playerRow == 1 ? 0xffffffff : 0xff90a4ae);
                  c.drawText(cdVolume <= 0 ? "🔇" : cdVolume < 0.5f ? "🔉" : "🔊", vx, t + 32, tp);
                  tp.setTextSize(13);
                  tp.setColor(0xff90a4ae);
                  c.drawText(Math.round(cdVolume * 100) + "%", vx, t + h - 26, tp);

                  // the spinning disc
                  if (d != null) {
                      c.save();
                      c.rotate(playing ? (time * 140) % 360 : 0, l + 140, t + 98);
                      drawDisc(c, l + 140, t + 98, 64, d, false);
                      c.restore();
                  }
                  float tx = l + 228;
                  tp.setTextAlign(Paint.Align.LEFT);
                  tp.setTextSize(25);
                  tp.setColor(0xffffffff);
                  c.drawText(d != null ? d.name : "No disc", tx, t + 48, tp);
                  String nt = nowTitle == null ? "" : nowTitle;
                  if (nt.length() > 34) nt = nt.substring(0, 33) + "…";
                  tp.setTextSize(17);
                  tp.setColor(0xffcfd8dc);
                  c.drawText(nt, tx, t + 76, tp);
                  tp.setTextSize(14);
                  tp.setColor(playing ? 0xffa5d6a7 : 0xffffcc80);
                  c.drawText((playing ? "Playing" : "Paused") + (nowYT ? " in SmartTube" : ""), tx, t + 98, tp);

                  // progress bar
                  long[] pr = songProgress();
                  if (pr != null && pr[1] > 0) {
                      float bl = tx, br = l + w - 110, byy = t + 120;
                      float f = Math.max(0, Math.min(1, pr[0] / (float) pr[1]));
                      p.setColor(0xff263142);
                      rf.set(bl, byy - 3, br, byy + 3);
                      c.drawRoundRect(rf, 3, 3, p);
                      p.setColor(0xffe1bee7);
                      rf.set(bl, byy - 3, bl + (br - bl) * f, byy + 3);
                      c.drawRoundRect(rf, 3, 3, p);
                      c.drawCircle(bl + (br - bl) * f, byy, 6, p);
                      tp.setTextAlign(Paint.Align.LEFT);
                      tp.setTextSize(13);
                      tp.setColor(0xffb0bec5);
                      c.drawText(mmss(pr[0]) + " / " + mmss(pr[1]), br + 12, byy + 5, tp);
                  }

                  // buttons
                  float by = t + 178, gap = 52, bx0 = l + 112;
                  for (int i = 0; i < PLAYER_BTNS.length; i++) {
                      float bx = bx0 + i * gap + (i > 0 ? 18 : 0);
                      p.setColor(i == playerSel && playerRow == 0 ? 0xff2e7dbd : 0xff263142);
                      c.drawCircle(bx, by, 23, p);
                      tp.setTextAlign(Paint.Align.CENTER);
                      tp.setTextSize(i == playerSel && playerRow == 0 ? 23 : 20);
                      tp.setColor(0xffffffff);
                      c.drawText(PLAYER_BTNS[i], bx, by + 7, tp);
                      if (i == 3 && shuffleOn) {
                          p.setColor(0xff76ff03);
                          c.drawCircle(bx, by + 18, 3, p);
                      }
                  }
                  tp.setTextAlign(Paint.Align.CENTER);
                  tp.setTextSize(14);
                  tp.setColor(0xffffffff);
                  if (playerRow == 0) c.drawText(PLAYER_BTN_NAMES[playerSel], bx0 + playerSel * gap + (playerSel > 0 ? 18 : 0), by + 44, tp);
                  else {
                      tp.setColor(0xffffcc80);
                      tp.setTextSize(13);
                      c.drawText(nowYT ? "Volume is for MP3 discs. YouTube discs follow the TV volume." : "Up / Down to change the volume", l + w / 2 + 30, by + 44, tp);
                  }
                  tp.setTextAlign(Paint.Align.RIGHT);
                  tp.setTextSize(12);
                  tp.setColor(0xff90a4ae);
                  c.drawText("Back to close", l + w - 22, t + 26, tp);
              }

