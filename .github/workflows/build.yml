                  tp.setColor(0xffcfd8dc);
                  String nt = ytStepping || (ytShuffling && ytBusyShuffle) ? "Shuffling…" : nowTitle == null ? "" : nowTitle;
                  c.drawText(fitText(nt, tr - tx), tx, t + 54, tp);
