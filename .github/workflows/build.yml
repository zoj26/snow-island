          def chaikin(pts, n):
              """Corner cutting: turns a polygon's sharp corners into smooth curves."""
              p = [tuple(map(float, q)) for q in pts]
              for _ in range(n):
                  q = []
                  for i in range(len(p)):
                      a, b = p[i], p[(i + 1) % len(p)]
                      q.append((0.75 * a[0] + 0.25 * b[0], 0.75 * a[1] + 0.25 * b[1]))
                      q.append((0.25 * a[0] + 0.75 * b[0], 0.25 * a[1] + 0.75 * b[1]))
                  p = q
              return p


          def paint_belly(col, ov, b, bpos, spec, pad):
              from PIL import ImageDraw, ImageFilter
              H, W = np.asarray(ov).shape[:2]
              o = np.asarray(ov).astype(np.float32)
              cm = np.asarray(col)[:, :, 3] > 100
              bd = np.zeros((H, W, 4), np.float32)
              bd[bpos[1]:bpos[1] + b.size[1], bpos[0]:bpos[0] + b.size[0]] = np.asarray(b)
              orange = (bd[..., 0] > 150) & (bd[..., 1] > 60) & (bd[..., 1] < 200) & (bd[..., 2] < 90) & (bd[..., 3] > 100)
              keep = cm & ~orange
              for name, rgb in (("line", 120), ("white", 255), ("grey", 128)):
                  m = Image.new("L", (W, H), 0)
                  pts = spec[name]
                  if name != "line":
                      pts = chaikin(pts, 4)        # round every corner
                  ImageDraw.Draw(m).polygon([(x + pad, y + pad) for x, y in pts], fill=255)
                  m = np.asarray(m.filter(ImageFilter.GaussianBlur(0.6 if name == "line" else 1.0))).astype(np.float32) / 255 * keep
                  for k in range(3):
                      o[..., k] = o[..., k] * (1 - m) + rgb * m
                  o[..., 3] = np.maximum(o[..., 3], m * 255)
              return Image.fromarray(o.astype(np.uint8), "RGBA")


          def files(d, layer):
              if d.startswith("Video"):
                  if not VSRC or layer != "Color":
                      return []
                  p = os.path.join(VSRC, d)
                  return sorted(glob.glob(p + "/*.png"), key=lambda f: int(os.path.basename(f)[:-4])) if os.path.isdir(p) else []
              p = os.path.join(SRC, d, layer)
              if os.path.isdir(p):
                  return sorted(glob.glob(p + "/*.png"), key=lambda f: int(os.path.basename(f)[:-4]))
              if os.path.exists(p + ".png"):
                  return [p + ".png"]
              return []


          def load(f):
              return Image.open(f).convert("RGBA")


          ICON = [None]
          FRAME_BODY = {}
          _WAVE_CUT = []


          def video_headcut(col, ov, r):
              """Which pixels the head rounding takes off a video frame (found from the beak, so a raised flipper is safe)."""
              before = np.asarray(col)[:, :, 3] > 0
              o0 = np.asarray(ov)
              orange = (o0[:, :, 0] > 180) & (o0[:, :, 1] > 80) & (o0[:, :, 1] < 200) & (o0[:, :, 2] < 90) & (o0[:, :, 3] > 200)
              oy, ox = np.nonzero(orange)
              cy_, cx_ = np.nonzero(before)
              beak = oy < cy_.min() + (cy_.max() - cy_.min()) * 0.55
              if beak.sum() <= 30:
                  return np.zeros_like(before)
              after = round_top(col, r, head_x=float(np.median(ox[beak])), head_bottom=int(oy[beak].min()),
                                solid=o0[:, :, 3] > 100, strip=0.3)
              return before & ~(np.asarray(after)[:, :, 3] > 0)


          def video_head_template():
              if not _WAVE_CUT:
                  col, ov = frame_layers("Video Wave", min(12, len(files("Video Wave", "Color")) - 1))
                  _WAVE_CUT.append(head_template(col, ov))
              return _WAVE_CUT[0]     # (folder, frame) -> body offset, for animations where one setting doesn't fit every frame


          def fill_belly(col, ov, e, epos, b, bpos):
              """Make the white belly run cleanly down to the grey belly line: any body colour showing in the
              gap between the bottom of the belly and the line underneath it becomes belly white."""
              o = np.asarray(ov).copy()
              H, W = o.shape[:2]
              em = np.zeros((H, W), bool)
              ea = np.asarray(e)[:, :, 3] > 128
              em[epos[1]:epos[1] + ea.shape[0], epos[0]:epos[0] + ea.shape[1]] = ea
              ba = np.asarray(b).astype(int)
              lum = ba[:, :, :3].mean(2)
              sat = ba[:, :, :3].max(2) - ba[:, :, :3].min(2)
              st = (ba[:, :, 3] > 90) & (sat < 70) & (lum < 215)
              sm = np.zeros((H, W), bool)
              sm[bpos[1]:bpos[1] + st.shape[0], bpos[0]:bpos[0] + st.shape[1]] = st
              ca = np.asarray(col)[:, :, 3] > 100
              cols = np.nonzero(em.any(0))[0]
              for x in cols:
                  yb = np.nonzero(em[:, x])[0].max()
                  below = np.nonzero(sm[yb + 1:yb + 16, x])[0]
                  if len(below) == 0:
                      continue
                  y1 = yb + 1 + below[0]
                  for y in range(yb + 1, y1):
                      if ca[y, x] and o[y, x, 3] < 200:
                          o[y, x] = (255, 255, 255, 255)
              return Image.fromarray(o, "RGBA")


          # in these folders the "Color" pictures are already the whole penguin, put together properly
          COMPOSITE = {"Walk (2)", "Walk (3)", "Walk (4)"}


          def split_composite(c, pad, video=False, at=(0, 0), canvas=None):
              """A whole-penguin picture -> (grey body-colour part, everything else), on a padded canvas.
              video: the colour is a lighter blue and its edges blend into the white belly, so those blended edge
              pixels are split into body colour underneath + belly white on top (keeps the belly edge clean)."""
              a = np.asarray(c).astype(np.float32)
              r, g, b, al = a[:, :, 0], a[:, :, 1], a[:, :, 2], a[:, :, 3]
              blue = (b > r + 25) & (b > g + 15)
              rest = a.copy()
              if video:
                  strict = blue & (b > r + 90)
                  r0 = float(np.median(r[strict])) if strict.any() else 40.0
                  b0 = float(np.median(b[strict])) if strict.any() else 220.0
                  from scipy.ndimage import binary_dilation
                  core = (r > 225) & (g > 225) & (b > 225) & (al > 128)
                  near = binary_dilation(core, iterations=3)       # only blends right at the belly's edge, not light highlights
                  whiteness = np.where(near, np.clip((r - r0) / (255 - r0), 0, 1), 0)
                  gv = np.clip(b / b0, 0, 1) * 255
                  rest[:, :, 0:3] = 255
                  rest[:, :, 3] = np.where(blue, whiteness * al, al)
                  rest[~blue, 0:3] = a[~blue, 0:3]
              else:
                  lum = (r * 0.3 + g * 0.59 + b * 0.11) / BASE_LUM
                  gv = np.clip(lum, 0, 1) * 255
                  rest[:, :, 3] = np.where(blue, 0, al)
              grey = np.dstack([gv, gv, gv, np.where(blue, al, 0)]).astype(np.uint8)
              W, H = canvas if canvas else (c.size[0] + 2 * pad, c.size[1] + 2 * pad)
              col = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              col.alpha_composite(Image.fromarray(grey, "RGBA"), (pad + at[0], pad + at[1]))
              ov = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              ov.alpha_composite(Image.fromarray(rest.astype(np.uint8), "RGBA"), (pad + at[0], pad + at[1]))
              return col, ov


          def frame_layers(d, i):
              """(grey colour layer, overlay) for frame i of folder d, on a shared canvas."""
              C, Bo, Be = files(d, "Color"), files(d, "Body"), files(d, "Belly")
              if d.startswith("Video"):
                  f = C[min(i, len(C) - 1)]
                  x, y = [int(v) for v in open(f[:-4] + ".txt").read().split()]
                  col, ov = split_composite(load(f), 160, video=True, at=(x, y), canvas=(1120, 800))
                  if False:
                      # the approved head: rounded the usual way
                      gone = video_headcut(col, ov, ROUND.get(d, 45))
                      c = np.asarray(col).copy()
                      c[gone, 3] = 0
                      col = Image.fromarray(c, "RGBA")
                      from scipy.ndimage import binary_dilation
                      o = np.asarray(ov).copy()
                      o[binary_dilation(gone, iterations=3) & ~(c[:, :, 3] > 0), 3] = 0    # no ghost outline of the old point
                      ov = Image.fromarray(o, "RGBA")
                  else:
                      # every other video frame gets that same head shape, lined up on the eyes
                      pass      # wave and dance keep the game's own head shape
                  from scipy.ndimage import label
                  c = np.asarray(col).copy()
                  o = np.asarray(ov).copy()
                  # faint edge pixels left hanging outside the body (old outline of the point): gone
                  from scipy.ndimage import binary_dilation
                  solid = binary_dilation((c[:, :, 3] > 200) | (o[:, :, 3] > 200), iterations=1)
                  o[~solid, 3] = 0
                  c[~solid, 3] = 0
                  # nothing left floating: keep only the penguin itself
                  lab, n = label((c[:, :, 3] > 0) | (o[:, :, 3] > 0))
                  if n > 1:
                      sizes = np.bincount(lab.ravel())
                      sizes[0] = 0
                      keep = lab == sizes.argmax()
                      c[~keep, 3] = 0
                      o[~keep, 3] = 0
                  col, ov = Image.fromarray(c, "RGBA"), Image.fromarray(o, "RGBA")
                  wy, wx = np.nonzero((o[:, :, 0] > 230) & (o[:, :, 1] > 230) & (o[:, :, 2] > 230) & (o[:, :, 3] > 200))
                  ICON[0] = (float(np.median(wx)), float(np.median(wy))) if len(wx) > 30 else None
                  return col, ov
              if d in COMPOSITE:
                  col, ov = split_composite(load(C[min(i, len(C) - 1)]), 160)
                  if d in ROUND and not is_side(d, i):
                      col = round_top(col, ROUND[d], solid=np.asarray(ov)[:, :, 3] > 100, strip=STRIP.get(d, 0.2))
                  if is_side(d, i):
                      col, ov = cap_round(col, ov)
                  o = np.asarray(ov)
                  wy, wx = np.nonzero((o[:, :, 0] > 230) & (o[:, :, 1] > 230) & (o[:, :, 2] > 230) & (o[:, :, 3] > 200))
                  ICON[0] = (float(np.median(wx)), float(np.median(wy))) if len(wx) > 30 else None
                  return col, ov
              c = load(C[min(i, len(C) - 1)])
              b = load(Bo[min(i, len(Bo) - 1)])
              e = load(Be[min(i, len(Be) - 1)]) if Be and d not in PAINT_BELLY else None
              if d in BELLY_SRC:
                  sd, si, sx, sy = BELLY_SRC[d]
                  e = load(files(sd, "Belly")[si])
                  e = e.resize((int(e.size[0] * sx), int(e.size[1] * sy)), Image.LANCZOS)
              pad = 160
              W = max(c.size[0], b.size[0]) + 2 * pad
              H = max(c.size[1], b.size[1]) + 2 * pad
              a = np.asarray(c).astype(np.float32)
              lum = (a[:, :, 0] * 0.3 + a[:, :, 1] * 0.59 + a[:, :, 2] * 0.11) / BASE_LUM
              g = np.clip(lum, 0, 1) * 255
              grey = np.dstack([g, g, g, a[:, :, 3]]).astype(np.uint8)
              col = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              col.alpha_composite(Image.fromarray(grey, "RGBA"), (pad, pad))
              ov = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              if e is not None:
                  bx, by = BELLY.get(d, ((c.size[0] - e.size[0]) // 2, (c.size[1] - e.size[1]) // 2))
                  ov.alpha_composite(e, (pad + bx, pad + by))
                  eb = e.getbbox()
                  ICON[0] = (pad + bx + (eb[0] + eb[2]) / 2, pad + by + eb[1] + (eb[3] - eb[1]) * 0.45) if eb else None
              else:
                  ICON[0] = None
              ox, oy = FRAME_BODY.get((d, i), BODY.get(d, (0, 0)))
              if e is not None and d in BELLY_SRC:
                  # a borrowed belly may not poke outside the coloured body
                  o = np.asarray(ov).copy()
                  o[np.asarray(col)[:, :, 3] <= 100, 3] = 0
                  ov = Image.fromarray(o, "RGBA")
              ov.alpha_composite(b, (pad + ox, pad + oy))
              if d in PAINT_BELLY:
                  ov = paint_belly(col, ov, b, (pad + ox, pad + oy), PAINT_BELLY[d], pad)
                  wp = np.array(PAINT_BELLY[d]["white"], float)
                  ICON[0] = (pad + wp[:, 0].mean(), pad + wp[:, 1].mean())
              if e is not None and d in BELLY_SRC:
                  ov = fill_belly_gap(col, ov, (pad + bx, pad + by), e)
              if e is not None and d not in BELLY_SRC:
                  ov = fill_belly(col, ov, e, (pad + bx, pad + by), b, (pad + ox, pad + oy))
              if d in ROUND:
                  col = round_top(col, ROUND[d], solid=np.asarray(ov)[:, :, 3] > 100, strip=STRIP.get(d, 0.2))
              if is_side(d, i):
                  col, ov = cap_round(col, ov)
              if d == "Walk (5)":
                  # walking away: the beak tip poking over the head looks odd, so it goes
                  a = np.asarray(ov).copy()
                  cb = col.getbbox()
                  top = cb[1] + int((cb[3] - cb[1]) * 0.35)
                  r, g, bl = a[:, :, 0].astype(int), a[:, :, 1].astype(int), a[:, :, 2].astype(int)
                  beak = (r > 150) & (g > 60) & (g < 200) & (bl < 90)
                  beak[top:, :] = False
                  a[beak, 3] = 0
                  ov = Image.fromarray(a, "RGBA")
              return col, ov


          def close_eyes(col, ov):
              """The napping frame: paint the open eyes out and draw closed ones (little arcs)."""
              o = np.asarray(ov).copy()
              alpha = o[:, :, 3]
              ys, xs = np.nonzero(alpha > 40)
              top, bot = ys.min(), ys.max()
              lim = top + int((bot - top) * 0.33)
              white = (o[:, :, 0] > 225) & (o[:, :, 1] > 225) & (o[:, :, 2] > 225) & (alpha > 200)
              white[lim:, :] = False
              wy, wx = np.nonzero(white)
              if len(wx) == 0:
                  return ov
              x0, x1, y0, y1 = wx.min(), wx.max(), wy.min(), wy.max()
              # everything in the eye box that isn't the orange beak goes (whites and pupils): the colour shows through
              box = o[y0:y1 + 1, x0:x1 + 1]
              orange = (box[:, :, 0] > 180) & (box[:, :, 1] > 90) & (box[:, :, 1] < 200) & (box[:, :, 2] < 90)
              keep = orange | (box[:, :, 3] < 10)
              box[~keep] = 0
              o[y0:y1 + 1, x0:x1 + 1] = box
              out = Image.fromarray(o, "RGBA")
              from PIL import ImageDraw
              dr = ImageDraw.Draw(out)
              # one closed eye (a little downward curve) where each open eye was
              mid = float(np.median(wx))
              sides = [sd for sd in (wx < mid, wx >= mid) if sd.sum() >= 10]
              span = max((wx[sd].max() - wx[sd].min()) for sd in sides) if sides else 0
              for side in sides:
                  ex0, ex1 = wx[side].min(), wx[side].max()
                  ecy = float(wy[side].mean())
                  ex0, ex1 = (ex0 + ex1) / 2 - span / 2, (ex0 + ex1) / 2 + span / 2     # both eyelids the same size
                  r = (ex1 - ex0) * 0.42
                  ecx = (ex0 + ex1) / 2
                  w = max(3, int((ex1 - ex0) * 0.16))
                  dr.arc([ecx - r, ecy - r * 0.9, ecx + r, ecy + r * 0.9], 15, 165, fill=(25, 25, 35, 255), width=w)
              return out


          # what goes in: (key, [(folder, frame index)...], per-frame feet?)
          # The side and back-diagonal walk folders in the pack are muddled: frames 4-7 of those directions sit in the
          # folder one before. Front, front-diagonal and back are fine as they are.
          JOBS = []
          JOBS.append(("W1", [("Walk (1)", i) for i in range(8)], True))
          JOBS.append(("W2", [("Walk (2)", i) for i in (0, 1, 2, 7)], True))
          # side walk: just the 4 true side frames (the other half in the pack is a second, mismatched step)
          JOBS.append(("W3", [("Walk (3)", i) for i in (0, 1, 2, 7)], True))
          JOBS.append(("W4", [("Walk (4)", 0), ("Walk (4)", 1), ("Walk (4)", 2)]
                       + [("Walk (3)", i) for i in (3, 4, 5, 6)] + [("Walk (4)", 7)], True))
          JOBS.append(("W5", [("Walk (5)", i) for i in range(8)], True))
          for k in range(1, 6):
              # standing diagonal: the pack's own finished walk picture (feet down) has the right belly and width
              JOBS.append(("I%d" % k, [("Idle (%d)" % k, 0)], True))
          JOBS.append(("S1", [("Sit (1)", 0)], True))
          if files("Video Wave", "Color"):
              JOBS.append(("V", [("Video Wave", i) for i in range(len(files("Video Wave", "Color")))], False))
          else:
              JOBS.append(("V", [("Wave", i) for i in range(len(files("Wave", "Color")))], False))
          def _faces_away(d, i):
              o = np.asarray(frame_layers(d, i)[1])
              return ((o[:, :, 0] > 230) & (o[:, :, 1] > 230) & (o[:, :, 2] > 230) & (o[:, :, 3] > 200)).sum() < 500


          # the dance spins round; the frames facing away don't line up, so those use the standing up-diagonal pose
          if files("Video Dance", "Color"):
              JOBS.append(("D", [("Video Dance", i) for i in range(len(files("Video Dance", "Color")))], False))
          else:
              JOBS.append(("D", [("Idle (4)", 0) if _faces_away("Dance", i) else ("Dance", i)
                                 for i in range(0, len(files("Dance", "Color")), 4)], False))


          def feet(col, ov):
              """Feet point of one frame: middle of the lower half of the body, bottom of the penguin."""
              a = np.asarray(col)[:, :, 3] > 40
              ys, xs = np.nonzero(a)
              sel = ys > (ys.min() + ys.max()) / 2
              return float(xs[sel].mean()), float(Image.alpha_composite(col, ov).getbbox()[3])


          # one scale for everything, from the front standing pose
          c0, o0 = frame_layers("Idle (1)", 0)
          bb = Image.alpha_composite(c0, o0).getbbox()
          SCALE = STORE_H / (bb[3] - bb[1])

          # the pack draws the back views a little smaller than the front: bring them up to the same height
          # The pack draws each direction at a slightly different size (front views small, side views tall).
          # Bring them most of the way to one common height so nobody grows or shrinks when they turn.
          _BASE = {"I1": 120.0, "I2": 128.5, "I3": 144.3, "I4": 126.2, "I5": 113.2,
                   "W1": 126.8, "W2": 127.8, "W3": 141.7, "W4": 141.9, "W5": 117.3}
          SIZE_FIX = {k: 1 + (130.0 / v - 1) * 0.8 for k, v in _BASE.items()}
          for _k in ("S1", "N1", "V", "D"):
              SIZE_FIX[_k] = SIZE_FIX["I1"]       # sitting, wave and dance start from the front standing pose

          tiles = []   # (key, image, ox, oy)
          icons = []   # (key, x, y): where the belly icon goes, relative to the feet
          for key, parts, per_frame in JOBS:
              if any(not files(d, "Color") for d, _ in parts):
                  continue
              frames, ipts = [], []
              for d, i in parts:
                  frames.append(frame_layers(d, i))
                  ipts.append(ICON[0])
              folder = parts[0][0]
              sc = SCALE * (2.0 if folder.startswith("Throw") else 1.0)     # the throw pictures in the pack are half size
              sc *= SIZE_FIX.get(key, 1.0)
              # one steady feet point per source folder (re-measuring every frame made them shake)
              fs = [feet(c, o) for c, o in frames]
              groups = {}
              for n, (d, i) in enumerate(parts):
                  groups.setdefault(d, []).append(n)
              anchors = [None] * len(frames)
              for d, ns in groups.items():
                  ax = float(np.median([fs[n][0] for n in ns]))
                  ay = float(np.percentile([fs[n][1] for n in ns], 85))
                  for n in ns:
                      anchors[n] = (ax, ay)
              if key == "S1":
                  frames.append((frames[0][0], close_eyes(*frames[0])))
                  anchors.append(anchors[0])
                  ipts.append(ipts[0])
              for n, (col, ov) in enumerate(frames):
                  k2 = "N1" if (key == "S1" and n == 1) else key
                  n2 = 0 if k2 == "N1" else n
                  ax, ay = anchors[n]
                  ip = ipts[n] if key not in ("W4", "I4", "T2") else None    # facing away: the icon goes on the back
                  if ip is None:     # no belly showing (from behind): middle of the back
                      b1 = col.getbbox()
                      ip = ((b1[0] + b1[2]) / 2, b1[1] + (b1[3] - b1[1]) * 0.55)
                  icons.append(("%s_%d_i" % (k2, n2), (ip[0] - ax) * sc, (ip[1] - ay) * sc))
                  for layer, im in (("c", col), ("o", ov)):
                      box = im.getbbox()
                      if box is None:
                          continue
                      crop = im.crop(box)
                      w = max(1, int(round(crop.size[0] * sc)))
                      h = max(1, int(round(crop.size[1] * sc)))
                      small = crop.convert("RGBa").resize((w, h), Image.LANCZOS).convert("RGBA")   # premultiplied: no edge bleed
                      tiles.append(("%s_%d_%s" % (k2, n2, layer), small, (box[0] - ax) * sc, (box[1] - ay) * sc))

          # shelf-pack into one atlas
          AW = 2048
          tiles.sort(key=lambda t: -t[1].size[1])
          x = y = shelf = 0
          places = []
          for key, im, ox, oy in tiles:
              w, h = im.size
              if x + w + 1 > AW:
                  x = 0
                  y += shelf + 1
                  shelf = 0
              places.append((key, x, y, w, h, ox, oy, im))
              x += w + 1
              shelf = max(shelf, h)
          AH = y + shelf + 1
          atlas = Image.new("RGBA", (AW, AH), (0, 0, 0, 0))
          os.makedirs(OUT, exist_ok=True)
          with open(os.path.join(OUT, "index.txt"), "w") as f:
              for key, x, y, w, h, ox, oy, im in places:
                  atlas.paste(im, (x, y))
                  f.write("%s %d %d %d %d %.1f %.1f\n" % (key, x, y, w, h, ox, oy))
              for key, ix, iy in icons:
                  f.write("%s 0 0 0 0 %.1f %.1f\n" % (key, ix, iy))
          atlas.save(os.path.join(OUT, "atlas.png"), optimize=True)
          print("sprites: %d pictures, atlas %dx%d" % (len(places), AW, AH))
          PY_EOF
          cat > font.py <<'PY_EOF'
          """Name tag font: a Futura file in the repo if there is one (Medium if it's a family file), otherwise Jost Medium
          (a free Futura look-alike) downloaded from Google Fonts. Writes app/src/main/assets/fonts/tag.ttf."""
          import glob, os, sys, urllib.request
          from fontTools.ttLib import TTFont, TTCollection

          out = "app/src/main/assets/fonts/tag.ttf"
          os.makedirs(os.path.dirname(out), exist_ok=True)
          cands = [f for f in glob.glob("**/*", recursive=True)
                   if "futura" in os.path.basename(f).lower() and f.lower().endswith((".ttf", ".otf", ".ttc"))]


          def style(font):
              n = font["name"]
              return " ".join(str(n.getDebugName(i) or "") for i in (1, 2, 4, 17))


          if cands:
              f = cands[0]
              if f.lower().endswith(".ttc"):
                  fonts = TTCollection(f).fonts
              else:
                  fonts = [TTFont(f)]
              pick = next((x for x in fonts if "medium" in style(x).lower()), fonts[0])
              print("name tags: using", f, "->", style(pick))
              pick.save(out)
              sys.exit(0)

          try:
              url = "https://github.com/google/fonts/raw/main/ofl/jost/Jost%5Bwght%5D.ttf"
              urllib.request.urlretrieve(url, "jost.ttf")
              from fontTools.varLib import instancer
              f = TTFont("jost.ttf")
              instancer.instantiateVariableFont(f, {"wght": 500}, inplace=True)
              f.save(out)
              print("name tags: using Jost Medium")
          except Exception as e:
              print("name tags: no font downloaded (" + str(e) + "), using the TV's default")
          PY_EOF
          pip install --quiet fonttools
          python3 font.py
          python3 find_sprites.py
          if [ -f sprite_root.txt ]; then
            pip install --quiet pillow numpy scipy
            python3 sprites.py "$(cat sprite_root.txt)" app/src/main/assets/sprites "$(cat video_root.txt 2>/dev/null)"
          fi
      - name: Make a signing key (first build only)
        run: |
          if [ ! -f signing/snowisland.keystore ]; then
            mkdir -p signing
            keytool -genkeypair -keystore signing/snowisland.keystore -storepass snowisland \
              -alias snowisland -keypass snowisland -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Snow Island"
            echo NEW_KEY=1 >> "$GITHUB_ENV"
          fi

      - name: Build the app
        working-directory: app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Save the signing key so updates install over the old version
        if: env.NEW_KEY == '1'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add signing/snowisland.keystore
          git commit -m "Save signing key [skip ci]"
          git push

      - name: Publish SnowIsland.apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/*.apk SnowIsland.apk
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          gh release create latest SnowIsland.apk --latest \
            --title "Snow Island (build ${{ github.run_number }})" \
            --notes "Install on the TV with the Downloader app."