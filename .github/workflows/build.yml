                  c.drawOval(640 - 220, 440, 640 + 220, 580, w);
                  w.setColor(0xff7b2d43);
                  c.drawOval(640 - 170, 458, 640 + 170, 562, w);
                  w.setColor(0xfff2d0a4);
                  c.drawOval(640 - 110, 478, 640 + 110, 542, w);
