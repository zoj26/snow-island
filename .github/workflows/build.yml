        run: |
          cat > find_sprites.py <<'PY_EOF'
          import glob, os, sys, zipfile
          zips = [z for z in glob.glob("*.zip") if "penguin" in z.lower() and "special" not in z.lower()]
          if not zips:
              print("No penguin sprite zip in the repo: using the original drawn penguins")
              sys.exit(0)
          os.makedirs("sprite_src", exist_ok=True)
          zipfile.ZipFile(zips[0]).extractall("sprite_src")
