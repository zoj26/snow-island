          /**
           * Snow Island: a home screen you walk around.
           * Your penguin waddles around a snowy island; every app is another penguin.
           * Walk up to one and press OK to open it. OK anywhere else opens the action wheel.
           */
          public class MainActivity extends Activity implements SurfaceHolder.Callback {

              // The game draws at 1280x720 and the TV scales it up. Much lighter on the chip than 4K.
              static final int VW = 1280, VH = 720;
              static final float WW = 2400, WH = 1600, CX = 1200, CY = 800, RX = 1050, RY = 680;
              static final float IGLOO_X = CX, IGLOO_Y = CY - 20;
              static final float DOOR_X = IGLOO_X, DOOR_Y = IGLOO_Y + 38;

              static final int DOWN = 0, UP = 1, LEFT = 2, RIGHT = 3;
              static final float PLAYER_SPEED = 230f;
              static final float NEAR_DIST = 95f;

              // Emotes / poses
              static final int E_NONE = 0, E_WAVE = 1, E_DANCE = 2, E_THROW = 3, E_SLIDE = 4, E_NAP = 5,
                      E_HOP = 6, E_FLAP = 7, E_LOOK = 8, E_SIT = 9, E_FLINCH = 10, E_HUG = 11, E_PAT = 12, E_SCRATCH = 13;

              static final int SCENE_ISLAND = 0, SCENE_IGLOO = 1, SCENE_FIRE = 2;
              static final int OV_NONE = 0, OV_WHEEL = 1, OV_LIST = 2, OV_FOLDER = 3, OV_PLAYER = 4;

              // The CD player sits on a little ice table in front of the igloo
              static final float CD_X = IGLOO_X - 258, CD_Y = IGLOO_Y + 18;
              // Ezio's bed, off to the side of the lawn chairs
              static final float BED_X = IGLOO_X + 310, BED_Y = IGLOO_Y + 140;
              static final float ROOM_BED_X = 788, ROOM_BED_Y = 306;
              static final float ROOM_FA = 640, ROOM_FB = 450;   // the round igloo floor: half-width and height, centred at the bottom middle      // his bed inside, on the hearth right of the fireplace
              static final float CUSHION_X = 475, CUSHION_Y = 350;         // the teal cushion on the left, his other napping spot

              // YouTube playlists that come with the island. To add one: {"Name", "playlist id", "colour"}
              static final String[][] YT_DISCS = {
                      {"Christmas", "PLXgUstcYt9KuLMQ1gt9jKmQB5ZSMqs9HF", "#c62828"},
              };
              // SmartTube's app names (stable first, then beta builds)
              static final String[] SMARTTUBE_PKGS = {"org.smarttube.stable", "org.smarttube.beta", "com.teamsmart.videomanager.tv", "com.liskovsoft.smarttubetv.beta", "com.liskovsoft.smarttubetv"};
              static final float[] CLOCK_SIZES = {1f, 0.85f, 0.75f, 0.6f};
              static final String[] CLOCK_SIZE_NAMES = {"Full", "85%", "75%", "60%"};
              static final int[] MIX_COLS = {0xff1e88e5, 0xff8e24aa, 0xff43a047, 0xfffb8c00, 0xff00acc1, 0xffd81b60, 0xff5e35b1, 0xfffdd835};
              static final String[] PLAYER_BTNS = {"⏹", "⏮", "⏯", "⏭", "🔀", "🔍", ""};     // the last one is drawn as a little CD binder
              static final String[] PLAYER_BTN_NAMES = {"Stop", "Back", "Play/pause", "Next", "Shuffle", "Song list", "CD folder"};

              static final int SEASON_NONE = 0, SEASON_XMAS = 1, SEASON_HALLOWEEN = 2, SEASON_VALENTINE = 3, SEASON_NEWYEAR = 4;
              static final String[] SEASON_PREF_NAMES = {"Auto", "Christmas", "Halloween", "Valentine's", "New Year", "Off"};

              // Sound ids
              static final int S_STEP = 0, S_CHIRP = 1, S_OPEN = 2, S_WHOOSH = 3, S_SPLAT = 4, S_TICK = 5, S_TOGGLE = 6, S_DOOR = 7, S_CRACKLE = 8, S_WHISTLE = 9;

              static final int[] SCARVES = {
                      0xffe53935, 0xff1e88e5, 0xff43a047, 0xfffdd835, 0xff8e24aa,
                      0xfffb8c00, 0xff00acc1, 0xffd81b60, 0xff6d4c41, 0xff3949ab,
                      0xff7cb342, 0xfff4511e
              };
              static final int PLAYER_SCARF = 0xffff5252;
              static final int PENGUIN_BLACK = 0xff1b2230;
              static final String[] CHAT_BITS = {"…", "♪", "♥", "?", "!", "★", "☺", "❄", "ha ha", "!!", "hm?", "♫", "ooh", "…!"};
              static final int[] LIGHT_COLS = {0xffe53935, 0xff43a047, 0xfffdd835, 0xff1e88e5, 0xffff80ab, 0xfffb8c00};

              static final String[] WHEEL_ICONS = {"👋", "🕺", "🤗", "❄️", "🐧", "📻", "🐈", "📯", "🙈", "⚙️", "🎵", "🤔", "👀"};
              static final int WN = 13, W_MUSIC = 10, W_REMOTE = 5, W_EZIO = 6, W_WHISTLE = 7;
              static final String[] WHEEL_NAMES = {"Wave", "Dance", "Hug", "Snowball", "Slide", "CD remote", "Ezio", "Whistle", "Apps", "Settings", "Music", "Head scratch", "Look around"};

              /** One penguin leaves a conversation to go and pet Ezio; the rest pause and react. */
              static class PetEvent {
                  AppPeng petter, host;
                  final ArrayList<AppPeng> others = new ArrayList<>();
                  float spotX, spotY, t, confT, flipT;
                  int outcome, phase, confMode, flipsLeft;
                  boolean three;
              }
              PetEvent petEv;
              final float[] emoteStartAt = new float[16];      // when each emote was last started by someone on their own
              int tvStarers;                                     // penguins currently staring out at you
              AppPeng ezTail; float ezTailT; boolean ezTailStare;   // Ezio tagging along behind (or just staring at) a penguin
              float ezStareGap = 0.2f;
              boolean ezFollowGo, ezTailGo;    // following: only set off once he's dropped a little behind (no jittery shuffling)
              AppPeng ezPetGroup;     // the conversation Ezio is wandering over to

              static class AppPeng {
                  String pkg, label;
                  Intent intent;
                  Bitmap icon;
                  int scarf, launches;
                  float hx, hy, x, y, tx, ty, wait, phase;
                  int facing = DOWN;
                  boolean moving;
                  int emote;
                  float emoteT, emoteDur, emoteDelay;
                  float hitT, throwBackT, ballT, hugX, hugY;
                  AppPeng throwBackAt;        // who to throw back at (null = you)
                  int throwBackDepth, spreeLeft;
                  float replyT, noticeT, ignoreT, stareT, turnAwayT;
                  boolean faceMe, joinArrived;    // faceMe: the pair turn to look at this joiner
                  int shortWalks, longAfter;      // after a few little shuffles about, they set off somewhere further
                  PetEvent ev;                    // part of a "someone left the chat to pet Ezio" moment
                  float evPauseT;
                  float flutterT;                 // shaking off a stare with a flutter of blinks
                  AppPeng napWith;                // walking over to nap beside this penguin
                  AppPeng napHost;                // napping as part of this penguin's group nap
                  AppPeng faceAt;                 // copying this penguin's emote: look at it
                  int napSide;                    // which side of the napper to lie down on
                  float stuckT, sx, sy;           // getting nowhere? pick somewhere else
                  float progT, bestD = 1e9f;      // walking but not getting any closer? (circling)
                  float joinWalkT;                // how long they've been trying to reach a conversation
                  float speedMul, walkMul = 1;    // their own natural walking pace, and a little variation walk to walk
                  boolean hasWp; float wpX, wpY;  // a stop-off point to get round something in the way
                  AppPeng stareAt;            // the penguin they're glaring at after being hit
                  boolean hugWalk;
