                  float tx = tailRight ? x + tw / 2 - 10 : x - tw / 2 + 10;
                  path.moveTo(tx - 5, y - 2); path.lineTo(tx + 5, y - 2); path.lineTo(tx + (tailRight ? 10 : -10), y + 9);
