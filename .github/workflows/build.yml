              float[] randomOnIsland(Random r, float minF, float maxF) {
                  double ang = r.nextDouble() * Math.PI * 2;
                  float f = minF + r.nextFloat() * (maxF - minF);
                  return new float[]{CX + (float) Math.cos(ang) * RX * f, CY + (float) Math.sin(ang) * RY * f};
              }

              void drawTree(Canvas c, Paint w, float x, float y, float s) {
                  w.setColor(0x22000000);
                  c.drawOval(x - 30 * s, y - 8 * s, x + 30 * s, y + 8 * s, w);
                  w.setColor(0xff6d4c41);
                  c.drawRect(x - 5 * s, y - 16 * s, x + 5 * s, y, w);
                  float base = y - 12 * s;
                  float[] widths = {34, 27, 19};
                  float[] heights = {40, 34, 28};
                  for (int i = 0; i < 3; i++) {
                      float hw = widths[i] * s, h = heights[i] * s;
                      path.reset();
                      path.moveTo(x - hw, base); path.lineTo(x + hw, base); path.lineTo(x, base - h); path.close();
                      w.setColor(i == 1 ? 0xff357a54 : 0xff2e6b4a);
                      c.drawPath(path, w);
                      path.reset();
                      path.moveTo(x - hw * 0.45f, base - h * 0.55f); path.lineTo(x + hw * 0.45f, base - h * 0.55f);
                      path.lineTo(x, base - h); path.close();
                      w.setColor(0xfff7fbff);
                      c.drawPath(path, w);
                      base -= h * 0.55f;
                  }
              }

              void drawSnowman(Canvas c, Paint w, float x, float y) {
                  w.setColor(0x22000000);
                  c.drawOval(x - 24, y - 7, x + 24, y + 7, w);
                  w.setColor(0xffffffff);
                  c.drawCircle(x, y - 20, 20, w);
                  c.drawCircle(x, y - 50, 14, w);
                  w.setColor(0xff263238);
                  c.drawCircle(x - 5, y - 53, 2, w);
                  c.drawCircle(x + 5, y - 53, 2, w);
                  c.drawCircle(x, y - 26, 2, w);
                  c.drawCircle(x, y - 16, 2, w);
                  w.setColor(0xffff7043);
                  path.reset();
                  path.moveTo(x, y - 50); path.lineTo(x + 12, y - 47); path.lineTo(x, y - 45); path.close();
                  c.drawPath(path, w);
              }

              void drawIgloo(Canvas c, Paint w, float x, float y) {
                  w.setStyle(Paint.Style.FILL);
                  w.setColor(0x26000000);
                  c.drawOval(x - 140, y - 22, x + 140, y + 22, w);
                  rf.set(x - 125, y - 125, x + 125, y + 125);
                  w.setColor(0xfffbfdff);
                  c.drawArc(rf, 180, 180, true, w);
                  w.setStyle(Paint.Style.STROKE);
                  w.setStrokeWidth(2.5f);
                  w.setColor(0xffb7d2e4);
                  c.drawArc(rf, 180, 180, false, w);
                  for (int row = 1; row <= 4; row++) {
                      float ly = y - row * 25;
                      float half = (float) Math.sqrt(Math.max(0, 125 * 125 - (row * 25) * (row * 25)));
                      c.drawLine(x - half, ly, x + half, ly, w);
                      int blocks = 6 - row;
                      for (int b = 0; b <= blocks; b++) {
                          float bx = x - half + (2 * half) * (b + (row % 2) * 0.5f) / (blocks + 1);
                          if (bx > x - half + 4 && bx < x + half - 4) c.drawLine(bx, ly, bx, ly + 25, w);
                      }
                  }
                  w.setStyle(Paint.Style.FILL);
                  rf.set(x - 48, y - 58, x + 48, y + 38);
                  w.setColor(0xffffffff);
                  c.drawArc(rf, 180, 180, true, w);
                  w.setStyle(Paint.Style.STROKE);
                  w.setColor(0xffb7d2e4);
                  c.drawArc(rf, 180, 180, false, w);
                  w.setStyle(Paint.Style.FILL);
                  rf.set(x - 26, y - 38, x + 26, y + 14);
                  w.setColor(0xff2c3e50);
                  c.drawArc(rf, 180, 180, true, w);
                  w.setStrokeWidth(0);
              }

              /** Inside the igloo. Drawn once; the fire is animated on top. */
              void bakeRoom() {
                  room = Bitmap.createBitmap(VW, VH, Bitmap.Config.RGB_565);
                  Canvas c = new Canvas(room);
                  Paint w = new Paint(Paint.ANTI_ALIAS_FLAG);
                  // Ice walls
                  w.setShader(new LinearGradient(0, 0, 0, VH, 0xffd8ecf7, 0xffa9cde2, Shader.TileMode.CLAMP));
                  c.drawRect(0, 0, VW, VH, w);
                  w.setShader(null);
                  w.setStyle(Paint.Style.STROKE);
                  w.setStrokeWidth(2);
                  w.setColor(0xff9cc3da);
                  // Ice blocks curve like the inside of a dome (rows sag toward the middle, rising at the sides)
                  c.save();
                  c.scale(1, -1, 0, 138);
                  float ecx = 640, ecy = 595;
                  for (int i = 0; i < 15; i++) {
                      float rx0 = 700 + i * 64, ry0 = 325 + i * 44;
                      float rx1 = rx0 + 64, ry1 = ry0 + 44;
                      rf.set(ecx - rx0, ecy - ry0, ecx + rx0, ecy + ry0);
                      c.drawArc(rf, 180, 180, false, w);
                      int joints = 14 + i;
                      for (int j = 0; j < joints; j++) {
                          double ang = Math.PI + Math.PI * (j + (i % 2) * 0.5) / joints;
                          float x0 = ecx + (float) Math.cos(ang) * rx0, y0 = ecy + (float) Math.sin(ang) * ry0;
                          float x1 = ecx + (float) Math.cos(ang) * rx1, y1 = ecy + (float) Math.sin(ang) * ry1;
                          c.drawLine(x0, y0, x1, y1, w);
                      }
