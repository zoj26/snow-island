                  boolean yt;
                  int color;
                  final ArrayList<String> songs = new ArrayList<>();
                  volatile ArrayList<String[]> tracks;   // YouTube: {videoId, title}
                  volatile boolean loading;
              }

              static class Item {
                  String label, value;
                  Bitmap icon;
                  Runnable action;
                  Item(String label, String value, Bitmap icon, Runnable action) {
                      this.label = label; this.value = value; this.icon = icon; this.action = action;
                  }
              }

              SurfaceView view;
              SurfaceHolder holder;
              volatile boolean running, destroyed;
              Thread renderThread;
              final Object lock = new Object();

              // Input
              volatile boolean kUp, kDown, kLeft, kRight;
              volatile float axX, axY;
              final ConcurrentLinkedQueue<Integer> keyQueue = new ConcurrentLinkedQueue<>();
              static final int REPEAT_FLAG = 1 << 20;

              // Settings
              SharedPreferences prefs;
              boolean musicOn, soundOn, weatherFx;
              int seasonPref;
              boolean namesAlways, autoReturn, tagColour;
              int clockSize;
