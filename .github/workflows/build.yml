              float[] randomOnIsland(Random r, float minF, float maxF) {
                  double ang = r.nextDouble() * Math.PI * 2;
                  float f = minF + r.nextFloat() * (maxF - minF);
                  return new float[]{CX + (float) Math.cos(ang) * RX * f, CY + (float) Math.sin(ang) * RY * f};
              }

              void drawTree(Canvas c, Paint w, float x, float y, float s) {
                  w.setColor(0x22000000);
                  c.drawOval(x - 30 * s, y - 8 * s, x + 30 * s, y + 8 * s, w);
                  w.setColor(0xff6d4c41);
                  c.drawRect(x - 5 * s, y - 16 * s, x + 5 * s, y, w);
                  float base = y - 12 * s;
                  float[] widths = {34, 27, 19};
                  float[] heights = {40, 34, 28};
                  for (int i = 0; i < 3; i++) {
                      float hw = widths[i] * s, h = heights[i] * s;
                      path.reset();
                      path.moveTo(x - hw, base); path.lineTo(x + hw, base); path.lineTo(x, base - h); path.close();
                      w.setColor(i == 1 ? 0xff357a54 : 0xff2e6b4a);
                      c.drawPath(path, w);
                      path.reset();
                      path.moveTo(x - hw * 0.45f, base - h * 0.55f); path.lineTo(x + hw * 0.45f, base - h * 0.55f);
                      path.lineTo(x, base - h); path.close();
                      w.setColor(0xfff7fbff);
                      c.drawPath(path, w);
                      base -= h * 0.55f;
                  }
              }

              void drawSnowman(Canvas c, Paint w, float x, float y) {
                  w.setColor(0x22000000);
                  c.drawOval(x - 24, y - 7, x + 24, y + 7, w);
                  w.setColor(0xffffffff);
                  c.drawCircle(x, y - 20, 20, w);
                  c.drawCircle(x, y - 50, 14, w);
                  w.setColor(0xff263238);
                  c.drawCircle(x - 5, y - 53, 2, w);
                  c.drawCircle(x + 5, y - 53, 2, w);
                  c.drawCircle(x, y - 26, 2, w);
                  c.drawCircle(x, y - 16, 2, w);
                  w.setColor(0xffff7043);
                  path.reset();
                  path.moveTo(x, y - 50); path.lineTo(x + 12, y - 47); path.lineTo(x, y - 45); path.close();
                  c.drawPath(path, w);
              }

              void drawIgloo(Canvas c, Paint w, float x, float y) {
                  w.setStyle(Paint.Style.FILL);
                  w.setColor(0x26000000);
                  c.drawOval(x - 140, y - 22, x + 140, y + 22, w);
                  rf.set(x - 125, y - 125, x + 125, y + 125);
                  w.setColor(0xfffbfdff);
                  c.drawArc(rf, 180, 180, true, w);
                  w.setStyle(Paint.Style.STROKE);
                  w.setStrokeWidth(2.5f);
                  w.setColor(0xffb7d2e4);
                  c.drawArc(rf, 180, 180, false, w);
                  for (int row = 1; row <= 4; row++) {
                      float ly = y - row * 25;
                      float half = (float) Math.sqrt(Math.max(0, 125 * 125 - (row * 25) * (row * 25)));
                      c.drawLine(x - half, ly, x + half, ly, w);
                      int blocks = 6 - row;
                      for (int b = 0; b <= blocks; b++) {
                          float bx = x - half + (2 * half) * (b + (row % 2) * 0.5f) / (blocks + 1);
                          if (bx > x - half + 4 && bx < x + half - 4) c.drawLine(bx, ly, bx, ly + 25, w);
                      }
                  }
                  w.setStyle(Paint.Style.FILL);
                  rf.set(x - 48, y - 58, x + 48, y + 38);
                  w.setColor(0xffffffff);
                  c.drawArc(rf, 180, 180, true, w);
                  w.setStyle(Paint.Style.STROKE);
                  w.setColor(0xffb7d2e4);
                  c.drawArc(rf, 180, 180, false, w);
                  w.setStyle(Paint.Style.FILL);
                  rf.set(x - 26, y - 38, x + 26, y + 14);
                  w.setColor(0xff2c3e50);
                  c.drawArc(rf, 180, 180, true, w);
                  w.setStrokeWidth(0);
              }

              /** Inside the igloo. Drawn once; the fire is animated on top. */
              void bakeRoom() {
                  room = Bitmap.createBitmap(VW, VH, Bitmap.Config.RGB_565);
                  Canvas c = new Canvas(room);
                  Paint w = new Paint(Paint.ANTI_ALIAS_FLAG);
                  // Ice walls
                  w.setShader(new LinearGradient(0, 0, 0, VH, 0xffd8ecf7, 0xffa9cde2, Shader.TileMode.CLAMP));
                  c.drawRect(0, 0, VW, VH, w);
                  w.setShader(null);
                  w.setStyle(Paint.Style.STROKE);
                  w.setStrokeWidth(2);
                  w.setColor(0xff9cc3da);
                  // Ice blocks as seen from inside a dome: the low rows hug the round floor, the rows flatten out
                  // higher up, and near the top they curve upward toward the sides, like looking up into the roof
                  Random wr = new Random(5);
                  final int ROWS = 11, SEGS = 120;
                  float[][] rx = new float[ROWS][SEGS + 1], ry = new float[ROWS][SEGS + 1];
                  for (int k = 0; k < ROWS; k++) {
                      float yc = 270;
                      for (int j = 0; j < k; j++) yc -= 46 * (float) Math.pow(0.9, j);
                      float ra = ROOM_FA + k * 70, rb = ROOM_FB + (270 - yc);
                      float wgt = Math.max(0, 1 - k / 5f);
                      wgt = wgt * wgt * (3 - 2 * wgt);
                      float curl = (float) Math.pow(k / (float) (ROWS - 1), 1.3) * 170;
                      for (int i = 0; i <= SEGS; i++) {
                          float t = i / (float) SEGS;
                          double ang = Math.PI + Math.PI * t;
                          float ex = 640 + ra * (float) Math.cos(ang), ey = 720 + rb * (float) Math.sin(ang);
                          float px2 = -160 + 1600 * t, u = (px2 - 640) / 800;
                          float py2 = yc - curl * u * u;
                          rx[k][i] = wgt * ex + (1 - wgt) * px2;
                          ry[k][i] = wgt * ey + (1 - wgt) * py2;
                      }
                      path.reset();
                      path.moveTo(rx[k][0], ry[k][0]);
                      for (int i = 1; i <= SEGS; i++) path.lineTo(rx[k][i], ry[k][i]);
                      c.drawPath(path, w);
                      if (k == 0) continue;
                      // joints between this row and the one below, evenly spaced along the row, shifted randomly per row
                      float len = 0;
                      for (int i = 0; i < SEGS; i++) len += (float) Math.hypot(rx[k][i + 1] - rx[k][i], ry[k][i + 1] - ry[k][i]);
                      int n = Math.max(8, (int) (len / (115 * Math.pow(0.94, k))));
                      float off = wr.nextFloat();
                      for (int j = 0; j < n; j++) {
                          float t = (j + off) / n * SEGS;
                          int i0 = Math.min(SEGS - 1, (int) t);
                          float fr = t - i0;
                          float x1 = rx[k][i0] + (rx[k][i0 + 1] - rx[k][i0]) * fr, y1 = ry[k][i0] + (ry[k][i0 + 1] - ry[k][i0]) * fr;
                          float x0 = rx[k - 1][i0] + (rx[k - 1][i0 + 1] - rx[k - 1][i0]) * fr, y0 = ry[k - 1][i0] + (ry[k - 1][i0 + 1] - ry[k - 1][i0]) * fr;
                          c.drawLine(x0, y0, x1, y1, w);
                      }
                  }
                  w.setStyle(Paint.Style.FILL);
                  // Floor
                  w.setShader(new LinearGradient(0, 270, 0, VH, 0xfff4f8fb, 0xffdde9f1, Shader.TileMode.CLAMP));
                  rf.set(640 - ROOM_FA, 720 - ROOM_FB, 640 + ROOM_FA, 720 + ROOM_FB);
                  c.drawOval(rf, w);
                  w.setShader(null);
                  // Rug
                  float ru = -14;      // moved up a little, so it sits halfway between the hearth and the door
                  w.setColor(0xff2f6f73);                                   // outer ring: deep teal
                  c.drawOval(640 - 300, 402 + ru, 640 + 300, 618 + ru, w);
                  w.setColor(0xffb23a48);
                  c.drawOval(640 - 260, 420 + ru, 640 + 260, 600 + ru, w);
                  w.setColor(0xffe0a458);
                  c.drawOval(640 - 220, 440 + ru, 640 + 220, 580 + ru, w);
                  w.setColor(0xff7b2d43);
                  c.drawOval(640 - 170, 458 + ru, 640 + 170, 562 + ru, w);
                  w.setColor(0xfff2d0a4);
                  c.drawOval(640 - 110, 478 + ru, 640 + 110, 542 + ru, w);
                  // Chimney: stone column running from the mantle up through the ceiling
                  w.setColor(0xff78909c);
                  c.drawRect(576, 0, 704, 124, w);
                  w.setColor(0xff90a4ae);
                  for (int row = 0; row < 5; row++) {
                      float sy = 4 + row * 27;
                      float off = (row % 2) * 30;
                      for (float sx = 580 - off; sx < 700; sx += 60) {
                          float l = Math.max(580, sx), r2 = Math.min(700, sx + 54);
                          if (r2 - l < 10) continue;
                          rf.set(l, sy, r2, sy + 22);
                          c.drawRoundRect(rf, 6, 6, w);
                      }
                  }
                  // Fireplace (stone)
                  w.setColor(0xff78909c);
                  rf.set(520, 120, 760, 300);
                  c.drawRoundRect(rf, 14, 14, w);
                  w.setColor(0xff90a4ae);
                  // stones laid in staggered rows, same as the chimney above
                  for (int row = 0; row < 6; row++) {
                      float sy = 134 + row * 27;
                      float off = (row % 2) * 30;
                      for (float sx = 526 - off; sx < 754; sx += 60) {
                          float l = Math.max(526, sx), r2 = Math.min(754, sx + 54);
                          if (r2 - l < 10) continue;
                          rf.set(l, sy, r2, Math.min(296, sy + 22));
                          c.drawRoundRect(rf, 6, 6, w);
                      }
                  }
                  // mantle sits just above the opening, like in the fireplace view
                  w.setColor(0x44000000);
                  c.drawRect(512, 178, 768, 184, w);
                  w.setColor(0xff5d4037);
                  rf.set(500, 150, 780, 180);
                  c.drawRoundRect(rf, 6, 6, w);
                  w.setColor(0xff6d4c41);
                  c.drawRect(504, 152, 776, 156, w);
                  w.setColor(0xff1c1c1c);
                  rf.set(570, 190, 710, 300);
                  c.drawArc(rf, 180, 180, true, w);
                  c.drawRect(570, 245, 710, 300, w);
                  // Logs
                  w.setColor(0xff6d4c41);
                  rf.set(588, 280, 692, 296);
                  c.drawRoundRect(rf, 8, 8, w);
                  // Family nameplate sitting on the mantle
                  drawNameplate(c, w, 640, 166, 0.8f);
                  // TV Settings console (left)
                  w.setColor(0x33000000);
                  c.drawOval(170, 395, 350, 425, w);
                  w.setColor(0xff5d4037);
                  c.drawRect(190, 330, 330, 410, w);
                  w.setColor(0xff37474f);
                  rf.set(175, 210, 345, 335);
                  c.drawRoundRect(rf, 16, 16, w);
                  w.setColor(0xff4fc3f7);
                  rf.set(190, 225, 330, 320);
                  c.drawRoundRect(rf, 10, 10, w);
                  // a game controller on the screen
                  w.setColor(0xffffffff);
                  rf.set(222, 254, 298, 292);
                  c.drawRoundRect(rf, 19, 19, w);
                  c.drawCircle(232, 290, 12, w);
                  c.drawCircle(288, 290, 12, w);
                  w.setColor(0xff37474f);
                  c.drawRect(230, 268, 246, 274, w);
                  c.drawRect(235, 263, 241, 279, w);
                  w.setColor(0xffe53935);
                  c.drawCircle(282, 266, 4.5f, w);
                  w.setColor(0xff43a047);
                  c.drawCircle(274, 276, 4.5f, w);
                  // Bookshelf (right)
                  w.setColor(0x33000000);
                  c.drawOval(930, 405, 1110, 430, w);
                  w.setColor(0xff6d4c41);
                  c.drawRect(940, 200, 1100, 415, w);
                  w.setColor(0xff4e342e);
                  int[] bookCols = {0xffe53935, 0xff1e88e5, 0xff43a047, 0xfffdd835, 0xff8e24aa, 0xfffb8c00};
                  for (int shelf = 0; shelf < 3; shelf++) {
                      float sy = 210 + shelf * 68;
                      w.setColor(0xff4e342e);
                      c.drawRect(948, sy, 1092, sy + 60, w);
                      float bx = 952;
                      Random r = new Random(shelf * 31 + 5);
                      while (bx < 1080) {
                          float bw = 12 + r.nextInt(10);
                          float bh = 38 + r.nextInt(18);
                          w.setColor(bookCols[r.nextInt(bookCols.length)]);
                          c.drawRect(bx, sy + 60 - bh, bx + bw, sy + 60, w);
                          bx += bw + 3;
                      }
                  }
                  // Stone hearth slab under the fireplace, flush with the floor
                  // (sticks out the same amount on both sides of the fireplace)
                  w.setColor(0xff6b7a85);
                  rf.set(450, 292, 830, 330);
                  c.drawRoundRect(rf, 7, 7, w);
                  w.setColor(0xff8496a2);
                  rf.set(450, 292, 830, 302);
                  c.drawRoundRect(rf, 5, 5, w);
                  // Doorway (smaller)
                  w.setColor(0xff2c3e50);
                  rf.set(592, 672, 688, 768);
                  c.drawArc(rf, 180, 180, true, w);
              }

              /** A brass "JAMIESON" plaque. */
