          def chaikin(pts, n):
              """Corner cutting: turns a polygon's sharp corners into smooth curves."""
              p = [tuple(map(float, q)) for q in pts]
              for _ in range(n):
                  q = []
                  for i in range(len(p)):
                      a, b = p[i], p[(i + 1) % len(p)]
                      q.append((0.75 * a[0] + 0.25 * b[0], 0.75 * a[1] + 0.25 * b[1]))
                      q.append((0.25 * a[0] + 0.75 * b[0], 0.25 * a[1] + 0.75 * b[1]))
                  p = q
              return p


          def paint_belly(col, ov, b, bpos, spec, pad):
              from PIL import ImageDraw, ImageFilter
              H, W = np.asarray(ov).shape[:2]
              o = np.asarray(ov).astype(np.float32)
              cm = np.asarray(col)[:, :, 3] > 100
              bd = np.zeros((H, W, 4), np.float32)
              bd[bpos[1]:bpos[1] + b.size[1], bpos[0]:bpos[0] + b.size[0]] = np.asarray(b)
              orange = (bd[..., 0] > 150) & (bd[..., 1] > 60) & (bd[..., 1] < 200) & (bd[..., 2] < 90) & (bd[..., 3] > 100)
              keep = cm & ~orange
              for name, rgb in (("line", 120), ("white", 255), ("grey", 128)):
                  m = Image.new("L", (W, H), 0)
                  pts = spec[name]
                  if name != "line":
                      pts = chaikin(pts, 4)        # round every corner
                  ImageDraw.Draw(m).polygon([(x + pad, y + pad) for x, y in pts], fill=255)
                  m = np.asarray(m.filter(ImageFilter.GaussianBlur(0.6 if name == "line" else 1.0))).astype(np.float32) / 255 * keep
                  for k in range(3):
                      o[..., k] = o[..., k] * (1 - m) + rgb * m
                  o[..., 3] = np.maximum(o[..., 3], m * 255)
              return Image.fromarray(o.astype(np.uint8), "RGBA")


          def files(d, layer):
              if d.startswith("Video"):
                  if not VSRC or layer != "Color":
                      return []
                  p = os.path.join(VSRC, d)
                  return sorted(glob.glob(p + "/*.png"), key=lambda f: int(os.path.basename(f)[:-4])) if os.path.isdir(p) else []
              p = os.path.join(SRC, d, layer)
              if os.path.isdir(p):
                  return sorted(glob.glob(p + "/*.png"), key=lambda f: int(os.path.basename(f)[:-4]))
              if os.path.exists(p + ".png"):
                  return [p + ".png"]
              return []


