                  c.drawRoundRect(rf, 26, 26, p);
                  boolean playing = d != null && radioBusy();

                  // volume: a tall slider down the whole left side
                  float vx = l + 30, vTop = t + 36, vBot = t + h - 28;
                  p.setColor(0xff263142);
                  rf.set(vx - 4, vTop, vx + 4, vBot);
