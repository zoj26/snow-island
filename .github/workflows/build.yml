          package com.josh.snowisland;

          import java.io.BufferedOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.OutputStream;
          import java.util.Random;

          /**
           * Makes every sound in the app from scratch with math, so there are no audio files to ship.
           * Sounds are written as small .wav files the first time the app runs, then reused.
           */
          final class Synth {
              static final int RATE = 22050;

              private Synth() { }

              // ------------------------------------------------------------------ sound effects

              static float[] step() {
                  Random r = new Random(11);
                  int n = (int) (RATE * 0.07);
                  float[] out = new float[n];
                  float lp = 0;
                  for (int i = 0; i < n; i++) {
                      float t = i / (float) n;
                      float env = (float) (Math.min(1, t * 40) * Math.pow(1 - t, 2.5));
                      lp += 0.35f * ((r.nextFloat() * 2 - 1) - lp);
                      out[i] = lp * env * 0.55f;
                  }
                  return out;
              }

              /** A soft, low "coo" for penguins (much gentler than the old squeak). */
              static float[] chirp() {
                  int n = (int) (RATE * 0.15);
                  float[] out = new float[n];
                  double ph = 0;
                  for (int i = 0; i < n; i++) {
                      float t = i / (float) n;
                      double f = t < 0.4 ? 560 + 160 * (t / 0.4) : 720 - 140 * ((t - 0.4) / 0.6);
                      ph += 2 * Math.PI * f / RATE;
                      float env = (float) (Math.min(1, t * 12) * Math.pow(1 - t, 1.8));
                      out[i] = (float) (Math.sin(ph) + 0.12 * Math.sin(2 * ph)) * env * 0.3f;
                  }
                  return out;
              }

              static float[] open() {
                  float[] out = new float[(int) (RATE * 0.75)];
                  int[] notes = {84, 88, 91, 96};
                  for (int k = 0; k < notes.length; k++) addBell(out, (int) (k * 0.07f * RATE), midi(notes[k]), 0.5f, 0.22f, false);
                  return out;
              }

              static float[] whoosh() {
                  Random r = new Random(5);
                  int n = (int) (RATE * 0.28);
                  float[] out = new float[n];
                  float lp = 0;
                  for (int i = 0; i < n; i++) {
                      float t = i / (float) n;
                      float cut = 0.04f + 0.3f * (float) Math.sin(Math.PI * t);
                      lp += cut * ((r.nextFloat() * 2 - 1) - lp);
                      out[i] = lp * (float) Math.sin(Math.PI * t) * 0.7f;
                  }
                  return out;
              }

              static float[] splat() {
                  Random r = new Random(9);
                  int n = (int) (RATE * 0.14);
                  float[] out = new float[n];
                  float lp = 0;
                  for (int i = 0; i < n; i++) {
                      float t = i / (float) n;
                      lp += 0.18f * ((r.nextFloat() * 2 - 1) - lp);
                      float env = (float) (Math.min(1, t * 60) * Math.pow(1 - t, 3));
                      out[i] = lp * env * 1.1f;
                  }
                  return out;
              }

              static float[] tick() {
                  int n = (int) (RATE * 0.03);
                  float[] out = new float[n];
                  for (int i = 0; i < n; i++) {
                      float t = i / (float) n;
                      out[i] = (float) Math.sin(2 * Math.PI * 1900 * i / RATE) * (1 - t) * (1 - t) * 0.25f;
                  }
                  return out;
              }

              static float[] toggle() {
                  float[] out = new float[(int) (RATE * 0.25)];
                  addBell(out, 0, midi(79), 0.25f, 0.18f, false);
                  addBell(out, (int) (0.06f * RATE), midi(86), 0.25f, 0.18f, false);
                  return out;
              }

              /** A two-note referee-style whistle, with a little trill. */
              static float[] whistle() {
                  int n = (int) (RATE * 0.62);
                  float[] out = new float[n];
                  double ph = 0;
                  for (int i = 0; i < n; i++) {
                      float t = i / (float) RATE;
                      boolean second = t > 0.26f;
                      float lt = second ? t - 0.3f : t;
                      if (second && t < 0.3f) { continue; }
                      double f = (second ? 2350 : 2050) + 60 * Math.sin(2 * Math.PI * 38 * t);
                      ph += 2 * Math.PI * f / RATE;
                      float len = second ? 0.32f : 0.26f;
                      float env = Math.min(1, lt * 60) * Math.min(1, (len - lt) * 25);
                      if (env < 0) env = 0;
                      out[i] = (float) (Math.sin(ph) + 0.2 * Math.sin(2 * ph)) * env * 0.35f;
                  }
                  return out;
              }

              static float[] door() {
                  float[] out = new float[(int) (RATE * 0.6)];
                  // soft thump
                  for (int i = 0; i < RATE * 0.12; i++) {
                      float t = i / (RATE * 0.12f);
                      out[i] += (float) Math.sin(2 * Math.PI * (90 - 40 * t) * i / RATE) * (1 - t) * 0.5f;
                  }
                  addBell(out, (int) (0.05f * RATE), midi(81), 0.45f, 0.15f, false);
                  addBell(out, (int) (0.13f * RATE), midi(88), 0.45f, 0.13f, false);
                  return out;
              }

              /**
               * Fireplace crackle, about 10 seconds, made to loop. Small soft crackles whose busyness
               * rises and falls in waves. No big cracks, no rumble, no pitched sounds.
               */
              static float[] crackle() {
                  Random r = new Random(9900);
                  int n = RATE * 10;
                  float[] out = new float[n];
                  double t = 0;
                  while (true) {
                      double busy = 0.5 + 0.5 * Math.sin(t * 0.9) * Math.sin(t * 0.37 + 1);
                      double rate = 1.5 + 8 * busy * busy;
                      t += -Math.log(1 - r.nextDouble()) / rate;
                      if (t >= 10) break;
                      float amp = 0.15f + r.nextFloat() * 0.35f;
                      softCrack(out, (int) (t * RATE), amp, 0.0008 + r.nextDouble() * 0.0015, 350, 1600 + r.nextDouble() * 1600, r);
                  }
                  normalize(out, 0.8f);
                  return out;
              }

              /** A soft crack: noise between two filters (lo..hi Hz), dying away in a millisecond or two. */
              static void softCrack(float[] out, int at, float amp, double decaySec, double lo, double hi, Random r) {
                  int n = out.length, len = (int) (decaySec * RATE * 6) + 6;
                  float[] tmp = new float[len];
                  float pk = 1e-9f;
                  double alp = 1 - Math.exp(-2 * Math.PI * hi / RATE), ahp = 1 - Math.exp(-2 * Math.PI * lo / RATE);
                  double l1 = 0, l2 = 0, h = 0;
                  for (int s = 0; s < len; s++) {
                      double e = Math.exp(-s / (decaySec * RATE));
                      double x = (r.nextDouble() * 2 - 1) * e;
                      l1 += alp * (x - l1);
                      l2 += alp * (l1 - l2);
                      h += ahp * (l2 - h);
                      tmp[s] = (float) (l2 - h);
                      pk = Math.max(pk, Math.abs(tmp[s]));
                  }
                  float k = amp / pk;
                  for (int s = 0; s < len; s++) out[(at + s) % n] += tmp[s] * k;
              }

              /** One tiny crack: a burst of wide-band noise that dies in about a millisecond. No pitch. */
              static void crack(float[] out, int at, float amp, double decaySec, double centerHz, Random r) {
                  int n = out.length, len = (int) (decaySec * RATE * 6) + 6;
                  float[] tmp = new float[len];
                  float pk = 1e-9f;
                  double bw = centerHz * 1.2;
                  double alp = 1 - Math.exp(-2 * Math.PI * (centerHz + bw / 2) / RATE);
                  double ahp = 1 - Math.exp(-2 * Math.PI * Math.max(200, centerHz - bw / 2) / RATE);
                  double l = 0, h = 0;
                  for (int s = 0; s < len; s++) {
                      double e = Math.exp(-s / (decaySec * RATE));
                      double x = (r.nextDouble() * 2 - 1) * e;
                      l += alp * (x - l);
                      h += ahp * (l - h);
                      tmp[s] = (float) (l - h);
                      pk = Math.max(pk, Math.abs(tmp[s]));
                  }
                  float k = amp / pk;
                  for (int s = 0; s < len; s++) out[(at + s) % n] += tmp[s] * k;
              }

              /** One tiny tap through a ringing filter, scaled so its loudest point is `amp`. Wraps around the end. */
              static void woodTap(float[] out, int at, double freq, double decaySec, float amp) {
                  int n = out.length;
                  double rr = Math.exp(-1.0 / (decaySec * RATE));
                  double c1 = 2 * rr * Math.cos(2 * Math.PI * freq / RATE), c2 = -rr * rr;
                  double y1 = 0, y2 = 0;
                  int len = (int) (decaySec * RATE * 7);
                  float[] tmp = new float[len];
                  float peak = 1e-9f;
                  Random r = new Random(at * 31L + (long) freq);
                  for (int s = 0; s < len; s++) {
                      double x = s < 3 ? (r.nextDouble() * 2 - 1) : 0;
                      double y = x + c1 * y1 + c2 * y2;
                      y2 = y1;
                      y1 = y;
                      tmp[s] = (float) y;
                      peak = Math.max(peak, Math.abs(tmp[s]));
                  }
                  float k = amp / peak;
                  for (int s = 0; s < len; s++) out[(at + s) % n] += tmp[s] * k;
              }

              // ------------------------------------------------------------------ music

              /**
               * A calm, original music-box loop (about 53 seconds).
               * Notes that ring past the end wrap around to the start, so the loop is seamless.
               */
              static float[] music() {
                  final float bpm = 72f;
                  final float beat = 60f / bpm;
                  final int bars = 16;
                  final int total = (int) (bars * 4 * beat * RATE);
                  float[] out = new float[total];
                  // C, Am, F, G   then   C, Em, F, G
                  int[][] chords = {
                          {48, 52, 55, 59}, {45, 48, 52, 55}, {41, 45, 48, 52}, {43, 47, 50, 55},
                          {48, 52, 55, 59}, {40, 43, 47, 50}, {41, 45, 48, 52}, {43, 47, 50, 53},
                  };
                  int[] scale = {72, 74, 76, 79, 81, 84, 86, 88};
                  Random r = new Random(2026);
                  int lastNote = 76;
                  for (int bar = 0; bar < bars; bar++) {
                      int[] ch = chords[bar % chords.length];
                      int barStart = (int) (bar * 4 * beat * RATE);

                      // Soft bass on beats 1 and 3
                      addBass(out, barStart, midi(ch[0] - 12), 0.16f, 1.6f * beat);
                      addBass(out, barStart + (int) (2 * beat * RATE), midi(ch[0] - 12 + (bar % 2 == 0 ? 7 : 0)), 0.11f, 1.6f * beat);

                      // Melody: eighth notes, mostly chord tones, with breathing room
                      boolean quietBar = bar % 4 == 3;
                      for (int e = 0; e < 8; e++) {
                          float chance = quietBar ? (e < 3 ? 0.7f : 0.15f) : (e % 2 == 0 ? 0.85f : 0.45f);
                          if (bar == bars - 1 && e > 2) chance = 0;
                          if (r.nextFloat() > chance) continue;
                          int note;
                          if (e == 0 || r.nextFloat() < 0.55f) {
                              int tone = ch[1 + r.nextInt(3)];
                              note = tone;
                              while (note < 72) note += 12;
                              while (note > 89) note -= 12;
                          } else {
                              int best = scale[0];
                              int bestD = 99;
                              for (int s : scale) {
                                  int d = Math.abs(s - lastNote) + (s == lastNote ? 3 : 0) + r.nextInt(4);
                                  if (d < bestD) { bestD = d; best = s; }
                              }
                              note = best;
                          }
                          if (bar == bars - 1 && e == 0) note = 84;
                          lastNote = note;
                          int at = barStart + (int) (e * beat / 2 * RATE);
                          addBell(out, at, midi(note), 1.6f, 0.17f, true);
                          // little sparkle an octave up now and then
                          if (r.nextFloat() < 0.12f) addBell(out, at, midi(note + 12), 0.8f, 0.05f, true);
                      }
                  }
                  normalize(out, 0.8f);
                  return out;
              }

              // ------------------------------------------------------------------ building blocks

              static double midi(int m) {
                  return 440.0 * Math.pow(2, (m - 69) / 12.0);
              }

              /** Music-box style bell: bright attack, slow fade. If wrap is true, tails loop to the start. */
              static void addBell(float[] out, int start, double f, float seconds, float amp, boolean wrap) {
                  int n = (int) (seconds * RATE);
                  double w = 2 * Math.PI * f / RATE;
                  double decay = Math.exp(-4.5 / n);
                  double env = 1;
                  for (int i = 0; i < n; i++) {
                      int idx = start + i;
                      if (idx >= out.length) {
                          if (!wrap) break;
                          idx %= out.length;
                      }
                      float attack = i < 60 ? i / 60f : 1f;
                      double s = Math.sin(w * i) + 0.32 * Math.sin(2 * w * i) * env + 0.1 * Math.sin(3.01 * w * i) * env * env;
                      out[idx] += (float) (s * env * amp * attack);
                      env *= decay;
                  }
              }

              static void addPad(float[] out, int start, int n, double f, float amp) {
                  double w = 2 * Math.PI * f / RATE;
                  int fade = (int) (0.6f * RATE);
                  for (int i = 0; i < n + fade; i++) {
                      int idx = (start + i) % out.length;
                      float env;
                      if (i < fade) env = i / (float) fade;
                      else if (i < n) env = 1;
                      else env = 1 - (i - n) / (float) fade;
                      double vib = 1 + 0.002 * Math.sin(i * 2 * Math.PI * 4.5 / RATE);
                      out[idx] += (float) ((Math.sin(w * i * vib) + 0.2 * Math.sin(2 * w * i)) * env * amp);
                  }
              }

              static void addBass(float[] out, int start, double f, float amp, float seconds) {
                  int n = (int) (seconds * RATE);
                  double w = 2 * Math.PI * f / RATE;
                  for (int i = 0; i < n; i++) {
                      int idx = (start + i) % out.length;
                      float t = i / (float) n;
                      float env = Math.min(1, i / 300f) * (float) Math.pow(1 - t, 1.5);
                      out[idx] += (float) (Math.sin(w * i) * env * amp);
                  }
              }

              static void normalize(float[] out, float target) {
                  float peak = 0.0001f;
                  for (float v : out) peak = Math.max(peak, Math.abs(v));
                  float k = target / peak;
                  for (int i = 0; i < out.length; i++) out[i] *= k;
              }

              static void writeWav(File f, float[] data) throws IOException {
                  int bytes = data.length * 2;
                  try (OutputStream os = new BufferedOutputStream(new FileOutputStream(f))) {
                      os.write(new byte[]{'R', 'I', 'F', 'F'});
                      le32(os, 36 + bytes);
                      os.write(new byte[]{'W', 'A', 'V', 'E', 'f', 'm', 't', ' '});
                      le32(os, 16);
                      le16(os, 1);
                      le16(os, 1);
                      le32(os, RATE);
                      le32(os, RATE * 2);
                      le16(os, 2);
                      le16(os, 16);
                      os.write(new byte[]{'d', 'a', 't', 'a'});
                      le32(os, bytes);
                      byte[] buf = new byte[4096];
                      int bi = 0;
                      for (float v : data) {
                          int s = (int) (Math.max(-1f, Math.min(1f, v)) * 32767);
                          buf[bi++] = (byte) (s & 0xff);
                          buf[bi++] = (byte) ((s >> 8) & 0xff);
                          if (bi == buf.length) { os.write(buf); bi = 0; }
                      }
                      if (bi > 0) os.write(buf, 0, bi);
                  }
              }

              private static void le32(OutputStream os, int v) throws IOException {
                  os.write(v & 0xff); os.write((v >> 8) & 0xff); os.write((v >> 16) & 0xff); os.write((v >> 24) & 0xff);
              }

              private static void le16(OutputStream os, int v) throws IOException {
                  os.write(v & 0xff); os.write((v >> 8) & 0xff);
              }
          }
          SNOW_EOF
          mkdir -p app/src/main/java/com/josh/snowisland
          cat > app/src/main/java/com/josh/snowisland/Weather.java <<'SNOW_EOF'
          package com.josh.snowisland;

          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.Locale;

          /**
           * Current local weather. Location comes from your internet connection (city level, no GPS);
           * the weather itself comes from Open-Meteo, a free weather service that needs no account.
           */
          final class Weather {
              static final int NONE = 0, SNOW = 1, RAIN = 2;

              boolean ok;
              String city = "";
              float tempC;
              int code;
              float windKmh;
              float windFromDeg;

              // What the island should do with it
              int precip = SNOW;
              float intensity = 0.35f;
              float cloud;
              float fog;
              boolean thunder;
              String desc = "";
              String emoji = "";

              static Weather fetch() {
                  Weather w = new Weather();
                  try {
                      double lat, lon;
                      String city;
                      try {
                          JSONObject loc = new JSONObject(get("https://get.geojs.io/v1/ip/geo.json"));
                          lat = loc.optDouble("latitude");
                          lon = loc.optDouble("longitude");
                          city = loc.optString("city", "");
                      } catch (Exception first) {
                          JSONObject loc = new JSONObject(get("https://ipapi.co/json/"));
                          lat = loc.optDouble("latitude");
                          lon = loc.optDouble("longitude");
                          city = loc.optString("city", "");
                      }
                      if (Double.isNaN(lat) || Double.isNaN(lon)) return w;
                      String url = String.format(Locale.US,
                              "https://api.open-meteo.com/v1/forecast?latitude=%.3f&longitude=%.3f"
                                      + "&current=temperature_2m,weather_code,wind_speed_10m,wind_direction_10m&timezone=auto",
                              lat, lon);
                      JSONObject cur = new JSONObject(get(url)).getJSONObject("current");
                      w.city = city;
                      w.tempC = (float) cur.optDouble("temperature_2m", 0);
                      w.code = cur.optInt("weather_code", 0);
                      w.windKmh = (float) cur.optDouble("wind_speed_10m", 0);
                      w.windFromDeg = (float) cur.optDouble("wind_direction_10m", 0);
                      w.ok = true;
                      w.interpret();
                  } catch (Exception ignored) {
                      w.ok = false;
                  }
                  return w;
              }

              void interpret() {
                  precip = NONE; intensity = 0; cloud = 0; fog = 0; thunder = false;
                  switch (code) {
                      case 0: desc = "Clear"; emoji = "☀️"; break;
                      case 1: desc = "Mostly clear"; emoji = "🌤"; cloud = 0.05f; break;
                      case 2: desc = "Partly cloudy"; emoji = "⛅"; cloud = 0.15f; break;
                      case 3: desc = "Overcast"; emoji = "☁️"; cloud = 0.3f; break;
                      case 45: case 48: desc = "Fog"; emoji = "🌫"; fog = 0.35f; cloud = 0.2f; break;
                      case 51: rain(0.3f, "Light drizzle"); break;
                      case 53: rain(0.45f, "Drizzle"); break;
                      case 55: rain(0.6f, "Heavy drizzle"); break;
                      case 56: case 57: rain(0.45f, "Freezing drizzle"); break;
                      case 61: rain(0.4f, "Light rain"); break;
                      case 63: rain(0.7f, "Rain"); break;
                      case 65: rain(1f, "Heavy rain"); break;
                      case 66: case 67: rain(0.75f, "Freezing rain"); break;
                      case 71: snow(0.35f, "Light snow"); break;
                      case 73: snow(0.65f, "Snow"); break;
                      case 75: snow(1f, "Heavy snow"); break;
                      case 77: snow(0.3f, "Snow grains"); break;
                      case 80: rain(0.5f, "Rain showers"); break;
                      case 81: rain(0.75f, "Rain showers"); break;
                      case 82: rain(1f, "Heavy showers"); break;
                      case 85: snow(0.6f, "Snow showers"); break;
                      case 86: snow(1f, "Heavy snow showers"); break;
                      case 95: case 96: case 99:
                          rain(0.9f, "Thunderstorm"); thunder = true; emoji = "⛈"; break;
                      default: desc = "—"; emoji = "🌡"; break;
                  }
              }

              private void rain(float i, String d) {
                  precip = RAIN; intensity = i; cloud = 0.25f; desc = d; emoji = "🌧";
              }

              private void snow(float i, String d) {
                  precip = SNOW; intensity = i; cloud = 0.2f; desc = d; emoji = "🌨";
              }

              private static String get(String u) throws Exception {
                  HttpURLConnection con = (HttpURLConnection) new URL(u).openConnection();
                  con.setConnectTimeout(8000);
                  con.setReadTimeout(8000);
                  con.setRequestProperty("User-Agent", "SnowIsland/2");
                  try (InputStream in = con.getInputStream()) {
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      byte[] buf = new byte[4096];
                      int n;
                      while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                      return bo.toString("UTF-8");
                  } finally {
                      con.disconnect();
                  }
              }
          }
          SNOW_EOF
          cat > app/src/main/java/com/josh/snowisland/MediaListener.java <<'SNOW_EOF'
          package com.josh.snowisland;

          import android.service.notification.NotificationListenerService;

          /**
           * Does nothing by itself. Android only lets an app see other apps' "now playing" controls
           * (SmartTube's play/pause state and song name) if it has one of these, switched on with:
           *   adb shell cmd notification allow_listener com.josh.snowisland/com.josh.snowisland.MediaListener
           */
          public class MediaListener extends NotificationListenerService {
          }
          SNOW_EOF

      - name: Add your fire recording (if fire.ogg is in the repo)
        run: |
          if [ -f fire.ogg ]; then
            mkdir -p app/src/main/res/raw
            cp fire.ogg app/src/main/res/raw/fire.ogg
            echo "Using fire.ogg"
          fi

      - name: Make a signing key (first build only)
        run: |
          if [ ! -f signing/snowisland.keystore ]; then
            mkdir -p signing
            keytool -genkeypair -keystore signing/snowisland.keystore -storepass snowisland \
              -alias snowisland -keypass snowisland -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Snow Island"
            echo NEW_KEY=1 >> "$GITHUB_ENV"
          fi

      - name: Build the app
        working-directory: app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Save the signing key so updates install over the old version
        if: env.NEW_KEY == '1'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add signing/snowisland.keystore
          git commit -m "Save signing key [skip ci]"
          git push

      - name: Publish SnowIsland.apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/*.apk SnowIsland.apk
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          gh release create latest SnowIsland.apk --latest \
            --title "Snow Island (build ${{ github.run_number }})" \
            --notes "Install on the TV with the Downloader app."