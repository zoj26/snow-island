              void drawWheel(Canvas c) {
                  // Stick picks a slice directly
                  if (Math.abs(axX) + Math.abs(axY) > 0.6f) {
                      double ang = Math.toDegrees(Math.atan2(axY, axX)) + 90;
                      if (ang < 0) ang += 360;
                      int sel = (int) Math.round(ang / 45.0) % 8;
                      if (sel != wheelSel) { wheelSel = sel; play(S_TICK, 0.3f, 1f); }
                  }
                  c.drawColor(0x66000000);
                  float cx = VW / 2f, cy = VH / 2f, ro = 245, ri = 92;
                  p.setColor(0xd9142433);
                  c.drawCircle(cx, cy, ro, p);
                  rf.set(cx - ro, cy - ro, cx + ro, cy + ro);
                  p.setColor(0xff2e7dbd);
                  c.drawArc(rf, -90 + wheelSel * 45 - 22.5f, 45, true, p);
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(2);
                  p.setColor(0x40ffffff);
                  for (int i = 0; i < 8; i++) {
                      double a = Math.toRadians(-90 + i * 45 - 22.5);
                      c.drawLine(cx + (float) Math.cos(a) * ri, cy + (float) Math.sin(a) * ri,
                              cx + (float) Math.cos(a) * ro, cy + (float) Math.sin(a) * ro, p);
                  }
                  p.setStyle(Paint.Style.FILL);
                  p.setColor(0xff0f1c2a);
                  c.drawCircle(cx, cy, ri, p);

                  tp.setTextAlign(Paint.Align.CENTER);
                  for (int i = 0; i < 8; i++) {
                      double a = Math.toRadians(-90 + i * 45);
                      float ix = cx + (float) Math.cos(a) * 168, iy = cy + (float) Math.sin(a) * 168;
                      tp.setColor(0xffffffff);
