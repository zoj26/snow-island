              final ArrayList<String> newSongs = new ArrayList<>();
              final Set<String> skippedSongs = new HashSet<>();
              int folderSel, playerSel, flipFrom, flipDir;
              float flipT;
              float folderAnim;
              boolean folderClosing;
              Runnable afterFolderClose;
              volatile Disc nowDisc;
              volatile boolean nowYT, radioPaused, ytActive, cdPlaying, dialogOpen;
              volatile String nowTitle = "";
              volatile long ytQuietSince, ytGraceUntil;
              MediaPlayer cdPlayer;
              final ArrayList<String> cdQueue = new ArrayList<>();
              int cdIndex;
              boolean cdResumeOnReturn;
              float nextCdNote;
              volatile boolean returnPending, mediaAccess, ytUserPaused, ytSawPlaying;
              volatile long ytJudgeAfter, returnArmedAt, ytResumeAt;
              volatile String ytSeenTitle;
              final ArrayList<Integer> ytOrder = new ArrayList<>();
              int ytPos;
              float cdVolume = 1f, volHoldAt;
              boolean shuffleOn;
              volatile boolean ytSawDiscSong, ytShuffleSent;
              volatile String ytLastTitle;
              volatile long ytUserSkipAt, ytJumpUntil, ytPrevPos, ytPrevDur, ytTitleSince;
              // shuffle history: {0, queueId} for a direct queue jump, {1, steps} for a jump made by skipping
              final ArrayList<long[]> ytHistory = new ArrayList<>();
              volatile boolean ytStepping, ytAfterJump, ytShuffling, ytBusyShuffle;
              volatile int ytCurIdx = -1;     // which song of the disc is playing, when we know
              int ytEndTicks;
              volatile long ytShuffleAt;
              final java.util.HashSet<Integer> ytPlayed = new java.util.HashSet<>();
              volatile long progPos, progDur, progAt;
              volatile boolean progPlaying;
              int playerRow;
              volatile long returnDeadline;
              int returnHits;

              // Controller stick in menus, sleepy-screen dimming
              int navDir = -1;
              float navT;
              boolean wasMenu;
              float afkT, afkDim, nextHeartFx, nextSmoke, rallyT, rallyFormT, fightCool = 30, fightCool2 = 45;
              int lastCamX = -1, lastCamY = -1;
              float[] drX, drY, drS, drR, drW, drA, drP;
              Bitmap iglooBmp;
              final Object iglooSpot = new Object();

              // Ezio the cat. His position is in the coordinates of whichever scene he's in.
              final Object ezSpot = new Object(), bedSpot = new Object();
              boolean ezFollow, ezMoving, ezSleeping, ezVisiting, ezFetch;
              float ezFetchX, ezFetchY, ezFetchWait, ezSearchA, ezFindAt;
              boolean ezFound, ezCarryBall, pHasBall;
              float ezNapCool, ezStuckT, ezDetourT, ezDetourX, ezDetourY, ezLastUX, ezLastUY;
              boolean ezBlocked;
              AppPeng ezPatPeng;      // the penguin giving him a pat right now (drawn in front of him)
              boolean ezPatByYou;
              AppPeng ezPatPeng2;                  // a second penguin patting him at the same time
              AppPeng ezChatA;                     // a conversation he's gone over to watch
              float ezChatT, ezWhipT;              // ezWhipT: tail whipping about after a catch
              boolean ezEyeLClosed, ezEyeRClosed;  // one eye after the other, during a slow blink
              float ezPatX, ezPatY;   // where he sits while being patted
              int ezScene = SCENE_ISLAND, ezFacing = RIGHT;
              float ezX = BED_X, ezY = BED_Y + 2, ezTX = BED_X, ezTY = BED_Y + 2;
              float ezWait = 3, ezPhase, ezBlinkT, ezNextBlink = 3, ezSleepT, ezVisitT = -1, ezReturnT = -1, ezStayT, ezHappyT;
              boolean ezGoBed, ezLeaving, ezRun;
              AppPeng ezPeng, ezStarePeng;
              float ezStareT, ezStareLen = 5f;
              int ezStareSets = 1;
              boolean ezStareEzFirst = true, ezStareLFirst = true;

              // Scene + overlays
              int scene = SCENE_ISLAND, pendingScene = -1;
              float fade;            // 0..1 black fade during scene change
              boolean fadingOut;
