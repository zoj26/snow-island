              /** A brass "JAMIESON" plaque. */
              void drawNameplate(Canvas c, Paint w, float cx, float cy, float sc) {
                  String name = "JAMIESON";
                  Paint t = new Paint(Paint.ANTI_ALIAS_FLAG);
                  t.setTypeface(Typeface.create(Typeface.SERIF, Typeface.BOLD));
                  t.setTextSize(17 * sc);
                  t.setTextAlign(Paint.Align.CENTER);
                  float tw = t.measureText(name) + 30 * sc, th = 26 * sc;
                  w.setColor(0x55000000);
                  rf.set(cx - tw / 2 + 2, cy - th / 2 + 3, cx + tw / 2 + 2, cy + th / 2 + 3);
                  c.drawRoundRect(rf, 5 * sc, 5 * sc, w);
                  rf.set(cx - tw / 2, cy - th / 2, cx + tw / 2, cy + th / 2);
                  w.setShader(new LinearGradient(0, cy - th / 2, 0, cy + th / 2, 0xfff3d98b, 0xffb8892e, Shader.TileMode.CLAMP));
                  c.drawRoundRect(rf, 5 * sc, 5 * sc, w);
                  w.setShader(null);
                  w.setStyle(Paint.Style.STROKE);
                  w.setStrokeWidth(1.5f * sc);
                  w.setColor(0xff8a6420);
                  rf.set(cx - tw / 2 + 4 * sc, cy - th / 2 + 4 * sc, cx + tw / 2 - 4 * sc, cy + th / 2 - 4 * sc);
                  c.drawRoundRect(rf, 3 * sc, 3 * sc, w);
                  w.setStyle(Paint.Style.FILL);
                  // little screws
                  w.setColor(0xff8a6420);
                  c.drawCircle(cx - tw / 2 + 9 * sc, cy, 1.8f * sc, w);
                  c.drawCircle(cx + tw / 2 - 9 * sc, cy, 1.8f * sc, w);
                  // engraved letters: light edge under dark text
                  t.setColor(0x88fff4c8);
                  c.drawText(name, cx, cy + 6.5f * sc, t);
                  t.setColor(0xff4e3510);
                  c.drawText(name, cx, cy + 5.5f * sc, t);
              }

              void initParticles() {
                  Random r = new Random(3);
                  int nw = 0;
                  waveX = new float[180]; waveY = new float[180]; wavePh = new float[180];
                  while (nw < 180) {
                      float x = r.nextFloat() * WW, y = r.nextFloat() * WH;
                      float ex = (x - CX) / (RX + 80), ey = (y - CY) / (RY + 65);
                      if (ex * ex + ey * ey < 1f) continue;
                      waveX[nw] = x; waveY[nw] = y; wavePh[nw] = r.nextFloat() * 6.28f;
                      nw++;
                  }
                  int ns = 240;
                  flX = new float[ns]; flY = new float[ns]; flSpd = new float[ns]; flR = new float[ns];
                  for (int i = 0; i < ns; i++) {
                      flX[i] = r.nextFloat() * VW;
                      flY[i] = r.nextFloat() * VH;
                      flSpd[i] = 0.6f + r.nextFloat() * 0.8f;
                      flR[i] = 1.2f + r.nextFloat() * 2f;
                  }
                  drX = new float[70]; drY = new float[70]; drS = new float[70]; drR = new float[70];
                  for (int i = 0; i < drX.length; i++) {
                      drX[i] = r.nextFloat() * VW;
                      drY[i] = r.nextFloat() * VH;
                      drS[i] = 260 + r.nextFloat() * 380;
                      drR[i] = 1.4f + r.nextFloat() * 2.4f;
                  }
                  int nst = 45;
                  stX = new float[nst]; stY = new float[nst]; stLen = new float[nst];
                  for (int i = 0; i < nst; i++) {
                      stX[i] = r.nextFloat() * VW;
                      stY[i] = r.nextFloat() * VH;
                      stLen[i] = 25 + r.nextFloat() * 45;
                  }
              }

              // ================================================================== main loop

              void renderLoop() {
                  while (running) {
                      Canvas c = null;
                      try { c = holder.lockHardwareCanvas(); } catch (Exception ignored) { }
                      if (c == null) {
                          try { c = holder.lockCanvas(); } catch (Exception ignored) { }
                      }
                      if (c == null) {
                          try { Thread.sleep(16); } catch (InterruptedException ignored) { }
                          continue;
                      }
                      try {
                          long now = System.nanoTime();
                          float dt = Math.min(0.05f, (now - lastNs) / 1e9f);
                          lastNs = now;
                          time += dt;
                          List<AppPeng> list;
                          synchronized (lock) { list = apps; }
                          update(dt, list);
                          if (scene == SCENE_ISLAND) drawIsland(c, list);
                          else if (scene == SCENE_IGLOO) drawRoom(c);
                          else drawFire(c);
                          if (afkDim > 0) drawSleepy(c);
                          drawOverlays(c);
                      } catch (Exception ex) {
                          // keep the loop alive no matter what
                      } finally {
                          try { holder.unlockCanvasAndPost(c); } catch (Exception ignored) { }
                      }
                  }
              }

              // ================================================================== update

              void update(float dt, List<AppPeng> list) {
                  // Scene fade
                  if (pendingScene >= 0) {
                      if (fadingOut) {
                          fade = Math.min(1, fade + dt * 4);
                          if (fade >= 1) { enterScene(pendingScene); fadingOut = false; }
                      } else {
                          fade = Math.max(0, fade - dt * 4);
                          if (fade <= 0) pendingScene = -1;
                      }
                  }

                  Runnable task;
                  while ((task = gameTasks.poll()) != null) {
                      try { task.run(); } catch (Exception ignored) { }
                  }

                  Integer k;
                  while ((k = keyQueue.poll()) != null) handleKey(k & ~REPEAT_FLAG, (k & REPEAT_FLAG) != 0, list);

                  // Controller stick / d-pad moves through menus: one step per push, keeps going if held
                  int sdir = -1;
                  if (Math.abs(axX) > 0.55f || Math.abs(axY) > 0.55f) {
                      sdir = Math.abs(axX) > Math.abs(axY)
                              ? (axX > 0 ? KeyEvent.KEYCODE_DPAD_RIGHT : KeyEvent.KEYCODE_DPAD_LEFT)
                              : (axY > 0 ? KeyEvent.KEYCODE_DPAD_DOWN : KeyEvent.KEYCODE_DPAD_UP);
                  }
                  boolean menuNav = overlay == OV_LIST || overlay == OV_FOLDER || overlay == OV_PLAYER;
                  if (menuNav) {
                      if (!wasMenu) { navDir = sdir; navT = 0.4f; }      // ignore a stick that was already held when the menu opened
                      else if (sdir != navDir) { navDir = sdir; navT = 0.4f; if (sdir > 0) handleKey(sdir, false, list); }
                      else if (sdir > 0) { navT -= dt; if (navT <= 0) { navT = 0.12f; handleKey(sdir, true, list); } }
                  }
                  wasMenu = menuNav;

                  // Fell asleep? Dim the screen and let snow blow across it (protects the TV from burn-in)
                  boolean anyInput = kUp || kDown || kLeft || kRight || axX != 0 || axY != 0;
                  if (anyInput) afkT = 0; else afkT += dt;
                  boolean sleepy = afkT > 45 && overlay == OV_NONE && scene != SCENE_FIRE && launching == null;
                  afkDim = sleepy ? Math.min(1, afkDim + dt / 4f) : Math.max(0, afkDim - dt * 3);
                  if (afkDim > 0) {
                      for (int i = 0; i < drX.length; i++) {
                          drX[i] += drS[i] * dt;
                          drY[i] += ((float) Math.sin(time * 1.3f + i) * 25 + 20) * dt;
                          if (drX[i] > VW + 60) { drX[i] = -60 - rnd.nextFloat() * 200; drY[i] = rnd.nextFloat() * VH; }
                          if (drY[i] > VH + 10) drY[i] = -10;
                      }
                  }

                  // CD folder slides up from the bottom of the screen, and back down when closed
                  if (overlay == OV_FOLDER) {
                      if (folderClosing) {
                          folderAnim = Math.max(0, folderAnim - dt * 4.5f);
                          if (folderAnim <= 0) {
                              overlay = OV_NONE;
                              folderClosing = false;
                              Runnable after = afterFolderClose;
                              afterFolderClose = null;
                              if (after != null) after.run();
                          }
                      } else {
                          folderAnim = Math.min(1, folderAnim + dt * 4f);
                      }
                      if (flipT > 0) { flipT += dt / 0.42f; if (flipT >= 1) flipT = 0; }
                  }

                  // Newly copied songs ask which disc they belong on
                  if (!newSongs.isEmpty() && overlay == OV_NONE && !dialogOpen && pendingScene < 0
                          && launching == null && sittingChair == null && scene != SCENE_FIRE) {
                      showSongPrompt();
                  }

                  // Little notes float up from the CD player while it plays
                  if (scene == SCENE_ISLAND && nowDisc != null && radioBusy()) {
                      nextCdNote -= dt;
                      if (nextCdNote <= 0) { nextCdNote = 0.7f + rnd.nextFloat() * 0.6f; spawnNote(CD_X + (rnd.nextBoolean() ? -26 : 26), CD_Y - 36); }
                  }

                  boolean inputHeld = kUp || kDown || kLeft || kRight || axX != 0 || axY != 0;
                  boolean frozen = overlay != OV_NONE || pendingScene >= 0 || launching != null || sittingChair != null || scene == SCENE_FIRE;

                  if (launching != null) {
                      launchT += dt;
                      if (launchT > 0.35f) { launch(launching); launching = null; }
                  }
                  if (sittingChair != null) {
                      chairT += dt;
                      if (chairT > 0.7f) {
                          Chair ch = sittingChair;
                          sittingChair = null;
                          startIntent(ch.intent, ch.label);
                      }
                  }
                  if (scene == SCENE_FIRE) updateFire(dt);
                  // Little sparks rising up the chimney inside the igloo
                  if (scene == SCENE_IGLOO && rnd.nextFloat() < dt * 4) {
                      Part q = part(640 + (rnd.nextFloat() - 0.5f) * 60, 280, true);
                      q.vx = (rnd.nextFloat() - 0.5f) * 20; q.vy = -50 - rnd.nextFloat() * 50;
                      q.max = q.life = 1.6f; q.size = 1 + rnd.nextFloat() * 1.2f;
                      q.color = rnd.nextBoolean() ? 0xffffe082 : 0xffffab40;
                      q.flue = true; q.flueX = 640; q.flueTop = 196;
                  }
                  // Smoke curling out of the igloo's chimney
                  if (scene == SCENE_ISLAND) {
                      nextSmoke -= dt;
                      if (nextSmoke <= 0) {
                          nextSmoke = 0.28f + rnd.nextFloat() * 0.25f;
                          Part q = part(IGLOO_X + 80 + (rnd.nextFloat() - 0.5f) * 8, IGLOO_Y - 140, true);
                          q.vx = 8 + rnd.nextFloat() * 10; q.vy = -22 - rnd.nextFloat() * 10;
                          q.max = q.life = 3.2f; q.size = 4 + rnd.nextFloat() * 2; q.grow = 4f;
                          q.color = 0xffcfd8dc;
                          if (rnd.nextFloat() < 0.12f) {
                              Part e = part(IGLOO_X + 80, IGLOO_Y - 142, true);
                              e.vx = (rnd.nextFloat() - 0.5f) * 20; e.vy = -40 - rnd.nextFloat() * 30;
                              e.max = e.life = 1.1f; e.size = 1.6f; e.color = 0xffffab40;
                          }
                      }
                  }

                  // Player emotes
                  if (pEmote != E_NONE) {
                      pEmoteT += dt;
                      if (pEmote == E_THROW && pEmoteT >= 0.22f && pEmoteT - dt < 0.22f) throwBall(true, null, px, py, facing);
                      if (pEmote == E_HUG) {
                          nextHeartFx -= dt;
                          if (nextHeartFx <= 0) { nextHeartFx = 0.35f; spawnHeart(px + (facing == LEFT ? -20 : 20), py - 80); }
                      }
                      if (pEmote == E_DANCE && rnd.nextFloat() < dt * 3) spawnNote(px, py - 95);
                      if (pEmote == E_NAP) {
                          nextZ -= dt;
                          if (nextZ <= 0) { nextZ = 1.2f; spawnZ(px + 12, py - 70); }
                      }
                      boolean ends = pEmoteDur > 0 && pEmoteT >= pEmoteDur;
                      boolean cancel = (pEmote == E_NAP || pEmote == E_SIT || pEmote == E_LOOK) && inputHeld && !frozen;
                      if (ends || cancel) pEmote = E_NONE;
                  }

                  moving = false;
                  if (!frozen) {
                      if (pEmote == E_SLIDE) {
                          movePlayer(slideDX, slideDY, 520, dt, true);
                          moving = true;
                      } else if (pEmote == E_NONE || pEmote == E_LOOK) {
                          float dx = (kRight ? 1 : 0) - (kLeft ? 1 : 0) + axX;
                          float dy = (kDown ? 1 : 0) - (kUp ? 1 : 0) + axY;
                          float len = (float) Math.sqrt(dx * dx + dy * dy);
                          if (len > 0.2f) {
                              if (len > 1) { dx /= len; dy /= len; }
                              movePlayer(dx, dy, PLAYER_SPEED, dt, false);
                              moving = true;
                              if (Math.abs(dx) > Math.abs(dy)) facing = dx < 0 ? LEFT : RIGHT;
                              else facing = dy < 0 ? UP : DOWN;
                          }
                      }
                  }
                  walkPhase += dt * (moving ? 14f : 3f);
                  if (moving && pEmote != E_SLIDE) {
                      int stepNow = (int) (walkPhase / Math.PI);
                      if (stepNow != lastStep) {
                          lastStep = stepNow;
                          play(S_STEP, scene == SCENE_ISLAND ? 0.35f : 0.25f, 0.85f + rnd.nextFloat() * 0.3f);
                      }
                  }

                  // Idle animations
                  if (inputHeld || pEmote != E_NONE || frozen) {
                      if (inputHeld) idleT = 0;
                  } else {
                      idleT += dt;
                      if (idleT > 40 && scene == SCENE_ISLAND) {
                          startEmote(E_NAP, 0);
                      } else if (idleT > nextIdle) {
                          nextIdle = idleT + 4 + rnd.nextFloat() * 4;
                          int pick = rnd.nextInt(3);
                          if (pick == 0) { startEmote(E_LOOK, 1.6f); }
                          else if (pick == 1) startEmote(E_FLAP, 0.8f);
                          else startEmote(E_HOP, 0.6f);
                      }
                  }
                  if (idleT == 0) nextIdle = 7f;

                  pHitT = Math.max(0, pHitT - dt);
                  pNextBlink -= dt;
                  if (pNextBlink <= 0) { pBlinkT = 0.13f; pNextBlink = 2 + rnd.nextFloat() * 4; }
                  pBlinkT = Math.max(0, pBlinkT - dt);

                  for (int i = 0; i < trailAge.length; i++) if (trailAge[i] > 0) trailAge[i] += dt;

                  if (scene == SCENE_ISLAND) updateIsland(dt, list);

                  // "Say hi" chirp when a new thing comes into reach
                  String nk = "";
                  Object tgt = scene == SCENE_ISLAND ? nearestTarget(list) : null;
                  AppPeng near = tgt instanceof AppPeng ? (AppPeng) tgt : null;
                  if (near != null) nk = near.pkg;
                  else if (tgt instanceof Chair) nk = ((Chair) tgt).key;
                  else {
                      String obj = nearObject();
                      if (obj != null) nk = obj;
                  }
                  if (!nk.equals(lastNearKey)) {
                      if (near != null) play(S_CHIRP, 0.16f, 0.9f + (near.pkg.hashCode() & 7) * 0.03f);
                      lastNearKey = nk;
                  }

                  updateEzio(dt);
                  updateParticles(dt);
              }

              void movePlayer(float dx, float dy, float speed, float dt, boolean slide) {
                  float nx = px + dx * speed * dt;
                  float ny = py + dy * speed * dt;
                  if (scene == SCENE_ISLAND) {
                      float ex = (nx - CX) / (RX - 35), ey = (ny - CY) / (RY - 30);
                      float e = ex * ex + ey * ey;
                      if (e > 1) {
                          float kk = (float) (1 / Math.sqrt(e));
                          nx = CX + (nx - CX) * kk;
                          ny = CY + (ny - CY) * kk;
                      }
                      // Igloo: blocks only its round base, so you can walk around and behind it
                      float ix = (nx - IGLOO_X) / 136f, iy = (ny - (IGLOO_Y - 22)) / 36f;
                      float ie = ix * ix + iy * iy;
                      if (ie < 1) {
                          float kk = (float) (1 / Math.sqrt(Math.max(ie, 0.0001f)));
                          nx = IGLOO_X + (nx - IGLOO_X) * kk;
                          ny = (IGLOO_Y - 22) + (ny - (IGLOO_Y - 22)) * kk;
                      }
                      // CD player table
                      float cx2 = (nx - CD_X) / 44f, cy2 = (ny - (CD_Y - 5)) / 14f;
                      float ce = cx2 * cx2 + cy2 * cy2;
                      if (ce < 1) {
                          float kk = (float) (1 / Math.sqrt(Math.max(ce, 0.0001f)));
                          nx = CD_X + (nx - CD_X) * kk;
                          ny = (CD_Y - 6) + (ny - (CD_Y - 6)) * kk;
                      }
                  } else {
                      nx = Math.max(170, Math.min(1110, nx));
                      ny = Math.max(380, Math.min(660, ny));
                      // furniture
                      if (ny < 440 && nx > 160 && nx < 360) ny = 440;
                      if (ny < 440 && nx > 920 && nx < 1120) ny = 440;
                  }
                  float moved = Math.abs(nx - px) + Math.abs(ny - py);
                  px = nx;
                  py = ny;
                  trailDist += moved;
                  if (scene == SCENE_ISLAND && trailDist > (slide ? 7 : 16)) {
                      trailDist = 0;
                      trailHead = (trailHead + 1) % trailX.length;
                      trailX[trailHead] = px + (slide ? 0 : (trailHead % 2 == 0 ? -6 : 6));
                      trailY[trailHead] = py;
                      trailAge[trailHead] = 0.001f;
                      trailSlide[trailHead] = slide;
                  }
              }

              void startEmote(int e, float dur) {
                  pEmote = e;
                  pEmoteT = 0;
                  pEmoteDur = dur;
                  switch (e) {
                      case E_WAVE:
                          facing = DOWN;
                          if (scene == SCENE_ISLAND) for (AppPeng a : apps) {
                              if (dist2(a.x, a.y, px, py) < 320 * 320) npcEmote(a, E_WAVE, 1.4f, 0.3f + rnd.nextFloat() * 0.4f);
                          }
                          play(S_CHIRP, 0.22f, 1f);
                          break;
                      case E_DANCE:
                          if (scene == SCENE_ISLAND) for (AppPeng a : apps) {
                              if (dist2(a.x, a.y, px, py) < 280 * 280) npcEmote(a, E_DANCE, 3.2f, 0.2f + rnd.nextFloat() * 0.5f);
                          }
                          break;
                      case E_SLIDE:
                          slideDX = facing == LEFT ? -1 : facing == RIGHT ? 1 : 0;
                          slideDY = facing == UP ? -1 : facing == DOWN ? 1 : 0;
                          play(S_WHOOSH, 0.5f, 0.8f);
                          break;
                      case E_THROW:
                          play(S_WHOOSH, 0.45f, 1.3f);
                          break;
                      case E_LOOK:
                          break;
                      default:
                          break;
                  }
              }

              void npcEmote(AppPeng a, int e, float dur, float delay) {
                  a.emote = e;
                  a.emoteT = 0;
                  a.emoteDur = dur;
                  a.emoteDelay = delay;
              }

              void updateIsland(float dt, List<AppPeng> list) {
                  boolean playerMoving = kUp || kDown || kLeft || kRight || axX != 0 || axY != 0;
                  if (rallyT > 0) {
                      rallyT -= dt;
                      if (rallyT <= 0) {
                          for (AppPeng a : list) { a.tx = a.hx + (rnd.nextFloat() - 0.5f) * 80; a.ty = a.hy + (rnd.nextFloat() - 0.5f) * 50; a.wait = 0; }
                      }
                  }
                  for (AppPeng a : list) {
                      if (rallyT > 0) {
                          // rush to their spot in the circle, then stand still facing you
                          a.blinkT = Math.max(0, a.blinkT - dt);
                          a.nextBlink -= dt;
                          if (a.nextBlink <= 0) { a.blinkT = 0.13f; a.nextBlink = 2 + rnd.nextFloat() * 5; }
                          float dx = a.rallyX - a.x, dy = a.rallyY - a.y, d = (float) Math.sqrt(dx * dx + dy * dy);
                          if (d > 3) {
                              float stp = Math.min(d, 210 * dt);
                              a.x += dx / d * stp; a.y += dy / d * stp;
                              a.moving = true;
                              a.facing = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? LEFT : RIGHT) : (dy < 0 ? UP : DOWN);
                              a.phase += dt * 12f;
                          } else {
                              a.moving = false;
                              a.facing = faceToward(a.x, a.y, px, py);
                              a.phase += dt * 3f;
                          }
                          continue;
                      }
                      if (a.hugWalk) {
                          if (playerMoving) { a.hugWalk = false; }
                          else {
                              float dx = a.hugX - a.x, dy = a.hugY - a.y;
                              float d = (float) Math.sqrt(dx * dx + dy * dy);
                              if (d < 3) {
                                  a.hugWalk = false;
                                  a.x = a.hugX; a.y = a.hugY;
                                  boolean onRight = a.x >= px;
                                  a.facing = onRight ? LEFT : RIGHT;
                                  facing = onRight ? RIGHT : LEFT;
                                  npcEmote(a, E_HUG, 2.4f, 0);
                                  startEmote(E_HUG, 2.4f);
                                  nextHeartFx = 0;
                              } else {
                                  float step = Math.min(d, 120 * dt);
                                  a.x += dx / d * step;
                                  a.y += dy / d * step;
                                  a.moving = true;
                                  a.facing = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? LEFT : RIGHT) : (dy < 0 ? UP : DOWN);
                                  a.phase += dt * 10f;
                              }
                              continue;
                          }
                      }
                      a.hitT = Math.max(0, a.hitT - dt);
                      a.nextBlink -= dt;
                      if (a.nextBlink <= 0) { a.blinkT = 0.13f; a.nextBlink = 2 + rnd.nextFloat() * 5; }
                      a.blinkT = Math.max(0, a.blinkT - dt);

                      if (a.throwBackT > 0) {
                          a.throwBackT -= dt;
                          if (a.throwBackT <= 0) {
                              a.facing = faceToward(a.x, a.y, px, py);
                              npcEmote(a, E_THROW, 0.45f, 0);
                              a.ballT = 0.22f;
                          }
                      }
                      if (a.ballT > 0) {
                          a.ballT -= dt;
                          if (a.ballT <= 0) throwBall(false, a, a.x, a.y, a.facing);
                      }

                      if (a.emote != E_NONE) {
                          if (a.emoteDelay > 0) {
                              a.emoteDelay -= dt;
                              if (a.emote == E_WAVE || a.emote == E_DANCE) a.facing = faceToward(a.x, a.y, px, py);
                          } else {
                              a.emoteT += dt;
                              if (a.emote == E_DANCE) {
                                  a.facing = ((int) (a.emoteT / 0.2f)) % 4;
                              }
                              if (a.emote == E_HUG) {
                                  float k2 = Math.min(1, dt * 8);
                                  a.x += (a.hugX - a.x) * k2;
                                  a.y += (a.hugY - a.y) * k2;
                                  if (a.facing == RIGHT && rnd.nextFloat() < dt * 2.5f) spawnHeart(a.x + 20, a.y - 80);
                              }
                              if (a.emoteT >= a.emoteDur) a.emote = E_NONE;
                          }
                          a.moving = false;
                          a.phase += dt * 3;
                          continue;
                      }

                      npcThink(a, dt, list);
                      a.phase += dt * (a.moving ? 10f : 3f);
                  }

                  // Nobody walks through the igloo or the boombox: anyone inside the base gets nudged back out
                  for (AppPeng a : list) {
                      float ix = (a.x - IGLOO_X) / 140f, iy = (a.y - (IGLOO_Y - 22)) / 40f;
                      float ie = ix * ix + iy * iy;
                      if (ie < 1) {
                          float k = (float) (1 / Math.sqrt(Math.max(ie, 0.0001f)));
                          a.x = IGLOO_X + (a.x - IGLOO_X) * k;
                          a.y = (IGLOO_Y - 22) + (a.y - (IGLOO_Y - 22)) * k;
                          // and if they were headed through it, send them around instead
                          float tix = (a.tx - IGLOO_X) / 150f, tiy = (a.ty - (IGLOO_Y - 22)) / 46f;
                          if (tix * tix + tiy * tiy < 1) a.ty = a.y < IGLOO_Y - 22 ? IGLOO_Y - 80 : IGLOO_Y + 40;
                      }
                      float cx2 = (a.x - CD_X) / 48f, cy2 = (a.y - (CD_Y - 5)) / 18f;
                      float ce = cx2 * cx2 + cy2 * cy2;
                      if (ce < 1) {
                          float k = (float) (1 / Math.sqrt(Math.max(ce, 0.0001f)));
                          a.x = CD_X + (a.x - CD_X) * k;
                          a.y = (CD_Y - 5) + (a.y - (CD_Y - 5)) * k;
                      }
                  }

                  // Snowballs
                  for (Iterator<Ball> it = balls.iterator(); it.hasNext(); ) {
                      Ball b = it.next();
                      b.t += dt;
                      b.x += b.vx * dt;
                      b.y += b.vy * dt;
                      float z = ballZ(b);
                      boolean done = false;
                      if (b.toy) {
                          // a snowball tossed for Ezio to chase: it doesn't hit anyone
                      } else if (b.fromPlayer) {
                          for (AppPeng a : list) {
                              if (z < 75 && dist2(a.x, a.y - 10, b.x, b.y) < 30 * 30) {
                                  a.hitT = 2.2f;
                                  a.facing = faceToward(a.x, a.y, px, py);
                                  npcEmote(a, E_FLINCH, 0.5f, 0);
                                  play(S_SPLAT, 0.6f, 1f);
                                  play(S_CHIRP, 0.18f, 1.15f);
                                  if (rnd.nextFloat() < 0.6f) a.throwBackT = 0.9f + rnd.nextFloat() * 0.5f;
                                  splat(b.x, b.y - z * 0.3f - 40);
                                  done = true;
                                  break;
                              }
                          }
                      } else if (z < 75 && dist2(px, py - 10, b.x, b.y) < 30 * 30) {
                          pHitT = 2.2f;
                          play(S_SPLAT, 0.6f, 0.9f);
                          splat(b.x, b.y - 45);
                          done = true;
                      }
                      if (!done && b.t >= b.dur) {
                          float ex = (b.x - CX) / RX, ey = (b.y - CY) / RY;
                          if (ex * ex + ey * ey > 1) splash(b.x, b.y); else splat(b.x, b.y);
                          play(S_SPLAT, 0.35f, 1.2f);
                          done = true;
                      }
                      if (done) it.remove();
                  }

                  // Seasonal extras
                  int season = activeSeason();
                  if (season == SEASON_NEWYEAR) {
                      nextFirework -= dt;
                      if (nextFirework <= 0) { nextFirework = 0.6f + rnd.nextFloat() * 1.2f; firework(); }
                  } else if (season == SEASON_VALENTINE) {
                      nextHeart -= dt;
                      if (nextHeart <= 0) { nextHeart = 0.5f + rnd.nextFloat(); heart(); }
                  }

                  // Weather particles
                  Weather w = weatherFx ? weather : null;
                  float windVX = 0, windVY = 0;
                  if (w != null && w.ok) {
                      double toward = Math.toRadians(w.windFromDeg + 180);
                      windVX = (float) Math.sin(toward) * w.windKmh * 5f;
                      windVY = (float) -Math.cos(toward) * w.windKmh * 2f;
                      if (w.thunder && rnd.nextFloat() < dt * 0.08f) flash = 1f;
                  }
                  flash = Math.max(0, flash - dt * 2.5f);
                  boolean rain = w != null && w.ok && w.precip == Weather.RAIN;
                  for (int i = 0; i < flX.length; i++) {
                      float fall = rain ? 700 * flSpd[i] : 45 * flSpd[i];
                      flY[i] += (fall + windVY * 0.3f) * dt;
                      flX[i] += (windVX * (rain ? 0.5f : 1f) + (rain ? 0 : (float) Math.sin(time * 0.8f + i) * 12f)) * dt;
                      if (flY[i] > VH + 10) { flY[i] = -10; flX[i] = rnd.nextFloat() * VW; }
                      if (flY[i] < -12) flY[i] = VH + 8;
                      if (flX[i] < -20) flX[i] += VW + 40;
                      if (flX[i] > VW + 20) flX[i] -= VW + 40;
                  }
                  for (int i = 0; i < stX.length; i++) {
                      stX[i] += windVX * 2.2f * dt;
                      stY[i] += windVY * 1.0f * dt;
                      if (stX[i] < -80) { stX[i] = VW + 60; stY[i] = rnd.nextFloat() * VH; }
                      if (stX[i] > VW + 80) { stX[i] = -60; stY[i] = rnd.nextFloat() * VH; }
                      if (stY[i] < -20) stY[i] = VH + 10;
                      if (stY[i] > VH + 20) stY[i] = -10;
                  }
              }

              void npcThink(AppPeng a, float dt, List<AppPeng> list) {
                  float pdx = px - a.x, pdy = py - a.y;
                  if (pdx * pdx + pdy * pdy < 130 * 130) {
                      if (a.chatWith != null) endChat(a);
                      if (a.joinOf != null) leaveGroup(a);
                      a.moving = false;
                      a.facing = faceToward(a.x, a.y, px, py);
                      return;
                  }
                  if (a.joinOf != null) {
                      AppPeng h = a.joinOf, h2 = h.chatWith;
                      if (h2 == null || !list.contains(h)) { leaveGroup(a); return; }
                      float mx = (h.x + h2.x) / 2, my = (h.y + h2.y) / 2;
                      float gx = mx + (a.joinSlot == 0 ? 0 : 0), gy = my + (a.joinSlot == 0 ? -34 : 30);
                      float jdx = gx - a.x, jdy = gy - a.y, jd = (float) Math.sqrt(jdx * jdx + jdy * jdy);
                      if (jd > 3) {
                          float st = Math.min(jd, 42 * dt);
                          a.x += jdx / jd * st; a.y += jdy / jd * st;
                          a.moving = true;
                          a.facing = Math.abs(jdx) > Math.abs(jdy) ? (jdx < 0 ? LEFT : RIGHT) : (jdy < 0 ? UP : DOWN);
                          return;
                      }
                      a.moving = false;
                      a.facing = faceToward(a.x, a.y, mx, my);
                      a.chatTalking = true;
                      a.joinSpeakT -= dt;
                      if (a.joinSpeakT <= 0) {
                          a.speaking = !a.speaking;
                          a.joinSpeakT = a.speaking ? 0.9f + rnd.nextFloat() * 1.2f : 1.8f + rnd.nextFloat() * 3f;
                          if (a.speaking) {
                              a.bubble = CHAT_BITS[rnd.nextInt(CHAT_BITS.length)];
                              if (rnd.nextFloat() < 0.3f) npcEmote(a, E_FLAP, 0.6f, 0);
                          }
                      }
                      return;
                  }
                  if (a.chatWith != null && a.chatTalking) {
                      AppPeng o = a.chatWith;
                      a.moving = false;
                      a.facing = faceToward(a.x, a.y, o.x, o.y);
                      a.chatT += dt;
                      if (a.speaking) {
                          a.speakT -= dt;
                          if (a.speakT <= 0) {
                              a.speaking = false;
                              o.speaking = true;
                              o.speakT = 1f + rnd.nextFloat() * 1.4f;
                              o.bubble = CHAT_BITS[rnd.nextInt(CHAT_BITS.length)];
                              float roll = rnd.nextFloat();
                              if (roll < 0.1f) { hugPair(a, o); return; }
                              if (roll < 0.28f) npcEmote(o, E_FLAP, 0.6f, 0);
                              else if (roll < 0.44f) npcEmote(a, E_HOP, 0.5f, 0);
                              if (rnd.nextFloat() < 0.3f && dist2(a.x, a.y, px, py) < 450 * 450) play(S_CHIRP, 0.05f, 0.95f + rnd.nextFloat() * 0.2f);
                          }
                      }
                      if (a.chatT > a.chatDur) endChat(a);
                      return;
                  }
                  if (a.chatWith == null && a.joinOf == null && a.wait > 0) {
                      a.wait -= dt;
                      a.moving = false;
                      float roll = rnd.nextFloat();
                      if (roll < dt * 0.06f) npcEmote(a, rnd.nextBoolean() ? E_HOP : E_FLAP, 0.7f, 0);
                      else if (roll < dt * 0.176f) tryStartChat(a, list);
                      return;
                  }
                  if (a.chatWith != null) {
                      a.chatT += dt;
                      if (a.chatT > 9) { endChat(a); return; }
                  }
                  float dx = a.tx - a.x, dy = a.ty - a.y;
                  float d = (float) Math.sqrt(dx * dx + dy * dy);
                  if (d < 2) {
                      a.moving = false;
                      if (a.chatWith != null) {
                          AppPeng o = a.chatWith;
                          a.arrived = true;
                          a.facing = faceToward(a.x, a.y, o.x, o.y);
                          if (o.arrived) {
                              float dur = 5 + rnd.nextFloat() * 5;
                              a.chatTalking = o.chatTalking = true;
                              a.chatT = o.chatT = 0;
                              a.chatDur = o.chatDur = dur;
                              a.speaking = true;
                              a.speakT = 1f + rnd.nextFloat();
                              a.bubble = CHAT_BITS[rnd.nextInt(CHAT_BITS.length)];
                          }
                          return;
                      }
                      a.wait = 1.5f + rnd.nextFloat() * 3.5f;
                      a.tx = a.hx + (rnd.nextFloat() - 0.5f) * 90;
                      a.ty = a.hy + (rnd.nextFloat() - 0.5f) * 60;
                  } else {
                      float speed = d > 150 && a.chatWith == null ? 65f : 42f;
                      float stepLen = Math.min(d, speed * dt);
                      a.x += dx / d * stepLen;
                      a.y += dy / d * stepLen;
                      a.moving = true;
                      a.facing = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? LEFT : RIGHT) : (dy < 0 ? UP : DOWN);
                  }
              }

              void tryStartChat(AppPeng a, List<AppPeng> list) {
                  // Sometimes walk over and join a conversation that's already going (up to 4 penguins)
                  if (rnd.nextFloat() < 0.35f) {
                      for (AppPeng h : list) {
                          if (h == a || h.chatWith == null || !h.chatTalking) continue;
                          if (dist2(h.x, h.y, a.x, a.y) > 480 * 480) continue;
                          int joined = 0;
                          for (AppPeng q : list) if (q.joinOf == h || q.joinOf == h.chatWith) joined++;
                          if (joined >= 2) continue;
                          a.joinOf = h;
                          a.joinSlot = joined;
                          a.joinSpeakT = 1 + rnd.nextFloat() * 2;
                          a.wait = 0;
                          return;
                      }
                  }
                  // Pick a random free penguin from a wide area, so different penguins get to meet
                  ArrayList<AppPeng> pool = new ArrayList<>();
                  for (AppPeng o : list) {
                      if (o == a || o.chatWith != null || o.joinOf != null || o.emote != E_NONE || o.hugWalk) continue;
                      if (dist2(o.x, o.y, px, py) < 160 * 160) continue;
                      if (dist2(o.x, o.y, a.x, a.y) < 480 * 480) pool.add(o);
                  }
                  if (pool.isEmpty()) return;
                  AppPeng best = pool.get(rnd.nextInt(pool.size()));
                  AppPeng o = best;
                  float mx = (a.x + o.x) / 2, my = (a.y + o.y) / 2;
                  AppPeng leftOne = a.x <= o.x ? a : o, rightOne = leftOne == a ? o : a;
                  // meet somewhere that isn't inside the igloo
                  float mix = (mx - IGLOO_X) / 190f, miy = (my - (IGLOO_Y - 22)) / 70f;
                  if (mix * mix + miy * miy < 1) my = my < IGLOO_Y - 22 ? IGLOO_Y - 100 : IGLOO_Y + 60;
                  leftOne.tx = mx - 30; rightOne.tx = mx + 30;
                  leftOne.ty = rightOne.ty = my;
                  a.chatWith = o; o.chatWith = a;
                  a.chatTalking = o.chatTalking = false;
                  a.arrived = o.arrived = false;
                  a.chatT = o.chatT = 0;
                  a.wait = o.wait = 0;
              }

              void leaveGroup(AppPeng a) {
                  a.joinOf = null;
                  a.chatTalking = false;
                  a.speaking = false;
                  a.bubble = null;
                  a.tx = a.hx + (rnd.nextFloat() - 0.5f) * 60;
                  a.ty = a.hy + (rnd.nextFloat() - 0.5f) * 40;
                  a.wait = 0;
              }

              void endChat(AppPeng a) {
                  AppPeng o = a.chatWith;
                  AppPeng[] both = o != null ? new AppPeng[]{a, o} : new AppPeng[]{a};
                  for (AppPeng q : both) {
                      q.chatWith = null;
                      q.chatTalking = q.speaking = q.arrived = false;
                      q.bubble = null;
                      q.tx = q.hx + (rnd.nextFloat() - 0.5f) * 60;
                      q.ty = q.hy + (rnd.nextFloat() - 0.5f) * 40;
                      q.wait = 0;
                  }
              }

              void updateFire(float dt) {
                  fireHintT += dt;
                  // whole-fire sway, slow and gentle
                  fireLean = (float) Math.sin(time * 1.3f) * 9 + (float) Math.sin(time * 2.9f + 1) * 5;
                  // each flame picks a new height every so often and eases toward it; middle flames reach higher
                  for (int i = 0; i < 11; i++) {
                      flameT[i] -= dt;
                      if (flameT[i] <= 0) {
                          float centre = 1 - Math.abs(i - 5) / 5f;          // 1 in the middle, 0 at the edges
                          float lo = 0.5f + 0.15f * centre, hi = 0.85f + 0.45f * centre;
                          flameTarget[i] = lo + rnd.nextFloat() * (hi - lo);
                          flameT[i] = 0.35f + rnd.nextFloat() * 0.9f;
                      }
                      flameH[i] += (flameTarget[i] - flameH[i]) * Math.min(1, dt * 3.2f);
                  }
                  updateFireEzio(dt);
                  // flame licks: spawn near the flame tips, rise and shrink
                  for (int k = 0; k < lickX.length; k++) {
                      if (lickLife[k] > 0) {
                          lickLife[k] -= dt;
                          lickY[k] -= (70 + lickSize[k] * 3) * dt;
                          lickX[k] += (float) Math.sin(time * 6 + k) * 18 * dt;
                      } else if (rnd.nextFloat() < dt * 0.22f) {
                          // break off the tip of one of the flames, right where it is this moment
                          int i = 2 + rnd.nextInt(7);
                          float base = 250 * (1 - Math.abs(i - 5) / 7f);
                          float n = flameH[i];
                          float lean = fireLean * (0.6f + 0.4f * (1 - Math.abs(i - 5) / 5f));
                          lickX[k] = 640 + (i - 5) * 33 + lean;
                          lickY[k] = 596 - base * n * 0.92f;
                          lickSize[k] = 4 + rnd.nextFloat() * 6;
                          lickShape[k] = rnd.nextFloat();
                          lickMax[k] = lickLife[k] = 0.3f + rnd.nextFloat() * 0.35f;
                      }
                  }
                  // A few stray sparks drifting up
                  if (rnd.nextFloat() < dt * 2.5f) spark(640 + (rnd.nextFloat() - 0.5f) * 280, 560, false);
                  // Every so often a log pops: a quick snappy burst of sparks
                  if (rnd.nextFloat() < dt * 0.5f) {
                      float x = 640 + (rnd.nextFloat() - 0.5f) * 220;
                      int count = 6 + rnd.nextInt(12);
                      for (int i = 0; i < count; i++) spark(x, 572, true);
                  }
                  // Smoke: wide and soft down by the fire, narrowing to a point as it's drawn up the chimney
                  if (rnd.nextFloat() < dt * 3f) {
                      Part q = part(640 + (rnd.nextFloat() - 0.5f) * 300, 540 + rnd.nextFloat() * 40, false);
                      q.vx = 0; q.vy = -40 - rnd.nextFloat() * 14;
                      q.max = q.life = 6f; q.size = 34 + rnd.nextFloat() * 14; q.grow = 1f;
                      q.color = 0xff2b2522;
                      q.seed = rnd.nextFloat() * 6.28f;
                      q.flue = true; q.flueX = 640; q.flueTop = 305;
                  }
                  // Bigger embers breaking off the flames: some rise away, some just fade, some wander about
                  if (rnd.nextFloat() < dt * 2.2f) {
                      Part q = part(640 + (rnd.nextFloat() - 0.5f) * 200, 420 + rnd.nextFloat() * 80, false);
                      q.size = 4 + rnd.nextFloat() * 5;
                      q.color = rnd.nextBoolean() ? 0xffffa726 : 0xffffcc80;
                      q.seed = rnd.nextFloat() * 6.28f;
                      float kind = rnd.nextFloat();
                      if (kind < 0.35f) {            // rises up the chimney
                          q.vx = (rnd.nextFloat() - 0.5f) * 30; q.vy = -80 - rnd.nextFloat() * 50;
                          q.max = q.life = 2f + rnd.nextFloat() * 1.2f; q.grow = -1.2f;
                          q.flue = true; q.flueX = 640; q.flueTop = 300;
                      } else if (kind < 0.65f) {     // fades out where it is
                          q.vx = (rnd.nextFloat() - 0.5f) * 16; q.vy = -18 - rnd.nextFloat() * 14;
                          q.max = q.life = 0.5f + rnd.nextFloat() * 0.5f; q.grow = -3f;
                      } else {                       // wanders around, then dies out
                          q.vx = 0; q.vy = -25 - rnd.nextFloat() * 20;
                          q.wander = 40 + rnd.nextFloat() * 50;
                          q.max = q.life = 1.6f + rnd.nextFloat() * 1.4f; q.grow = -1.5f;
                      }
                  }
              }

              // Ezio in the fireplace view: 0 sitting on his bed, 1 asleep on it, 2 walking/running, 3 standing about
              static final float FX_BED = 1150;
              float fxX = FX_BED, fxTarget, fxT;
              int fxState, fxFacing = LEFT, fxNext;
              boolean fxRun;

              void startFireEzio() {
                  fxX = FX_BED;
                  fxFacing = LEFT;
                  fxState = ezFollow || rnd.nextBoolean() ? 0 : 1;
                  fxT = 6 + rnd.nextFloat() * 8;
              }

              void updateFireEzio(float dt) {
                  if (ezScene != SCENE_IGLOO) return;
                  fxT -= dt;
                  if (fxState == 2) {
                      float d = fxTarget - fxX;
                      if (Math.abs(d) > 3) {
                          fxFacing = d < 0 ? LEFT : RIGHT;
                          fxX += Math.signum(d) * Math.min(Math.abs(d), (fxRun ? 260 : 105) * dt);
                          ezPhase += dt * (fxRun ? 10 : 0);
                          return;
                      }
                      fxX = fxTarget;
                      if (Math.abs(fxX - FX_BED) < 4) { fxState = fxNext; fxFacing = LEFT; fxT = 6 + rnd.nextFloat() * 9; }
                      else { fxState = 3; fxT = 1.5f + rnd.nextFloat() * 3; }
                      return;
                  }
                  if (fxT > 0) return;
                  float r = rnd.nextFloat();
                  boolean atBed = Math.abs(fxX - FX_BED) < 8;
                  if (r < 0.6f) {
                      // settle on the bed: sit and stare, or curl up and sleep
                      int want = rnd.nextFloat() < 0.5f ? 0 : 1;
                      if (atBed) { fxState = want; fxT = 6 + rnd.nextFloat() * 9; }
                      else { fxNext = want; fxTarget = FX_BED; fxRun = false; fxState = 2; }
                  } else {
                      // wander along the hearth, sometimes at a run
                      fxTarget = 90 + rnd.nextFloat() * 1000;
                      fxRun = rnd.nextFloat() < 0.3f;
                      fxState = 2;
                  }
              }

              /** Ezio's bed from the side: a soft round bed with raised bolster edges. front=true draws just the front lip. */
              void drawPetBed(Canvas c, float x, float y, float s, boolean front) {
                  c.save();
                  c.translate(x, y);
                  c.scale(s, s);
                  if (!front) {
                      p.setColor(0x33000000);
                      c.drawOval(-46, -5, 46, 5, p);
                      // back bolster
                      p.setColor(0xff9c3d4a);
                      rf.set(-42, -30, 42, -4);
                      c.drawRoundRect(rf, 13, 13, p);
                      p.setColor(0xffb24a57);
                      rf.set(-40, -30, 40, -18);
                      c.drawRoundRect(rf, 8, 8, p);
                      // inside cushion
                      p.setColor(0xfff1e3d3);
                      rf.set(-30, -18, 30, -6);
                      c.drawRoundRect(rf, 6, 6, p);
                      // side bolsters
                      p.setColor(0xffa8424f);
                      c.drawCircle(-36, -12, 11, p);
                      c.drawCircle(36, -12, 11, p);
                  } else {
                      // front lip (drawn over him when he's in the bed)
                      p.setColor(0xffb24a57);
                      rf.set(-40, -12, 40, 2);
                      c.drawRoundRect(rf, 7, 7, p);
                      p.setColor(0xffc95e6b);
                      rf.set(-38, -12, 38, -7);
                      c.drawRoundRect(rf, 4, 4, p);
                      p.setColor(0xffa8424f);
                      c.drawCircle(-36, -6, 8, p);
                      c.drawCircle(36, -6, 8, p);
                  }
                  c.restore();
              }

              void spark(float x, float y, boolean pop) {
                  Part q = part(x, y, false);
                  if (pop) {
                      // fast and sharp, then quickly slowed by the air: a snap, not a fountain
                      double a = -Math.PI / 2 + (rnd.nextDouble() - 0.5) * 2.2;
                      float sp = 320 + rnd.nextFloat() * 380;
                      q.vx = (float) Math.cos(a) * sp;
                      q.vy = (float) Math.sin(a) * sp;
                      q.g = 140;
                      q.drag = 4.5f;
                      q.max = q.life = rnd.nextFloat() < 0.75f ? 0.35f + rnd.nextFloat() * 0.4f : 1.1f + rnd.nextFloat() * 0.8f;
                      q.size = 1.6f + rnd.nextFloat() * 1.2f;
                  } else {
                      q.vx = (rnd.nextFloat() - 0.5f) * 60;
                      q.vy = -120 - rnd.nextFloat() * 160;
                      q.g = 20;
                      q.max = q.life = 1.2f + rnd.nextFloat() * 1.5f;
                      q.size = 1.4f + rnd.nextFloat() * 1.4f;
                      q.flue = true; q.flueX = 640; q.flueTop = 300;
                  }
                  q.color = rnd.nextBoolean() ? 0xffffe082 : 0xffffab40;
              }

              Object nearestTarget(List<AppPeng> list) {
                  Object best = null;
                  float bd = NEAR_DIST * NEAR_DIST;
                  for (AppPeng a : list) {
                      float d = dist2(a.x, a.y, px, py);
                      if (d < bd) { bd = d; best = a; }
                  }
                  float cd = Math.min(bd, 75 * 75);
                  for (Chair c : chairs) {
                      float d = dist2(c.x, c.y + 12, px, py);
                      if (d < cd) { cd = d; best = c; }
                  }
                  return best;
              }

              float ballZ(Ball b) {
                  float u = b.t / b.dur;
                  return 30 * (1 - u) + 4 * 45 * u * (1 - u);
              }

              void throwBall(boolean fromPlayer, AppPeng owner, float x, float y, int face) {
                  Ball b = new Ball();
                  float dx = face == LEFT ? -1 : face == RIGHT ? 1 : 0;
                  float dy = face == UP ? -1 : face == DOWN ? 1 : 0;
                  if (!fromPlayer) {
                      float ddx = px - x, ddy = py - y;
                      float d = (float) Math.max(1, Math.sqrt(ddx * ddx + ddy * ddy));
                      dx = ddx / d; dy = ddy / d;
                  }
                  b.x = x + dx * 20;
                  b.y = y + dy * 10;
                  b.vx = dx * 520;
                  b.vy = dy * 520;
                  b.dur = 0.75f;
                  b.fromPlayer = fromPlayer;
                  b.owner = owner;
                  balls.add(b);
                  if (!fromPlayer) play(S_WHOOSH, 0.35f, 1.4f);
              }

              int faceToward(float x, float y, float tx, float ty) {
                  float dx = tx - x, dy = ty - y;
                  return Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? LEFT : RIGHT) : (dy < 0 ? UP : DOWN);
              }

              static float dist2(float x1, float y1, float x2, float y2) {
                  float dx = x1 - x2, dy = y1 - y2;
                  return dx * dx + dy * dy;
              }

              AppPeng nearestApp(List<AppPeng> list) {
                  AppPeng best = null;
                  float bd = NEAR_DIST * NEAR_DIST;
                  for (AppPeng a : list) {
                      float d = dist2(a.x, a.y, px, py);
                      if (d < bd) { bd = d; best = a; }
                  }
                  return best;
              }

              /** Non-penguin things you can use: the igloo door outside, furniture inside. */
              String nearObject() {
                  if (scene == SCENE_ISLAND) {
                      if (ezScene == SCENE_ISLAND && !ezFollow && dist2(px, py, ezX, ezY) < 60 * 60) return "ezio";
                      if (dist2(px, py, CD_X, CD_Y) < 70 * 70) return "cd";
                      return dist2(px, py, DOOR_X, DOOR_Y + 20) < 70 * 70 ? "door" : null;
                  }
                  if (ezScene == SCENE_IGLOO && !ezFollow && dist2(px, py, ezX, ezY) < 60 * 60) return "ezio";
                  if (py > 615 && Math.abs(px - 640) < 110) return "exit";
                  if (px < 400 && py < 520) return "tv";
                  if (px > 880 && py < 520) return "shelf";
                  if (Math.abs(px - 640) < 140 && py < 470) return "fire";
                  return null;
              }

              String objectLabel(String o) {
                  switch (o) {
                      case "door": return null;
                      case "exit": return null;
                      case "tv": return "Press OK for TV Settings";
                      case "shelf": return "Press OK for Island settings";
                      case "fire": return "Press OK to sit by the fire";
                      case "cd": return nowDisc != null ? "Press OK for the CD player" : "Press OK to open your CD folder";
                      default: return null;
                  }
              }

              // ================================================================== key handling

              void handleKey(int code, boolean repeat, List<AppPeng> list) {
                  if (pendingScene >= 0) return;
                  boolean ok = code == KeyEvent.KEYCODE_DPAD_CENTER || code == KeyEvent.KEYCODE_ENTER
                          || code == KeyEvent.KEYCODE_NUMPAD_ENTER || code == KeyEvent.KEYCODE_BUTTON_A;
                  boolean back = code == KeyEvent.KEYCODE_BACK || code == KeyEvent.KEYCODE_BUTTON_B;
                  boolean menu = code == KeyEvent.KEYCODE_INFO || code == KeyEvent.KEYCODE_MENU
                          || code == KeyEvent.KEYCODE_GUIDE || code == KeyEvent.KEYCODE_BUTTON_Y
                          || code == KeyEvent.KEYCODE_BUTTON_START;
                  idleT = 0;
                  afkT = 0;
                  if (pEmote == E_NAP || pEmote == E_SIT || pEmote == E_LOOK) {
                      if (overlay == OV_NONE) pEmote = E_NONE;
                  }

                  if (overlay == OV_WHEEL) {
                      if (back || menu) { overlay = OV_NONE; play(S_TICK, 0.4f, 0.8f); return; }
                      if (code == KeyEvent.KEYCODE_DPAD_RIGHT || code == KeyEvent.KEYCODE_DPAD_DOWN) {
                          wheelSel = (wheelSel + 1) % WN; play(S_TICK, 0.4f, 1f);
                      } else if (code == KeyEvent.KEYCODE_DPAD_LEFT || code == KeyEvent.KEYCODE_DPAD_UP) {
                          wheelSel = (wheelSel + WN - 1) % WN; play(S_TICK, 0.4f, 1f);
                      } else if (ok) {
                          overlay = OV_NONE;
                          wheelAction(wheelSel);
                      }
                      return;
                  }
                  if (overlay == OV_FOLDER) {
                      if (folderClosing) return;
                      int n = discs.size();
                      if (back) { closeFolder(nowDisc != null ? this::openPlayer : null); return; }
                      int total = folderSlots();
                      folderSel = Math.max(0, Math.min(total - 1, folderSel));
                      int page = folderSel / 8, slot = folderSel % 8;
                      int col = (slot % 4) % 2 + (slot >= 4 ? 2 : 0), row = (slot % 4) / 2;
                      int target = -1;
                      if (code == KeyEvent.KEYCODE_DPAD_RIGHT) target = col < 3 ? slotIndex(page, col + 1, row) : slotIndex(page + 1, 0, row);
                      else if (code == KeyEvent.KEYCODE_DPAD_LEFT) target = col > 0 ? slotIndex(page, col - 1, row) : (page > 0 ? slotIndex(page - 1, 3, row) : -1);
                      else if (code == KeyEvent.KEYCODE_DPAD_DOWN && row == 0) target = slotIndex(page, col, 1);
                      else if (code == KeyEvent.KEYCODE_DPAD_UP && row == 1) target = slotIndex(page, col, 0);
                      if (target >= 0 && target < total && target != folderSel) {
                          boolean flip = target / 8 != page;
                          if (flip) { flipFrom = page; flipDir = target / 8 > page ? 1 : -1; flipT = 0.001f; }
                          folderSel = target;
                          play(flip ? S_WHOOSH : S_TICK, flip ? 0.35f : 0.35f, flip ? 1.6f : 1.05f);
                          return;
                      }
                      if (folderSel >= n) {
                          if (ok && !repeat) play(S_TICK, 0.3f, 0.7f);   // empty sleeve
                          return;
                      }
                      if (ok && !repeat) {
                          final Disc d = discs.get(folderSel);
                          play(S_OPEN, 0.45f, 1f);
                          closeFolder(() -> playDisc(d, -1));
                          return;
                      }
                      if (menu) { openDiscMenu(discs.get(folderSel)); return; }
                      return;
                  }
                  if (overlay == OV_PLAYER) {
                      if (back || menu) { overlay = OV_NONE; play(S_TICK, 0.4f, 0.8f); return; }
                      // The volume slider stands on the left: Left from the first button reaches it, Up/Down set it, Right goes back
                      if (playerRow == 1) {
                          if (code == KeyEvent.KEYCODE_DPAD_UP || code == KeyEvent.KEYCODE_DPAD_DOWN) {
                              setCdVolume(cdVolume + (code == KeyEvent.KEYCODE_DPAD_UP ? 0.05f : -0.05f));
                              play(S_TICK, 0.3f * cdVolume + 0.05f, 0.8f + cdVolume * 0.6f);
                          } else if (code == KeyEvent.KEYCODE_DPAD_RIGHT) { playerRow = 0; playerSel = 0; play(S_TICK, 0.35f, 1.1f); }
                          return;
                      }
                      if (code == KeyEvent.KEYCODE_DPAD_LEFT && playerSel == 0) { playerRow = 1; play(S_TICK, 0.35f, 0.9f); return; }
                      if (code == KeyEvent.KEYCODE_DPAD_RIGHT) { playerSel = Math.min(PLAYER_BTNS.length - 1, playerSel + 1); play(S_TICK, 0.35f, 1f); }
                      else if (code == KeyEvent.KEYCODE_DPAD_LEFT) { playerSel = Math.max(0, playerSel - 1); play(S_TICK, 0.35f, 1f); }
                      else if (ok && !repeat) {
                          switch (playerSel) {
                              case 0: radioSkip(-1); break;
                              case 1: radioToggle(); break;
                              case 2: radioSkip(1); break;
                              case 3: setShuffle(!shuffleOn); break;
                              case 4: overlay = OV_NONE; openFolder(); break;
                              case 5: if (nowDisc != null) openSongList(nowDisc, () -> { overlay = OV_PLAYER; }); break;
                              case 6: stopRadio(); overlay = OV_NONE; play(S_TOGGLE, 0.45f, 0.7f); break;
                          }
                          if (nowDisc == null && overlay == OV_PLAYER) overlay = OV_NONE;
                      }
                      return;
                  }
                  if (overlay == OV_LIST) {
                      if (back) {
                          play(S_TICK, 0.4f, 0.8f);
                          if (listOnBack != null) listOnBack.run(); else overlay = OV_NONE;
                          return;
                      }
                      if (code == KeyEvent.KEYCODE_DPAD_DOWN) { listSel = Math.min(listItems.size() - 1, listSel + 1); play(S_TICK, 0.3f, 1f); }
                      else if (code == KeyEvent.KEYCODE_DPAD_UP) { listSel = Math.max(0, listSel - 1); play(S_TICK, 0.3f, 1f); }
                      else if (ok && !repeat && listSel < listItems.size()) {
                          Runnable r = listItems.get(listSel).action;
                          if (r != null) r.run();
                      }
                      return;
                  }

                  if (scene == SCENE_FIRE) {
                      if (back || ok) goScene(SCENE_IGLOO);
                      return;
                  }
                  if (launching != null || sittingChair != null) return;
                  if (back) {
                      if (scene == SCENE_IGLOO) { goScene(SCENE_ISLAND); return; }
                      runOnUiThread(this::finish);
                      return;
                  }
                  if (menu) { openWheel(); return; }
                  if (code == KeyEvent.KEYCODE_BUTTON_X) { doSnowball(); return; }
                  if (code == KeyEvent.KEYCODE_BUTTON_L1) { startEmote(E_WAVE, 1.8f); return; }
                  if (code == KeyEvent.KEYCODE_BUTTON_R1) { startEmote(E_DANCE, 3.2f); return; }
                  if (ok) {
                      if (scene == SCENE_ISLAND) {
                          Object tgt = nearestTarget(list);
                          if (tgt instanceof AppPeng) {
                              launching = (AppPeng) tgt; launchT = 0;
                              pEmote = E_NONE;
                              play(S_OPEN, 0.5f, 1f);
                              return;
                          }
                          if (tgt instanceof Chair) {
                              Chair ch = (Chair) tgt;
                              sittingChair = ch;
                              chairT = 0;
                              px = ch.x; py = ch.y + 1; facing = DOWN;
                              pEmote = E_SIT; pEmoteT = 0; pEmoteDur = 0;
                              play(S_OPEN, 0.5f, 0.85f);
                              return;
                          }
                      }
                      String o = nearObject();
                      if (o != null) { useObject(o); return; }
                      // OK in open space does nothing; the (i) / Info button opens the wheel
                  }
              }

              void openWheel() {
                  overlay = OV_WHEEL;
                  pEmote = E_NONE;
                  play(S_TICK, 0.45f, 1.2f);
              }

              void wheelAction(int i) {
                  switch (i) {
                      case 0: startEmote(E_WAVE, 1.8f); break;
                      case 1: startEmote(E_DANCE, 3.2f); break;
                      case 2: doHug(); break;
                      case 3: doSnowball(); break;
                      case 4: startEmote(E_SLIDE, 1.1f); break;
                      case 5:
                          if (nowDisc != null) openPlayer();
                          else toast("No disc playing. Walk over to the boombox to put one on.");
                          break;
                      case 6: toggleEzio(); break;
                      case 7: blowWhistle(); break;
                      case 8: openAppsList(null); break;
                      case 9: openSettings(); break;
                      case 10: setMusic(!musicOn); break;
                  }
              }

              /** Two penguins step in and hug. */
              /**
               * Blow the whistle: every penguin rushes over and stands in a loose circle around you for
               * a few seconds, so you can pick one; then they all go back to what they were doing.
               */
              void blowWhistle() {
                  if (scene != SCENE_ISLAND) { toast("The penguins can't hear you in here"); return; }
                  List<AppPeng> list = apps;
                  int n = list.size();
                  if (n == 0) return;
                  play(S_WHISTLE, 0.55f, 1f);
                  rallyT = 9f;
                  float rx = Math.max(210, n * 15), ry = rx * 0.6f;
                  for (int k = 0; k < n; k++) {
                      AppPeng a = list.get(k);
                      if (a.chatWith != null) endChat(a);
                      if (a.joinOf != null) leaveGroup(a);
                      a.hugWalk = false;
                      double ang = Math.PI * 2 * k / n - Math.PI / 2;
                      float gx = px + (float) Math.cos(ang) * rx, gy = py + (float) Math.sin(ang) * ry;
                      float ex = (gx - CX) / (RX - 50), ey = (gy - CY) / (RY - 45);
                      float e = ex * ex + ey * ey;
                      if (e > 1) { float kk = (float) (1 / Math.sqrt(e)); gx = CX + (gx - CX) * kk; gy = CY + (gy - CY) * kk; }
                      float ix = (gx - IGLOO_X) / 150f, iy = (gy - (IGLOO_Y - 22)) / 50f;
                      if (ix * ix + iy * iy < 1) gy = gy < IGLOO_Y - 22 ? IGLOO_Y - 85 : IGLOO_Y + 45;
                      a.rallyX = gx; a.rallyY = gy;
                      a.emote = E_NONE;
                  }
              }

              void hugPair(AppPeng a, AppPeng o) {
                  AppPeng l = a.x <= o.x ? a : o, r = l == a ? o : a;
                  float mx = (l.x + r.x) / 2, my = (l.y + r.y) / 2;
                  l.hugX = mx - 19; r.hugX = mx + 19;
                  l.hugY = r.hugY = my;
                  l.facing = RIGHT; r.facing = LEFT;
                  a.speaking = o.speaking = false;
                  a.bubble = o.bubble = null;
                  npcEmote(l, E_HUG, 2.4f, 0);
                  npcEmote(r, E_HUG, 2.4f, 0);
                  endChatAfterHug(a);
              }

              void endChatAfterHug(AppPeng a) {
                  AppPeng o = a.chatWith;
                  a.chatWith = null; a.chatTalking = false; a.arrived = false;
                  if (o != null) { o.chatWith = null; o.chatTalking = false; o.arrived = false; o.speaking = false; o.bubble = null; }
                  for (AppPeng q : new AppPeng[]{a, o}) {
                      if (q == null) continue;
                      q.tx = q.hx + (rnd.nextFloat() - 0.5f) * 60;
                      q.ty = q.hy + (rnd.nextFloat() - 0.5f) * 40;
                      q.wait = 1.5f;
                  }
              }

              /** You hug the nearest penguin. */
              void doHug() {
                  if (scene != SCENE_ISLAND) return;
                  AppPeng best = null;
                  float bd = 170 * 170;
                  for (AppPeng a : apps) {
                      float d = dist2(a.x, a.y, px, py);
                      if (d < bd) { bd = d; best = a; }
                  }
                  if (best == null) { toast("Walk up to a penguin first, then hug"); return; }
                  if (best.chatWith != null) endChat(best);
                  // They waddle over to you, then the hug starts
                  boolean onRight = best.x >= px;
                  facing = onRight ? RIGHT : LEFT;
                  best.hugX = px + (onRight ? 40 : -40);
                  best.hugY = py;
                  best.hugWalk = true;
                  best.emote = E_NONE;
                  play(S_CHIRP, 0.2f, 1.05f);
              }

              void spawnHeart(float x, float y) {
                  Part q = part(x + (rnd.nextFloat() - 0.5f) * 16, y, true);
                  q.vx = (rnd.nextFloat() - 0.5f) * 20;
                  q.vy = -40;
                  q.max = q.life = 1.3f;
                  q.glyph = "♥";
                  q.size = 18 + rnd.nextFloat() * 6;
                  q.color = rnd.nextBoolean() ? 0xffe91e63 : 0xffff80ab;
              }

              void doSnowball() {
                  if (scene != SCENE_ISLAND) return;
                  startEmote(E_THROW, 0.45f);
              }

              void useObject(String o) {
                  switch (o) {
                      case "door": play(S_DOOR, 0.5f, 1f); goScene(SCENE_IGLOO); break;
                      case "exit": play(S_DOOR, 0.5f, 0.9f); goScene(SCENE_ISLAND); break;
                      case "tv": play(S_OPEN, 0.5f, 0.9f); startIntent(new Intent(Settings.ACTION_SETTINGS), "Settings"); break;
                      case "shelf": openSettings(); break;
                      case "fire": play(S_DOOR, 0.3f, 1.3f); goScene(SCENE_FIRE); break;
                      case "ezio": petEzio(); break;
                      case "cd":
                          facing = faceToward(px, py, CD_X, CD_Y);
                          if (nowDisc != null) openPlayer(); else openFolder();
                          break;
                  }
              }

              void goScene(int s) {
                  pendingScene = s;
                  fadingOut = true;
                  pEmote = E_NONE;
              }

              void enterScene(int s) {
                  parts.clear();
                  lastCamX = -1;
                  if (s == SCENE_FIRE) {
                      fireHintT = 0;
                      startFireEzio();
                      parts.clear();
                      startCrackle();
                  } else if (s == SCENE_IGLOO) {
                      if (scene == SCENE_FIRE) {
                          stopCrackle();
                          parts.clear();
                          px = 640; py = 455; facing = UP;
                          pEmote = E_SIT; pEmoteT = 0; pEmoteDur = 0;
                      } else {
                          islandX = px; islandY = py;
                          px = 640; py = 640; facing = UP;
                      }
                  } else {
                      px = DOOR_X; py = DOOR_Y + 40; facing = DOWN;
                  }
                  int from = scene;
                  scene = s;
                  lastNearKey = "";
                  ezioSceneChange(from, s);
              }

              // ================================================================== Ezio the cat

              /** The scene Ezio cares about: the fullscreen fire counts as being inside the igloo. */
              int ezPlayerScene() {
                  return scene == SCENE_FIRE ? SCENE_IGLOO : scene;
              }

              void ezioSceneChange(int from, int to) {
                  int pf = from == SCENE_FIRE ? SCENE_IGLOO : from, pt = to == SCENE_FIRE ? SCENE_IGLOO : to;
                  if (pf == pt) return;
                  if (ezFollow) {
                      // He comes along, right behind you
                      ezScene = pt;
                      if (pt == SCENE_IGLOO) { ezX = 600; ezY = 660; } else { ezX = DOOR_X - 40; ezY = DOOR_Y + 60; }
                      ezTX = ezX; ezTY = ezY;
                      ezSleeping = false;
                      return;
                  }
                  if (pt == SCENE_IGLOO && ezScene == SCENE_ISLAND) {
                      // Maybe he'll wander in after a while
                      ezVisitT = rnd.nextFloat() < 0.5f ? 15 + rnd.nextFloat() * 30 : -1;
                  } else if (pt == SCENE_ISLAND && ezScene == SCENE_IGLOO) {
                      // He stays by the fire for a bit, then comes back out
                      ezReturnT = 10 + rnd.nextFloat() * 20;
                  }
              }

              void toggleEzio() {
                  ezFollow = !ezFollow;
                  prefs.edit().putBoolean("ezfollow", ezFollow).apply();
                  int ps = ezPlayerScene();
                  if (ezFollow) {
                      if (ezScene != ps) {
                          // He trots in from nearby
                          ezScene = ps;
                          if (ps == SCENE_IGLOO) { ezX = 640; ezY = 700; }
                          else { ezX = px + (rnd.nextBoolean() ? 380 : -380); ezY = py + 60; }
                      }
                      ezSleeping = false;
                      ezLeaving = false;
                      ezVisiting = false;
                      ezHappyT = 1.2f;
                      play(S_CHIRP, 0.22f, 0.62f);
                      toast("Ezio is following you");
                  } else {
                      ezWait = 1.5f;
                      if (ezScene == SCENE_IGLOO) { ezVisiting = true; ezStayT = 60 + rnd.nextFloat() * 60; }
                      play(S_CHIRP, 0.15f, 0.55f);
                      toast("Ezio wanders off to do cat things");
                  }
              }

              void petEzio() {
                  ezSleeping = false;
                  ezHappyT = 1.6f;
                  ezFacing = px < ezX ? LEFT : RIGHT;
                  ezWait = 3;
                  play(S_CHIRP, 0.2f, 0.6f);
                  for (int i = 0; i < 4; i++) spawnHeart(ezX + (rnd.nextFloat() - 0.5f) * 20, ezY - 40);
              }

              void updateEzio(float dt) {
                  int ps = ezPlayerScene();
                  ezPhase += dt * (ezMoving ? 13f : 2f);
                  ezHappyT = Math.max(0, ezHappyT - dt);
                  ezNextBlink -= dt;
                  if (ezNextBlink <= 0) { ezBlinkT = 0.15f; ezNextBlink = 2.5f + rnd.nextFloat() * 4; }
                  ezBlinkT = Math.max(0, ezBlinkT - dt);
                  if (ezStareT > 0) {
                      // Slow blinks during a stare-off: Ezio first, the penguin a beat later
                      ezStareT -= dt;
                      float t = 3.4f - ezStareT;
                      boolean ezClosed = (t > 0.9f && t < 1.45f) || (t > 2.3f && t < 2.85f);
                      boolean pgClosed = (t > 1.15f && t < 1.7f) || (t > 2.45f && t < 3.0f);
                      ezNextBlink = Math.max(ezNextBlink, 1f);
                      if (ezClosed) ezBlinkT = 0.05f;
                      AppPeng a = ezStarePeng;
                      if (a != null) {
                          a.facing = faceToward(a.x, a.y, ezX, ezY);
                          a.nextBlink = Math.max(a.nextBlink, 1f);
                          if (pgClosed) a.blinkT = 0.05f;
                          a.wait = Math.max(a.wait, 0.5f);
                      }
                      if (ezStareT <= 0) ezStarePeng = null;
                  }

                  if (ezScene != ps) {
                      // Off-screen: he might show up in your scene
                      if (ps == SCENE_IGLOO && ezVisitT > 0) {
                          ezVisitT -= dt;
                          if (ezVisitT <= 0) {
                              ezScene = SCENE_IGLOO; ezX = 640; ezY = 705;
                              ezVisiting = true; ezLeaving = false; ezSleeping = false;
                              ezStayT = 45 + rnd.nextFloat() * 55;
                              ezGoBed = true;
                              if (rnd.nextBoolean()) { ezTX = ROOM_BED_X; ezTY = ROOM_BED_Y + 2; }
                              else { ezTX = CUSHION_X; ezTY = CUSHION_Y; }
                              ezWait = 0;
                          }
                      } else if (ps == SCENE_ISLAND && ezReturnT > 0) {
                          ezReturnT -= dt;
                          if (ezReturnT <= 0) {
                              ezScene = SCENE_ISLAND; ezX = DOOR_X; ezY = DOOR_Y + 40;
                              ezVisiting = false; ezLeaving = false; ezSleeping = false;
                              ezWait = 0; ezTX = ezX + 80; ezTY = ezY + 60;
                          }
                      }
                      ezMoving = false;
                      return;
                  }

                  boolean inside = ezScene == SCENE_IGLOO;
                  ezMoving = false;
                  if (ezFollow) {
                      ezSleeping = false;
                      ezPeng = null;
                      ezRun = false;
                      float behind = facing == LEFT ? 55 : facing == RIGHT ? -55 : (ezX < px ? -45 : 45);
                      float tx = px + behind, ty = py + (facing == UP ? 40 : 8);
                      float dx = tx - ezX, dy = ty - ezY, d = (float) Math.sqrt(dx * dx + dy * dy);
                      if (d > 28) {
                          float sp = d > 300 ? 340 : d > 120 ? 250 : 170;
                          ezStep(dx / d, dy / d, Math.min(d, sp * dt), inside);
                      } else if (rnd.nextFloat() < dt * 0.3f) {
                          ezFacing = px < ezX ? LEFT : RIGHT;
                      }
                      return;
                  }
                  if (inside && ezVisiting) {
                      ezStayT -= dt;
                      if (ezStayT <= 0 && !ezLeaving) {
                          ezLeaving = true; ezSleeping = false;
                          ezTX = 640; ezTY = 700; ezWait = 0;
                      }
                  }
                  if (ezSleeping) {
                      ezSleepT -= dt;
                      if (ezSleepT <= 0) { ezSleeping = false; ezWait = 1 + rnd.nextFloat() * 2; }
                      return;
                  }
                  if (ezWait > 0) { ezWait -= dt; return; }
                  if (ezPeng != null && !inside) {
                      // keep heading for the penguin he picked
                      ezTX = ezPeng.x + (ezX < ezPeng.x ? -34 : 34);
                      ezTY = ezPeng.y + 4;
                  }
                  float dx = ezTX - ezX, dy = ezTY - ezY, d = (float) Math.sqrt(dx * dx + dy * dy);
                  if (d > 3) {
                      ezStep(dx / d, dy / d, Math.min(d, (ezRun ? 240 : 95) * dt), inside);
                      return;
                  }
                  if (ezRun) {
                      // caught the snowball!
                      ezRun = false;
                      ezHappyT = 1.2f;
                      ezWait = 2 + rnd.nextFloat() * 2;
                      splat(ezX + (ezFacing == LEFT ? -12 : 12), ezY - 6);
                      return;
                  }
                  if (ezPeng != null && !inside) {
                      AppPeng a = ezPeng;
                      ezPeng = null;
                      ezFacing = a.x < ezX ? LEFT : RIGHT;
                      a.facing = faceToward(a.x, a.y, ezX, ezY);
                      a.wait = 2.5f;
                      float roll = rnd.nextFloat();
                      if (roll < 0.4f) {
                          // a pat on the head
                          npcEmote(a, E_WAVE, 1.6f, 0);
                          ezHappyT = 1.8f;
                          ezWait = 2.5f;
                          play(S_CHIRP, 0.12f, 0.6f);
                      } else if (roll < 0.75f) {
                          // the penguin tosses a snowball and Ezio runs after it
                          double ang = Math.atan2(a.y - ezY, a.x - ezX) + (rnd.nextDouble() - 0.5) * 1.6;
                          float lx = a.x + (float) Math.cos(ang) * 230, ly = a.y + (float) Math.sin(ang) * 140;
                          float ex = (lx - CX) / (RX - 60), ey = (ly - CY) / (RY - 60);
                          float e = ex * ex + ey * ey;
                          if (e > 1) { float k = (float) (1 / Math.sqrt(e)); lx = CX + (lx - CX) * k; ly = CY + (ly - CY) * k; }
                          a.facing = faceToward(a.x, a.y, lx, ly);
                          npcEmote(a, E_THROW, 0.45f, 0);
                          Ball b = new Ball();
                          b.x = a.x; b.y = a.y;
                          b.dur = 0.75f;
                          b.vx = (lx - a.x) / b.dur; b.vy = (ly - a.y) / b.dur;
                          b.toy = true;
                          b.owner = a;
                          balls.add(b);
                          play(S_WHOOSH, 0.3f, 1.4f);
                          ezTX = lx; ezTY = ly;
                          ezRun = true;
                          ezWait = 0.3f;
                      } else {
                          // a stare-off, with slow, deliberate blinks
                          ezWait = 3.4f;
                          a.wait = 3.8f;
                          ezStareT = 3.4f;
                          ezStarePeng = a;
                      }
                      return;
                  }
                  // Arrived somewhere
                  if (inside && ezLeaving) {
                      // Out the door he goes
                      ezScene = SCENE_ISLAND; ezX = DOOR_X; ezY = DOOR_Y + 40;
                      ezLeaving = false; ezVisiting = false;
                      ezTX = ezX + 60; ezTY = ezY + 70; ezWait = 0;
                      return;
                  }
                  if (inside && !ezGoBed && rnd.nextFloat() < 0.5f) {
                      // nap time: his bed on the hearth, or the cushion on the other side
                      ezGoBed = true;
                      if (rnd.nextBoolean()) { ezTX = ROOM_BED_X; ezTY = ROOM_BED_Y + 2; }
                      else { ezTX = CUSHION_X; ezTY = CUSHION_Y; }
                      return;
                  }
                  if (ezGoBed) {
                      ezGoBed = false;
                      ezSleeping = true;
                      ezSleepT = inside ? 25 + rnd.nextFloat() * 30 : 12 + rnd.nextFloat() * 20;
                      return;
                  }
                  ezWait = 2 + rnd.nextFloat() * 4;
                  if (!inside && rnd.nextFloat() < 0.3f) {
                      AppPeng best = null;
                      float bd = 380 * 380;
                      for (AppPeng a : apps) {
                          if (a.emote != E_NONE || a.chatWith != null || a.hugWalk) continue;
                          float dd = dist2(a.x, a.y, ezX, ezY);
                          if (dd < bd && rnd.nextFloat() < 0.6f) { bd = dd; best = a; }
                      }
                      if (best != null) { ezPeng = best; return; }
                  }
                  if (inside) {
                      ezTX = 520 + rnd.nextFloat() * 240; ezTY = 460 + rnd.nextFloat() * 70;
                  } else if (rnd.nextFloat() < 0.3f) {
                      ezGoBed = true; ezTX = BED_X; ezTY = BED_Y + 2;
                  } else {
                      double a = rnd.nextDouble() * Math.PI * 2;
                      float r = 60 + rnd.nextFloat() * 170;
                      ezTX = BED_X + (float) Math.cos(a) * r; ezTY = BED_Y + (float) Math.sin(a) * r * 0.6f;
                  }
              }

              /** One step for Ezio, kept on the island (and off the igloo and boombox) or inside the room. */
              void ezStep(float ux, float uy, float len, boolean inside) {
                  float nx = ezX + ux * len, ny = ezY + uy * len;
                  if (inside) {
                      nx = Math.max(170, Math.min(1110, nx));
                      ny = Math.max(nx > 780 && nx < 900 ? 300 : nx > 380 && nx < 900 ? 345 : 400, Math.min(705, ny));
                  } else {
                      float ex = (nx - CX) / (RX - 45), ey = (ny - CY) / (RY - 40);
                      float e = ex * ex + ey * ey;
                      if (e > 1) { float k = (float) (1 / Math.sqrt(e)); nx = CX + (nx - CX) * k; ny = CY + (ny - CY) * k; }
                      float ix = (nx - IGLOO_X) / 136f, iy = (ny - (IGLOO_Y - 22)) / 36f;
                      float ie = ix * ix + iy * iy;
                      if (ie < 1) { float k = (float) (1 / Math.sqrt(Math.max(ie, 0.0001f))); nx = IGLOO_X + (nx - IGLOO_X) * k; ny = (IGLOO_Y - 22) + (ny - (IGLOO_Y - 22)) * k; }
                  }
                  if (Math.abs(ux) > 0.2f) ezFacing = ux < 0 ? LEFT : RIGHT;
                  ezX = nx; ezY = ny;
                  ezMoving = true;
              }

              /**
               * Ezio: a round, fluffy black cat with a little head, stubby legs, a big fluffy tail and big
               * derpy eyes. At Christmas he's wrapped in lights with a star on his head.
               */
              void drawEzio(Canvas c, float x, float y, float s, int face, boolean moving, boolean sleeping, float phase, boolean blink, int season) {
                  final int FUR = 0xff16141b, FUR2 = 0xff24212b;
                  c.save();
                  c.translate(x, y);
                  c.scale(face == LEFT ? -s : s, s);
                  p.setColor(0x30000000);
                  c.drawOval(-22, -5, 22, 5, p);
                  float bob = moving ? (float) Math.abs(Math.sin(phase)) * 2.5f : (float) Math.sin(phase * 0.6f) * 0.8f;
                  if (sleeping) {
                      // curled-up loaf with the tail wrapped round
                      p.setColor(FUR);
                      c.drawOval(-20, -20, 20, 0, p);
                      for (int i = 0; i < 10; i++) {
                          double a = Math.PI + Math.PI * i / 9.0;
                          c.drawCircle((float) Math.cos(a) * 19, -10 + (float) Math.sin(a) * 9, 4.2f, p);
                      }
                      c.drawOval(-24, -9, 8, 2, p);
                      c.drawCircle(12, -13, 9, p);
                      path.reset();
                      path.moveTo(6, -19); path.lineTo(9, -27); path.lineTo(13, -20); path.close();
                      path.moveTo(13, -20); path.lineTo(18, -27); path.lineTo(20, -17); path.close();
                      c.drawPath(path, p);
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(1.6f);
                      p.setColor(0xfff2f2f2);
                      c.drawLine(9, -13, 13, -13, p);
                      c.drawLine(15, -13, 19, -13, p);
                      p.setStyle(Paint.Style.FILL);
                      if (season == SEASON_XMAS) ezLights(c, true);
                      c.restore();
                      if (rnd.nextFloat() < 0.012f) spawnZ(x + 10, y - 30);
                      return;
                  }
                  c.translate(0, -bob);
                  // fluffy tail curling up behind
                  float sway = (float) Math.sin(phase * (moving ? 0.6f : 0.35f)) * 6;
                  p.setColor(FUR);
                  for (int i = 0; i < 9; i++) {
                      float t = i / 8f;
                      float tx = -16 - t * 12 + (float) Math.sin(t * 3) * 4, ty = -12 - t * 26;
                      c.drawCircle(tx + sway * t, ty, 5 + t * 3.5f, p);
                  }
                  // stubby legs
                  float lift = moving ? (float) Math.sin(phase) * 2.5f : 0;
                  p.setColor(FUR);
                  rf.set(-13, -9 - Math.max(0, lift), -6, 1 - Math.max(0, lift)); c.drawRoundRect(rf, 3, 3, p);
                  rf.set(6, -9 - Math.max(0, -lift), 13, 1 - Math.max(0, -lift)); c.drawRoundRect(rf, 3, 3, p);
                  p.setColor(FUR2);
                  rf.set(-4, -9 - Math.max(0, -lift), 3, 0 - Math.max(0, -lift)); c.drawRoundRect(rf, 3, 3, p);
                  // round fluffy body
                  p.setColor(FUR);
                  c.drawCircle(0, -20, 16, p);
                  for (int i = 0; i < 14; i++) {
                      double a = Math.PI * 2 * i / 14.0;
                      float j = (i % 3) * 0.8f;
                      c.drawCircle((float) Math.cos(a) * (15 + j), -20 + (float) Math.sin(a) * (15 + j), 3.6f, p);
                  }
                  // small head on top, a bit forward
                  float hx = 6, hy = -38;
                  c.drawCircle(hx, hy, 10, p);
                  for (int i = 0; i < 8; i++) {
                      double a = Math.PI * 2 * i / 8.0;
                      c.drawCircle(hx + (float) Math.cos(a) * 9.5f, hy + (float) Math.sin(a) * 9.5f, 2.6f, p);
                  }
                  path.reset();
                  path.moveTo(hx - 9, hy - 4); path.lineTo(hx - 7, hy - 17); path.lineTo(hx - 1, hy - 8); path.close();
                  path.moveTo(hx + 2, hy - 8); path.lineTo(hx + 9, hy - 17); path.lineTo(hx + 10, hy - 3); path.close();
                  c.drawPath(path, p);
                  p.setColor(0xffd88a9a);
                  path.reset();
                  path.moveTo(hx - 7.5f, hy - 6); path.lineTo(hx - 6.5f, hy - 13); path.lineTo(hx - 3, hy - 8); path.close();
                  path.moveTo(hx + 4, hy - 8); path.lineTo(hx + 8, hy - 13); path.lineTo(hx + 8.5f, hy - 5); path.close();
                  c.drawPath(path, p);
                  // big derpy eyes
                  if (blink) {
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(1.6f);
                      p.setColor(0xfff2f2f2);
                      c.drawLine(hx - 7, hy, hx - 1, hy, p);
                      c.drawLine(hx + 2, hy, hx + 8, hy, p);
                      p.setStyle(Paint.Style.FILL);
                  } else {
                      p.setColor(0xffffffff);
                      c.drawCircle(hx - 4, hy, 4.4f, p);
                      c.drawCircle(hx + 5, hy, 4.4f, p);
                      p.setColor(0xff111111);
                      c.drawCircle(hx - 3.2f, hy + 0.6f, 1.9f, p);
                      c.drawCircle(hx + 5.6f, hy - 0.2f, 1.9f, p);
                  }
                  // whiskers
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(0.8f);
                  p.setColor(0x88ffffff);
                  c.drawLine(hx + 8, hy + 4, hx + 16, hy + 2, p);
                  c.drawLine(hx + 8, hy + 5, hx + 16, hy + 6, p);
                  c.drawLine(hx - 6, hy + 4, hx - 14, hy + 2, p);
                  p.setStyle(Paint.Style.FILL);
                  if (season == SEASON_XMAS) {
                      ezLights(c, false);
                      p.setColor(0xffe53935);
                      drawStar(c, hx, hy - 16, 6);
                  }
                  c.restore();
                  if (ezHappyT > 0 && rnd.nextFloat() < 0.15f) spawnHeart(x, y - 52 * s);
              }

              /** A string of twinkling Christmas lights wrapped around Ezio. */
              void ezLights(Canvas c, boolean loaf) {
                  float[][] spots = loaf
                          ? new float[][]{{-14, -8}, {-6, -14}, {3, -9}, {-10, -2}, {12, -6}}
                          : new float[][]{{-11, -26}, {-3, -31}, {7, -27}, {12, -20}, {-13, -14}, {-4, -10}, {6, -12}};
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(0.9f);
                  p.setColor(0xff3a3a3a);
                  path.reset();
                  for (int i = 0; i < spots.length; i++) {
                      if (i == 0) path.moveTo(spots[i][0], spots[i][1]); else path.lineTo(spots[i][0], spots[i][1]);
                  }
                  c.drawPath(path, p);
                  p.setStyle(Paint.Style.FILL);
                  for (int i = 0; i < spots.length; i++) {
                      int col = LIGHT_COLS[i % LIGHT_COLS.length];
                      boolean on = ((int) (time * 2.2f) + i) % 3 != 0;
                      p.setColor(on ? col : blend(col, 0xff000000, 0.5f));
                      c.drawCircle(spots[i][0], spots[i][1], 2.4f, p);
                  }
              }

