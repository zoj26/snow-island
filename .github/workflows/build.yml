# Snow Island - a walk-around home screen for Android TV.
# This one file holds the whole app. Every time you save a change to it,
# GitHub builds a new SnowIsland.apk and posts it under Releases.
name: Build Snow Island

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Write the app's files
        run: |
          mkdir -p app
          cat > app/settings.gradle <<'SNOW_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "SnowIsland"
          SNOW_EOF
          cat > app/build.gradle <<'SNOW_EOF'
          plugins {
              id 'com.android.application' version '8.5.2'
          }

          android {
              namespace 'com.josh.snowisland'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.josh.snowisland'
                  minSdk 26
                  targetSdk 34
                  versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
                  versionName "1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
              }

              signingConfigs {
                  stable {
                      storeFile file('../signing/snowisland.keystore')
                      storePassword 'snowisland'
                      keyAlias 'snowisland'
                      keyPassword 'snowisland'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.stable
                  }
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          SNOW_EOF
          cat > app/gradle.properties <<'SNOW_EOF'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          SNOW_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'SNOW_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:label="Snow Island"
                  android:icon="@drawable/icon"
                  android:banner="@drawable/banner"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="landscape"
                      android:configChanges="keyboard|keyboardHidden|navigation|orientation|screenSize|screenLayout|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          SNOW_EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/icon.xml <<'SNOW_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#2F78B8" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#F5FAFD" android:pathData="M4,80a50,22 0,1 0,100 0a50,22 0,1 0,-100 0z" />
              <path android:fillColor="#1B2230" android:pathData="M38,84a16,26 0,1 0,32 0a16,26 0,1 0,-32 0z" />
              <path android:fillColor="#1B2230" android:pathData="M42,52a12,12 0,1 0,24 0a12,12 0,1 0,-24 0z" />
              <path android:fillColor="#FAFCFF" android:pathData="M43,88a11,18 0,1 0,22 0a11,18 0,1 0,-22 0z" />
              <path android:fillColor="#FFFFFF" android:pathData="M45.5,50a3.5,3.5 0,1 0,7 0a3.5,3.5 0,1 0,-7 0zM55.5,50a3.5,3.5 0,1 0,7 0a3.5,3.5 0,1 0,-7 0z" />
              <path android:fillColor="#111111" android:pathData="M47.5,50.5a1.7,1.7 0,1 0,3.4 0a1.7,1.7 0,1 0,-3.4 0zM57.1,50.5a1.7,1.7 0,1 0,3.4 0a1.7,1.7 0,1 0,-3.4 0z" />
              <path android:fillColor="#FFA726" android:pathData="M50.5,55h7l-3.5,5z" />
              <path android:fillColor="#FF5252" android:pathData="M41,61h26v6h-26zM58,64h6v12h-6zM42,44a12,10 0,0 1,24 0z" />
              <path android:fillColor="#FFFFFF" android:pathData="M54,33a4,4 0,1 0,0.1 0z" />
          </vector>
          SNOW_EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/banner.xml <<'SNOW_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="320dp" android:height="180dp"
              android:viewportWidth="320" android:viewportHeight="180">
              <path android:fillColor="#2F78B8" android:pathData="M0,0h320v180h-320z" />
              <path android:fillColor="#F5FAFD" android:pathData="M20,150a140,34 0,1 0,280 0a140,34 0,1 0,-280 0z" />
              <path android:fillColor="#2E6B4A" android:pathData="M40,140l18,-40l18,40zM250,138l16,-36l16,36z" />
              <path android:fillColor="#FFFFFF" android:pathData="M50,118l8,-18l8,18zM259,118l7,-16l7,16z" />
              <path android:fillColor="#1B2230" android:pathData="M148,140a14,24 0,1 0,28 0a14,24 0,1 0,-28 0zM151,110a11,11 0,1 0,22 0a11,11 0,1 0,-22 0z" />
              <path android:fillColor="#FAFCFF" android:pathData="M152,144a10,16 0,1 0,20 0a10,16 0,1 0,-20 0z" />
              <path android:fillColor="#FFA726" android:pathData="M158,113h8l-4,5z" />
              <path android:fillColor="#FF5252" android:pathData="M150,119h24v5h-24zM151,103a11,9 0,0 1,22 0z" />
              <path android:fillColor="#FFFFFF" android:pathData="M155,108a2.5,2.5 0,1 0,5 0a2.5,2.5 0,1 0,-5 0zM164,108a2.5,2.5 0,1 0,5 0a2.5,2.5 0,1 0,-5 0z" />
          </vector>
          SNOW_EOF
          mkdir -p app/src/main/java/com/josh/snowisland
          cat > app/src/main/java/com/josh/snowisland/MainActivity.java <<'SNOW_EOF'
          package com.josh.snowisland;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.LinearGradient;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.RadialGradient;
          import android.graphics.Rect;
          import android.graphics.RectF;
          import android.graphics.Shader;
          import android.graphics.Typeface;
          import android.graphics.drawable.Drawable;
          import android.media.AudioAttributes;
          import android.media.MediaPlayer;
          import android.media.SoundPool;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.InputDevice;
          import android.view.KeyEvent;
          import android.view.MotionEvent;
          import android.view.SurfaceHolder;
          import android.view.SurfaceView;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Toast;

          import java.io.File;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Calendar;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.Iterator;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Random;
          import java.util.Set;
          import java.util.concurrent.ConcurrentLinkedQueue;

          /**
           * Snow Island: a home screen you walk around.
           * Your penguin waddles around a snowy island; every app is another penguin.
           * Walk up to one and press OK to open it. OK anywhere else opens the action wheel.
           */
          public class MainActivity extends Activity implements SurfaceHolder.Callback {

              // The game draws at 1280x720 and the TV scales it up. Much lighter on the chip than 4K.
              static final int VW = 1280, VH = 720;
              static final float WW = 2400, WH = 1600, CX = 1200, CY = 800, RX = 1050, RY = 680;
              static final float IGLOO_X = CX, IGLOO_Y = CY - 20;
              static final float DOOR_X = IGLOO_X, DOOR_Y = IGLOO_Y + 38;

              static final int DOWN = 0, UP = 1, LEFT = 2, RIGHT = 3;
              static final float PLAYER_SPEED = 230f;
              static final float NEAR_DIST = 95f;

              // Emotes / poses
              static final int E_NONE = 0, E_WAVE = 1, E_DANCE = 2, E_THROW = 3, E_SLIDE = 4, E_NAP = 5,
                      E_HOP = 6, E_FLAP = 7, E_LOOK = 8, E_SIT = 9, E_FLINCH = 10;

              static final int SCENE_ISLAND = 0, SCENE_IGLOO = 1;
              static final int OV_NONE = 0, OV_WHEEL = 1, OV_LIST = 2;

              static final int SEASON_NONE = 0, SEASON_XMAS = 1, SEASON_HALLOWEEN = 2, SEASON_VALENTINE = 3, SEASON_NEWYEAR = 4;
              static final String[] SEASON_PREF_NAMES = {"Auto", "Christmas", "Halloween", "Valentine's", "New Year", "Off"};

              // Sound ids
              static final int S_STEP = 0, S_CHIRP = 1, S_OPEN = 2, S_WHOOSH = 3, S_SPLAT = 4, S_TICK = 5, S_TOGGLE = 6, S_DOOR = 7;

              static final int[] SCARVES = {
                      0xffe53935, 0xff1e88e5, 0xff43a047, 0xfffdd835, 0xff8e24aa,
                      0xfffb8c00, 0xff00acc1, 0xffd81b60, 0xff6d4c41, 0xff3949ab,
                      0xff7cb342, 0xfff4511e
              };
              static final int PLAYER_SCARF = 0xffff5252;
              static final int[] LIGHT_COLS = {0xffe53935, 0xff43a047, 0xfffdd835, 0xff1e88e5, 0xffff80ab, 0xfffb8c00};

              static final String[] WHEEL_ICONS = {"👋", "🕺", "❄️", "🐧", "💤", "🙈", "⚙️", "🎵"};
              static final String[] WHEEL_NAMES = {"Wave", "Dance", "Snowball", "Belly slide", "Nap", "Apps", "Island settings", "Music"};

              static class AppPeng {
                  String pkg, label;
                  Intent intent;
                  Bitmap icon;
                  int scarf, launches;
                  float hx, hy, x, y, tx, ty, wait, phase;
                  int facing = DOWN;
                  boolean moving;
                  int emote;
                  float emoteT, emoteDur, emoteDelay;
                  float hitT, throwBackT;
                  float blinkT, nextBlink = 2f;
                  boolean placed;
              }

              static class Ball {
                  float x, y, vx, vy, t, dur;
                  boolean fromPlayer;
                  AppPeng owner;
              }

              static class Part {
                  float x, y, vx, vy, g, life, max, size;
                  int color;
                  String glyph;
                  boolean world;
              }

              static class Item {
                  String label, value;
                  Bitmap icon;
                  Runnable action;
                  Item(String label, String value, Bitmap icon, Runnable action) {
                      this.label = label; this.value = value; this.icon = icon; this.action = action;
                  }
              }

              SurfaceView view;
              SurfaceHolder holder;
              volatile boolean running, destroyed;
              Thread renderThread;
              final Object lock = new Object();

              // Input
              volatile boolean kUp, kDown, kLeft, kRight;
              volatile float axX, axY;
              final ConcurrentLinkedQueue<Integer> keyQueue = new ConcurrentLinkedQueue<>();
              static final int REPEAT_FLAG = 1 << 20;

              // Settings
              SharedPreferences prefs;
              boolean musicOn, soundOn, weatherFx;
              int seasonPref;
              final Set<String> hidden = new HashSet<>();

              // Scene + overlays
              int scene = SCENE_ISLAND, pendingScene = -1;
              float fade;            // 0..1 black fade during scene change
              boolean fadingOut;
              int overlay = OV_NONE;
              int wheelSel;
              String listTitle = "";
              final ArrayList<Item> listItems = new ArrayList<>();
              int listSel, listScroll;
              Runnable listOnBack;

              // Player
              float px = CX, py = CY + 130;
              float islandX = CX, islandY = CY + 130;
              int facing = DOWN;
              float walkPhase;
              boolean moving;
              int pEmote;
              float pEmoteT, pEmoteDur;
              float idleT, nextIdle = 7f, pHitT, pBlinkT, pNextBlink = 3f;
              float slideDX, slideDY;
              int lastStep;
              AppPeng lastNear;
              String lastNearKey = "";

              // World
              Bitmap world, room;
              volatile List<AppPeng> apps = new ArrayList<>();
              volatile List<AppPeng> allApps = new ArrayList<>();
              final Map<String, AppPeng> byPkg = new HashMap<>();
              float[] waveX, waveY, wavePh;
              float[] flX, flY, flSpd, flR;
              float[] stX, stY, stLen;
              final float[] trailX = new float[60], trailY = new float[60], trailAge = new float[60];
              final boolean[] trailSlide = new boolean[60];
              int trailHead;
              float trailDist;
              final ArrayList<Ball> balls = new ArrayList<>();
              final ArrayList<Part> parts = new ArrayList<>();
              float flash, nextFirework, nextHeart, nextZ;

              AppPeng launching;
              float launchT;
              float time;
              long lastNs;

              volatile Weather weather;

              // Audio
              SoundPool sounds;
              final int[] soundIds = new int[8];
              MediaPlayer music;
              volatile boolean resumed;

              final Random rnd = new Random();
              final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              final Paint tp = new Paint(Paint.ANTI_ALIAS_FLAG);
              final Path path = new Path();
              final RectF rf = new RectF();
              final Rect src = new Rect(), dst = new Rect();
              final ArrayList<Object> drawList = new ArrayList<>();
              final SimpleDateFormat timeFmt = new SimpleDateFormat("h:mm", Locale.getDefault());
              final SimpleDateFormat dateFmt = new SimpleDateFormat("EEE, MMM d", Locale.getDefault());

              // ================================================================== lifecycle

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN
                          | WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  prefs = getSharedPreferences("island", MODE_PRIVATE);
                  musicOn = prefs.getBoolean("music", true);
                  soundOn = prefs.getBoolean("sound", true);
                  weatherFx = prefs.getBoolean("weatherfx", true);
                  seasonPref = prefs.getInt("season", 0);
                  hidden.addAll(prefs.getStringSet("hidden", new HashSet<String>()));

                  view = new SurfaceView(this);
                  holder = view.getHolder();
                  holder.setFixedSize(VW, VH);
                  holder.addCallback(this);
                  view.setFocusable(true);
                  setContentView(view);
                  view.requestFocus();

                  tp.setTypeface(Typeface.create(Typeface.DEFAULT, Typeface.BOLD));
                  bakeWorld();
                  bakeRoom();
                  initParticles();
                  initAudio();
                  startWeather();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  resumed = true;
                  hideSystemUi();
                  kUp = kDown = kLeft = kRight = false;
                  axX = axY = 0;
                  loadApps();
                  updateMusic();
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  resumed = false;
                  if (music != null) {
                      try { if (music.isPlaying()) music.pause(); } catch (Exception ignored) { }
                  }
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  destroyed = true;
                  try { if (music != null) music.release(); } catch (Exception ignored) { }
                  try { if (sounds != null) sounds.release(); } catch (Exception ignored) { }
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemUi();
              }

              @SuppressWarnings("deprecation")
              void hideSystemUi() {
                  view.setSystemUiVisibility(View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
              }

              @Override
              public void surfaceCreated(SurfaceHolder h) {
                  running = true;
                  lastNs = System.nanoTime();
                  renderThread = new Thread(this::renderLoop, "island-render");
                  renderThread.start();
              }

              @Override
              public void surfaceChanged(SurfaceHolder h, int format, int w, int hgt) { }

              @Override
              public void surfaceDestroyed(SurfaceHolder h) {
                  running = false;
                  if (renderThread != null) {
                      try { renderThread.join(500); } catch (InterruptedException ignored) { }
                      renderThread = null;
                  }
              }

              // ================================================================== input

              @Override
              public boolean dispatchKeyEvent(KeyEvent e) {
                  int code = e.getKeyCode();
                  boolean down = e.getAction() == KeyEvent.ACTION_DOWN;
                  switch (code) {
                      case KeyEvent.KEYCODE_DPAD_UP: case KeyEvent.KEYCODE_W: kUp = down; break;
                      case KeyEvent.KEYCODE_DPAD_DOWN: case KeyEvent.KEYCODE_S: kDown = down; break;
                      case KeyEvent.KEYCODE_DPAD_LEFT: case KeyEvent.KEYCODE_A: kLeft = down; break;
                      case KeyEvent.KEYCODE_DPAD_RIGHT: case KeyEvent.KEYCODE_D: kRight = down; break;
                      case KeyEvent.KEYCODE_DPAD_CENTER: case KeyEvent.KEYCODE_ENTER: case KeyEvent.KEYCODE_NUMPAD_ENTER:
                      case KeyEvent.KEYCODE_BUTTON_A: case KeyEvent.KEYCODE_BACK: case KeyEvent.KEYCODE_BUTTON_B:
                      case KeyEvent.KEYCODE_INFO: case KeyEvent.KEYCODE_MENU: case KeyEvent.KEYCODE_GUIDE:
                      case KeyEvent.KEYCODE_BUTTON_Y: case KeyEvent.KEYCODE_BUTTON_START: case KeyEvent.KEYCODE_BUTTON_X:
                      case KeyEvent.KEYCODE_BUTTON_L1: case KeyEvent.KEYCODE_BUTTON_R1:
                          break;
                      default:
                          return super.dispatchKeyEvent(e);
                  }
                  if (down) {
                      int rep = e.getRepeatCount();
                      if (rep == 0) keyQueue.add(code);
                      else if (code == KeyEvent.KEYCODE_DPAD_UP || code == KeyEvent.KEYCODE_DPAD_DOWN) keyQueue.add(code | REPEAT_FLAG);
                  }
                  return true;
              }

              @Override
              public boolean dispatchGenericMotionEvent(MotionEvent e) {
                  if ((e.getSource() & InputDevice.SOURCE_JOYSTICK) == InputDevice.SOURCE_JOYSTICK
                          && e.getAction() == MotionEvent.ACTION_MOVE) {
                      float x = e.getAxisValue(MotionEvent.AXIS_X);
                      float y = e.getAxisValue(MotionEvent.AXIS_Y);
                      float hx = e.getAxisValue(MotionEvent.AXIS_HAT_X);
                      float hy = e.getAxisValue(MotionEvent.AXIS_HAT_Y);
                      if (Math.abs(hx) > 0.5f) x = hx;
                      if (Math.abs(hy) > 0.5f) y = hy;
                      axX = Math.abs(x) > 0.25f ? x : 0;
                      axY = Math.abs(y) > 0.25f ? y : 0;
                      return true;
                  }
                  return super.dispatchGenericMotionEvent(e);
              }

              // ================================================================== audio

              void initAudio() {
                  try {
                      AudioAttributes aa = new AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_GAME)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build();
                      sounds = new SoundPool.Builder().setMaxStreams(6).setAudioAttributes(aa).build();
                  } catch (Exception ex) {
                      sounds = null;
                  }
                  new Thread(() -> {
                      File dir = getFilesDir();
                      String[] names = {"step", "chirp", "open", "whoosh", "splat", "tick", "toggle", "door"};
                      for (int i = 0; i < names.length; i++) {
                          try {
                              File f = new File(dir, "sfx2_" + names[i] + ".wav");
                              if (!f.exists()) {
                                  float[] data;
                                  switch (i) {
                                      case 0: data = Synth.step(); break;
                                      case 1: data = Synth.chirp(); break;
                                      case 2: data = Synth.open(); break;
                                      case 3: data = Synth.whoosh(); break;
                                      case 4: data = Synth.splat(); break;
                                      case 5: data = Synth.tick(); break;
                                      case 6: data = Synth.toggle(); break;
                                      default: data = Synth.door(); break;
                                  }
                                  Synth.writeWav(f, data);
                              }
                              if (sounds != null) soundIds[i] = sounds.load(f.getAbsolutePath(), 1);
                          } catch (Exception ignored) { }
                      }
                      try {
                          File mf = new File(dir, "music2.wav");
                          if (!mf.exists()) {
                              File tmp = new File(dir, "music2.tmp");
                              Synth.writeWav(tmp, Synth.music());
                              tmp.renameTo(mf);
                          }
                          runOnUiThread(() -> {
                              if (destroyed) return;
                              try {
                                  music = new MediaPlayer();
                                  music.setDataSource(mf.getAbsolutePath());
                                  music.setLooping(true);
                                  music.setVolume(0.32f, 0.32f);
                                  music.prepare();
                                  updateMusic();
                              } catch (Exception ex) {
                                  music = null;
                              }
                          });
                      } catch (Exception ignored) { }
                  }, "island-audio").start();
              }

              void play(int id, float vol, float rate) {
                  if (!soundOn || sounds == null || soundIds[id] == 0) return;
                  try { sounds.play(soundIds[id], vol, vol, 1, 0, rate); } catch (Exception ignored) { }
              }

              void updateMusic() {
                  runOnUiThread(() -> {
                      if (music == null) return;
                      try {
                          if (musicOn && resumed) { if (!music.isPlaying()) music.start(); }
                          else if (music.isPlaying()) music.pause();
                      } catch (Exception ignored) { }
                  });
              }

              // ================================================================== weather

              void startWeather() {
                  Thread t = new Thread(() -> {
                      while (!destroyed) {
                          Weather w = Weather.fetch();
                          if (w.ok) weather = w;
                          long wait = w.ok ? 20 * 60 * 1000L : 2 * 60 * 1000L;
                          long until = System.currentTimeMillis() + wait;
                          while (!destroyed && System.currentTimeMillis() < until) {
                              try { Thread.sleep(2000); } catch (InterruptedException ignored) { }
                          }
                      }
                  }, "island-weather");
                  t.setDaemon(true);
                  t.start();
              }

              // ================================================================== apps

              void loadApps() {
                  new Thread(() -> {
                      PackageManager pm = getPackageManager();
                      LinkedHashMap<String, AppPeng> found = new LinkedHashMap<>();
                      String[] cats = {Intent.CATEGORY_LEANBACK_LAUNCHER, Intent.CATEGORY_LAUNCHER};
                      for (String cat : cats) {
                          Intent q = new Intent(Intent.ACTION_MAIN);
                          q.addCategory(cat);
                          List<ResolveInfo> list;
                          try { list = pm.queryIntentActivities(q, 0); } catch (Exception ex) { continue; }
                          for (ResolveInfo ri : list) {
                              String pk = ri.activityInfo.packageName;
                              if (pk.equals(getPackageName()) || found.containsKey(pk)) continue;
                              AppPeng a = new AppPeng();
                              a.pkg = pk;
                              a.label = String.valueOf(ri.loadLabel(pm));
                              Intent li = cat.equals(Intent.CATEGORY_LEANBACK_LAUNCHER)
                                      ? pm.getLeanbackLaunchIntentForPackage(pk)
                                      : pm.getLaunchIntentForPackage(pk);
                              if (li == null) {
                                  li = new Intent(Intent.ACTION_MAIN);
                                  li.addCategory(cat);
                                  li.setClassName(pk, ri.activityInfo.name);
                              }
                              a.intent = li;
                              try { a.icon = toBitmap(ri.loadIcon(pm), 72); } catch (Exception ex) { a.icon = null; }
                              a.launches = prefs.getInt("n_" + pk, 0);
                              a.scarf = SCARVES[(pk.hashCode() & 0x7fffffff) % SCARVES.length];
                              found.put(pk, a);
                          }
                      }
                      List<AppPeng> all = new ArrayList<>(found.values());
                      Collections.sort(all, (a, b) -> a.label.compareToIgnoreCase(b.label));
                      synchronized (lock) {
                          allApps = all;
                          relayout();
                      }
                  }, "island-apps").start();
              }

              /** Builds the visible list: hidden apps removed, most-used apps closest to the igloo. Call with lock held. */
              void relayout() {
                  List<AppPeng> vis = new ArrayList<>();
                  for (AppPeng a : allApps) if (!hidden.contains(a.pkg)) vis.add(a);
                  Collections.sort(vis, (a, b) -> a.launches != b.launches
                          ? Integer.compare(b.launches, a.launches) : a.label.compareToIgnoreCase(b.label));
                  float[] ring = {0.30f, 0.50f, 0.68f, 0.82f};
                  int[] cap = {6, 10, 14, 1000};
                  int idx = 0, n = vis.size();
                  Random r = new Random(42);
                  for (int k = 0; k < ring.length && idx < n; k++) {
                      int count = Math.min(cap[k], n - idx);
                      double offset = Math.PI / count * 0.5 + k * 0.45;
                      for (int j = 0; j < count; j++, idx++) {
                          AppPeng a = vis.get(idx);
                          double ang = offset + 2 * Math.PI * j / count;
                          float nhx = CX + (float) Math.cos(ang) * RX * ring[k];
                          float nhy = CY + (float) Math.sin(ang) * RY * ring[k];
                          AppPeng old = byPkg.get(a.pkg);
                          if (old != null && old != a && old.placed) {
                              a.x = old.x; a.y = old.y; a.facing = old.facing; a.phase = old.phase;
                              a.placed = true;
                          } else if (!a.placed) {
                              a.x = nhx; a.y = nhy; a.phase = r.nextFloat() * 6f;
                              a.placed = true;
                          }
                          if (old == null || Math.abs(nhx - a.hx) > 1 || Math.abs(nhy - a.hy) > 1) {
                              a.tx = nhx; a.ty = nhy; a.wait = 0;
                          }
                          a.hx = nhx; a.hy = nhy;
                      }
                  }
                  byPkg.clear();
                  for (AppPeng a : allApps) byPkg.put(a.pkg, a);
                  apps = vis;
              }

              Bitmap toBitmap(Drawable d, int size) {
                  Bitmap b = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888);
                  Canvas c = new Canvas(b);
                  d.setBounds(0, 0, size, size);
                  d.draw(c);
                  return b;
              }

              void launch(AppPeng a) {
                  a.launches++;
                  prefs.edit().putInt("n_" + a.pkg, a.launches).apply();
                  startIntent(a.intent, a.label);
              }

              void startIntent(Intent intent, String label) {
                  runOnUiThread(() -> {
                      try {
                          Intent i = new Intent(intent);
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(i);
                      } catch (Exception ex) {
                          Toast.makeText(this, "Couldn't open " + label, Toast.LENGTH_SHORT).show();
                      }
                  });
              }

              // ================================================================== seasons

              int activeSeason() {
                  if (seasonPref == 1) return SEASON_XMAS;
                  if (seasonPref == 2) return SEASON_HALLOWEEN;
                  if (seasonPref == 3) return SEASON_VALENTINE;
                  if (seasonPref == 4) return SEASON_NEWYEAR;
                  if (seasonPref == 5) return SEASON_NONE;
                  Calendar cal = Calendar.getInstance();
                  int m = cal.get(Calendar.MONTH), d = cal.get(Calendar.DAY_OF_MONTH), h = cal.get(Calendar.HOUR_OF_DAY);
                  if (m == Calendar.OCTOBER && d >= 15) return SEASON_HALLOWEEN;
                  if ((m == Calendar.DECEMBER && d == 31 && h >= 18) || (m == Calendar.JANUARY && d == 1)) return SEASON_NEWYEAR;
                  if (m == Calendar.DECEMBER || (m == Calendar.JANUARY && d <= 6)) return SEASON_XMAS;
                  if (m == Calendar.FEBRUARY && d >= 7 && d <= 14) return SEASON_VALENTINE;
                  return SEASON_NONE;
              }

              // ================================================================== baked art

              void bakeWorld() {
                  world = Bitmap.createBitmap((int) WW, (int) WH, Bitmap.Config.RGB_565);
                  Canvas c = new Canvas(world);
                  Paint w = new Paint(Paint.ANTI_ALIAS_FLAG);
                  Random r = new Random(7);

                  w.setShader(new LinearGradient(0, 0, 0, WH, 0xff2f78b8, 0xff123f6c, Shader.TileMode.CLAMP));
                  c.drawRect(0, 0, WW, WH, w);
                  w.setShader(null);
                  w.setColor(0xff4a97cf);
                  c.drawOval(CX - RX - 70, CY - RY - 55, CX + RX + 70, CY + RY + 55, w);
                  w.setColor(0xffcfe7f4);
                  c.drawOval(CX - RX - 20, CY - RY - 16, CX + RX + 20, CY + RY + 16, w);
                  w.setShader(new RadialGradient(CX, CY - 80, RX, 0xffffffff, 0xffe3eff7, Shader.TileMode.CLAMP));
                  c.drawOval(CX - RX, CY - RY, CX + RX, CY + RY, w);
                  w.setShader(null);

                  w.setColor(0xffe6f0f7);
                  for (int i = 0; i < 55; i++) {
                      float[] pt = randomOnIsland(r, 0.1f, 0.9f);
                      float dw = 50 + r.nextFloat() * 110, dh = 14 + r.nextFloat() * 26;
                      c.drawOval(pt[0] - dw, pt[1] - dh, pt[0] + dw, pt[1] + dh, w);
                  }
                  for (int i = 0; i < 26; i++) {
                      float[] pt = randomOnIsland(r, 0.97f, 1.015f);
                      float s = 0.6f + r.nextFloat() * 0.9f;
                      w.setColor(0xff7d8a95);
                      c.drawOval(pt[0] - 18 * s, pt[1] - 11 * s, pt[0] + 18 * s, pt[1] + 9 * s, w);
                      w.setColor(0xffffffff);
                      c.drawOval(pt[0] - 12 * s, pt[1] - 12 * s, pt[0] + 8 * s, pt[1] - 4 * s, w);
                  }
                  ArrayList<float[]> things = new ArrayList<>();
                  for (int i = 0; i < 70; i++) {
                      float[] pt = randomOnIsland(r, 0.88f, 0.97f);
                      things.add(new float[]{pt[0], pt[1], 0.8f + r.nextFloat() * 0.6f, 0});
                  }
                  for (int i = 0; i < 4; i++) {
                      float[] pt = randomOnIsland(r, 0.86f, 0.88f);
                      things.add(new float[]{pt[0], pt[1], 1f, 1});
                  }
                  Collections.sort(things, (a, b) -> Float.compare(a[1], b[1]));
                  for (float[] t : things) {
                      if (t[3] == 0) drawTree(c, w, t[0], t[1], t[2]);
                      else drawSnowman(c, w, t[0], t[1]);
                  }
                  drawIgloo(c, w, IGLOO_X, IGLOO_Y);
              }

              float[] randomOnIsland(Random r, float minF, float maxF) {
                  double ang = r.nextDouble() * Math.PI * 2;
                  float f = minF + r.nextFloat() * (maxF - minF);
                  return new float[]{CX + (float) Math.cos(ang) * RX * f, CY + (float) Math.sin(ang) * RY * f};
              }

              void drawTree(Canvas c, Paint w, float x, float y, float s) {
                  w.setColor(0x22000000);
                  c.drawOval(x - 30 * s, y - 8 * s, x + 30 * s, y + 8 * s, w);
                  w.setColor(0xff6d4c41);
                  c.drawRect(x - 5 * s, y - 16 * s, x + 5 * s, y, w);
                  float base = y - 12 * s;
                  float[] widths = {34, 27, 19};
                  float[] heights = {40, 34, 28};
                  for (int i = 0; i < 3; i++) {
                      float hw = widths[i] * s, h = heights[i] * s;
                      path.reset();
                      path.moveTo(x - hw, base); path.lineTo(x + hw, base); path.lineTo(x, base - h); path.close();
                      w.setColor(i == 1 ? 0xff357a54 : 0xff2e6b4a);
                      c.drawPath(path, w);
                      path.reset();
                      path.moveTo(x - hw * 0.45f, base - h * 0.55f); path.lineTo(x + hw * 0.45f, base - h * 0.55f);
                      path.lineTo(x, base - h); path.close();
                      w.setColor(0xfff7fbff);
                      c.drawPath(path, w);
                      base -= h * 0.55f;
                  }
              }

              void drawSnowman(Canvas c, Paint w, float x, float y) {
                  w.setColor(0x22000000);
                  c.drawOval(x - 24, y - 7, x + 24, y + 7, w);
                  w.setColor(0xffffffff);
                  c.drawCircle(x, y - 20, 20, w);
                  c.drawCircle(x, y - 50, 14, w);
                  w.setColor(0xff263238);
                  c.drawCircle(x - 5, y - 53, 2, w);
                  c.drawCircle(x + 5, y - 53, 2, w);
                  c.drawCircle(x, y - 26, 2, w);
                  c.drawCircle(x, y - 16, 2, w);
                  w.setColor(0xffff7043);
                  path.reset();
                  path.moveTo(x, y - 50); path.lineTo(x + 12, y - 47); path.lineTo(x, y - 45); path.close();
                  c.drawPath(path, w);
              }

              void drawIgloo(Canvas c, Paint w, float x, float y) {
                  w.setStyle(Paint.Style.FILL);
                  w.setColor(0x26000000);
                  c.drawOval(x - 140, y - 22, x + 140, y + 22, w);
                  rf.set(x - 125, y - 125, x + 125, y + 125);
                  w.setColor(0xfffbfdff);
                  c.drawArc(rf, 180, 180, true, w);
                  w.setStyle(Paint.Style.STROKE);
                  w.setStrokeWidth(2.5f);
                  w.setColor(0xffb7d2e4);
                  c.drawArc(rf, 180, 180, false, w);
                  for (int row = 1; row <= 4; row++) {
                      float ly = y - row * 25;
                      float half = (float) Math.sqrt(Math.max(0, 125 * 125 - (row * 25) * (row * 25)));
                      c.drawLine(x - half, ly, x + half, ly, w);
                      int blocks = 6 - row;
                      for (int b = 0; b <= blocks; b++) {
                          float bx = x - half + (2 * half) * (b + (row % 2) * 0.5f) / (blocks + 1);
                          if (bx > x - half + 4 && bx < x + half - 4) c.drawLine(bx, ly, bx, ly + 25, w);
                      }
                  }
                  w.setStyle(Paint.Style.FILL);
                  rf.set(x - 48, y - 58, x + 48, y + 38);
                  w.setColor(0xffffffff);
                  c.drawArc(rf, 180, 180, true, w);
                  w.setStyle(Paint.Style.STROKE);
                  w.setColor(0xffb7d2e4);
                  c.drawArc(rf, 180, 180, false, w);
                  w.setStyle(Paint.Style.FILL);
                  rf.set(x - 26, y - 38, x + 26, y + 14);
                  w.setColor(0xff2c3e50);
                  c.drawArc(rf, 180, 180, true, w);
                  w.setStrokeWidth(0);
              }

