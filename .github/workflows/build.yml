              /**
               * A tiny ring-binder CD folder: spine on the left, the cover swung open a little, the clear
               * plastic sleeves fanning out, and a silver CD on the front cover.
               */
              void drawBinderIcon(Canvas c, float x, float y, float s) {
                  c.save();
                  c.translate(x, y);
                  c.scale(s, s);
                  // back cover
                  p.setColor(0xff1f2733);
                  rf.set(-11, -12, 11, 12);
                  c.drawRect(rf, p);
                  // clear plastic sleeves, each opened a little less than the cover
                  float[] fr = {0.92f, 0.8f, 0.7f};
                  int[] sc = {0xffb9cad8, 0xffd6e4ef, 0xffc4d4e1};
                  for (int k = 0; k < 3; k++) {
                      float xr = -10 + 21 * fr[k];
                      path.reset();
                      path.moveTo(-10, -11); path.lineTo(xr, -12.2f); path.lineTo(xr, 12.2f); path.lineTo(-10, 11); path.close();
                      p.setColor(sc[k]);
                      c.drawPath(path, p);
                  }
                  // front cover swung open toward you: narrower, its free edge a bit taller because it's closer
                  float xr = -11 + 22 * 0.55f;
                  path.reset();
                  path.moveTo(-11, -12); path.lineTo(xr, -14); path.lineTo(xr, 14); path.lineTo(-11, 12); path.close();
                  p.setColor(0xff2b3646);
                  c.drawPath(path, p);
                  // silver CD on the cover, squashed to match the angle
                  float cx = (-11 + xr) / 2 + 0.5f;
                  p.setColor(0xffcfd8dc);
                  c.drawOval(cx - 4.6f, -7.6f, cx + 4.6f, 7.6f, p);
                  p.setColor(0xffeceff1);
                  c.drawOval(cx - 2.6f, -4.4f, cx + 0.6f, 0.4f, p);
                  p.setColor(0xff2b3646);
                  c.drawOval(cx - 1.1f, -1.8f, cx + 1.1f, 1.8f, p);
                  // spine with its rings
                  p.setColor(0xff111821);
                  c.drawRect(-13, -13, -9, 13, p);
                  p.setColor(0xffb0bec5);
                  for (int k = -1; k <= 1; k++) c.drawCircle(-11, k * 7, 1.6f, p);
                  c.restore();
              }

              /** Shortens text with "…" so it fits in maxW pixels at the current text size. */
              String fitText(String s, float maxW) {
                  if (s == null) return "";
                  if (tp.measureText(s) <= maxW) return s;
                  int n = s.length();
                  while (n > 1 && tp.measureText(s.substring(0, n) + "…") > maxW) n--;
                  return s.substring(0, n) + "…";
              }

